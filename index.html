    <div style="font-size:11px;color:var(--grey);font-weight:800;text-transform:uppercase;margin:8px 0 2px;">Key details</div>
    ${def.checks.filter(c=>c.essential).map(item).join('')}
    <div style="font-size:11px;color:var(--grey);font-weight:800;text-transform:uppercase;margin:10px 0 2px;">Useful to add <span style="text-transform:none;font-weight:600;">(doesn\u2019t affect the rating)</span></div>
    ${def.checks.filter(c=>!c.essential).map(item).join('')}`;
}
// Plain-text version of the checklist for a sub-expander's ? help popup.
function farmDetailTypeHelpText(category){
  const def=FARM_DETAIL_TYPES[category];
  return 'What to include for each '+def.singular+':\n\nKey details (these set the red/amber/green rating):\n'
    + def.checks.filter(c=>c.essential).map(c=>'\u2022 '+c.label).join('\n')
    + '\n\nUseful to add:\n'
    + def.checks.filter(c=>!c.essential).map(c=>'\u2022 '+c.label).join('\n')
    + '\n\nThe rating only checks that each topic has been mentioned, not that what you\u2019ve written is right. Up to '+FARM_DETAIL_MAX_CHARS+' characters per entry \u2014 if you need more, add a second entry.';
}
function farmDetailIsDirty(){
  const e=farmDetailEdit;
  if(!e) return false;
  if(!e.id) return !!((e.name||'').trim()||(e.details||'').trim());
  const d=farmDetails.find(x=>x.id===e.id);
  return !d || d.name!==e.name || (d.details||'')!==(e.details||'');
}
function fmtDateTimeShort(iso){
  if(!iso) return '\u2014';
  const d=new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function farmDetailModifiedLine(d){
  if(!d.modified_at) return '';
  const who=d.modified_by_name||d.modified_by_email||'';
  return 'Last updated '+fmtDateTimeShort(d.modified_at)+(who?' by '+who:'');
}

  const feedTypesBody = `

  return `

    <div class="body">
      <div id="settingsSection-farm" style="margin:8px 0;">

          <span style="flex:1;text-align:left;">Farm</span>

          <span style="width:20px;height:20px;flex-shrink:0;">${icon(settingsOpenSection==='farm'?'triangleDown':'triangleRight')}</span>

function escapeHtml(s){const d=document.createElement('div'); d.textContent=s; return d.innerHTML;}
// Grows a textarea to fit its current content (used for the Details boxes
// on Farm Damage/Improvement) — starts single-line when empty so it reads
// as a normal input the farmer can tap into, then expands as they type or
// once real content is loaded in, rather than always reserving a tall,
// mostly-empty box.
function autoGrowTextarea(el){
  if(!el) return;
  el.style.height='auto';
  el.style.height=Math.max(el.scrollHeight, 38)+'px';
}
// Pinch-zoom and drag-to-pan on a photo, scoped entirely to one viewport —
// deliberately not touching the page's own viewport meta tag
// (maximum-scale=1 is set globally so normal screens don't zoom by
// accident), so this is its own small touch-handling layer rather than
// the browser's native pinch behaviour. Shared by every full-size photo
// view in the app (imageView for a saved record's photo, photoView for
// the photo currently attached to a form) rather than duplicated per
// modal. Uses the Pointer Events API with explicit pointer capture —
// more reliable at tracking two fingers through a full gesture across
// different Android/Chrome builds than raw touchstart/move/end, which can
// silently lose track of a finger that drifts off the element.
function wireImageZoomPan(viewportId, imgId){
  const viewport=document.getElementById(viewportId);
  const img=document.getElementById(imgId);
  if(!viewport || !img) return;
  let scale=1, tx=0, ty=0;
  const pointers=new Map(); // active pointerId -> last {x,y}
  let pinchStartDist=0, pinchStartScale=1;
  let panStart=null; // {id, x, y, tx, ty}
  let lastTapTime=0, lastTapX=0, lastTapY=0;
  const MIN_SCALE=1, MAX_SCALE=4, DOUBLE_TAP_ZOOM=2.5;

  const apply=()=>{ img.style.transform='translate(-50%,-50%) translate('+tx+'px,'+ty+'px) scale('+scale+')'; };

  // Approximate bounds (based on the viewport box, not the image's actual
  // rendered size, which varies by aspect ratio) — generous enough to not
  // feel restrictive while stopping the image being dragged entirely out
  // of view.
  const clampPan=()=>{
    const maxOffsetX=(viewport.clientWidth*(scale-1))/2 + viewport.clientWidth*0.15;
    const maxOffsetY=(viewport.clientHeight*(scale-1))/2 + viewport.clientHeight*0.15;
    tx=Math.max(-maxOffsetX, Math.min(maxOffsetX, tx));
    ty=Math.max(-maxOffsetY, Math.min(maxOffsetY, ty));
  };
  const dist=(a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
  const toggleZoom=()=>{
    if(scale>1){ scale=1; tx=0; ty=0; } else { scale=DOUBLE_TAP_ZOOM; tx=0; ty=0; }
    apply();
  };

  viewport.addEventListener('pointerdown', (e)=>{
    e.stopPropagation(); // never let this reach the phone frame's swipe-to-back listener
    viewport.setPointerCapture(e.pointerId); // keep receiving move/up for this finger even if it drifts outside the box
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===1){
      const now=Date.now();
      if(now-lastTapTime<350 && Math.hypot(e.clientX-lastTapX, e.clientY-lastTapY)<30){
        toggleZoom();
        lastTapTime=0; // consumed — don't chain into a false triple-tap
        pointers.clear();
        return;
      }
      lastTapTime=now; lastTapX=e.clientX; lastTapY=e.clientY;
      if(scale>1) panStart={id:e.pointerId, x:e.clientX, y:e.clientY, tx, ty};
    } else if(pointers.size===2){
      panStart=null; // pinch takes over from any single-finger pan in progress
      const pts=[...pointers.values()];
      pinchStartDist=dist(pts[0], pts[1]);
      pinchStartScale=scale;
    }
  });

  viewport.addEventListener('pointermove', (e)=>{
    if(!pointers.has(e.pointerId)) return;
    e.stopPropagation();
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2 && pinchStartDist>0){
      e.preventDefault();
      const pts=[...pointers.values()];
      scale=Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale*(dist(pts[0],pts[1])/pinchStartDist)));
      clampPan();
      apply();
    } else if(pointers.size===1 && panStart && panStart.id===e.pointerId && scale>1){
      e.preventDefault();
      tx=panStart.tx+(e.clientX-panStart.x);
      ty=panStart.ty+(e.clientY-panStart.y);
      clampPan();
      apply();
    }
  });

  const endPointer=(e)=>{
    e.stopPropagation();
    pointers.delete(e.pointerId);
    if(panStart && panStart.id===e.pointerId) panStart=null;
    if(pointers.size<2) pinchStartDist=0;
    if(pointers.size===0 && scale<=1){ scale=1; tx=0; ty=0; apply(); }
  };
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);

  // Desktop convenience — double-click mirrors double-tap.
  img.addEventListener('dblclick', toggleZoom);
}

  document.getElementById('filterOffFarm').onchange=(e)=>{filterOffFarm=e.target.checked;};
  document.getElementById('filterUnweighed60').onchange=(e)=>{filterUnweighed60=e.target.checked;};
  document.getElementById('filterTbOverdue').onchange=(e)=>{filterTbOverdue=e.target.checked;};
  document.getElementById('filterOpenInjury').onchange=(e)=>{filterOpenInjury=e.target.checked;};
  document.getElementById('filterReset').onclick=()=>{
    statusFilter='active'; filterBreedId=null; herdShowAllHistory=false;
    filterOffFarm=false; filterBcs=null; filterHealth=null; filterUnweighed60=false; filterTbOverdue=false; filterOpenInjury=false;
    render();
  };
  document.getElementById('filterApply').onclick=()=>{showFilterModal=false; render();};
}

// Closes whatever modal is open without rebuilding the underlying screen —
// used where the screen behind the modal has in-progress, unsaved field
// values that a full render() would wipe out.
// ---------- camera-based tag scan (real OCR reader) ----------
// Opens the phone's actual camera, then runs the captured photo through an
// on-device OCR engine (Tesseract.js, loaded from CDN — see the <script> tag
// near the top of the file) to read the printed EID digits off the tag
// itself. No RFID/NFC hardware integration — this is a photo read, same as
// a farmer squinting at the tag, so lighting/focus/angle all matter.
let ocrWorkerPromise=null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise=(async()=>{
      const worker=await Tesseract.createWorker('eng');
      // Letters need to stay in the allowed set (not just digits) so things
      // like the "UK" country mark on the tag get read AS letters and
      // discarded cleanly — forcing everything into 0-9 was making Tesseract
      // mis-guess the country mark, the crown logo, and the tag's plastic
      // button/stud as extra stray digits, which then got glued onto the
      // real number.
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ ',
        tessedit_pageseg_mode: '6', // treat the photo as one uniform block of text
      });
      return worker;
    })();
  }
  return ocrWorkerPromise;
}
// Basic contrast boost before OCR: grayscale + hard threshold. Ear tags are
// usually dark digits on a light tag, so this cheap pass measurably helps
// Tesseract lock onto the digits instead of scratches, mud, or background.
function preprocessImageForOcr(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(img.src);
      const maxDim=1600;
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){ const scale=maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const imageData=ctx.getImageData(0,0,w,h);
      const d=imageData.data;
      for(let i=0;i<d.length;i+=4){
        const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        const v=gray>140?255:0;
        d[i]=d[i+1]=d[i+2]=v;
      }
      ctx.putImageData(imageData,0,0);
      canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('canvas export failed')), 'image/png');
    };
    img.onerror=()=>reject(new Error('image load failed'));
    img.src=URL.createObjectURL(file);
  });
}
// Pulls the tag number out of raw OCR text. A printed ear tag isn't one
// monolithic number — it's normally two groups (a herd mark and an
// individual animal number, e.g. "777777" and "301234"), plus a country
// mark ("UK"/"GB", or "XI" for Northern Ireland) and a crown/logo graphic
// that OCR sometimes mis-guesses as a stray extra digit or two. Digit
// groups are extracted by looking at each recognised word on its own and
// only keeping substantial ones (4+ digits) — short 1-3 digit leftovers
// are almost always misread noise, not part of the tag number.
//
// The country mark is printed as letters but the electronic EID uses a
// numeric equivalent (UK/GB → 826, XI → 899) — OCR can only ever read it
// as text, so it's spotted separately here and translated to the number
// it actually represents on the chip, then prepended.
//
// Caveat worth knowing: this assumes the tag is a WYSIWYG bovine EID tag,
// where the printed herd mark + individual number are the exact same
// digits encoded on the chip after the country code. That's only true for
// newer tags issued under the bovine EID rollout (new calves onward) — the
// bulk of existing UK cattle still carry the older tag numbering, which
// isn't guaranteed to decompose into a clean herd+animal-number EID this
// way. So a scanned "EID" here is a best-effort reconstruction from the
// tag face, not a guaranteed read of the actual electronic chip contents.
// Produces the same UK172091 202786 shape as formatEid — see the note
// there. Used to convert a detected UK/GB/XI letter prefix to the
// numeric 826/899 chip code; now the letters are what's kept, since
// they're the canonical format everywhere else in the app.
function extractEidFromOcrText(rawText){
  if(!rawText) return null;
  const upper=rawText.toUpperCase();
  let countryPrefix='';
  if(/\bXI\b/.test(upper)) countryPrefix='XI';
  else if(/\b(UK|GB)\b/.test(upper)) countryPrefix='UK';
  const words=rawText.split(/\s+/).filter(Boolean);
  const groups=words.map(w=>w.replace(/\D/g,'')).filter(g=>g.length>=4);
  if(!groups.length) return null;
  const digits=groups.join('').slice(0,12);
  if(digits.length<6) return null; // too little to be confident this is a real tag read
  const first6=digits.slice(0,6);
  const rest=digits.slice(6,12);
  return countryPrefix + first6 + (rest ? ' '+rest : '');
}
// Runs the full read pipeline on one captured photo using the on-device
// offline reader: preprocess -> OCR -> extract digits. Updates statusEl (if
// given) with progress so the first scan on a device — which has to
// download the OCR engine — doesn't look like it's hung.
async function readEidFromPhotoTesseract(file, statusEl){
  if(statusEl && !ocrWorkerPromise){ statusEl.style.display='block'; statusEl.style.color='var(--grey)'; statusEl.textContent='Loading tag reader (first scan only)\u2026'; }
  if(!ocrWorkerPromise) updateScanningOverlay('Loading tag reader (first scan only)\u2026');
  const worker=await getOcrWorker();
  if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--grey)'; statusEl.textContent='Reading tag\u2026'; }
  updateScanningOverlay('Reading tag\u2026');
  const processed=await preprocessImageForOcr(file);
  const { data:{ text } }=await worker.recognize(processed);
  return extractEidFromOcrText(text);
}
// Same read, via the Groq vision API instead of the offline reader —
// genuinely reads the image rather than pattern-matching character shapes,
// so handles angled/worn/stylised tags far better. Requires the farmer's
// own Groq API key (Settings > Use AI?) and a live connection;
// throws on any failure so the caller can fall back cleanly rather than
// silently returning a wrong answer.
async function readEidFromPhotoGroq(file, statusEl){
  if(!farmSettings.groq_api_key) throw new Error('No Groq key configured');
  if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--grey)'; statusEl.textContent='Reading tag\u2026'; }
  updateScanningOverlay('Reading tag\u2026');
  const base64=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=()=>reject(new Error('image read failed'));
    reader.readAsDataURL(file);
  });
  // Prompt is deliberately specific about the OFFICIAL printed structure
  // (per DEFRA/BCMS/gov.scot ear tag specs), not just "read the digits" —
  // giving the model the real shape to expect measurably improves reads of
  // angled/worn tags AND photos of a screen/photo of a tag (moire/glare
  // confuses generic OCR far more than a model that knows what it's
  // looking for). Since 1 Jan 2000 UK cattle tags print as: two-letter
  // country code (UK/GB, or XI for NI) + a 6-digit herd number + a second
  // 6-digit group (1 check digit + the animal's 5-digit individual number)
  // — e.g. "UK 123456 700002". Older/replacement tags can deviate from
  // this, so the model isn't told to reject anything that doesn't match.
  // The "don't omit unclear digits" instruction matters a lot in practice:
  // a model note like "...smudged" for an unclear digit reads as prose
  // text and gets silently dropped by the word-length filter downstream —
  // one of the most common ways a genuinely OK read still returns nothing.
  const prompt='This is a photo of a UK/EU bovine (cattle) ear tag — it may be at an angle, worn, on a curved surface, or itself a photo of a tag shown on a screen/photo. Official UK ear tags (since 1 Jan 2000) print as: a two-letter country code (UK, GB, or XI for Northern Ireland), then a 6-digit herd number, then a second 6-digit group made up of a check digit plus the animal\u2019s 5-digit individual number — for example "UK 123456 700002". Some older or replacement tags may not exactly match this pattern; read what is actually printed either way. Read ONLY the printed country code and digit groups exactly as shown on the tag itself, ignoring any crown/logo graphic, extra management-info text, scratches, plastic stud, or background. If any single digit is smudged or unclear, give your single best guess for that digit rather than leaving it out or describing it in words — never omit a digit. Reply with ONLY the country code (if visible) followed by the digit groups exactly as printed, separated by single spaces, and nothing else — no explanation, no punctuation, no extra words.';
  // A farmer with a weak signal shouldn't be left staring at "Reading
  // tag..." for the 30-60s a browser's own default timeout can take
  // before giving up — bail out and fall back to the offline reader well
  // before that becomes the frustrating part. Groq's whole point is
  // speed, so this can be tighter than the old timeout was.
  const text=await callGroq(prompt, {mediaType:file.type||'image/jpeg', base64}, {maxTokens:300, timeoutMs:8000});
  const digits=extractEidFromOcrText(text);
  // IMPORTANT: this used to silently return null here on a parse miss,
  // which the caller treated as an ordinary (non-error) empty result —
  // so the farmer only ever saw "couldn't read a tag number from that
  // photo" with no clue the model had actually returned something. That
  // hid the real failure mode: the model often DOES read the tag fine but
  // in a shape extractEidFromOcrText doesn't recognise (extra words,
  // an unexpected separator, digit groups outside the 4+ digit filter,
  // etc). Throwing here instead surfaces the raw text in the on-screen
  // error (via aiError below), which is what's needed to tell
  // "the model genuinely can't read this tag" apart from "it read it
  // but our parser choked on the reply" — two very different bugs.
  if(!digits) throw new Error('Read the text \u201c'+text.trim().replace(/\s+/g,' ').slice(0,80)+'\u201d but a tag number couldn\u2019t be parsed out of it');
  return digits;
}
// Main entry point every scan flow calls. Tries Groq first when a key's
// configured — falls straight back to the offline Tesseract reader on ANY
// failure (no key, no signal, bad response, rate limit, whatever) so a
// scan never just breaks; it only ever gets quietly less accurate. Returns
// which engine actually produced the result (or failed) alongside the
// digits, so a failed read can tell the farmer something more useful than
// just "couldn't read it" — that detail used to only go to the internal
// activity log, which isn't somewhere a phone user would ever find it.
// Extracts several fields at once from a photo of a passport page (EID,
// breed, sex, DOB, mgmt/herd ID, dam/sire EID) — structured multi-field
// extraction like this genuinely needs a vision model's judgement, not
// just OCR, so unlike tag scanning there's no offline Tesseract fallback:
// without a Groq key this feature just isn't available, and the caller
// says so up front.
async function readAnimalFromPassportGroq(file){
  if(!farmSettings.groq_api_key) throw new Error('No Groq key configured');
  updateScanningOverlay('Reading passport\u2026');
  const base64=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=()=>reject(new Error('image read failed'));
    reader.readAsDataURL(file);
  });
  // Deliberately scoped to the individual animal's own details plus its
  // parents' EIDs — not the keeper/holding info on the cover or movement
  // history, which aren't useful here.
  // Dam's number is commonly printed on a passport; sire's number is rarer
  // (often unknown in a suckler herd) but included when it's there too —
  // both are just off-farm EID references at this point, same as if the
  // farmer had typed them into the Mother/Father picker by hand.
  // Modern (post-2011, CPP52) UK passports are a single page. Breed is
  // printed as the breed name in full, not a code.
  const prompt='This is a photo of a page from a UK (or EU) cattle passport for one individual animal. Modern UK passports (since 2011, form CPP52) are a single page; the animal\u2019s own ear tag number is usually printed in the top-right corner, formatted as a country code (e.g. UK) followed by a 6-digit herd number, then a check digit, then a 5-digit sequence number \u2014 transcribe it exactly as printed, spaces included. Breed is printed as the breed name in full (e.g. "HEREFORD"), sometimes followed by "X" or "CROSS" meaning the animal is a cross of that breed (e.g. "HEREFORD X" = Hereford Cross) \u2014 transcribe the breed exactly as printed, X/Cross suffix included, do not guess a code or translate it into anything else. Extract these details if visible on this page, and reply with ONLY a single JSON object and nothing else \u2014 no markdown fences, no explanation: {"eid":"the animal\u2019s own official ear tag number, as printed (country code plus digit groups), or null if not visible","breed":"the breed exactly as printed, X/Cross suffix included if present, or null","sex":"M or F, or null","dob":"date of birth as YYYY-MM-DD, or null","mgmt_id":"any herd mark, management number, or name printed for this specific animal, or null","dam_eid":"the dam\u2019s official ear tag number if printed \u2014 may be labelled Dam, Genetic Dam, or Birth Dam \u2014 or null","sire_eid":"the sire\u2019s (father\u2019s) official ear tag number if printed, or null \u2014 often blank/unknown, that\u2019s normal"}. Use null for anything not actually visible on this page rather than guessing. Do not include keeper/holding details or movement history.';
  const text=await callGroq(prompt, {mediaType:file.type||'image/jpeg', base64}, {json:true, maxTokens:500});
  try{ return parseAiJson(text); }
  catch(parseErr){ throw new Error('Groq reply couldn\u2019t be read as data: \u201c'+text.slice(0,120)+'\u201d'); }
}
// Same JSON-completion pattern as readAnimalFromPassportGroq, but
// text-only — used by the "Ask" report to run the farmer's own Groq key
// instead of the sandbox-only Claude endpoint, so Ask actually works
// once this app is used outside a Claude preview.
async function askFarmQuestionGroq(promptText){
  if(!farmSettings.groq_api_key) throw new Error('No Groq key configured');
  const text=await callGroq(promptText, null, {json:true, maxTokens:1024, timeoutMs:20000});
  try{ return parseAiJson(text); }
  catch(parseErr){ throw new Error('Groq reply couldn\u2019t be read as data: \u201c'+text.slice(0,120)+'\u201d'); }
}
async function readEidFromPhoto(file, statusEl){
  if(farmSettings.use_ai===true && farmSettings.groq_api_key){
    try{
      const digits=await readEidFromPhotoGroq(file, statusEl);
      return {digits, engineUsed:'groq'};
    }catch(e){
      logMsg('AI tag read failed, falling back to offline reader: '+e.message);
      updateScanningOverlay('AI unavailable \u2014 trying offline reader\u2026');
      try{
        const digits=await readEidFromPhotoTesseract(file, statusEl);
        return {digits, engineUsed:'tesseract', aiError:e.message};
      }catch(e2){
        return {digits:null, engineUsed:'tesseract', engineError:e2.message, aiError:e.message};
      }
    }
  }
  try{
    const digits=await readEidFromPhotoTesseract(file, statusEl);
    return {digits, engineUsed:'tesseract'};
  }catch(e2){
    return {digits:null, engineUsed:'tesseract', engineError:e2.message};
  }
}
// Routes a scanned EID straight to the right outcome for the context it was
// scanned from — no extra "look up" confirm tap needed.
async function processScannedEid(eid, mode, statusEl){
  const norm=s=>s.replace(/\s+/g,'').toLowerCase();
  const activeOnly = mode!=='lookup';
  const match=animals.find(a=>a.eid && norm(a.eid)===norm(eid) && (!activeOnly || a.status==='active'));
  if(match){
    if(mode==='lookup'){ modal=null; selectedId=match.id; view='detail'; render(); }
    else if(mode==='weigh'){ selectAnimalForWeigh(match.id); }
    else if(mode==='medBulk'){ selectAnimalForMedBulk(match.id); }
    else if(mode==='move'){
      const result=await selectAnimalForMove(match.id);
      renderModal();
      showSaveToast(result==='removed'?'Removed':'Added');
    }
    return;
  }
  if(mode==='lookup'){
    showConfirmModal('No animal found with EID '+eid+'. Add as a new animal?', ()=>{
      newAnimalMotherId=null; newAnimalMotherExternalEid=null; newAnimalFatherId=null; newAnimalFatherExternalEid=null; newAnimalPhoto=null;
      newAnimalPassportScanned=false;
      newAnimalEid=eid; view='add'; render();
    });
    return;
  }
  if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--red)'; statusEl.textContent='No active animal found with EID '+eid+'.'; }
}
// Opens the camera, then actually reads the tag from the photo taken.
// If this was triggered from a button living inside another modal (the
// weigh/move/medBulk "pick animal" modals all have their own scan
// button), that modal's DOM gets replaced while the camera's open —
// only one modal shows at a time — so it's snapshotted here and
// restored the moment the photo's taken, before anything tries to
// touch its fields. Callers with no modal open (home-scan, herdScanBtn)
// just get modalSnapshot as null/undefined, which the guard skips.
function performTagScan(mode, statusElId){
  const modalSnapshot=modal;
  triggerScanCameraCapture(async(file)=>{
    if(modalSnapshot){ modal=modalSnapshot; renderModal(); }
    const statusEl=statusElId ? document.getElementById(statusElId) : null;
    if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--grey)'; statusEl.textContent='Reading tag\u2026'; }
    showScanningOverlay('Reading tag\u2026');
    try{
      const result=await readEidFromPhoto(file, statusEl);
      if(!result.digits){
        // Tells the farmer (and, when they describe it back, us) exactly
        // which reader was actually in play, not just "it didn't work" —
        // that distinction used to be invisible outside the internal log.
        // Includes the actual AI error text (truncated) rather than
        // just "it failed", so a report-back gives the real status/reason
        // immediately instead of needing another round to dig it out.
        let engineNote = result.engineUsed==='groq' ? ' (read via AI)'
          : result.aiError ? ' (AI reader failed \u2014 '+result.aiError.slice(0,150)+' \u2014 then fell back to the offline reader, which also couldn\u2019t read it)'
          : (farmSettings.use_ai===true && farmSettings.groq_api_key) ? '' : ' (offline reader \u2014 AI key not set up)';
        const msg='Couldn\u2019t read a tag number from that photo'+engineNote+' \u2014 try again with better light/focus, or enter the EID manually.';
        if(statusEl){ statusEl.style.color='var(--red)'; statusEl.textContent=msg; } else showInfoModal(msg);
        return;
      }
      processScannedEid(result.digits, mode, statusEl);
    } catch(err){
      const msg='Couldn\u2019t read the tag (check you have a signal for the tag reader to load, then try again).';
      if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--red)'; statusEl.textContent=msg; } else showInfoModal(msg);
    } finally {
      hideScanningOverlay();
    }
  });
}
// Used for EID tag scanning and passport scanning — see captureFromCamera
// for why this stays in-page rather than handing off to a native camera
// app. onPhotoTaken is simply not called if the person closes the camera
// view without taking a photo, matching the old cancelled-picker behaviour.
function triggerScanCameraCapture(onPhotoTaken){
  captureFromCamera().then(onPhotoTaken).catch(()=>{ /* cancelled */ });
}
// Fills the New Animal form from a passport-scan result — shared by the
// live scan handler (view==='add' wiring) and the resume-after-reload
// flow in the app boot sequence, so a scan interrupted by an iOS
// background-reload can be recovered rather than silently lost. Assumes
// the New Animal form is already the DOM currently rendered. Returns the
// list of field labels actually filled in.
// Converts a printed country-code prefix (UK, GB, XI) to the numeric
// equivalent the app stores EIDs as everywhere else — see the notes on
// extractEidFromOcrText for why (826/899 is what's actually on the
// electronic chip, not the letters printed for humans to read).
// Passport scanning reads the letters exactly as printed (see that
// prompt), so this brings a passport-scanned EID in line with every
// other entry path before it's stored — otherwise the same animal's EID
// ends up in two different formats depending on how it was entered,
// which silently breaks matching between them (mother/father lookups,
// duplicate detection) since EID comparison elsewhere only strips
// whitespace, not letters.
// Normalizes a passport-scanned EID into the same UK172091 202786 shape
// as formatEid/extractEidFromOcrText. Passports print the 2-letter
// country code, but the model reading the photo doesn't always
// transcribe it — that's exactly what caused a passport-scanned EID to
// stop matching the same animal on a later tag scan: the scan silently
// produced a bare, prefix-less EID instead of erroring, so there was
// nothing to notice at the time. When the prefix is missing but the
// digit count matches a normal UK EID (12 digits), default to UK rather
// than leaving it prefix-less — overwhelmingly the realistic case for a
// UK pilot farm, and far better than silently storing an EID no other
// scan path will ever produce a match for again.
function normalizeScannedEid(raw){
  if(!raw) return raw;
  const trimmed=String(raw).trim();
  const m=trimmed.match(/^(UK|GB|XI)\b\s*(.*)$/i);
  if(m) return formatEid(m[1].toUpperCase()+m[2]);
  const digits=trimmed.replace(/\D/g,'');
  if(digits.length===12) return formatEid('UK'+digits);
  return trimmed; // not a shape recognised — leave it rather than guess wrong
}
function applyPassportScanResult(result){
  const filled=[];
  if(result.eid){
    newAnimalEid=normalizeScannedEid(String(result.eid).trim());
    const btnText=document.getElementById('enterEidBtnText');
    if(btnText) btnText.textContent='EID: '+newAnimalEid;
    filled.push('EID');
  }
  if(result.breed){
    const rawBreed=String(result.breed).trim();
    // Passports print a trailing "X" (or "Cross") to mean cross-bred —
    // strip it before matching against the farm's breed list, and use it
    // to set the separate cross toggle instead, rather than trying to
    // match a breed literally named e.g. "Hereford X".
    const crossSuffix=rawBreed.match(/\s*(x|cross)\s*$/i);
    const breedForMatching = crossSuffix ? rawBreed.slice(0, crossSuffix.index).trim() : rawBreed;
    const activeBreeds=breeds.filter(b=>b.active);
    const match=activeBreeds.find(b=>b.name.toLowerCase()===breedForMatching.toLowerCase())
      || activeBreeds.find(b=>breedForMatching.toLowerCase().includes(b.name.toLowerCase()) || b.name.toLowerCase().includes(breedForMatching.toLowerCase()));
    const breedSelect=document.getElementById('f-breed');
    if(match && breedSelect){ breedSelect.value=match.id; filled.push('Breed'); }
    if(crossSuffix){
      newAnimalIsCross=true;
      const crossBtn=document.getElementById('breedCrossToggle');
      if(crossBtn) crossBtn.style.color='var(--ink)';
      filled.push('Cross-bred (X)');
    }
  }
  if(result.sex==='M' || result.sex==='F'){
    const radio=document.getElementById(result.sex==='M'?'sexM':'sexF');
    if(radio){ radio.checked=true; filled.push('Sex'); }
  }
  if(result.dob && /^\d{4}-\d{2}-\d{2}$/.test(result.dob)){
    const birthInput=document.getElementById('f-birth');
    if(birthInput){ birthInput.value=result.dob; filled.push('D.O.B.'); }
  }
  const tagInput=document.getElementById('f-tag');
  if(result.mgmt_id && tagInput && !tagInput.value.trim()){
    tagInput.value=String(result.mgmt_id).trim();
    filled.push('Mgmt ID');
  }
  // Same rule as typing an EID into the Mother/Father picker by hand: a
  // match on this farm links straight to that animal; anything else (no
  // match, or off this farm entirely) is stored as an off-farm EID
  // reference. There's no "click save twice to confirm" step here the way
  // there is in the picker — that exists to catch a mistyped EID, which
  // doesn't apply to a value read straight off an official document.
  const norm=s=>s.replace(/\s+/g,'').toLowerCase();
  if(result.dam_eid){
    const eid=normalizeScannedEid(String(result.dam_eid).trim());
    const found=animals.find(x=>x.eid && norm(x.eid)===norm(eid) && x.sex==='F');
    if(found){ newAnimalMotherId=found.id; newAnimalMotherExternalEid=null; }
    else { newAnimalMotherId=null; newAnimalMotherExternalEid=eid; }
    const btn=document.getElementById('pickMother');
    if(btn){ btn.innerHTML=found?escapeHtml(animalDisplayName(found)):escapeHtml(eid)+'<br>(off-farm)'; btn.classList.add('set'); btn.style.background=''; btn.style.border=''; }
    filled.push('Mother');
  }

// Recover a passport scan interrupted mid-flow — see the note above on
// why a reload (iOS memory reclaim, Android tab discard, or an app
// update) can silently wipe an in-progress scan without warning. Called
// once at boot, and again every time the app regains the foreground
// (see the visibilitychange listener near the end of the boot sequence)
// — the boot-time call alone only ever caught this after a full manual
// reload, not the moment the person actually switches back to the app,
// which is when it's most likely to actually matter.
async function checkForInterruptedPassportScan(){
  if(!(authUser && authFarmId && deviceFarmCode)) return; // only once properly signed in and paired, not mid-login
  if(modal) return; // don't interrupt something else already on screen
  try{
    const pendingRaw=localStorage.getItem(LS_PREFIX+'pendingPassportScan');
    if(!pendingRaw) return;
    const pending=JSON.parse(pendingRaw);
    if(Date.now()-(pending.savedAt||0) >= 24*60*60*1000){
      localStorage.removeItem(LS_PREFIX+'pendingPassportScan');
      return;
    }
    showConfirmModal('Adding an animal from a passport scan looks like it got interrupted before it was saved \u2014 want to pick up where it left off?', ()=>{
      view='add'; newAnimalEid=null; newAnimalMotherId=null; newAnimalMotherExternalEid=null; newAnimalFatherId=null; newAnimalFatherExternalEid=null; newAnimalPhoto=null; newAnimalPassportScanned=false; newAnimalIsCross=false; newAnimalEidManuallyEntered=false;
      render();
      const filled=applyPassportScanResult(pending.result);
      try{ localStorage.removeItem(LS_PREFIX+'pendingPassportScan'); }catch(e){ /* best-effort only */ }
      if(filled.length){ showSaveToast('Resumed \u2014 filled in from passport'); logMsg('Resumed an interrupted passport scan \u2014 filled in: <b>'+filled.join(', ')+'</b>. Please check before saving.'); }
    }, ()=>{
      try{ localStorage.removeItem(LS_PREFIX+'pendingPassportScan'); }catch(e){ /* best-effort only */ }
    }, 'Resume', 'Discard');
  }catch(e){ /* corrupt or missing — nothing to recover */ }
}

// 'medtypes', etc.) — when given, every literal occurrence of the word

// Bulleted "you're missing these" popup — used instead of small inline error
// text so a farmer can't miss what still needs filling in.
// Scrolls to and briefly highlights the first missing mandatory field, so
// it's obvious at a glance what still needs filling in — replacing a tiny
// red caption that was easy to miss or scroll straight past. Takes pairs of
// [fieldId, label] in form order; only the first missing one is surfaced,
// matching the existing convention of validating top-to-bottom.
function highlightFirstMissingField(pairs){
  for(const [fieldId, label] of pairs){
    const field=document.getElementById(fieldId);
    if(!field) continue;
    // Radio buttons always report their own static value regardless of
    // whether they're checked — "missing" for a radio group means none of
    // them are checked, not that this one's value is blank.
    const isRadio = field.type==='radio';
    if(isRadio){
      if(document.querySelector('input[name="'+field.name+'"]:checked')) continue;
    } else if(field.value && field.value.trim()){
      continue; // has a value — not the culprit
    }
    field.scrollIntoView({block:'center', behavior:'smooth'});
    if(isRadio){
      // Highlight the whole radio group's row, not just one small circle —
      // a tinted single radio button would be easy to miss.
      const row=field.closest('.formrow');
      const target=row||field;
      const prevBg=target.style.background;
      target.style.background='var(--red-bg)';
      const clearHighlight=()=>{ target.style.background=prevBg; document.querySelectorAll('input[name="'+field.name+'"]').forEach(el=>el.removeEventListener('change', clearHighlight)); };
      document.querySelectorAll('input[name="'+field.name+'"]').forEach(el=>el.addEventListener('change', clearHighlight));
      return true;
    }
    const prevBg=field.style.background;
    const prevBorder=field.style.border;
    field.style.background='var(--red-bg)';
    // Plain inputs/selects already show a border (background tint alone
    // reads as "highlighted"), but buttons like the parent pickers render
    // with border:none — background tint alone is easy to miss on those,
    // so give every field an explicit red border too for a consistent look.
    field.style.border='2px solid var(--red)';
    setTimeout(()=>{ field.focus({preventScroll:true}); }, 300);
    // Stays highlighted until the farmer actually fixes it, rather than
    // fading on a timer — a few-second auto-clear meant it could vanish
    // again before they'd even scrolled back up to look at it.
    const clearHighlight=()=>{ field.style.background=prevBg; field.style.border=prevBorder; field.removeEventListener('input', clearHighlight); field.removeEventListener('change', clearHighlight); };
    field.addEventListener('input', clearHighlight);
    field.addEventListener('change', clearHighlight);
    return true;
  }
  return false;
}

              if(isMother) { animalForParent.mother_id=null; animalForParent.mother_external_eid=val; }
              else { animalForParent.father_id=null; animalForParent.father_external_eid=val; }
              animalForParent.updated_at=new Date().toISOString();
              await persistAll();
              await syncAnimalToSupabase(animalForParent);
              if(isMother) { editAnimalMotherId=undefined; editAnimalMotherExternalEid=undefined; }
              else { editAnimalFatherId=undefined; editAnimalFatherExternalEid=undefined; }
            } else {
              if(isMother) { newAnimalMotherId=null; newAnimalMotherExternalEid=val; }
              else { newAnimalFatherId=null; newAnimalFatherExternalEid=val; }
            }
            closeModalOnly();
            const btn=document.getElementById(btnId);
            if(btn){ btn.innerHTML=val+'<br>(off-farm)'; btn.classList.add('set'); btn.style.background=''; btn.style.border=''; }
            if(modal.parentContext==='edit') showSaveToast('Updated');
            return;
          }
          errEl.innerHTML='No animal found with that EID.<br>Click save again to confirm details are correct or the '+(isMother?'mother':'father')+' is not on your farm.';
          modal.notFoundConfirmValue = val;
          return;
        }
        modal.notFoundConfirmValue=null;
        const wantSex = isMother ? 'F' : 'M';
        if(found.sex!==wantSex){ errEl.textContent='That tag belongs to '+animalDisplayName(found)+', recorded as '+(found.sex==='F'?'female':'male')+' \u2014 check you scanned the right animal.'; return; }
        if(modal.parentContext==='edit'){
          // Editing an existing animal: commit straight to the record now,
          // rather than only staging it for the outer form's Save button —
          // this was the source of the "needs two saves" bug. Deliberately
          // not calling a full render() here so any other field the farmer
          // has mid-typed elsewhere on this same form isn't wiped out —
          // just a targeted update to this one button, same as before.
          const animalForParent=animals.find(x=>x.id===selectedId);
          if(isMother) { animalForParent.mother_id=found.id; animalForParent.mother_external_eid=null; }
          else { animalForParent.father_id=found.id; animalForParent.father_external_eid=null; }
          animalForParent.updated_at=new Date().toISOString();
          await persistAll();
          await syncAnimalToSupabase(animalForParent);
          if(isMother) { editAnimalMotherId=undefined; editAnimalMotherExternalEid=undefined; }
          else { editAnimalFatherId=undefined; editAnimalFatherExternalEid=undefined; }
        } else {
          if(isMother) { newAnimalMotherId=found.id; newAnimalMotherExternalEid=null; }
          else { newAnimalFatherId=found.id; newAnimalFatherExternalEid=null; }
        }
        closeModalOnly();
        const btn=document.getElementById(btnId);
        if(btn){ btn.textContent=animalDisplayName(found); btn.classList.add('set'); btn.style.background=''; btn.style.border=''; }
        if(modal.parentContext==='edit') showSaveToast('Updated');
        return;
      }
      if(modal.context==='edit'){
        // Same fix as above: commit the EID straight to the record now,
        // not just to the draft variable — targeted DOM patch below keeps
        // any other unsaved field on this form intact.
        const animalForEid=animals.find(x=>x.id===selectedId);
        animalForEid.eid=val;
        animalForEid.updated_at=new Date().toISOString();
        await persistAll();
        await syncAnimalToSupabase(animalForEid);
        editAnimalEid=undefined;
        const headerEl=document.getElementById('editEidHeaderText');
        if(headerEl){
          headerEl.textContent = val ? formatEid(val) : 'Not set';
          const c=eidStatusColor(val, animalForEid.birth_date);
          headerEl.style.color = c ? `var(--${c})` : 'var(--ink)';
        }
        closeModalOnly();
        showSaveToast('Updated');
        return;
      } else {
        newAnimalEid=val;
        newAnimalEidManuallyEntered=!!val;
        const btnText=document.getElementById('enterEidBtnText');
        if(btnText) btnText.textContent=val?('EID: '+val):'Enter EID';
      }
      closeModalOnly();
    };
  }
  if(modal.type==='timelineAction'){
    const item=modal.item;
    const goToRecord=()=>{
      modal=null;
      if(item.kind==='status'){
        if(item.ref.event_type==='created'){
          editAnimalMotherId=undefined; editAnimalMotherExternalEid=undefined; editAnimalFatherId=undefined; editAnimalFatherExternalEid=undefined; editAnimalEid=undefined; editAnimalPhoto=undefined; editAnimalIsCross=undefined;
          view='animalDetails';
        }
        else { view='archive'; }
      }
      else if(item.kind==='weight'){
        weighTarget=selectedId; weighDate=item.ref.recorded_at.slice(0,10); weighSessionRecordId=item.ref.id;
        currentBcsValue=item.ref.bcs; cameFromSummary=true; view='weigh';
      }
      else if(item.kind==='injury'){ healthTarget=selectedId; view='injury'; }
      else if(item.kind==='medicine'){ healthTarget=selectedId; view='medicine'; }
      else if(item.kind==='move'){ view='move'; moveDate=item.ref.date; moveGps=item.ref.gps; moveAnimalIds=[...item.ref.animal_ids]; moveSessionRecordId=item.ref.id; moveLocationVal=item.ref.location||''; moveReasonVal=item.ref.reason||''; moveDirection=item.ref.direction||null; moveDestCphVal=item.ref.dest_cph||''; cameFromSummary=true; }
      else if(item.kind==='breeding'){ view='breeding'; cameFromSummary=true; breedingEasePick=undefined; breedingMotherPick=undefined; }
      render();
    };
    document.getElementById('tl-view').onclick=goToRecord;
    document.getElementById('tl-delete').onclick=()=>{ modal={type:'timelineDeleteConfirm', item}; render(); };
  }
  if(modal.type==='timelineDeleteConfirm'){
    const cancel2=document.getElementById('modalCancel2');
    if(cancel2) cancel2.onclick=()=>{ modal=null; render(); };
    document.getElementById('tl-confirmdelete').onclick=async()=>{
      const item=modal.item;
      if(item.kind==='weight'){
        const idx=weights.findIndex(w=>w.id===item.ref.id); if(idx>-1) weights.splice(idx,1);
        if(authFarmId){
          const { error: delErr } = await sb.from('weights').delete().eq('id', item.ref.id);
          if(delErr){ logMsg('<span style="color:var(--red);">Couldn\u2019t remove this weigh entry from the shared farm database \u2014 '+escapeHtml(delErr.message)+'.</span>'); }
        }
      } else if(item.kind==='injury'){
        const idx=injuryRecords.findIndex(r=>r.id===item.ref.id); if(idx>-1) injuryRecords.splice(idx,1);
        if(authFarmId){
          const { error: delErr } = await sb.from('injury_records').delete().eq('id', item.ref.id);
          if(delErr){ logMsg('<span style="color:var(--red);">Couldn\u2019t remove this injury from the shared farm database \u2014 '+escapeHtml(delErr.message)+'.</span>'); }
        }
      } else if(item.kind==='medicine'){
        const idx=medicineRecords.findIndex(r=>r.id===item.ref.id); if(idx>-1) medicineRecords.splice(idx,1);
        if(authFarmId){ await deleteMedicineFromSupabase(item.ref.id); }
      } else if(item.kind==='move'){
        // Deleting a move from one animal's Timeline should only take
        // THAT animal off the move — not wipe the whole move record and
        // every other animal that was on it too. A move only gets fully
        // removed once removing this animal leaves its animal_ids empty.
        const rec=moveRecords.find(r=>r.id===item.ref.id);
        if(rec){
          rec.animal_ids=(rec.animal_ids||[]).filter(id=>id!==selectedId);
          if(rec.animal_ids.length===0){
            const idx=moveRecords.findIndex(r=>r.id===rec.id);
            if(idx>-1) moveRecords.splice(idx,1);
            await deleteMoveFromSupabase(rec.id);
          } else {
            await syncMoveToSupabase(rec);
          }
        }
      } else {
        showInfoModal('Status events can\u2019t be deleted here \u2014 use Archive to restore or change status instead.');
        modal=null; render(); return;
      }
      await persistAll();
      logMsg('Removed a timeline record.');
      modal=null;
      render();
    };
  }
  if(modal.type==='actions'){
    document.getElementById('action-move').onclick=()=>{ modal=null; view='move'; cameFromSummary=false; moveDate=todayStr(); moveGps=null; moveAnimalIds=[]; moveSessionRecordId=null; moveLocationVal=''; moveReasonVal=''; moveDirection=null; moveDestCphVal=''; moveHistoryScope=null; moveHistoryExpanded=false; expandedMoveHistoryId=null; moveWarningsSuppressed=false; render(); };
    document.getElementById('action-weigh').onclick=()=>{ modal=null; view='weigh'; weighTarget=null; weighDate=todayStr(); weighSessionRecordId=null; currentBcsValue=null; weighInlineSearchTerm=''; cameFromSummary=false; render(); };
  }
}

async function confirmModal(){
  const a=animals.find(x=>x.id===selectedId);
  const modalTypeAtStart=modal.type; // modal gets nulled below, before we need this for navigation
  if(modal.type==='restore'){
    const reason=document.getElementById('modalReason').value.trim();
    if(!reason){ document.getElementById('modalErr').textContent='Reason is required to restore.'; return; }
    const restoredEvent={id:uuid(), event_type:'restored', from_status:a.status, to_status:'active', reason, created_at:new Date().toISOString(), farmer_id:currentFarmerId};
    events[a.id].push(restoredEvent);
    a.status='active'; a.updated_at=new Date().toISOString();
    await persistAll();
    await syncAnimalToSupabase(a);
    await syncAnimalEventToSupabase(a.id, restoredEvent);
    logMsg('Restored <b>'+(animalDisplayName(a))+'</b> to active. Reason: &ldquo;'+escapeHtml(reason)+'&rdquo;');
  } else if(modal.type==='void'){
    const voidedEvent={id:uuid(), event_type:'voided', from_status:a.status, to_status:'voided', reason:null, created_at:new Date().toISOString(), farmer_id:currentFarmerId};
    events[a.id].push(voidedEvent);
    a.status='voided'; a.updated_at=new Date().toISOString();
    await persistAll();
    await syncAnimalToSupabase(a);
    await syncAnimalEventToSupabase(a.id, voidedEvent);
    logMsg('Removed <b>'+(animalDisplayName(a))+'</b> (accidental entry). This cannot be restored.');
  } else if(modal.type==='exit'){
    const wd = modal.status==='sold' ? activeWithdrawal(a.id) : null;
    const exitDateEl=document.getElementById('exitDateInput');
    const exitDate=exitDateEl && exitDateEl.value ? exitDateEl.value : todayStr();
    const note=document.getElementById('modalNote').value.trim();
    if(wd && !note){ document.getElementById('modalExitErr').textContent='Please enter a reason for proceeding despite the withdrawal period.'; return; }
    let fallenStockRef=null;
    if(modal.status==='dead'){
      fallenStockRef=document.getElementById('fallenStockRef').value.trim();
      if(!fallenStockRef){ document.getElementById('modalExitErr').textContent='A National Fallen Stock Co. reference is required for a death record.'; return; }
    }
    if(modal.status==='swapped'){
      const dir=document.getElementById('exitSwapDirection').value;
      if(!dir){ document.getElementById('modalExitErr').textContent='Choose whether money was given or received.'; return; }
    }
    const isLoss = modal.status==='dead' || modal.status==='stolen';
    const exitValueRaw=document.getElementById('exitValueInput').value.trim();
    const exitValueMag=exitValueRaw?Math.abs(parseFloat(exitValueRaw))||0:0;
    // Loss stored negative, profit stored positive — so a report can just
    // sum this field directly to get the actual realised change per month,
    // rather than needing to know the exit reason all over again.
    // Sold: the field is the gross sale price, not profit — the true
    // financial outcome is what's left after what the animal actually cost
    // (purchase + medicine), so that's what actually gets recorded.
    // Swapped: "Given" is money paid out (a cost), "Received" is money
    // taken in (a gain) — the direction alone determines the sign.
    let realizedValue;
    if(modal.status==='sold') realizedValue = exitValueMag - totalCost(a);
    else if(modal.status==='swapped') realizedValue = document.getElementById('exitSwapDirection').value==='received' ? exitValueMag : -exitValueMag;
    else realizedValue = isLoss ? -exitValueMag : exitValueMag;
    const exitIso = exitDate===todayStr() ? new Date().toISOString() : new Date(exitDate+'T12:00:00').toISOString();
    const exitEvent={id:uuid(), event_type:EXIT_STATUSES[modal.status], from_status:'active', to_status:modal.status, reason:null, note:note||null, created_at:exitIso, farmer_id:currentFarmerId};
    events[a.id].push(exitEvent);
    a.status=modal.status; a.updated_at=new Date().toISOString();
    a.realized_value=realizedValue;
    a.realized_value_date=exitDate;
    if(modal.status==='dead') a.fallen_stock_ref=fallenStockRef;
    await persistAll();
    await syncAnimalToSupabase(a);
    await syncAnimalEventToSupabase(a.id, exitEvent);
    logMsg('Marked <b>'+(animalDisplayName(a))+'</b> as '+modal.status+' (net '+(realizedValue<0?'loss':'gain')+' of '+fmtGBP(Math.abs(realizedValue))+')'+(wd?' <span style="color:var(--red);">(overrode an active withdrawal warning)</span>':'')+'.');
  }
  modal=null;
  // Restoring to active is the one status change where staying anywhere
  // near "Remove animal" doesn't make sense — land on the animal's own
  // details instead. Every other status change (sold/dead/stolen/swapped/
  // voided) takes the animal out of day-to-day use, so Home is the more
  // useful landing spot rather than a now-stale Remove-animal screen.
  if(modalTypeAtStart==='restore'){ selectedId=a.id; cameFromSummary=false; view='detail'; }
  else { navStack=[]; suppressHistoryPush=true; selectedId=null; view='home'; }
  render();
  // Says what actually happened and what it means for where the animal now
  // shows up, rather than a bare "Updated" that leaves the farmer to infer
  // it from the animal having vanished off the list they were just on.
  const name=animalDisplayName(a);
  let toastMsg='Updated';
  if(modalTypeAtStart==='restore') toastMsg=name+' re-added to the active list';
  else if(modalTypeAtStart==='void') toastMsg=name+' removed (accidental entry)';
  else if(modalTypeAtStart==='exit') toastMsg=name+' marked as '+a.status+', removed from default animal list';
  showSaveToast(toastMsg);
}

function wireView(){
  // Any footer icon marked "home" always returns to the hub, regardless of screen.
  document.querySelectorAll('.footericon.home').forEach(el=>el.onclick=()=>{
    const goHomeContinue=async()=>{
      if(view==='move') await commitMoveEntry();
      navStack=[]; suppressHistoryPush=true;
      view='home'; selectedId=null; weighTarget=null; feedTarget=null; healthTarget=null; cameFromSummary=false; medBulkActive=false; medBulkCarry=null; herdSelectMode=false; herdSelectedIds=[]; render();
    };
    if(hasUnsavedNewAnimalData()){
      showConfirmModal('Discard new animal?', goHomeContinue);
      return;
    }
    if(hasUnsavedMedicineAddData()){
      showConfirmModal('Discard medicine record?', goHomeContinue);
      return;
    }
    if(hasUnsavedMedCabinetAddData()){
      showConfirmModal(medCabEditTargetId?'Discard changes to this medicine?':'Discard new medicine?', goHomeContinue);
      return;
    }
    if(hasUnsavedMedDisposeData()){
      showConfirmModal('Discard medicine disposal?', goHomeContinue);
      return;
    }
    if(hasUnsavedDamageAddData()){
      showConfirmModal('Discard new farm damage?', goHomeContinue);
      return;
    }
    if(hasUnsavedInjuryAddData()){
      showConfirmModal('Discard new injury?', goHomeContinue);
      return;
    }
    if(hasUnsavedFeedAddData()){
      showConfirmModal('Discard new fodder record?', goHomeContinue);
      return;
    }
    if(hasUnsavedWeighChanges()){
      showConfirmModal('You have weight/BCS values entered but not saved. Leave without saving?', goHomeContinue);
      return;
    }
    goHomeContinue();
  });

  // Wired once here rather than per-screen, since the "jump to month/year"
  // button sits next to every date field in the app regardless of view.
  document.querySelectorAll('[data-datejump]').forEach(el=>el.onclick=()=>{
    const targetInputId=el.dataset.datejump;
    const target=document.getElementById(targetInputId);
    if(!target) return;
    // Starts from whatever date the field already holds — e.g. re-opening
    // this on an animal that already has a D.O.B. set shows that date, not
    // today's — and only falls back to today when the field is genuinely
    // empty (a brand new animal, or an older record that never had a
    // D.O.B. recorded).
    const now=new Date();
    let startYear=now.getFullYear(), startMonth=now.getMonth(), startDay=now.getDate();
    if(target.value){
      const [y,m,d]=target.value.split('-').map(n=>parseInt(n,10));
      if(!isNaN(y)) startYear=y;
      if(!isNaN(m)) startMonth=m-1;
      if(!isNaN(d)) startDay=d;
    }
    let minYear=now.getFullYear()-40;
    // A field with an explicit max= (D.O.B., disposal date, ...) gets that
    // as a genuine ceiling on the wheel itself — not just a floor the
    // +10-year default could never actually be lowered below, which was
    // the bug: the wheel let you scroll to and select a future year, and
    // only a same-turn silent clamp down in the Go handler stopped the
    // final value — confusing, and one more place a fix could slip.
    // Fields with no max= (fodder/medicine expiry, genuinely open-ended)
    // keep the generous +10 default so they're not capped at this year.
    let maxYear = target.max ? parseInt(target.max.slice(0,4),10) : now.getFullYear()+10;
    minYear=Math.min(minYear, startYear);
    if(!target.max) maxYear=Math.max(maxYear, startYear);
    if(target.min){ minYear=Math.min(minYear, parseInt(target.min.slice(0,4),10)); }
    modal={type:'dateJump', targetInputId, minYear, maxYear, startYear, startMonth, startDay};
    renderModal();
  });

  if(view==='home'){
    document.getElementById('home-help').onclick=()=>{ showInfoModal('Home. Click the home icon on any screen to return here.'); };
    document.getElementById('switchUserBtn').onclick=()=>{ modal={type:'switchUser'}; render(); };
    document.getElementById('home-animals').onclick=()=>{ view='herd'; statusFilter='active'; searchTerm=''; filterBreedId=null; herdShowAllHistory=false; filterOffFarm=false; filterBcs=null; filterHealth=null; filterUnweighed60=false; filterTbOverdue=false; filterOpenInjury=false; render(); };
    document.getElementById('home-addanimal').onclick=()=>{ view='add'; newAnimalEid=null; newAnimalMotherId=null; newAnimalMotherExternalEid=null; newAnimalFatherId=null; newAnimalFatherExternalEid=null; newAnimalPhoto=null; newAnimalPassportScanned=false; newAnimalIsCross=false; newAnimalEidManuallyEntered=false; render(); };
    document.getElementById('home-move').onclick=()=>{
      view='move'; cameFromSummary=false; moveDate=todayStr(); moveGps=null; moveAnimalIds=[]; moveSessionRecordId=null; moveLocationVal=''; moveReasonVal=''; moveDirection=null; moveDestCphVal=''; moveHistoryScope=null; moveHistoryExpanded=false; expandedMoveHistoryId=null; moveWarningsSuppressed=false;
      render();
      // UAT found farmers didn't realise "View previous" (collapsed, easy
      // to miss) is also where you go to mark an animal sold or bring it
      // back on farm — not just a read-only log. Only shown from this
      // Home tile entry point, not every way of reaching Move, since this
      // is where a farmer starting fresh is most likely to need the nudge.
      if(!moveEnterDetailsHintSuppressed) showInfoModal('Enter move details then add the animals.', null, 'Do not show again for this session', ()=>{ moveEnterDetailsHintSuppressed=true; });
    };
    document.getElementById('home-weigh').onclick=()=>{ view='weigh'; weighTarget=null; weighDate=todayStr(); weighSessionRecordId=null; currentBcsValue=undefined; weighInlineSearchTerm=''; cameFromSummary=false; render(); };
    document.getElementById('home-damage').onclick=()=>{ view='damage'; expandedDamageId=null; render(); };
    const homeFeedBtn=document.getElementById('home-feed');
    if(homeFeedBtn) homeFeedBtn.onclick=()=>{ view='feed'; feedTarget=null; feedLastDate=null; render(); };
    document.getElementById('home-insights').onclick=()=>{ view='insights'; render(); };
    document.getElementById('home-reports').onclick=()=>{ view='reports'; render(); };
    document.getElementById('home-feedback').onclick=()=>{ window.open('mailto:ATHENAXltd@gmail.com?subject='+encodeURIComponent('aBC Stockman feedback')+'&body='+encodeURIComponent('We can only make aBC Stockman better with your feedback. Please let us know of any bugs or missing functionality. Give as much detail as possible and we\u2019ll try our best to make it reality. ')); };
    document.getElementById('home-settings').onclick=()=>{ view='settings'; render(); };
    document.getElementById('home-scan').onclick=()=>{ performTagScan('lookup', null); };
  }

  if(view==='herd'){
    document.getElementById('searchInput').oninput=(e)=>{searchTerm=e.target.value; render(); const si=document.getElementById('searchInput'); si.focus(); si.setSelectionRange(searchTerm.length,searchTerm.length);};
    wireSearchClear('searchInput');
    const herdShowAllBtn=document.getElementById('herdShowAllHistory');
    if(herdShowAllBtn) herdShowAllBtn.onclick=()=>{ herdShowAllHistory=true; render(); };
    const herdSelectAllBtn=document.getElementById('herdSelectAllBtn');
    if(herdSelectAllBtn) herdSelectAllBtn.onclick=()=>{
      // Whatever rows are actually on screen right now — already reflects
      // the search term, status filter, and breed filter, so this only
      // ever selects what the farmer can currently see, not the whole herd.
      // Toggles: if everything visible is already selected, a second tap
      // clears the selection (and leaves select mode) instead.
      if(herdSelectAllBtn.dataset.allselected==='1'){
        herdSelectedIds=[]; herdSelectMode=false;
      } else {
        herdSelectedIds=[...document.querySelectorAll('tr[data-openrow]')].map(row=>row.dataset.openrow);
        herdSelectMode=herdSelectedIds.length>0;
      }
      render();
    };
    document.querySelectorAll('[data-sort]').forEach(el=>el.onclick=()=>{
      const col=el.dataset.sort;
      if(sortColumn===col) sortDir = sortDir==='asc'?'desc':'asc'; else { sortColumn=col; sortDir='asc'; }
      render();
    });
    const toggleHerdSelect=(id)=>{
      if(herdSelectedIds.includes(id)) herdSelectedIds=herdSelectedIds.filter(x=>x!==id);
      else herdSelectedIds.push(id);
      if(herdSelectedIds.length===0) herdSelectMode=false; // deselecting the last row drops back to normal browsing
      render();
    };
    // Long-press (or a real mouse-hold, for testing on desktop) turns
    // selection mode on and selects that first row. pointerdown/up/move
    // covers touch and mouse in one listener rather than needing separate
    // touch* and mouse* handlers. Cancels on real drag movement (past a
    // small pixel threshold) so a scroll gesture starting on a row can't
    // be mistaken for a long-press — NOT on any pointermove at all, since
    // a finger held "still" on a real touchscreen still reports a few
    // pixels of jitter constantly, which cancelled the timer instantly on
    // a real device even though a genuinely static mouse cursor never
    // triggers pointermove at all, so this looked fine in desktop testing
    // and simply didn't work on a phone.
    let herdLongPressTimer=null, herdLongPressFiredId=null;
    document.querySelectorAll('tr[data-openrow]').forEach(row=>{
      const id=row.dataset.openrow;
      row.style.webkitUserSelect='none'; row.style.userSelect='none'; row.style.webkitTouchCallout='none';
      let startX=0, startY=0;
      const cancel=()=>clearTimeout(herdLongPressTimer);
      row.addEventListener('pointerdown', (e)=>{
        herdLongPressFiredId=null;
        startX=e.clientX; startY=e.clientY;
        clearTimeout(herdLongPressTimer);
        herdLongPressTimer=setTimeout(()=>{
          herdLongPressFiredId=id;
          if(!herdSelectMode){ herdSelectMode=true; herdSelectedIds=[id]; }
          else toggleHerdSelect(id);
          render();
        }, 500);
      });
      row.addEventListener('pointerup', cancel);
      row.addEventListener('pointermove', (e)=>{
        if(Math.hypot(e.clientX-startX, e.clientY-startY) > 12) cancel();
      });
      row.addEventListener('pointerleave', cancel);
      row.addEventListener('pointercancel', cancel);
      row.addEventListener('contextmenu', (e)=>e.preventDefault()); // don't let the browser's own long-press menu fight with ours
    });
    const openOrToggle=(id)=>{
      // The click that fires right as a finger/mouse lifts off after a
      // long-press would otherwise immediately toggle the row a second
      // time (or worse, navigate away) straight after long-press just
      // selected it — herdLongPressFiredId swallows exactly that one
      // trailing click.
      if(herdLongPressFiredId===id){ herdLongPressFiredId=null; return; }
      if(herdSelectMode){ toggleHerdSelect(id); return; }
      selectedId=id; view='detail'; render();
    };
    document.querySelectorAll('[data-openrow],[data-openname]').forEach(el=>el.onclick=(e)=>{
      // The <td data-openname> sits inside the <tr data-openrow>, and both
      // match this selector — without stopping propagation here, a tap on
      // the name cell fires openOrToggle once for the td, then again as it
      // bubbles up to the tr's own handler. That was harmless when this
      // only ever navigated to the same detail screen twice, but toggling
      // selection twice cancels itself out, so it matters now.
      e.stopPropagation();
      openOrToggle(el.dataset.openrow||el.dataset.openname);
    });
    document.querySelectorAll('[data-openprofit]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      if(herdSelectMode){ toggleHerdSelect(el.dataset.openprofit); return; }
      selectedId=el.dataset.openprofit;

      // a failed passcode leaves the user back on the form to retry, and
      // firing late must never bounce them off it (a timing flag reset
      // right after that failure raced this and lost; this doesn't).
      if(PRE_APP_VIEWS.has(view) && !pcMode){
        if(authFarmId && deviceFarmCode) goHomeRespectingBootMinimum();
        else { view = authFarmId ? 'login' : 'supaWaiting'; render(); }
      }
      // else: already in normal use — just keep authUser/authFarmId
      // current in the background, silently, and leave the farmer
      // wherever they are.
    } else {
      // A genuinely lost/expired session is different — nothing else in
      // the app works without one, so this one still applies regardless
      // of current screen.
      authFarmId=null; view='supaLogin'; render();
    }
  });

  if(!authUser){ view='supaLogin'; render(); }
  else if(!authFarmId){ view='supaWaiting'; render(); }
  else if(!deviceFarmCode){ view='login'; render(); }
  else { goHomeRespectingBootMinimum(); }
  if(isOnline) runPendingAnalyses();
  if(isOnline) flushSyncQueue();
  if(isOnline) promoteLocalPhotos();

  await checkForInterruptedPassportScan();

  // Re-check whenever the app comes back to the foreground — not just at
  // boot. This is what actually catches an interruption in practice: the
  // app usually keeps running (paused, not reloaded) when backgrounded
  // for the camera, so the boot-time check alone only ever fired after a
  // full manual reload, not the moment you switch back to the app.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && !modal) checkForInterruptedPassportScan();
  });

  // Single persistent connectivity icon, shown in the same top-right spot
  // on every screen including Home — green when the device genuinely has
  // signal, red when it doesn't (navigator.onLine, updated live by the
  // 'online'/'offline' events below). Not clickable — this used to be a
  // manual simulate-signal toggle for testing, but that meant it could
  // show green while actually offline, which defeated real offline
  // testing. If you need to test offline behaviour, actually turn off
  // wifi/mobile data — this icon will now follow that honestly.
  const phoneFrame0=document.getElementById('phoneFrame');
  const noServerBtn=document.createElement('button');
  noServerBtn.className='noServerIcon';
  noServerBtn.style.cursor='default';
  phoneFrame0.appendChild(noServerBtn);
  updateSignalBadge();
  window.addEventListener('online', async()=>{
    isOnline=true; render(); runPendingAnalyses();
    await flushSyncQueue();
    await promoteLocalPhotos();
    await pullLatestFarmData();
  });
  window.addEventListener('offline', ()=>{ isOnline=false; render(); });

  // Swipe right anywhere on the phone screen to go back — mirrors the header back arrow.
  const phoneFrame=document.getElementById('phoneFrame');
  let touchStartX=0, touchStartY=0, touchActive=false;
  phoneFrame.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1) return;
    touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; touchActive=true;
  }, {passive:true});
  phoneFrame.addEventListener('touchend', (e)=>{
    if(!touchActive) return;
    touchActive=false;
    const endX=(e.changedTouches[0]||{}).clientX ?? touchStartX;
    const endY=(e.changedTouches[0]||{}).clientY ?? touchStartY;
    const dx=endX-touchStartX, dy=endY-touchStartY;
    if(dx>70 && Math.abs(dx)>Math.abs(dy)*2){ goBack(); }
  }, {passive:true});
})();
</script>
<script>
  // Register the service worker. When a new version takes over, DON'T
  // reload immediately — that can silently interrupt whatever's in
  // progress (a multi-step scan, a half-filled form), which is very
  // likely what caused a passport scan to appear to dump the app back on
  // Home mid-flow: a new build takes several seconds to install in the
  // background, easily long enough to land right in the middle of an
  // AI call. Instead, show a small persistent banner and let the
  // person choose when it's safe to apply it.
  if('serviceWorker' in navigator){
    let swRegistration=null;
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js', {updateViaCache: 'none'})
        .then(reg=>{ swRegistration=reg; })
        .catch(()=>{});
    });
    // The initial register() above only checks for a new sw.js once, at
    // page load — if a new build gets uploaded while this tab/PWA is
    // already sitting open, nothing prompts Chrome to look again until
    // the page is reloaded. Explicitly nudging it on every return to the
    // foreground (reopening the PWA, switching back to this tab) closes
    // that gap without needing a full reload — the actual install still
    // takes its own real time in the background either way (fetching and
    // caching the whole app shell isn't instant, especially on mobile
    // data), this just makes sure the check itself isn't also waiting on
    // the next accidental page load to happen.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible' && swRegistration) swRegistration.update().catch(()=>{});
    });
    let swRefreshed=false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(swRefreshed) return;
      swRefreshed=true;
      const frame=document.getElementById('phoneFrame');
      if(!frame){ window.location.reload(); return; } // shouldn't happen, but don't strand the person on a dead page
      const banner=document.createElement('button');
      banner.id='updateReadyBanner';
      banner.textContent='Update available \u2014 tap to refresh';
      banner.style.cssText='position:absolute;left:10px;right:10px;bottom:10px;z-index:60;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);';
      banner.onclick=()=>{ window.location.reload(); };
      frame.appendChild(banner);
    });
  }
</script>
</body>
