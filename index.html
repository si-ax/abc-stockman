            if(btn){ btn.innerHTML=val+'<br>(off-farm)'; btn.classList.add('set'); btn.style.background=''; btn.style.border=''; }
            if(modal.parentContext==='edit') showSaveToast('Updated');
            return;
          }
          errEl.innerHTML='No animal found with that EID.<br>Click save again to confirm details are correct or the '+(isMother?'mother':'father')+' is not on your farm.';
          modal.notFoundConfirmValue = val;
          return;
        }
        modal.notFoundConfirmValue=null;
        const wantSex = isMother ? 'F' : 'M';
        if(found.sex!==wantSex){ errEl.textContent='That tag belongs to '+animalDisplayName(found)+', recorded as '+(found.sex==='F'?'female':'male')+' \u2014 check you scanned the right animal.'; return; }
        if(modal.parentContext==='edit'){
          // Editing an existing animal: commit straight to the record now,
          // rather than only staging it for the outer form's Save button —
          // this was the source of the "needs two saves" bug. Deliberately
          // not calling a full render() here so any other field the farmer
          // has mid-typed elsewhere on this same form isn't wiped out —
          // just a targeted update to this one button, same as before.
          const animalForParent=animals.find(x=>x.id===selectedId);
          if(isMother) { animalForParent.mother_id=found.id; animalForParent.mother_external_eid=null; }
          else { animalForParent.father_id=found.id; animalForParent.father_external_eid=null; }
          animalForParent.updated_at=new Date().toISOString();
          await persistAll();
          await syncAnimalToSupabase(animalForParent);
          if(isMother) { editAnimalMotherId=undefined; editAnimalMotherExternalEid=undefined; }
          else { editAnimalFatherId=undefined; editAnimalFatherExternalEid=undefined; }
        } else {
          if(isMother) { newAnimalMotherId=found.id; newAnimalMotherExternalEid=null; }
          else { newAnimalFatherId=found.id; newAnimalFatherExternalEid=null; }
        }
        closeModalOnly();
        const btn=document.getElementById(btnId);
        if(btn){ btn.textContent=animalDisplayName(found); btn.classList.add('set'); btn.style.background=''; btn.style.border=''; }
        if(modal.parentContext==='edit') showSaveToast('Updated');
        return;
      }
      if(modal.context==='edit'){
        // Same fix as above: commit the EID straight to the record now,
        // not just to the draft variable — targeted DOM patch below keeps
        // any other unsaved field on this form intact.
        const animalForEid=animals.find(x=>x.id===selectedId);
        animalForEid.eid=val;
        animalForEid.updated_at=new Date().toISOString();
        await persistAll();
        await syncAnimalToSupabase(animalForEid);
        editAnimalEid=undefined;
        const headerEl=document.getElementById('editEidHeaderText');
        if(headerEl){
          headerEl.textContent = val ? formatEid(val) : 'Not set';
          const c=eidStatusColor(val, animalForEid.birth_date);
          headerEl.style.color = c ? `var(--${c})` : 'var(--ink)';
        }
        closeModalOnly();
        showSaveToast('Updated');
        return;
      } else {
        newAnimalEid=val;
        const btnText=document.getElementById('enterEidBtnText');
        if(btnText) btnText.textContent=val?('EID: '+val):'Enter EID';
      }
      closeModalOnly();
    };
  }
  if(modal.type==='timelineAction'){
    const item=modal.item;
    const goToRecord=()=>{
      modal=null;
      if(item.kind==='status'){
        if(item.ref.event_type==='created'){
          editAnimalMotherId=undefined; editAnimalMotherExternalEid=undefined; editAnimalFatherId=undefined; editAnimalFatherExternalEid=undefined; editAnimalEid=undefined; editAnimalPhoto=undefined; editAnimalIsCross=undefined;
          view='animalDetails';
        }
        else { view='archive'; }
      }
      else if(item.kind==='weight'){
        weighTarget=selectedId; weighDate=item.ref.recorded_at.slice(0,10); weighSessionRecordId=item.ref.id;
        currentBcsValue=item.ref.bcs; cameFromSummary=true; view='weigh';
      }
      else if(item.kind==='injury'){ healthTarget=selectedId; view='injury'; }
      else if(item.kind==='medicine'){ healthTarget=selectedId; view='medicine'; }
      else if(item.kind==='move'){ view='move'; moveDate=item.ref.date; moveGps=item.ref.gps; moveAnimalIds=[...item.ref.animal_ids]; moveSessionRecordId=item.ref.id; moveLocationVal=item.ref.location||''; moveReasonVal=item.ref.reason||''; moveDirection=item.ref.direction||null; moveDestCphVal=item.ref.dest_cph||''; cameFromSummary=true; }
      else if(item.kind==='breeding'){ view='breeding'; cameFromSummary=true; breedingEasePick=undefined; breedingMotherPick=undefined; }
      render();
    };
    document.getElementById('tl-view').onclick=goToRecord;
    document.getElementById('tl-delete').onclick=()=>{ modal={type:'timelineDeleteConfirm', item}; render(); };
  }
  if(modal.type==='timelineDeleteConfirm'){
    const cancel2=document.getElementById('modalCancel2');
    if(cancel2) cancel2.onclick=()=>{ modal=null; render(); };
    document.getElementById('tl-confirmdelete').onclick=async()=>{
      const item=modal.item;
      if(item.kind==='weight'){
        const idx=weights.findIndex(w=>w.id===item.ref.id); if(idx>-1) weights.splice(idx,1);
        if(authFarmId){
          const { error: delErr } = await sb.from('weights').delete().eq('id', item.ref.id);
          if(delErr){ logMsg('<span style="color:var(--red);">Couldn\u2019t remove this weigh entry from the shared farm database \u2014 '+escapeHtml(delErr.message)+'.</span>'); }
        }
      } else if(item.kind==='injury'){
        const idx=injuryRecords.findIndex(r=>r.id===item.ref.id); if(idx>-1) injuryRecords.splice(idx,1);
        if(authFarmId){
          const { error: delErr } = await sb.from('injury_records').delete().eq('id', item.ref.id);
          if(delErr){ logMsg('<span style="color:var(--red);">Couldn\u2019t remove this injury from the shared farm database \u2014 '+escapeHtml(delErr.message)+'.</span>'); }
        }
      } else if(item.kind==='medicine'){
        const idx=medicineRecords.findIndex(r=>r.id===item.ref.id); if(idx>-1) medicineRecords.splice(idx,1);
        if(authFarmId){ await deleteMedicineFromSupabase(item.ref.id); }
      } else if(item.kind==='move'){
        // Deleting a move from one animal's Timeline should only take
        // THAT animal off the move — not wipe the whole move record and
        // every other animal that was on it too. A move only gets fully
        // removed once removing this animal leaves its animal_ids empty.
        const rec=moveRecords.find(r=>r.id===item.ref.id);
        if(rec){
          rec.animal_ids=(rec.animal_ids||[]).filter(id=>id!==selectedId);
          if(rec.animal_ids.length===0){
            const idx=moveRecords.findIndex(r=>r.id===rec.id);
            if(idx>-1) moveRecords.splice(idx,1);
            await deleteMoveFromSupabase(rec.id);
          } else {
            await syncMoveToSupabase(rec);
          }
        }
      } else {
        showInfoModal('Status events can\u2019t be deleted here \u2014 use Archive to restore or change status instead.');
        modal=null; render(); return;
      }
      await persistAll();
      logMsg('Removed a timeline record.');
      modal=null;
      render();
    };
  }
  if(modal.type==='actions'){
    document.getElementById('action-move').onclick=()=>{ modal=null; view='move'; cameFromSummary=false; moveDate=todayStr(); moveGps=null; moveAnimalIds=[]; moveSessionRecordId=null; moveLocationVal=''; moveReasonVal=''; moveDirection=null; moveDestCphVal=''; moveHistoryScope=null; moveHistoryExpanded=false; expandedMoveHistoryId=null; moveWarningsSuppressed=false; render(); };
    document.getElementById('action-weigh').onclick=()=>{ modal=null; view='weigh'; weighTarget=null; weighDate=todayStr(); weighSessionRecordId=null; currentBcsValue=null; weighInlineSearchTerm=''; cameFromSummary=false; render(); };
  }
}

async function confirmModal(){
  const a=animals.find(x=>x.id===selectedId);
  const modalTypeAtStart=modal.type; // modal gets nulled below, before we need this for navigation
  if(modal.type==='restore'){
    const reason=document.getElementById('modalReason').value.trim();
    if(!reason){ document.getElementById('modalErr').textContent='Reason is required to restore.'; return; }
    const restoredEvent={id:uuid(), event_type:'restored', from_status:a.status, to_status:'active', reason, created_at:new Date().toISOString(), farmer_id:currentFarmerId};
    events[a.id].push(restoredEvent);
    a.status='active'; a.updated_at=new Date().toISOString();
    await persistAll();
    await syncAnimalToSupabase(a);
    await syncAnimalEventToSupabase(a.id, restoredEvent);
    logMsg('Restored <b>'+(animalDisplayName(a))+'</b> to active. Reason: &ldquo;'+escapeHtml(reason)+'&rdquo;');
  } else if(modal.type==='void'){
    const voidedEvent={id:uuid(), event_type:'voided', from_status:a.status, to_status:'voided', reason:null, created_at:new Date().toISOString(), farmer_id:currentFarmerId};
    events[a.id].push(voidedEvent);
    a.status='voided'; a.updated_at=new Date().toISOString();
    await persistAll();
    await syncAnimalToSupabase(a);
    await syncAnimalEventToSupabase(a.id, voidedEvent);
    logMsg('Removed <b>'+(animalDisplayName(a))+'</b> (accidental entry). This cannot be restored.');
  } else if(modal.type==='exit'){
    const wd = modal.status==='sold' ? activeWithdrawal(a.id) : null;
    const exitDateEl=document.getElementById('exitDateInput');
    const exitDate=exitDateEl && exitDateEl.value ? exitDateEl.value : todayStr();
    const note=document.getElementById('modalNote').value.trim();
    if(wd && !note){ document.getElementById('modalExitErr').textContent='Please enter a reason for proceeding despite the withdrawal period.'; return; }
    let fallenStockRef=null;
    if(modal.status==='dead'){
      fallenStockRef=document.getElementById('fallenStockRef').value.trim();
      if(!fallenStockRef){ document.getElementById('modalExitErr').textContent='A National Fallen Stock Co. reference is required for a death record.'; return; }
    }
    if(modal.status==='swapped'){
      const dir=document.getElementById('exitSwapDirection').value;
      if(!dir){ document.getElementById('modalExitErr').textContent='Choose whether money was given or received.'; return; }
    }
    const isLoss = modal.status==='dead' || modal.status==='stolen';
    const exitValueRaw=document.getElementById('exitValueInput').value.trim();
    const exitValueMag=exitValueRaw?Math.abs(parseFloat(exitValueRaw))||0:0;
    // Loss stored negative, profit stored positive — so a report can just
    // sum this field directly to get the actual realised change per month,
    // rather than needing to know the exit reason all over again.
    // Sold: the field is the gross sale price, not profit — the true
    // financial outcome is what's left after what the animal actually cost
    // (purchase + medicine), so that's what actually gets recorded.
    // Swapped: "Given" is money paid out (a cost), "Received" is money
    // taken in (a gain) — the direction alone determines the sign.
    let realizedValue;
    if(modal.status==='sold') realizedValue = exitValueMag - totalCost(a);
    else if(modal.status==='swapped') realizedValue = document.getElementById('exitSwapDirection').value==='received' ? exitValueMag : -exitValueMag;
    else realizedValue = isLoss ? -exitValueMag : exitValueMag;
    const exitIso = exitDate===todayStr() ? new Date().toISOString() : new Date(exitDate+'T12:00:00').toISOString();
    const exitEvent={id:uuid(), event_type:EXIT_STATUSES[modal.status], from_status:'active', to_status:modal.status, reason:null, note:note||null, created_at:exitIso, farmer_id:currentFarmerId};
    events[a.id].push(exitEvent);
    a.status=modal.status; a.updated_at=new Date().toISOString();
    a.realized_value=realizedValue;
    a.realized_value_date=exitDate;
    if(modal.status==='dead') a.fallen_stock_ref=fallenStockRef;
    await persistAll();
    await syncAnimalToSupabase(a);
    await syncAnimalEventToSupabase(a.id, exitEvent);
    logMsg('Marked <b>'+(animalDisplayName(a))+'</b> as '+modal.status+' (net '+(realizedValue<0?'loss':'gain')+' of '+fmtGBP(Math.abs(realizedValue))+')'+(wd?' <span style="color:var(--red);">(overrode an active withdrawal warning)</span>':'')+'.');
  }
  modal=null;
  // Restoring to active is the one status change where staying anywhere
  // near "Remove animal" doesn't make sense — land on the animal's own
  // details instead. Every other status change (sold/dead/stolen/swapped/
  // voided) takes the animal out of day-to-day use, so Home is the more
  // useful landing spot rather than a now-stale Remove-animal screen.
  if(modalTypeAtStart==='restore'){ selectedId=a.id; cameFromSummary=false; view='detail'; }
  else { navStack=[]; suppressHistoryPush=true; selectedId=null; view='home'; }
  render();
  // Says what actually happened and what it means for where the animal now
  // shows up, rather than a bare "Updated" that leaves the farmer to infer
  // it from the animal having vanished off the list they were just on.
  const name=animalDisplayName(a);
  let toastMsg='Updated';
  if(modalTypeAtStart==='restore') toastMsg=name+' re-added to the active list';
  else if(modalTypeAtStart==='void') toastMsg=name+' removed (accidental entry)';
  else if(modalTypeAtStart==='exit') toastMsg=name+' marked as '+a.status+', removed from default animal list';
  showSaveToast(toastMsg);
}

function wireView(){
  // Any footer icon marked "home" always returns to the hub, regardless of screen.
  document.querySelectorAll('.footericon.home').forEach(el=>el.onclick=()=>{
    const goHomeContinue=async()=>{
      if(view==='move') await commitMoveEntry();
      navStack=[]; suppressHistoryPush=true;
      view='home'; selectedId=null; weighTarget=null; feedTarget=null; healthTarget=null; cameFromSummary=false; medBulkActive=false; medBulkCarry=null; herdSelectMode=false; herdSelectedIds=[]; render();
    };
    if(hasUnsavedNewAnimalData()){
      showConfirmModal('Discard new animal?', goHomeContinue);
      return;
    }
    if(hasUnsavedMedicineAddData()){
      showConfirmModal('Discard medicine record?', goHomeContinue);
      return;
    }
    if(hasUnsavedMedCabinetAddData()){
      showConfirmModal(medCabEditTargetId?'Discard changes to this medicine?':'Discard new medicine?', goHomeContinue);
      return;
    }
    if(hasUnsavedMedDisposeData()){
      showConfirmModal('Discard medicine disposal?', goHomeContinue);
      return;
    }
    if(hasUnsavedDamageAddData()){
      showConfirmModal('Discard new farm damage?', goHomeContinue);
      return;
    }
    if(hasUnsavedWeighChanges()){
      showConfirmModal('You have weight/BCS values entered but not saved. Leave without saving?', goHomeContinue);
      return;
    }
    goHomeContinue();
  });

  // Wired once here rather than per-screen, since the "jump to month/year"
  // button sits next to every date field in the app regardless of view.
  document.querySelectorAll('[data-datejump]').forEach(el=>el.onclick=()=>{
    const targetInputId=el.dataset.datejump;
    const target=document.getElementById(targetInputId);
    if(!target) return;
    // Starts from whatever date the field already holds — e.g. re-opening
    // this on an animal that already has a D.O.B. set shows that date, not
    // today's — and only falls back to today when the field is genuinely
    // empty (a brand new animal, or an older record that never had a
    // D.O.B. recorded).
    const now=new Date();
    let startYear=now.getFullYear(), startMonth=now.getMonth(), startDay=now.getDate();
    if(target.value){
      const [y,m,d]=target.value.split('-').map(n=>parseInt(n,10));
      if(!isNaN(y)) startYear=y;
      if(!isNaN(m)) startMonth=m-1;
      if(!isNaN(d)) startDay=d;
    }
    let minYear=now.getFullYear()-40;
    // A field with an explicit max= (D.O.B., disposal date, ...) gets that
    // as a genuine ceiling on the wheel itself — not just a floor the
    // +10-year default could never actually be lowered below, which was
    // the bug: the wheel let you scroll to and select a future year, and
    // only a same-turn silent clamp down in the Go handler stopped the
    // final value — confusing, and one more place a fix could slip.
    // Fields with no max= (fodder/medicine expiry, genuinely open-ended)
    // keep the generous +10 default so they're not capped at this year.
    let maxYear = target.max ? parseInt(target.max.slice(0,4),10) : now.getFullYear()+10;
    minYear=Math.min(minYear, startYear);
    if(!target.max) maxYear=Math.max(maxYear, startYear);
    if(target.min){ minYear=Math.min(minYear, parseInt(target.min.slice(0,4),10)); }
    modal={type:'dateJump', targetInputId, minYear, maxYear, startYear, startMonth, startDay};
    renderModal();
  });

  if(view==='home'){
    document.getElementById('home-help').onclick=()=>{ showInfoModal('Home. Click the home icon on any screen to return here.'); };
    document.getElementById('switchUserBtn').onclick=()=>{ modal={type:'switchUser'}; render(); };
    document.getElementById('home-animals').onclick=()=>{ view='herd'; statusFilter='active'; searchTerm=''; filterBreedId=null; herdShowAllHistory=false; render(); };
    document.getElementById('home-addanimal').onclick=()=>{ view='add'; newAnimalEid=null; newAnimalMotherId=null; newAnimalMotherExternalEid=null; newAnimalFatherId=null; newAnimalFatherExternalEid=null; newAnimalPhoto=null; newAnimalPassportScanned=false; newAnimalIsCross=false; render(); };
    document.getElementById('home-move').onclick=()=>{
      view='move'; cameFromSummary=false; moveDate=todayStr(); moveGps=null; moveAnimalIds=[]; moveSessionRecordId=null; moveLocationVal=''; moveReasonVal=''; moveDirection=null; moveDestCphVal=''; moveHistoryScope=null; moveHistoryExpanded=false; expandedMoveHistoryId=null; moveWarningsSuppressed=false;
      render();
      // UAT found farmers didn't realise "View previous" (collapsed, easy
      // to miss) is also where you go to mark an animal sold or bring it
      // back on farm — not just a read-only log. Only shown from this
      // Home tile entry point, not every way of reaching Move, since this
      // is where a farmer starting fresh is most likely to need the nudge.
      if(!moveEnterDetailsHintSuppressed) showInfoModal('Enter move details then add the animals.', null, 'Do not show again for this session', ()=>{ moveEnterDetailsHintSuppressed=true; });
    };
    document.getElementById('home-weigh').onclick=()=>{ view='weigh'; weighTarget=null; weighDate=todayStr(); weighSessionRecordId=null; currentBcsValue=undefined; weighInlineSearchTerm=''; cameFromSummary=false; render(); };
    document.getElementById('home-damage').onclick=()=>{ view='damage'; expandedDamageId=null; render(); };
    document.getElementById('home-feed').onclick=()=>{ view='feed'; feedTarget=null; feedLastDate=null; render(); };
    document.getElementById('home-insights').onclick=()=>{ view='insights'; render(); };
    document.getElementById('home-reports').onclick=()=>{ view='reports'; render(); };
    document.getElementById('home-feedback').onclick=()=>{ window.open('mailto:ATHENAXltd@gmail.com?subject='+encodeURIComponent('aBC Stockman feedback')+'&body='+encodeURIComponent('We can only make aBC Stockman better with your feedback. Please let us know of any bugs or missing functionality. Give as much detail as possible and we\u2019ll try our best to make it reality. ')); };
    document.getElementById('home-settings').onclick=()=>{ view='settings'; render(); };
    document.getElementById('home-scan').onclick=()=>{ performTagScan('lookup', null); };
  }

  if(view==='herd'){
    document.getElementById('searchInput').oninput=(e)=>{searchTerm=e.target.value; render(); const si=document.getElementById('searchInput'); si.focus(); si.setSelectionRange(searchTerm.length,searchTerm.length);};
    wireSearchClear('searchInput');
    const herdShowAllBtn=document.getElementById('herdShowAllHistory');
    if(herdShowAllBtn) herdShowAllBtn.onclick=()=>{ herdShowAllHistory=true; render(); };
    document.querySelectorAll('[data-sort]').forEach(el=>el.onclick=()=>{
      const col=el.dataset.sort;
      if(sortColumn===col) sortDir = sortDir==='asc'?'desc':'asc'; else { sortColumn=col; sortDir='asc'; }
      render();
    });
    const toggleHerdSelect=(id)=>{
      if(herdSelectedIds.includes(id)) herdSelectedIds=herdSelectedIds.filter(x=>x!==id);
      else herdSelectedIds.push(id);
      if(herdSelectedIds.length===0) herdSelectMode=false; // deselecting the last row drops back to normal browsing
      render();
    };
    // Long-press (or a real mouse-hold, for testing on desktop) turns
    // selection mode on and selects that first row. pointerdown/up/move
    // covers touch and mouse in one listener rather than needing separate
    // touch* and mouse* handlers. Cancels on real drag movement (past a
    // small pixel threshold) so a scroll gesture starting on a row can't
    // be mistaken for a long-press — NOT on any pointermove at all, since
    // a finger held "still" on a real touchscreen still reports a few
    // pixels of jitter constantly, which cancelled the timer instantly on
    // a real device even though a genuinely static mouse cursor never
    // triggers pointermove at all, so this looked fine in desktop testing
    // and simply didn't work on a phone.
    let herdLongPressTimer=null, herdLongPressFiredId=null;
    document.querySelectorAll('tr[data-openrow]').forEach(row=>{
      const id=row.dataset.openrow;
      row.style.webkitUserSelect='none'; row.style.userSelect='none'; row.style.webkitTouchCallout='none';
      let startX=0, startY=0;
      const cancel=()=>clearTimeout(herdLongPressTimer);
      row.addEventListener('pointerdown', (e)=>{
        herdLongPressFiredId=null;
        startX=e.clientX; startY=e.clientY;
        clearTimeout(herdLongPressTimer);
        herdLongPressTimer=setTimeout(()=>{
          herdLongPressFiredId=id;
          if(!herdSelectMode){ herdSelectMode=true; herdSelectedIds=[id]; }
          else toggleHerdSelect(id);
          render();
        }, 500);
      });
      row.addEventListener('pointerup', cancel);
      row.addEventListener('pointermove', (e)=>{
        if(Math.hypot(e.clientX-startX, e.clientY-startY) > 12) cancel();
      });
      row.addEventListener('pointerleave', cancel);
      row.addEventListener('pointercancel', cancel);
      row.addEventListener('contextmenu', (e)=>e.preventDefault()); // don't let the browser's own long-press menu fight with ours
    });
    const openOrToggle=(id)=>{
      // The click that fires right as a finger/mouse lifts off after a
      // long-press would otherwise immediately toggle the row a second
      // time (or worse, navigate away) straight after long-press just
      // selected it — herdLongPressFiredId swallows exactly that one
      // trailing click.
      if(herdLongPressFiredId===id){ herdLongPressFiredId=null; return; }
      if(herdSelectMode){ toggleHerdSelect(id); return; }
      selectedId=id; view='detail'; render();
    };
    document.querySelectorAll('[data-openrow],[data-openname]').forEach(el=>el.onclick=(e)=>{
      // The <td data-openname> sits inside the <tr data-openrow>, and both
      // match this selector — without stopping propagation here, a tap on
      // the name cell fires openOrToggle once for the td, then again as it
      // bubbles up to the tr's own handler. That was harmless when this
      // only ever navigated to the same detail screen twice, but toggling
      // selection twice cancels itself out, so it matters now.
      e.stopPropagation();
      openOrToggle(el.dataset.openrow||el.dataset.openname);
    });
    document.querySelectorAll('[data-openprofit]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      if(herdSelectMode){ toggleHerdSelect(el.dataset.openprofit); return; }
      selectedId=el.dataset.openprofit;
      view='profitScore'; render();
    });
    document.querySelectorAll('[data-openhealth]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      if(herdSelectMode){ toggleHerdSelect(el.dataset.openhealth); return; }
      selectedId=el.dataset.openhealth; cameFromSummary=false;
      view='healthScore'; render();
    });
    document.querySelectorAll('[data-openbcs]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      if(herdSelectMode){ toggleHerdSelect(el.dataset.openbcs); return; }
      const animalId=el.dataset.openbcs;
      selectedId=animalId; timelineKindFilter='bcstrend'; cameFromSummary=false;
      view='timeline'; render();
    });
    document.getElementById('herd-help').onclick=()=>{
      if(herdSelectMode){ showInfoModal('Tap more animals to add them to the selection, then tap Move to move them all together. Tap the back arrow to cancel.'); return; }
      showInfoModal('\u2022 All active animals display by default.\n\n\u2022 Filter to show previous animals.\n\n\u2022 Tap column heading to sort.\n\n\u2022 Tap EID/name to see its Summary.\n\n\u2022 Tap Profit, BCS, or Health to jump straight to that detail.\n\n\u2022 Press and hold an animal to select several at once and move them together.');
    };
    const herdFilterBtn=document.getElementById('herd-filter');
    if(herdFilterBtn) herdFilterBtn.onclick=()=>{ showFilterModal=true; render(); };
    const herdScanBtn=document.getElementById('herd-scan');
    if(herdScanBtn) herdScanBtn.onclick=()=>{ performTagScan('lookup', null); };
    const herdMoveBtn=document.getElementById('herd-move');
    if(herdMoveBtn) herdMoveBtn.onclick=()=>{
      view='move'; cameFromSummary=false; moveDate=todayStr(); moveGps=null; moveSessionRecordId=null;
      moveLocationVal=''; moveReasonVal=''; moveDirection=null; moveDestCphVal='';
      moveAnimalIds=[...herdSelectedIds];
      moveHistoryScope=null; moveHistoryExpanded=false; expandedMoveHistoryId=null;
      moveWarningsSuppressed=false;
      herdSelectMode=false; herdSelectedIds=[];

      const name=document.getElementById('medcab-name').value.trim();
      const type=document.getElementById('medcab-type').value.trim();
      const batchNoVal=document.getElementById('medcab-batchno').value.trim();
      const expiryDateVal=document.getElementById('medcab-expirydate').value;
      const qtySizeRaw=document.getElementById('medcab-qtysize').value.trim();
      const costRaw=document.getElementById('medcab-cost').value.trim();
      const supplierVal=document.getElementById('medcab-supplier').value.trim();
      const supplierAddressVal=document.getElementById('medcab-supplieraddress').value.trim();
      const withdrawalDaysRaw=document.getElementById('medcab-withdrawaldays').value.trim();
      const dosageKgRaw=document.getElementById('medcab-dosagekg').value.trim();
      const missing=[];
      if(!name) missing.push('Product name');
      if(!type) missing.push('Type');
      if(!batchNoVal) missing.push('Batch No.');
      if(!expiryDateVal) missing.push('Expiry date');
      if(!qtySizeRaw) missing.push('Size/Qty');
      if(!costRaw) missing.push('Cost');
      if(!supplierVal) missing.push('Supplier');
      if(!supplierAddressVal) missing.push('Supplier address');
      if(!withdrawalDaysRaw) missing.push('Default withdrawal (days)');
      if(missing.length){ highlightFirstMissingField([['medcab-name','Product name'],['medcab-type','Type'],['medcab-batchno','Batch No.'],['medcab-expirydate','Expiry date'],['medcab-qtysize','Size/Qty'],['medcab-cost','Cost'],['medcab-supplier','Supplier'],['medcab-supplieraddress','Supplier address'],['medcab-withdrawaldays','Default withdrawal (days)']]); return; }
      const qtySize=parseFloat(qtySizeRaw);
      if(isNaN(qtySize) || qtySize<=0){ errEl.textContent='Enter a Size/Qty greater than 0.'; return; }
      const cost=parseFloat(costRaw);
      if(isNaN(cost) || cost<0){ errEl.textContent='Enter a valid cost.'; return; }
      const withdrawalDays=parseInt(withdrawalDaysRaw,10);
      if(isNaN(withdrawalDays) || withdrawalDays<0){ errEl.textContent='Enter a valid number of withdrawal days.'; return; }
      const dosagePerKg = dosageKgRaw ? parseFloat(dosageKgRaw) : null;
      const qtyUnit=document.getElementById('medcab-qtyunit').value;

      if(editItem){
        editItem.name=name; editItem.type=type; editItem.batch_no=batchNoVal; editItem.expiry_date=expiryDateVal;
        editItem.qty_size=qtySize; editItem.qty_unit=qtyUnit; editItem.cost=cost;
        editItem.supplier=supplierVal; editItem.supplier_address=supplierAddressVal;
        editItem.withdrawal_days=withdrawalDays; editItem.dosage_per_kg=(dosagePerKg!=null && !isNaN(dosagePerKg))?dosagePerKg:null;
        editItem.photo_data=medCabAddPhoto;
        await persistAll();
        await syncMedicineTypeToSupabase(editItem);
        logMsg('Updated <b>'+escapeHtml(name)+'</b> in the Medicine Cabinet.');
      } else {
        const newMedType={
          id:uuid(), name, type, batch_no:batchNoVal, expiry_date:expiryDateVal,
          qty_size:qtySize, qty_unit:qtyUnit,
          cost, supplier:supplierVal, supplier_address:supplierAddressVal,
          withdrawal_days:withdrawalDays, dosage_per_kg:(dosagePerKg!=null && !isNaN(dosagePerKg))?dosagePerKg:null,
          photo_data:medCabAddPhoto,
          active:true, locked:false, disposed_at:null,
        };
        medicineTypes.push(newMedType);
        await persistAll();
        await syncMedicineTypeToSupabase(newMedType);
        logMsg('Added <b>'+escapeHtml(name)+'</b> to the Medicine Cabinet ('+qtySize+qtyUnit+', '+fmtGBP(cost)+').');
      }
      showSaveToast('Saved');
      settingsOpenSection='medtypes'; settingsShowAddForm=false;
      view='settings';
      render();
      const target=document.getElementById('settingsSection-medtypes');
      if(target) target.scrollIntoView({block:'start', behavior:'smooth'});
    };
  }
  if(view==='medDispose'){
    wireGoKeySubmit('meddispose-save');
    const m=medicineTypes.find(x=>x.id===medDisposeTargetId);
    const expected=m?cabinetRemaining(m):0;
    const qtyInput=document.getElementById('meddispose-qty');
    const diffRow=document.getElementById('meddispose-diffrow');
    const diffReasonInput=document.getElementById('meddispose-diffreason');
    const updateDiffRow=()=>{
      const val=parseFloat(qtyInput.value);
      const matches = !isNaN(val) && Math.abs(val-expected)<0.0001;
      diffRow.style.display = matches ? 'none' : 'block';
    };
    qtyInput.onchange=updateDiffRow;
    document.getElementById('meddispose-help').onclick=()=>{ showInfoModal('\u2022 Qty remaining defaults to the calculated amount left in this batch \u2014 amend it if the actual count differs.\n\n\u2022 If it doesn\u2019t match, explain the difference (at least 10 characters) so there\u2019s a record of why.\n\n\u2022 Disposal date can be today or earlier, never in the future.'); };
    document.getElementById('meddispose-save').onclick=async()=>{
      const errEl=document.getElementById('err-meddispose'); errEl.textContent='';
      const qtyRaw=qtyInput.value.trim();
      const disposalDate=document.getElementById('meddispose-date').value;
      const methodVal=document.getElementById('meddispose-method').value.trim();
      const missing=[];
      if(!qtyRaw) missing.push('Qty remaining');
      if(!disposalDate) missing.push('Date of disposal');
      if(!methodVal) missing.push('How & where');
      if(missing.length){ highlightFirstMissingField([['meddispose-qty','Qty remaining'],['meddispose-date','Date of disposal'],['meddispose-method','How & where']]); return; }
      const qtyVal=parseFloat(qtyRaw);
      if(isNaN(qtyVal)){ errEl.textContent='Enter a valid quantity.'; return; }
      if(qtyVal<0){ errEl.textContent='Qty remaining cannot be less than 0.'; return; }
      if(disposalDate > todayStr()){ errEl.textContent='Date of disposal cannot be in the future.'; return; }
      const matches = Math.abs(qtyVal-expected)<0.0001;
      let diffReason='';
      if(!matches){
        diffReason=diffReasonInput.value.trim();
        if(diffReason.length<10){ errEl.textContent='Explain the qty difference (at least 10 characters).'; diffReasonInput.focus(); return; }
      }
      if(!m) return;
      m.disposed_at=new Date().toISOString();
      m.disposal_qty_remaining=qtyVal;
      m.disposal_qty_diff_reason=diffReason||null;
      m.disposal_date=disposalDate;
      m.disposal_method=methodVal;
      await persistAll();
      await syncMedicineTypeToSupabase(m);
      logMsg('Disposed of <b>'+escapeHtml(m.name)+'</b> (Batch '+escapeHtml(m.batch_no||'')+').');
      showSaveToast('Saved');
      settingsOpenSection='medtypes'; settingsShowAddForm=false;
      medCabinetViewPrevExpanded=true; medCabinetExpandedType=null;
      view='settings';
      render();
      const target=document.getElementById('settingsSection-medtypes');
      if(target) target.scrollIntoView({block:'start', behavior:'smooth'});
    };
  }
  if(view==='injury'){
    document.querySelector('[data-injback]').onclick=()=>{healthTarget=null; view='detail'; render();};
    document.getElementById('inj-help').onclick=()=>{ showInfoModal('\u2022 Active injuries are highlighted red and can be amended as required \u2014 changes to free text boxes save when you click outside them.\n\n\u2022 Previous injuries can be viewed.\n\n\u2022 The number of injuries affects the animal\u2019s health score (the more injuries, the lower the score) and sell recommendations.\n\n\u2022 Click the Add button to add a new injury.\n\n\u2022 Add medicine links whichever injury is expanded to the medicine you give for it.\n\n\u2022 Tick off injuries as they recover/heal.\n\n\u2022 Later functionality: photo of the injury will be analysed and recommendations given.'); };
    document.getElementById('inj-add').onclick=()=>{ injAddPhoto=null; view='injuryAdd'; render(); };
    document.getElementById('inj-addmedicine').onclick=()=>{
      // Only offer to link when exactly one injury is expanded — the
      // accordion behaviour above guarantees at most one, so this is
      // unambiguous. With nothing expanded there's nothing to link to,
      // so fall back to the plain (unlinked) route to the medicine list.
      const linkedId = expandedInjuryIds.size===1 ? [...expandedInjuryIds][0] : null;
      if(linkedId){
        showConfirmModal('The medicine you add will be linked to this injury.', ()=>{
          medAddPhoto=null; medAddDefaultReason='injury'; medAddInjuryId=linkedId; medBulkActive=false; medBulkCarry=null; view='medicineAdd'; render();
        }, null, 'Ok', 'Cancel');
      } else {
        view='medicine'; render();
      }
    };
    document.querySelectorAll('[data-toggleinjury]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.toggleinjury;
      const wasOpen=expandedInjuryIds.has(id);
      // Accordion behaviour: expanding one injury collapses every other
      // one, active or previous — "Add medicine" links to whichever
      // injury is currently expanded, so at most one can be open at once.
      expandedInjuryIds.clear();
      if(!wasOpen) expandedInjuryIds.add(id);
      render();
      if(!wasOpen){
        const target=document.querySelector('[data-toggleinjury="'+id+'"]');
        if(target) target.scrollIntoView({block:'start', behavior:'smooth'});
      }
    });
    const injHistToggle=document.getElementById('injHistoricalToggle');
    if(injHistToggle) injHistToggle.onclick=()=>{
      const wasOpen=injHistoricalExpanded;
      injHistoricalExpanded=!injHistoricalExpanded;
      if(!wasOpen){
        // Opening the group doesn't itself expand a row, but keeps the
        // same one-open-at-a-time rule — collapse whatever else was open.
        expandedInjuryIds.clear();
      }
      render();
      if(!wasOpen){
        const target=document.getElementById('injHistoricalToggle');
        if(target) target.scrollIntoView({block:'start', behavior:'smooth'});
      }
    };
    document.querySelectorAll('[data-viewtext]').forEach(el=>el.onclick=()=>{ showInfoModal(el.dataset.viewtext); });
    document.querySelectorAll('[data-viewinjuryphoto]').forEach(el=>el.onclick=()=>{
      const inj=injuryRecords.find(x=>x.id===el.dataset.viewinjuryphoto);
      if(!inj.photo_data){ showInfoModal('Photo not taken'); return; }
      modal={type:'imageView', src:inj.photo_data};
      render();
    });
    document.querySelectorAll('[data-gotomedrecord]').forEach(el=>el.onclick=()=>goToMedicineRecord(el.dataset.gotomedrecord));
    document.querySelectorAll('[data-recoveredcheck]').forEach(el=>el.onchange=async()=>{
      const inj=injuryRecords.find(x=>x.id===el.dataset.recoveredcheck);
      inj.resolved_at = el.checked ? new Date().toISOString() : null;
      await persistAll();
      await syncInjuryToSupabase(inj);
      const a=animals.find(x=>x.id===healthTarget);
      logMsg((el.checked?'Marked recovered':'Reopened')+' an injury for <b>'+(animalDisplayName(a))+'</b>.');
      render();
      showSaveToast('Updated');
    });
    // Active injuries are editable in place — no history is kept of the
    // edits, this just updates the record directly, same as the rest of
    // the app's inline-edit fields (Breeding, Settings, etc). Saves as
    // soon as the field loses focus, no separate Save button needed.
    // Body part and injury level are mandatory (same as on the Add form) —
    // there's no blank option in the dropdown any more, but this guards
    // against ever silently saving an empty value regardless.
    document.querySelectorAll('[data-injbodypart]').forEach(el=>el.onchange=async()=>{
      const inj=injuryRecords.find(x=>x.id===el.dataset.injbodypart);
      if(!el.value){ el.value=inj.body_part||'head'; return; }
      inj.body_part=el.value;
      await persistAll();
      await syncInjuryToSupabase(inj);
      render();
      showSaveToast('Body part: '+el.value.charAt(0).toUpperCase()+el.value.slice(1));
    });
    document.querySelectorAll('[data-injlevel]').forEach(el=>el.onchange=async()=>{
      const inj=injuryRecords.find(x=>x.id===el.dataset.injlevel);
      if(!el.value){ el.value=inj.severity||1; return; }
      inj.severity=parseInt(el.value,10);
      await persistAll();
      await syncInjuryToSupabase(inj);
      render();
      showSaveToast('Injury level: '+inj.severity);
    });
    document.querySelectorAll('[data-injnotes]').forEach(el=>el.onchange=async()=>{
      const inj=injuryRecords.find(x=>x.id===el.dataset.injnotes);
      inj.notes=el.value.trim()||null;
      inj.cause=null; // merged into the single Cause/notes field now — avoid keeping a stale duplicate
      await persistAll();
      await syncInjuryToSupabase(inj);
      showSaveToast(inj.notes?'Cause/notes saved':'Cause/notes cleared');
    });
    // Grows the Cause/notes box to fit whatever's actually been typed,
    // rather than always reserving a fixed block of empty space — sized
    // once on render for existing text, then again on every keystroke.
    document.querySelectorAll('[data-injnotes]').forEach(el=>{
      const resize=()=>{ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; };
      resize();
      el.addEventListener('input', resize);
    });
    injuryRecords.filter(r=>r.animal_id===healthTarget && !r.resolved_at && expandedInjuryIds.has(r.id)).forEach(inj=>{
      wirePhotoCaptureModal('injrow'+inj.id, async(dataUrl)=>{
        inj.photo_data=dataUrl;
        // A replaced photo makes any existing AI diagnosis stale — clear it
        // and re-queue for analysis, same as a brand-new photo would be.
        inj.analysis_status='pending';
        inj.ai_diagnosis=null; inj.ai_treatment=null; inj.ai_confidence=null; inj.ai_vet_recommended=null; inj.analyzed_at=null;
        await persistAll();
        await syncInjuryToSupabase(inj);
        render();
        showSaveToast('Updated');
      });
    });
  }
  if(view==='injuryAdd'){
    wireGoKeySubmit('injadd-save');
    wirePhotoCaptureModal('injphoto', (dataUrl)=>{ injAddPhoto=dataUrl; updatePhotoPreview('injphoto', dataUrl); });
    const levelSelect=document.getElementById('inj-level');
    const applyLevelColor=()=>{
      const v=parseInt(levelSelect.value,10);
      if(v){ levelSelect.style.background=injurySeverityColor(v); levelSelect.style.color='#fff'; levelSelect.style.fontWeight='700'; }
      else { levelSelect.style.background=''; levelSelect.style.color=''; levelSelect.style.fontWeight=''; }
    };
    levelSelect.onchange=applyLevelColor;
    wireSelectAutoAdvance('inj-level', 'inj-notes');
    applyLevelColor();
    document.getElementById('injadd-help').onclick=()=>{ showInfoModal('\u2022 Record as much detail as necessary to monitor this injury.\n\n\u2022 Taking a photo helps assess recovery later.\n\n\u2022 Injuries are used to calculate overall health.\n\n\u2022 Future functionality: the photo will be analysed to give recommendations.'); };
    document.getElementById('injadd-save').onclick=async()=>{
      const a=animals.find(x=>x.id===healthTarget);
      const bodyPartVal=document.getElementById('inj-bodypart').value;
      const levelRaw=document.getElementById('inj-level').value;
      const missing=[];
      if(!bodyPartVal) missing.push('Body part');
      if(!levelRaw) missing.push('Injury level');
      if(missing.length){ highlightFirstMissingField([['inj-bodypart','Body part'],['inj-level','Injury level']]); return; }
      const checklist={
        bleeding: document.getElementById('chk-bleeding').checked,
        non_weight_bearing: document.getElementById('chk-weightbearing').checked,
        hot_to_touch: document.getElementById('chk-hot').checked,
      };
      const newInjury = {
        id:uuid(), animal_id:a.id, photo_data:injAddPhoto||null,
        body_part: bodyPartVal||null,
        cause: null,
        severity: levelRaw?parseInt(levelRaw,10):null,
        notes: document.getElementById('inj-notes').value.trim()||null,
        checklist, recorded_at:new Date().toISOString(), resolved_at:null,
        analysis_status: injAddPhoto ? 'pending' : null, ai_diagnosis:null, ai_treatment:null, ai_confidence:null, ai_vet_recommended:null, analyzed_at:null,
        farmer_id:currentFarmerId,
      };
      injuryRecords.push(newInjury);
      await persistAll();
      await syncInjuryToSupabase(newInjury);
      logMsg('Logged an injury for <b>'+(animalDisplayName(a))+'</b>'+(injAddPhoto?' with a photo':'')+'.');
      injAddPhoto=null;
      // Accordion behaviour: the newly-added injury becomes the one and
      // only expanded row.
      expandedInjuryIds=new Set([injuryRecords[injuryRecords.length-1].id]);
      view='injury'; render();
      showSaveToast('Saved');
      if(onlineSim) runPendingAnalyses();
      showConfirmModal('Add medicine for this injury?', ()=>{
        medAddPhoto=null; medAddDefaultReason='injury'; medAddInjuryId=injuryRecords[injuryRecords.length-1].id; medBulkActive=false; medBulkCarry=null; view='medicineAdd'; render();
      });
    };
  }

  // Universal back arrow — every appbar back button now pops the real
  // navigation history, overriding any older screen-specific destination.
  document.querySelectorAll('.appbar button.back').forEach(el=>el.onclick=goBack);
}

(async ()=>{
  await loadAll();

  // Cloud auth gate (Phase 1) — runs before the existing local farm-pairing
  // screen. Three states: not signed in, signed in but not yet added to a
  // farm, or signed in and linked to a farm (in which case `animals` has
  // just been hydrated from Supabase and the app carries on as before).
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    authUser=session.user;
    await resolveFarmMembership();
  }
  sb.auth.onAuthStateChange(async(_event, newSession)=>{
    authUser = newSession ? newSession.user : null;
    if(authUser){
      await resolveFarmMembership();
      view = authFarmId ? (deviceFarmCode?'home':'login') : 'supaWaiting';
    } else {
      authFarmId=null; view='supaLogin';
    }
    render();
  });

  if(!authUser){ view='supaLogin'; }
  else if(!authFarmId){ view='supaWaiting'; }
  else if(!deviceFarmCode){ view='login'; }
  render();
  if(onlineSim) runPendingAnalyses();

  await checkForInterruptedPassportScan();

  // Re-check whenever the app comes back to the foreground — not just at
  // boot. This is what actually catches an interruption in practice: the
  // app usually keeps running (paused, not reloaded) when backgrounded
  // for the camera, so the boot-time check alone only ever fired after a
  // full manual reload, not the moment you switch back to the app.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && !modal) checkForInterruptedPassportScan();
  });

  // Single persistent connectivity icon, shown in the same top-right spot
  // on every screen including Home — previously Home had its own separate
  // green/red toggle there while every other page showed a static
  // "not connected" icon, so by default the two disagreed with each other.
  // Now there's just the one: it reflects onlineSim (green = simulated
  // online, red = simulated offline) and tapping it toggles that state,
  // same as Home's old toggle used to, from any screen.
  const phoneFrame0=document.getElementById('phoneFrame');
  const noServerBtn=document.createElement('button');
  noServerBtn.className='noServerIcon';
  noServerBtn.onclick=()=>{ onlineSim=!onlineSim; render(); if(onlineSim) runPendingAnalyses(); };
  phoneFrame0.appendChild(noServerBtn);
  updateSignalBadge();

  // Swipe right anywhere on the phone screen to go back — mirrors the header back arrow.
  const phoneFrame=document.getElementById('phoneFrame');
  let touchStartX=0, touchStartY=0, touchActive=false;
  phoneFrame.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1) return;
    touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; touchActive=true;
  }, {passive:true});
  phoneFrame.addEventListener('touchend', (e)=>{
    if(!touchActive) return;
    touchActive=false;
    const endX=(e.changedTouches[0]||{}).clientX ?? touchStartX;
    const endY=(e.changedTouches[0]||{}).clientY ?? touchStartY;
    const dx=endX-touchStartX, dy=endY-touchStartY;
    if(dx>70 && Math.abs(dx)>Math.abs(dy)*2){ goBack(); }
  }, {passive:true});
})();
</script>
<script>
  // Register the service worker. When a new version takes over, DON'T
  // reload immediately — that can silently interrupt whatever's in
  // progress (a multi-step scan, a half-filled form), which is very
  // likely what caused a passport scan to appear to dump the app back on
  // Home mid-flow: a new build takes several seconds to install in the
  // background, easily long enough to land right in the middle of a
  // Gemini call. Instead, show a small persistent banner and let the
  // person choose when it's safe to apply it.
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
    let swRefreshed=false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(swRefreshed) return;
      swRefreshed=true;
      const frame=document.getElementById('phoneFrame');
      if(!frame){ window.location.reload(); return; } // shouldn't happen, but don't strand the person on a dead page
      const banner=document.createElement('button');
      banner.id='updateReadyBanner';
      banner.textContent='Update available \u2014 tap to refresh';
      banner.style.cssText='position:absolute;left:10px;right:10px;bottom:10px;z-index:60;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);';
      banner.onclick=()=>{ window.location.reload(); };
      frame.appendChild(banner);
    });
  }
</script>
</body>
