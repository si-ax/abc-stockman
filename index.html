<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>aBC Stockman</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1A8A4A">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="aBC Stockman">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111; --paper:#ffffff; --card:#ffffff;
    --primary:#1a8a4a; --primary-dark:#136337;
    --green:#1a8a4a; --green-bg:#e3f5ea;
    --amber:#c98400; --amber-bg:#fdf0d8;
    --yellow:#e0b400;
    --red:#d13b30; --red-bg:#fbe2e0;
    --grey:#5c5949; --grey-light:#c9c9c9; --line:#e4e4e4; --link:#1565c0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#f3f3f3;color:var(--ink);font-family:'Inter',sans-serif;padding:24px 18px 60px;}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0;}
  .wrap{max-width:960px;margin:0 auto;}
  .top{margin-bottom:20px;}
  .top h1{font-size:30px;color:var(--ink);}
  .top p{font-size:14px;color:var(--grey);margin:6px 0 0;max-width:660px;line-height:1.5;}
  .banner{background:var(--amber-bg);color:#7a5406;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:8px;margin-top:10px;display:inline-block;}
  .grid{display:flex;justify-content:center;}

  .phone{background:#1c1c1c;border-radius:34px;padding:14px;box-shadow:0 2px 0 var(--line);position:relative;}
  .screen{background:var(--paper);border-radius:22px;overflow:hidden;min-height:600px;display:flex;flex-direction:column;}
  .appbar{background:var(--paper);color:var(--ink);padding:12px 14px;font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;min-height:22px;border-bottom:1px solid var(--line);}
  .appbar button.back{background:none;border:none;color:var(--ink);cursor:pointer;padding:0 4px 0 0;display:flex;align-items:center;}
  .appbar button.back svg{width:26px;height:26px;}
  .appbar .signal{color:var(--red);display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;}
  .appbar .help{background:none;border:none;cursor:pointer;color:var(--grey);display:flex;align-items:center;}
  .body{flex:1;overflow-y:auto;padding:10px 10px 4px;}

  /* ---- icon-grid hub screens (Home, Animal Summary) ---- */
  .icongrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 4px;}
  .icontile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;position:relative;font-family:inherit;}
  .icontile:active{opacity:.6;background:#f7f7f7;}
  .icontile .ticon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;}
  .icontile .ticon svg{width:44px;height:44px;}
  .icontile .ticon .comboIcon svg{width:100%;height:100%;}
  .icontile .tlabel{font-size:13px;font-weight:700;color:var(--ink);text-align:center;}
  .icontile .tbadge{position:absolute;top:6px;right:calc(50% - 34px);background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .icontile.disabled .ticon svg{opacity:.35;}
  .icontile.disabled .tlabel{color:var(--grey);}
  .icontile.filled{border-color:transparent;}
  .icontile.filled:active{opacity:.75;}
  .amberfield{background:var(--amber-bg)!important;border-color:var(--amber)!important;}

  /* ---- footer icon bar (persistent action bar) ---- */
  .footerbar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);background:#fff;padding:5px 20px;flex:0 0 auto;}
  .footericon.primary{background:var(--primary);color:#fff;border-radius:12px;padding:6px 16px;}
  .footericon.primary svg{color:#fff;}
  .footericon{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 10px;font-family:inherit;color:var(--grey);}
  .footericon svg{width:30px;height:30px;}
  .footericon.active{color:var(--primary);}
  .footericon.warn{color:var(--amber);}
  .footericon.warn .flabel{color:var(--amber);font-weight:800;}
  .footericon.danger{background:var(--red);color:#fff;border-radius:12px;padding:6px 16px;}
  .footericon.danger svg{color:#fff;}
  .footericon.danger .flabel{color:#fff;}
  .footericon.bordered{border:1.5px solid var(--line);border-radius:12px;padding:5px 14px;}
  .footericon.home svg{color:var(--primary);}
  .footericon.home{border:1.5px solid var(--primary);border-radius:12px;padding:6px 16px;}
  .footericon.home .flabel{color:var(--primary);}
  .footericon .flabel{font-size:9.5px;font-weight:700;}

  /* ---- brief auto-dismiss confirmation toast (lives in #phoneFrame, outside
     #screen, so it survives the render() innerHTML swap that follows a save) ---- */
  .savetoast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:82%;text-align:center;white-space:pre-line;}
  .savetoast.show{opacity:1;}
  /* Full-frame scanning overlay — shown the instant a tag photo is taken
     and hidden only once a result (success or failure) comes back, so a
     farmer never sees the app go quiet for the several seconds a Groq
     call (plus, on failure, a Tesseract fallback + first-run engine
     download) can genuinely take. Unlike .savetoast this does NOT
     auto-dismiss on a timer — it's tied to the actual scan finishing. */
  .scanoverlay{position:absolute;inset:0;background:rgba(17,17,17,.55);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;color:#fff;text-align:center;padding:0 30px;}
  .scanoverlay.show{display:flex;}
  .scanoverlay .spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:scanoverlayspin .8s linear infinite;}
  .scanoverlay .msg{font-size:15px;font-weight:700;}
  @keyframes scanoverlayspin{to{transform:rotate(360deg);}}
  .oppspinner{width:34px;height:34px;margin:0 auto 10px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:scanoverlayspin .8s linear infinite;}
  .noServerIcon{position:absolute;top:14px;right:14px;width:22px;height:22px;color:var(--red);z-index:45;cursor:pointer;background:none;border:none;padding:0;}

  /* ---- animal list table ---- */
  .listtable{width:100%;border-collapse:collapse;}
  .listtable thead th{position:sticky;top:0;background:#fff;font-size:11px;text-transform:uppercase;color:var(--grey);text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  .listtable thead th.sorted{color:var(--ink);}
  .listtable thead th .arrow{font-size:9px;margin-left:2px;}
  .listtable tbody tr{border-bottom:1px solid var(--line);cursor:pointer;}
  .listtable tbody tr:active{background:#f7f7f7;}
  .listtable td{padding:9px 4px;font-size:13px;vertical-align:middle;}
  .listtable td.idcell{color:var(--grey);font-size:10.5px;font-weight:600;}
  .listtable td.namecell{font-weight:700;text-decoration:underline;text-decoration-color:var(--line);}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;}
  .pill.green{background:var(--green);}
  .pill.amber{background:var(--amber);}
  .pill.red{background:var(--red);}
  .circledot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;}
  .circledot.green{background:var(--green);}
  .circledot.amber{background:var(--amber);}
  .circledot.red{background:var(--red);}
  .heartcell svg{width:26px;height:26px;}

  .searchrow{display:flex;gap:6px;margin-bottom:8px;}
  .searchwrap{position:relative;flex:1;}
  .searchwrap input{padding-right:32px;}
  .searchClearBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--grey);width:22px;height:22px;display:none;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  .searchClearBtn.show{display:flex;}
  .searchrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
  .chip{font-size:14.5px;font-weight:700;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--grey);}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}

  .row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;}
  .row:hover{border-color:var(--primary);}
  .row .id{font-size:11px;color:var(--grey);font-weight:600;}
  .row .name{font-size:14px;font-weight:600;}
  .badge{font-size:10.5px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
  .badge.active{background:var(--green-bg);color:var(--green);}
  .badge.exit{background:var(--amber-bg);color:var(--amber);}
  .badge.voided{background:var(--grey);color:#fff;}
  .empty{padding:40px 20px;text-align:center;color:var(--grey);font-size:13px;}

  label{display:block;font-size:12.5px;font-weight:700;text-transform:uppercase;color:var(--grey);margin:12px 0 4px;}
  /* one step bigger than the app-wide default, for the screens with the most spare room */
  .bigtext label{font-size:14px;}
  .bigtext input[type=text],.bigtext input[type=number],.bigtext input[type=date],.bigtext select,.bigtext textarea{font-size:16.5px;}
  input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;font-family:inherit;background:#fff;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  textarea{resize:vertical;min-height:56px;}
  .field-error{color:var(--red);font-size:13px;margin-top:3px;}
  .fullbtn{width:100%;background:var(--primary);color:#fff;border:none;padding:11px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-top:16px;}
  .datewheel-wrap{position:relative;height:150px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .datewheel-col{height:150px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .datewheel-col::-webkit-scrollbar{display:none;}
  .datewheel-spacer{height:50px;flex-shrink:0;}
  .datewheel-item{height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:19px;font-weight:700;color:var(--grey);}
  .datewheel-highlight{position:absolute;top:50px;left:0;right:0;height:50px;border-top:2px solid var(--primary);border-bottom:2px solid var(--primary);pointer-events:none;background:rgba(46,125,50,0.06);}
  .fullbtn:disabled{opacity:.4;cursor:not-allowed;}
  .fullbtn.danger{background:var(--red);}
  .fullbtn.ghost{background:#fff;color:var(--ink);border:1px solid var(--primary);}

  .detailhead{padding:10px 2px 6px;text-align:center;}
  .detailhead .tag{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--grey);letter-spacing:.05em;}
  .detailhead .name{font-family:'Barlow Condensed',sans-serif;font-size:26px;color:var(--ink);}
  .detailhead .meta{font-size:12.5px;color:var(--grey);margin-top:2px;}
  .statusline{margin:6px 0 4px;text-align:center;}

  .actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .actionbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;}
  .actionbtn:hover{border-color:var(--primary);}
  .actionbtn .actionicon{width:18px;height:18px;flex-shrink:0;}
  .actionbtn.voidbtn{grid-column:1/-1;color:var(--red);border-color:var(--red-bg);}
  .bcsgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:2px;}
  .bcsbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 0;font-size:26px;font-weight:800;cursor:pointer;color:var(--ink);}
  .bcsbtn.on.bcs-green{background:var(--green);color:#fff;border-color:var(--green);}
  .bcsbtn.on.bcs-amber{background:var(--amber);color:#fff;border-color:var(--amber);}
  .bcsbtn.on.bcs-red{background:var(--red);color:#fff;border-color:var(--red);}
  .warnbanner{background:var(--red-bg);color:var(--red);font-size:12px;font-weight:600;padding:10px 12px;border-radius:8px;margin:8px 0;}
  .sevbadge{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px;}
  .sevbadge.sev-bcs-green{background:var(--green-bg);color:var(--green);}
  .sevbadge.sev-bcs-amber{background:var(--amber-bg);color:var(--amber);}
  .sevbadge.sev-bcs-red{background:var(--red-bg);color:var(--red);}
  .thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0;}
  .valuecard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;}
  .valuerow{display:flex;gap:8px;}
  .valuebox{flex:1;border-radius:8px;padding:8px 10px;}
  .valuelabel{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--grey);}
  .valuenum{font-size:22px;font-weight:700;font-family:'Barlow Condensed',sans-serif;}
  .breakdown{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;}
  .bkhead{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink);}
  .bkrow{display:flex;justify-content:space-between;font-size:15px;color:#3a3d2e;padding:5px 0;}

  .eventlist{margin-top:14px;}
  .event{border-left:2px solid var(--line);padding:2px 0 10px 12px;margin-left:4px;position:relative;}
  .event::before{content:'';width:8px;height:8px;background:var(--primary);border-radius:50%;position:absolute;left:-5px;top:5px;}
  .event .etype{font-weight:700;font-size:12.5px;text-transform:capitalize;}
  .event .ets{font-size:10.5px;color:var(--grey);}
  .event .ereason{font-size:12px;color:var(--grey);margin-top:2px;font-style:italic;}

  .modal-backdrop{position:absolute;inset:0;background:rgba(17,17,17,.5);display:flex;align-items:flex-end;z-index:5;}
  .modal{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px 16px 20px;max-height:80vh;overflow-y:auto;}
  /* Camera capture breaks out of the app's normal portrait phone-frame
     entirely (position:fixed escapes it — .phone/#screen have no
     transform set, so this isn't trapped inside their bounds) and fills
     the REAL device viewport, in whatever orientation it's actually
     held. object-fit:cover means the live preview fills the available
     space cleanly either way. The portrait/landscape rule below is what
     actually gives a landscape hold more usable width for a wide
     subject (e.g. a passport's printed details, which run across the
     top of the page) instead of squeezing it into a narrow column. */
  .camera-fullscreen{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;}
  .camera-fullscreen .cam-video-wrap{flex:1;position:relative;overflow:hidden;background:#000;min-height:0;min-width:0;}
  .camera-fullscreen video{width:100%;height:100%;object-fit:cover;display:block;}
  .camera-fullscreen .cam-close{position:absolute;top:max(10px, env(safe-area-inset-top));right:10px;z-index:2;background:rgba(0,0,0,.55);border:none;border-radius:50%;width:38px;height:38px;color:#fff;display:flex;align-items:center;justify-content:center;}
  .camera-fullscreen .cam-controls{background:#111;padding:14px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:8px;flex-shrink:0;}
  .camera-fullscreen .cam-status{font-size:13px;color:#ddd;text-align:center;line-height:1.4;min-height:1.2em;}
  @media (orientation:landscape){
    .camera-fullscreen{flex-direction:row;}
    .camera-fullscreen .cam-controls{width:150px;padding:16px 12px;justify-content:center;}
  }
  .modal h3{font-size:16px;color:var(--ink);margin-bottom:2px;}
  .modal .sub{font-size:12.5px;color:var(--grey);margin-bottom:8px;}

  .damagebar{width:100%;border:none;border-radius:8px;padding:10px 12px;color:#fff;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left;}
  .damagepanel{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:10px 12px 14px;margin-top:-2px;}
  .urgencychip{flex:1;padding:10px 0;border-radius:20px;border:3px solid transparent;font-weight:700;font-size:16px;cursor:pointer;color:#fff;opacity:.55;}
  .urgencychip[data-urgency="low"]{background:var(--grey-light);color:var(--ink);}
  .urgencychip[data-urgency="med"]{background:var(--amber);}
  .urgencychip[data-urgency="high"]{background:var(--red);}
  .urgencychip.on{opacity:1;border-color:var(--ink);}
  .formrow{display:flex;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);gap:12px;}
  .formrow.compact{padding:6px 2px;border-bottom:none;}
  .formrow>label{margin:0;font-size:12.5px;font-weight:800;text-transform:uppercase;color:var(--ink);flex:0 0 30%;}
  .formrow>.formctrl{flex:1;min-width:0;}
  .formrow input,.formrow select{margin:0;}
  .formrow .withunit{display:flex;align-items:center;gap:6px;}
  .formrow .withunit input{flex:1;min-width:0;}
  .formrow .withunit span{font-weight:800;font-size:13px;color:var(--ink);flex-shrink:0;}
  .eidrow{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);}
  .eidbtn{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--primary);font-weight:800;font-size:15px;cursor:pointer;padding:0;}
  .eidbtn svg{width:20px;height:20px;}
  .breedhistorybtn svg{width:18px;height:18px;flex-shrink:0;}
  .helpcircle{background:var(--red);border:none;color:#fff;width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;font-weight:800;font-family:inherit;line-height:1;}
  .helpcircle svg{width:15px;height:15px;}
  #eidModalScan svg,#eidModalSave svg{width:24px;height:24px;}
  .parentbtn{flex:1;background:#e8e8e8;border:none;border-radius:8px;padding:12px 8px;font-weight:700;color:#666;font-size:13.5px;cursor:pointer;}
  .parentbtn.set{background:var(--green-bg);color:var(--green);}
  .radiogroup{display:flex;align-items:center;gap:8px;}
  .radiogroup input[type=radio]{width:22px;height:22px;accent-color:var(--primary);margin:0;}
  .radiogroup label{font-weight:800;font-size:15px;margin-right:14px;text-transform:none;}

  /* ---- mobile: app fills the real screen, desktop chrome collapses ---- */
  @media(max-width:680px){
    html,body{height:100%;margin:0;overflow:hidden;}
    body{padding:0;}
    .wrap{max-width:none;height:100%;display:flex;flex-direction:column;}
    .top{display:none;}
    .banner{font-size:11px;padding:5px 9px;margin-top:0;}
    .grid{flex:1;min-height:0;display:block;position:relative;}
    .grid > div:first-child{height:100%;display:flex;flex-direction:column;}
    .phone{background:none;border-radius:0;padding:0;box-shadow:none;flex:1;min-height:0;display:flex;flex-direction:column;}
    .screen{border-radius:0;min-height:0;flex:1;display:flex;flex-direction:column;}
    .appbar{flex:0 0 auto;}
    .body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .stickyhead{position:sticky;top:0;background:var(--paper);z-index:2;padding-top:6px;margin-bottom:2px;}
    .footerbar{flex:0 0 auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>aBC Stockman</h1>
    <p>Animals and weigh/BCS entries now sync to the shared farm database. Feed, medicine, injuries, damage, and moves still run on local device storage for now, as this migrates one piece at a time.</p>
  </div>

  <div class="grid">
    <div>
      <div class="phone" id="phoneFrame">
        <div class="screen" id="screen" style="position:relative;">
          <!-- rendered by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Real OCR for the tag scanner (reads the printed EID digits off the actual
     photo instead of faking a result). Needs internet on first use per
     device, to download the OCR engine/model — after that it's cached by
     the browser and works offline. This is here for realistic demoing;
     flagged as something to reconsider before any "true offline" build. -->

// Same list on renderLogin (first-time pairing) and renderBootLoading
// (every repeat open) — shared so the two screens can't quietly drift.
const LOGIN_BULLETS=['Know your stock.','Better stock decisions.','Every animal. Every decision.','Simple livestock management.','Healthy stock. Better returns.','Confidence in every animal.'];
const SUPERADMIN_EMAIL='ho66es@hotmail.com';
function isSuperAdmin(){ return !!(authUser && authUser.email===SUPERADMIN_EMAIL); }
async function resolveFarmMembership(){
  if(!authUser) return;
  // Everyone else only ever has one row here. Si (the superuser) can
  // have several — one real farm of his own (role 'owner') plus one
  // admin row per farm the auto-membership trigger has added him to
  // (see add_superadmin_to_new_farm) — so this fetches all of them
  // rather than assuming just one.
  const { data: memberships, error: memErr } = await sb.from('farm_members').select('farm_id, role').eq('user_id', authUser.id);
  if(memErr){ authError = memErr.message; return; }
  if(!memberships || !memberships.length){ authFarmId=null; return; }
  // Which farm to actually open: whatever this device last had open, if
  // that's still one the person belongs to; otherwise their own farm
  // (the 'owner' row) if they have one; otherwise just the first.
  const savedFarmId = await safeGet('local:activefarmid');
  const stillMember = savedFarmId && memberships.some(m=>m.farm_id===savedFarmId);
  const ownRow = memberships.find(m=>m.role==='owner');
  authFarmId = stillMember ? savedFarmId : (ownRow ? ownRow.farm_id : memberships[0].farm_id);
  if(isSuperAdmin()){ loadAdminFarmsList(); loadTotalAnimalCount(); } // fire-and-forget — the System Admin panel just renders empty until these resolve, no need to hold up the rest of boot for it
  await loadFarmData(authFarmId);
}
// The actual per-farm data load, split out from resolveFarmMembership
// above so System Admin can re-run it against a different farm_id
// without going through membership resolution again — see
// adminSwitchFarm. Every query here is now explicitly scoped with
// .eq('farm_id', farmId): RLS alone used to be enough to keep one
// farm's data separate from another's because nobody ever belonged to
// more than one farm, but that stopped being true the moment a second
// farm_members row became possible (Si's admin access) — without this,
// a superuser viewing one farm would silently see every farm's records
// merged together.
async function loadFarmData(farmId){
  const { data: remoteAnimals, error: animErr } = await sb.from('animals').select('*').eq('farm_id', farmId).order('created_seq', {ascending:true});
  if(animErr){ authError = animErr.message; return; }
  animals = remoteAnimals || [];
  const { data: remoteWeights, error: weightErr } = await sb.from('weights').select('*').eq('farm_id', farmId);
  if(weightErr){ authError = weightErr.message; return; }
  weights = remoteWeights || [];
  const { data: remoteDamage, error: damageErr } = await sb.from('damage_records').select('*').eq('farm_id', farmId);
  if(damageErr){ authError = damageErr.message; return; }
  damageRecords = remoteDamage || [];
  const { data: remoteInjuries, error: injuryErr } = await sb.from('injury_records').select('*').eq('farm_id', farmId);
  if(injuryErr){ authError = injuryErr.message; return; }
  injuryRecords = remoteInjuries || [];
  const { data: remoteMoves, error: moveErr } = await sb.from('move_records').select('*').eq('farm_id', farmId);
  if(moveErr){ authError = moveErr.message; return; }
  moveRecords = remoteMoves || [];
  const { data: remoteMeds, error: medErr } = await sb.from('medicine_records').select('*').eq('farm_id', farmId);
  if(medErr){ authError = medErr.message; return; }
  medicineRecords = remoteMeds || [];
  const { data: remoteFeed, error: feedErr } = await sb.from('feed_records').select('*').eq('farm_id', farmId);
  if(feedErr){ authError = feedErr.message; return; }
  feedRecords = remoteFeed || [];
  const { data: remoteFeedUsage, error: feedUsageErr } = await sb.from('feed_usage_records').select('*').eq('farm_id', farmId);
  if(feedUsageErr){ authError = feedUsageErr.message; return; }
  feedUsageRecords = remoteFeedUsage || [];

  const { data: remoteBreeds, error: breedErr } = await sb.from('breeds').select('*').eq('farm_id', farmId);
  if(breedErr){ authError = breedErr.message; return; }
  breeds = remoteBreeds || [];
  const { data: remoteBreedPriceHistory, error: bphErr } = await sb.from('breed_price_history').select('*').eq('farm_id', farmId);
  if(bphErr){ authError = bphErr.message; return; }
  breedPriceHistory = remoteBreedPriceHistory || [];
  const { data: remoteFeedTypes, error: feedTypeErr } = await sb.from('feed_types').select('*').eq('farm_id', farmId);
  if(feedTypeErr){ authError = feedTypeErr.message; return; }
  feedTypes = remoteFeedTypes || [];
  const { data: remoteMedTypes, error: medTypeErr } = await sb.from('medicine_types').select('*').eq('farm_id', farmId);
  if(medTypeErr){ authError = medTypeErr.message; return; }
  medicineTypes = remoteMedTypes || [];
  ensureTbTestMedicineType(true);
  const { data: remoteFarmersVets, error: fvErr } = await sb.from('farmers_vets').select('*').eq('farm_id', farmId);
  if(fvErr){ authError = fvErr.message; return; }
  farmersVets = remoteFarmersVets || [];
  // Farm details — deliberately NOT fatal on error (unlike the tables above):
  // this is an optional, newer table, so if it's ever unavailable the rest
  // of the farm should still load, keeping whatever's cached on the device.
  const { data: remoteFarmDetails, error: fdErr } = await sb.from('farm_details').select('*').eq('farm_id', farmId);
  if(!fdErr) farmDetails = remoteFarmDetails || [];
  else console.warn('farm_details load failed:', fdErr.message);
  // Latest Farm Opportunities run — optional, same non-fatal treatment.
  const { data: remoteOpps, error: foErr } = await sb.from('farm_opportunities').select('*').eq('farm_id', farmId).order('created_at', {ascending:false}).limit(1);
  if(!foErr){ const ro=remoteOpps&&remoteOpps[0]; if(ro && (!farmOpportunitiesLatest || new Date(ro.created_at)>=new Date(farmOpportunitiesLatest.created_at))) farmOpportunitiesLatest = ro; }
  else console.warn('farm_opportunities load failed:', foErr.message);

  // Farm-wide settings — one shared row per farm. Created from whatever's
  // currently in the local default if this farm doesn't have one yet
  // (e.g. the very first person to sign in on it).
  const { data: remoteFarmSettings, error: fsErr } = await sb.from('farm_settings').select('*').eq('farm_id', farmId).maybeSingle();
  if(fsErr){ authError = fsErr.message; return; }
  if(remoteFarmSettings){
    farmSettings.cph = remoteFarmSettings.cph||'';
    farmSettings.farm_location = normaliseFarmLocation(remoteFarmSettings.farm_location);
    farmSettings.typical_gestation_days = remoteFarmSettings.typical_gestation_days??283;
    farmSettings.use_animal_names = remoteFarmSettings.use_animal_names!==false;
    farmSettings.manage_fodder_spend = remoteFarmSettings.manage_fodder_spend!==false;
    farmSettings.use_ai = !!remoteFarmSettings.use_ai;
    farmSettings.groq_api_key = remoteFarmSettings.groq_api_key||null;
    farmSettings.tb_test_interval_months = remoteFarmSettings.tb_test_interval_months||6;
  } else {
    await sb.from('farm_settings').insert({ farm_id:farmId, cph:farmSettings.cph||null, farm_location:farmSettings.farm_location||null, typical_gestation_days:farmSettings.typical_gestation_days||283, use_animal_names:farmSettings.use_animal_names!==false, manage_fodder_spend:farmSettings.manage_fodder_spend!==false, use_ai:!!farmSettings.use_ai, groq_api_key:farmSettings.groq_api_key||null, tb_test_interval_months:tbTestIntervalMonths() });
  }

  // Per-user settings — this signed-in person's own row only, never
  // shared with the rest of the farm (see the note on userSettings).
  const { data: remoteUserSettings, error: usErr } = await sb.from('user_settings').select('*').eq('user_id', authUser.id).maybeSingle();
  if(usErr){ authError = usErr.message; return; }
  if(remoteUserSettings){
    userSettings.mute_weighing_notification = !!remoteUserSettings.mute_weighing_notification;
  } else {
    await sb.from('user_settings').insert({ user_id:authUser.id, mute_weighing_notification:!!userSettings.mute_weighing_notification });
  }

// ---------- offline sync queue (Phase 4) ----------
// Every syncXToSupabase function below goes through queuedSync() instead
// of calling Supabase directly. On success, nothing changes from before.
// On failure — no signal, a dropped connection, a timeout — the change
// is kept here and retried automatically once signal returns, rather
// than just being logged and left to drift out of sync until someone
// happens to edit that same record again. Keyed by table+id, so editing
// the same record twice while offline just replaces the pending entry
// with its latest state instead of queuing two retries.
//
// This deliberately doesn't try to tell a real connectivity failure
// apart from a genuine server-side rejection (a bad value, an RLS
// mismatch) — both look the same from here (an error back from
// Supabase), and by far the common case for this app is the former. A
// record that fails for a real data reason will keep retrying quietly
// rather than erroring loudly, which just means it stays in the pending
// count until someone investigates — not ideal, but a lot better than
// the alternative of losing it. Worth a smarter clash/error queue if
// this ever turns up in practice, not before.
let syncQueue={}; // 'table:id' -> {table, method, payload, matchId, label, queuedAt}
async function persistSyncQueue(){
  await safeSet('local:syncqueue', JSON.stringify(syncQueue));
}
async function attemptSupabaseWrite({table, method, payload, matchId}){
  let error;
  if(method==='upsert') ({error} = await sb.from(table).upsert(payload));
  else if(method==='insert') ({error} = await sb.from(table).insert(payload));
  else if(method==='update') ({error} = await sb.from(table).update(payload).eq('id', matchId));
  else if(method==='delete') ({error} = await sb.from(table).delete().eq('id', matchId));
  return error||null;
}
async function queuedSync(key, entry){
  const error = await attemptSupabaseWrite(entry);
  if(!error){
    if(syncQueue[key]){ delete syncQueue[key]; await persistSyncQueue(); render(); }
    return;
  }
  // Attempts carry over across edits to the same record — someone tweaking
  // an unrelated field on a record that's already failing shouldn't reset
  // its count back to zero and let it dodge the stuck-item check forever.
  const prev=syncQueue[key];
  syncQueue[key] = {...entry, queuedAt:(prev&&prev.queuedAt)||new Date().toISOString(), lastAttemptAt:new Date().toISOString(), attempts:((prev&&prev.attempts)||0)+1};
  await persistSyncQueue();
  logMsg('<span style="color:var(--red);">Couldn\u2019t sync '+escapeHtml(entry.label)+' to the shared farm database \u2014 '+escapeHtml(error.message)+'. It\u2019s saved on this device and will sync automatically once signal returns.</span>');
  render(); // updates the pending-sync badge
}
function pendingSyncCount(){ return Object.keys(syncQueue).length; }
// A record still failing after this many attempts is very unlikely to be
// a signal problem any more (an ordinary offline gap gets retried far
// more than 10 times before signal returns) — see stuckSyncEntries().
const SYNC_STUCK_THRESHOLD=10;
function stuckSyncEntries(){
  return Object.entries(syncQueue).filter(([k,e])=>(e.attempts||0)>=SYNC_STUCK_THRESHOLD).map(([key,e])=>({key, ...e}));
}
// Retries everything queued. Called when the 'online' event fires, once
// at boot (in case the app was closed mid-queue), and on a light
// interval while anything's still pending — navigator.onLine says
// there's a network interface up, not that it's actually good enough to
// complete a request, so a timer catches the "technically online but
// too weak to sync" case the event alone would miss.
//
// Ordering: retried in the order they were first queued (Object.keys
// preserves insertion order for string keys), one at a time rather than
// in parallel — deliberately, since a few of these tables have a real
// foreign key back to animals (an injury/weight/medicine/event needs its
// animal to exist first). Because you can't add an injury in the UI to
// an animal that doesn't locally exist yet, that animal's own sync was
// always attempted — and so queued, if it failed — before the injury's
// was, so the queue's natural order already retries parents before
// children within the same pass. This isn't an explicit dependency
// graph, just an emergent property of the UI's own ordering plus
// sequential (not concurrent) retries here — worth knowing if a new
// syncXToSupabase is ever added for a table with its own FK.
let syncQueueFlushing=false;
async function flushSyncQueue(){
  if(syncQueueFlushing || !isOnline) return;
  const keys=Object.keys(syncQueue);
  if(!keys.length) return;
  syncQueueFlushing=true;
  let succeeded=0;
  for(const key of keys){
    const entry=syncQueue[key];
    if(!entry) continue; // discarded mid-loop (stuck-item removal) — skip rather than resurrect it
    const error=await attemptSupabaseWrite(entry);
    if(!error){ delete syncQueue[key]; succeeded++; }
    else { entry.attempts=(entry.attempts||0)+1; entry.lastAttemptAt=new Date().toISOString(); }
  }
  await persistSyncQueue();
  syncQueueFlushing=false;
  if(succeeded){ logMsg(succeeded+' change'+(succeeded===1?'':'s')+' synced to the shared farm database.'); render(); }
}
// A photo taken with no signal falls back to storing the raw capture
// directly as photo_data (see wirePhotoCaptureModal) — that keeps it
// viewable straight away, but unlike every other offline change, that
// fallback was never retried: the photo just stayed a large embedded
// image forever instead of becoming the small Storage URL everything
// else uses. This finds any record still in that state (detectable
// purely by photo_data being a data: URL rather than an https:// one —
// true whether the record was brand new or already existed when the
// photo was retaken) and, once signal's back, uploads it properly and
// patches just that record's photo_data through its normal sync
// function. Runs alongside flushSyncQueue on the same triggers.
const PHOTO_TABLES=[
  {list:()=>animals, syncFn:syncAnimalToSupabase},
  {list:()=>injuryRecords, syncFn:syncInjuryToSupabase},
  {list:()=>damageRecords, syncFn:syncDamageToSupabase},
  {list:()=>medicineRecords, syncFn:syncMedicineToSupabase},
  {list:()=>medicineTypes, syncFn:syncMedicineTypeToSupabase},
];
function recordsWithLocalOnlyPhotos(){
  const isLocalPhoto=v=>typeof v==='string' && v.indexOf('data:image/')===0;
  const found=[];
  PHOTO_TABLES.forEach(({list, syncFn})=>{
    list().forEach(record=>{ if(isLocalPhoto(record.photo_data)) found.push({record, syncFn}); });
  });
  return found;
}
let photoPromotionRunning=false;
async function promoteLocalPhotos(){
  if(photoPromotionRunning || !isOnline || !authFarmId) return;
  const pending=recordsWithLocalOnlyPhotos();
  if(!pending.length) return;
  photoPromotionRunning=true;
  let promoted=0;
  for(const {record, syncFn} of pending){
    try{
      const url=await uploadPhotoToStorage(record.photo_data, 'promoted');
      await cachePhotoOffline(url, record.photo_data); // offline viewing keeps working, now keyed to the new URL
      record.photo_data=url;
      await syncFn(record); // pushes the now-small photo_data to Supabase (queues itself on failure, same as any other edit)
      promoted++;
    }catch(e){ /* still offline, or the upload itself failed — leave as-is, next pass will retry */ }
  }
  if(promoted){ await persistAll(); render(); }
  photoPromotionRunning=false;
}
// Refreshes this device's local copy of every farm-scoped array straight
// from Supabase — the part that was missing before. Only ever call this
// AFTER flushSyncQueue/promoteLocalPhotos above have finished pushing
// this device's own pending changes: loadFarmData() fully replaces the
// local arrays with whatever's on the server, so pulling first would
// silently throw away anything not yet synced, replacing it with the
// (older) shared copy.
//
// This catches up on whatever anyone else changed while this device was
// offline. It does NOT solve two devices editing the very same record
// while both offline — pushing first still means whichever push reaches
// Supabase last simply overwrites the other, with no comparison at all.
// That's the separate clash-detection gap; this only closes "my local
// copy silently goes stale and stays stale until a manual reload."
async function pullLatestFarmData(){
  if(!isOnline || !authFarmId) return;
  await loadFarmData(authFarmId);
  render();
}
// Which in-memory array a table's records live in, for the tables it's
// safe to let a farmer discard themselves from the Attention list when
// stuck — everything with its own record-per-row array. animals,
// farm_settings, and user_settings are deliberately left out: an animal
// is too consequential to delete from a list-tap, and the settings
// tables are singletons with nothing to "re-enter" in the same sense —
// those just show up in Attention as a flag to investigate rather than
// discard. animal_events lives nested under events[animalId] rather
// than a flat array, so it's handled separately below.
const SYNC_TABLE_TO_LOCAL_ARRAY={
  damage_records:()=>damageRecords, injury_records:()=>injuryRecords, move_records:()=>moveRecords,
  medicine_records:()=>medicineRecords, feed_records:()=>feedRecords, feed_usage_records:()=>feedUsageRecords,
  breeds:()=>breeds, breed_price_history:()=>breedPriceHistory, feed_types:()=>feedTypes,
  medicine_types:()=>medicineTypes, farmers_vets:()=>farmersVets, breeding_records:()=>breedingRecords,
  farm_details:()=>farmDetails,
};
async function discardStuckSyncEntry(key){
  const idx=key.indexOf(':');
  const table=key.slice(0,idx), recordId=key.slice(idx+1);
  const arrayGetter=SYNC_TABLE_TO_LOCAL_ARRAY[table];
  if(arrayGetter){
    const arr=arrayGetter();
    const i=arr.findIndex(x=>x.id===recordId);
    if(i>-1) arr.splice(i,1);
  } else if(table==='animal_events'){
    for(const animalId in events){
      const i=events[animalId].findIndex(e=>e.id===recordId);
      if(i>-1){ events[animalId].splice(i,1); break; }
    }
  }
  delete syncQueue[key];
  await persistSyncQueue();
  await persistAll();
  logMsg('Removed from this device \u2014 you\u2019ll need to add it again.');
  render();
}
// Whether it's safe to replace the local arrays with a fresh pull right
// now. Pulling mid-keystroke (a focused text field) or mid-dialog (a
// modal open — including the photo-capture flow) risks disrupting
// whatever the farmer's actively doing, since loadFarmData() replaces
// the underlying arrays those screens are built from. Doesn't fully
// guarantee nothing is ever lost (an abandoned, never-saved draft was
// always going to vanish on navigating away regardless of polling) —
// just avoids interrupting the moment someone's actively typing.
function shouldDeferBackgroundRefresh(){
  if(modal) return true;
  const el=document.activeElement;
  return !!(el && ['INPUT','TEXTAREA','SELECT'].includes(el.tagName));
}
// The full periodic cycle: push this device's own pending changes up,
// finish any stuck photo uploads, then pull a fresh copy of the farm's
// data down — same push-before-pull ordering as the 'online' event
// handler, for the same reason (pulling first would overwrite anything
// not yet synced with the older shared copy).
//
// The pull is a full re-fetch of every farm-scoped table, not an
// incremental "what changed" diff — most of these tables don't actually
// carry a reliable last-changed timestamp (only `animals` has
// updated_at; breeds, feed_types, and farmers_vets have no timestamp at
// all), so there's no column to diff against without a schema change.
// At the scale of one farm's data (tens to low hundreds of rows, not
// thousands) a full re-pull every 10 minutes costs nothing worth optimising
// for yet — revisit this if that scale assumption ever stops holding.
async function periodicFarmSync(){
  if(!isOnline || !authFarmId) return;
  if(pendingSyncCount()) await flushSyncQueue();
  if(recordsWithLocalOnlyPhotos().length) await promoteLocalPhotos();
  if(shouldDeferBackgroundRefresh()) return; // try again next cycle rather than disrupt an active edit
  await pullLatestFarmData();
}
setInterval(periodicFarmSync, 600000); // 10 minutes — single-farmer use, no other users on the same farm to stay current with, so a slower background check is enough and less likely to interrupt whatever screen the farmer's on

// Suggests a typical Prime age range for a breed the farmer's just typed
// in — a real live web search isn't something a static, client-only app
// can do for itself, so this reuses the same per-user Groq key as
// passport/tag scanning to get a reasonable general-knowledge estimate
// instead. Deliberately presented as a starting point to check, not a
// fact — breed maturation varies a lot by system (grass vs intensive)
// and individual animal, this is nowhere near precise enough to trust
// blindly. Returns null (quietly, no error shown) if AI isn't set up,
// the breed isn't recognised, or the call fails — the existing 18/30
// default is a perfectly fine fallback either way.
async function suggestBreedPrimeAgeGroq(breedName){
  if(!farmSettings.groq_api_key) return null;
  const prompt='For the cattle breed "'+breedName+'" as commonly reared in the UK, what is a typical age range in months during which a commercially finished animal of this breed is at its prime condition for sale? Base this on the breed\u2019s general reputation for maturation rate (traditional/native breeds often finish later than fast-growing continental breeds) \u2014 a general estimate is fine, this doesn\u2019t need to be precise. Reply with ONLY a JSON object and nothing else, no markdown fences, no explanation: {"min_months": a whole number, "max_months": a whole number}. If "'+breedName+'" isn\u2019t a real cattle breed you recognise, or you\u2019re not reasonably confident, reply with {"min_months": null, "max_months": null} instead of guessing.';
  let text;
  try{
    // Lower-stakes suggestion, and Groq's whole point is speed — fail
    // fast rather than making the farmer wait on something this minor.
    text=await callGroq(prompt, null, {json:true, maxTokens:100, timeoutMs:6000});
  }catch(e){ return null; }
  try{
    const parsed=parseAiJson(text);
    if(parsed.min_months==null || parsed.max_months==null) return null; // not confident — leave the defaults alone
    const min=parseInt(parsed.min_months,10), max=parseInt(parsed.max_months,10);
    if(isNaN(min) || isNaN(max) || min<=0 || max<=min) return null;
    return {min, max};
  }catch(e){ return null; }
}

function pad(n){return n.toString().padStart(2,'0');}
function nowStr(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;const v=c=='x'?r:(r&0x3|0x8);return v.toString(16);});}
function logMsg(msg){
  const el=document.getElementById('log');
  if(!el) return; // desktop testing panel removed — activity log has nowhere to render, still fine to no-op
  const line=document.createElement('div');
  line.innerHTML='<span class="t">'+nowStr()+'</span>'+msg;
  el.appendChild(line);
  el.scrollTop=el.scrollHeight;
}

// Brief auto-dismiss confirmation toast. Lives in #phoneFrame (a parent of
// #screen) rather than inside #screen itself, so it isn't wiped out by the
// innerHTML swap the very next render() call performs (e.g. Weigh/BCS save
// immediately re-renders to switch screens or reset the picker).
let saveToastTimer=null;
function showSaveToast(msg){
  const frame=document.getElementById('phoneFrame');
  if(!frame) return;
  let el=document.getElementById('saveToast');
  if(!el){
    el=document.createElement('div');
    el.id='saveToast';
    el.className='savetoast';
    frame.appendChild(el);
  }
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(saveToastTimer);
  // A longer, more informative toast (e.g. two lines: "Weight +72kg" /
  // "BCS improving") needs more than the bare-word default to actually
  // read before it fades.
  const duration = msg.includes('\n') ? 3200 : 2000;
  saveToastTimer=setTimeout(()=>{ el.classList.remove('show'); }, duration);
}
// Persistent "reading tag…" spinner — deliberately separate from
// showSaveToast above, which auto-hides after 2s regardless of whether the
// scan is still running. A Groq read plus (on failure) a Tesseract
// fallback can easily take 10-15s+, especially on a first-run device still
// downloading the offline OCR engine, so a 2s toast made the app look
// dead/frozen for the rest of that time. This has no timer at all — it's
// shown the instant a photo is taken and only ever hidden once the actual
// scan promise resolves, in performTagScan's try/finally.
function showScanningOverlay(msg){
  const frame=document.getElementById('phoneFrame');
  if(!frame) return;
  let el=document.getElementById('scanOverlay');
  if(!el){
    el=document.createElement('div');
    el.id='scanOverlay';
    el.className='scanoverlay';
    el.innerHTML='<div class="spinner"></div><div class="msg" id="scanOverlayMsg"></div>';
    frame.appendChild(el);
  }
  document.getElementById('scanOverlayMsg').textContent=msg||'Reading tag\u2026';
  el.classList.add('show');
}
function updateScanningOverlay(msg){
  const msgEl=document.getElementById('scanOverlayMsg');
  if(msgEl) msgEl.textContent=msg;
}
function hideScanningOverlay(){
  const el=document.getElementById('scanOverlay');
  if(el) el.classList.remove('show');
}

// ---------- storage (tries window.storage first for the Claude viewer;
// falls back to localStorage so data actually persists when installed as a
// standalone PWA, where window.storage doesn't exist) ----------
let storageDegraded=false;
const LS_PREFIX='abcstockman:';
function hasLocalStorage(){
  try{
    if(typeof localStorage==='undefined') return false;
    const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const lsAvailable = hasLocalStorage();
const mem={};
async function safeGet(key){
  if(!storageDegraded && typeof window.storage!=='undefined'){
    try{ const r=await window.storage.get(key,false); return r.value; }
    catch(e){
      const m=(e&&e.message||'').toLowerCase();
      if(m.includes('not found')||m.includes('404')) return null;
      storageDegraded=true;
    }
  }
  if(lsAvailable){ const v=localStorage.getItem(LS_PREFIX+key); return v===null?null:v; }
  return key in mem ? mem[key] : null;
}
async function safeSet(key,value){
  if(!storageDegraded && typeof window.storage!=='undefined'){
    try{ await window.storage.set(key,value,false); return; }
    catch(e){ storageDegraded=true; }
  }
  if(lsAvailable){ try{ localStorage.setItem(LS_PREFIX+key,value); return; }catch(e){ /* quota or disabled — fall through to memory */ } }
  mem[key]=value;
}

function icon(name){ return ICONS[name] || ''; }
// CPH numbers are entered on a numeric keypad (no slash key), formatted as
// NN/NNN/NNNN — this strips anything non-numeric and re-inserts the slashes
// at the right positions as the farmer types.
function formatCph(raw){
  const digits=(raw||'').replace(/\D/g,'').slice(0,9);
  let out=digits.slice(0,2);
  if(digits.length>2) out+='/'+digits.slice(2,5);
  if(digits.length>5) out+='/'+digits.slice(5,9);
  return out;
}
const BCMS_URL='https://secure.services.defra.gov.uk/wps/portal/ctso';
// Wraps just the word "BCMS" in a real link to the DEFRA CTS portal,
// opening in a new tab. Used inline within plain text/labels/buttons.
// stopPropagation matters specifically where this sits inside a clickable
// checkbox <label> (move/birth reporting) — without it, tapping the link
// would also toggle the checkbox underneath it; native browser behavior
// already prevents the reverse (nested <a> doesn't get swallowed by the
// label's own forwarding), but this makes the checkbox side explicit too.
function bcmsLink(text, plain){
  text = text===undefined ? 'BCMS' : text;
  // plain=true keeps it clickable but drops the blue — for the rare case
  // where it sits on a solid dark background (currently just the overdue
  // birth-registration banner) where blue-on-red is genuinely hard to read.
  // The underline alone still marks it as a link.
  const style = plain ? 'color:inherit;text-decoration:underline;text-underline-offset:3px;' : 'color:#2f6fed;text-decoration:underline;text-underline-offset:3px;';
  return `<a href="${BCMS_URL}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="${style}">${text}</a>`;
}
// Canonical EID shape across the whole app is now UK172091 202786 —
// country code letters (as printed on every tag and passport) run
// straight into the first 6 digits, a space, then the last 6. This used
// to format toward the numeric 826/899 country code instead (what's
// actually on the electronic chip) on the theory that it's the "real"
// value — reversed deliberately: farmers compare what's on screen
// against a physical tag or passport, where the letters are what's
// printed, and a format only insiders recognise just invited transcribing
// mistakes. See extractEidFromOcrText and applyPassportScanResult's
// normalizeScannedEid for the two read paths that need to agree with
// this, since a mismatch here is exactly how a re-scanned animal stops
// matching itself.
function formatEid(raw){
  const trimmed=(raw||'').trim();
  const prefixMatch=trimmed.match(/^([A-Za-z]{1,2})/);
  const prefix=prefixMatch?prefixMatch[1].toUpperCase():'';
  const digits=trimmed.slice(prefix.length).replace(/\D/g,'').slice(0,12);
  let out=prefix+digits.slice(0,6);
  if(digits.length>6) out+=' '+digits.slice(6,12);
  return out;
}
// Wraps a <input type="date"> with a small "jump to month/year" button, so
// picking a date far in the past (e.g. a 10-year-old animal's D.O.B.)
// doesn't mean tapping the native picker's month arrow 120 times. The
// native picker itself can't be customised — its whole UI is owned by the
// browser/OS — so this instead opens a lightweight custom Year/Month
// picker (see modal.type==='dateJump') that sets the real date input's
// value directly and fires a genuine change event, so every existing
// onchange handler on that field keeps working completely unchanged. The
// native picker then opens already on the right month for the final,
// single tap to pick the exact day.
function dateFieldWithJump(inputHtml, inputId){

}

// When "Animal names/Mgmt ID?" is No, the farm has opted to identify every
// animal by its full EID everywhere — no name, no Mgmt ID, no minimised EID
// shorthand. These three functions are the single chokepoint every screen
// in the app renders an animal's identity through, so redefining them here
// is enough to make that switch apply everywhere consistently.
function animalDisplayName(a){
  if(farmSettings.use_animal_names===false) return a.eid || '(no EID)';
  return (a.name) ? a.name : a.tag_number;
}
// Short EID chip shown next to an animal's name — last 3 digits of the actual EID.
// If no EID has been recorded, show a plain "…" placeholder rather than
// falling back to the Mgmt ID (which isn't an EID and shouldn't be implied as one).
// Not used at all when identifying by full EID only (see animalDisplayName).
function eidShortDisplay(a){ return a.eid ? '..'+a.eid.slice(-3) : '…'; }
// Header EID + name: partial EID sits to the left, sized 75% of the name's
// font, so the name can run as large as the header allows. In EID-only mode
// this collapses to just the full EID at the requested size — there's
// nothing else to show alongside it.
function headerIdName(a, nameSize){
  if(farmSettings.use_animal_names===false){
    // Full EIDs are long (15 digits + spaces) — a little smaller than the
    // name/tag would be, so it has a better chance of fitting on one line.
    const eidOnlySize=(nameSize*0.85).toFixed(1);
    return `<span style="font-size:${eidOnlySize}px;font-weight:800;">${animalDisplayName(a)}</span>`;
  }
  const eidSize=(nameSize*0.75).toFixed(1);
  return `<span style="font-size:${eidSize}px;font-weight:600;color:var(--grey);">${eidShortDisplay(a)}</span> <span style="font-size:${nameSize}px;font-weight:800;">${animalDisplayName(a)}</span>`;
}
function fmtGBP(amount, decimals){
  if(decimals===undefined) decimals=2;
  if(amount==null || isNaN(amount)) return '£\u2014';
  const sign = amount<0 ? '-' : '';
  const parts = Math.abs(amount).toFixed(decimals).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign+'£'+parts.join('.');
}
// Same as fmtGBP but drops the pence entirely when they'd just be ".00" —
// used on screens (Market Value) that want to stay as compact as possible;
// a farmer who genuinely prices to the penny still sees it.
function fmtGBPSmart(amount){
  if(amount==null || isNaN(amount)) return '£\u2014';
  const rounded=Math.round(amount*100)/100;
  const isWhole=Math.abs(rounded-Math.round(rounded))<0.001;
  return fmtGBP(rounded, isWhole?0:2);
}
// Thousand-separated quantity, e.g. 5000 -> "5,000" — keeps any decimal
// part (fractional sacks/bales) as-is rather than rounding it away.
function fmtQty(n){
  if(n==null || isNaN(n)) return '';
  const parts = String(n).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
// Whole-number percentage with thousand separators, e.g. 9207 -> "9,207%" —
// small purchase-price/cost animals can show percentages this large.
// decimals defaults to 0; pass 1 to keep a decimal place (e.g. the ROI
// report's aggregate figure, which showed one before this was added).
function fmtPct(value, decimals){
  if(decimals===undefined) decimals=0;
  if(value==null || isNaN(value)) return '\u2014';
  const sign = value<0 ? '-' : '';
  const parts=Math.abs(value).toFixed(decimals).split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign+parts.join('.')+'%';
}

// Uploads a captured photo (data: URL) to the shared 'photos' Storage
// bucket and returns its public URL — used by wirePhotoCaptureModal so
// every photo across the app (animal, injury, damage, medicine cabinet)
// lands in Storage instead of being stored as base64 text in a database
// column. Path is farmId/idPrefix/uuid.ext — the farmId segment is what
// the bucket's upload policy actually checks.
async function uploadPhotoToStorage(dataUrl, idPrefix){
  const match=dataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.*)$/);
  if(!match) throw new Error('not a usable image');
  const mimeType=match[1], base64=match[2];
  const ext=(mimeType.split('/')[1]||'jpg').replace('jpeg','jpg');
  const safePrefix=(idPrefix||'photo').replace(/[^a-zA-Z0-9_-]/g,'');
  const path=authFarmId+'/'+safePrefix+'/'+uuid()+'.'+ext;
  const byteChars=atob(base64);
  const byteNumbers=new Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++) byteNumbers[i]=byteChars.charCodeAt(i);
  const blob=new Blob([new Uint8Array(byteNumbers)], {type:mimeType});
  const { error } = await sb.storage.from('photos').upload(path, blob, {contentType:mimeType, upsert:false});
  if(error) throw error;
  const { data } = sb.storage.from('photos').getPublicUrl(path);
  return data.publicUrl;
}
// ---------- offline photo cache ----------
// Once a photo's uploaded to Storage, photo_data on the record becomes a
// remote URL (see uploadPhotoToStorage above) and the original bytes
// aren't kept anywhere else — fine online, but that URL can't load with
// no signal, and a farmer genuinely needs these offline: comparing an
// injury against how it looked when first recorded, or checking an
// animal's markings against its ID photo, both often happen out in a
// field months later, quite possibly by someone other than whoever
// originally took the photo (so it can't rely on still being in that
// person's camera roll). So every uploaded photo also gets a small
// local copy cached under its Storage URL, and every place a photo
// renders falls back to that cached copy if the live URL fails to load.
// Keyed by URL (not by record id) so it works regardless of when in a
// record's lifecycle the photo was actually captured and uploaded.
let photoCache={}; // Storage URL -> small local data: URL
function hydratePhotoCache(){
  // Only meaningful for the real localStorage-backed deployment — the
  // window.storage path (Claude's own preview) has no synchronous way to
  // enumerate keys, and that's not the real target environment for a
  // farmer's installed PWA anyway.
  if(!lsAvailable) return;
  const prefix=LS_PREFIX+'photocache:';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.indexOf(prefix)===0) photoCache[k.slice(prefix.length)]=localStorage.getItem(k);
  }
}
// Downscales to something comfortably small (a phone screen never needs
// more than this to compare markings or an injury site) so caching every
// photo a farm takes doesn't run the device out of local storage.
function compressForOfflineCache(dataUrl){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      const maxDim=640;
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){ const scale=maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      try{ resolve(canvas.toDataURL('image/jpeg',0.6)); }
      catch(e){ resolve(dataUrl); } // canvas export failed — still better to cache the full original than have no offline copy at all
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}
async function cachePhotoOffline(url, dataUrl){
  try{
    const small=await compressForOfflineCache(dataUrl);
    photoCache[url]=small;
    await safeSet('photocache:'+url, small);
  }catch(e){ /* best-effort — worst case this one photo just won't have an offline fallback */ }
}

// Turns a raw API/network error into something a farmer can actually
// read, instead of a JSON error dump. Provider-agnostic on purpose (the
// underlying AI provider is just an implementation detail from here).
function friendlyAiError(err){
  const msg=(err && err.message)||'';
  if(/\b503\b/.test(msg) || /high demand|overloaded|temporarily unavailable/i.test(msg)) return 'The AI service is busy right now \u2014 try again in a minute or two.';
  if(/\b429\b/.test(msg) || /quota|rate.?limit/i.test(msg)) return 'The AI service is asking to slow down (rate limit) \u2014 wait a moment and try again, or check your API key\u2019s usage limits in Settings.';
  if(/\b401\b|\b403\b/.test(msg) || /invalid.*key|unauthoriz/i.test(msg)) return 'Your AI API key looks like it\u2019s not working \u2014 check it in Settings.';
  if(err instanceof TypeError && /Failed to fetch|NetworkError/i.test(msg)) return 'Couldn\u2019t reach the AI service \u2014 check you have a signal, then try again.';
  if(/timed out/i.test(msg)) return 'That took too long \u2014 check your signal, then try again.';
  // Every recognisable case above returns a fully friendly message with
  // no raw text — this fallback is deliberately different: it's for
  // whatever we HAVEN'T seen before, so hiding the detail here would
  // make a genuinely new failure mode undiagnosable next time it happens.
  return msg ? 'Something went wrong (\u201c'+msg.slice(0,150)+'\u201d) \u2014 try again in a moment.' : 'Something went wrong \u2014 try again in a moment.';

// Groq — chosen over Gemini specifically for two reasons a real farmer
// hits immediately: (1) signup only needs any email, not a Google
// account, and (2) it's meaningfully faster, which matters when someone's
// stood in a field waiting for a tag to be read. Vision candidates handle
// photos (passport/tag/injury); text candidates handle everything else
// (Ask, breed suggestions) since there's no reason to pay a vision
// model's overhead when there's no image involved.
// Groq retires model IDs on a real schedule (see console.groq.com/docs/
// deprecations) — llama-4-scout and llama-3.1-8b-instant, both used here
// originally, were already gone by the time this shipped, which is
// exactly the failure mode a fixed single model name can't recover from.
// Each list tries a second candidate on a 404 (model retired) as well as
// the usual 429/5xx, same defence the old Gemini implementation had.
// Worth rechecking the deprecations page occasionally as models move on.
//
// Vision specifically has now failed with a "model does not exist" 404
// twice in a row on two different hardcoded names — both ones that
// looked current from outside documentation, neither of which actually
// worked against this real account. Guessing a third name blind isn't a
// real fix, so vision instead asks Groq's own /models endpoint what's
// ACTUALLY available to this specific key, live, and picks from that —
// see discoverGroqVisionModel. GROQ_VISION_MODELS is kept only as a
// last-resort fallback if that discovery call itself fails outright
// (e.g. no signal to even ask the question).
const GROQ_VISION_MODELS=['qwen/qwen3.8-27b'];
const GROQ_TEXT_MODELS=['openai/gpt-oss-20b', 'openai/gpt-oss-120b'];
const GROQ_TIMEOUT_MS=12000; // Groq's whole point is speed — no reason to wait as long as Gemini needed
// Cached per browser session once found, so every photo scan doesn't
// re-query /models — only re-discovered if the cached one itself starts
// 404ing (see callGroq), which is the actual signal something changed.
let groqVisionModelCache=null;
async function discoverGroqVisionModel(apiKey){
  try{
    const resp=await fetch('https://api.groq.com/openai/v1/models', {headers:{'Authorization':'Bearer '+apiKey}});
    if(!resp.ok) return null;
    const json=await resp.json();
    const ids=(json.data||[]).map(m=>m.id);
    // Try known-good names first, but only if they're actually present in
    // THIS account's live list — that's the whole point versus before.
    for(const known of ['qwen/qwen3.8-27b', 'meta-llama/llama-4-scout-17b-16e-instruct', 'meta-llama/llama-4-maverick-17b-128e-instruct']){
      if(ids.includes(known)) return known;
    }
    // Otherwise, whatever's live that LOOKS vision-capable by name — not
    // perfect, but far better odds than a name guessed from outside docs
    // that have no visibility into this account's actual access.
    return ids.find(id=>/vision|scout|maverick|qwen3\.\d|llava|vl-/i.test(id)) || null;
  }catch(e){ return null; }
}
// Shared low-level caller — every AI feature in the app goes through
// this now, instead of each duplicating its own request/retry logic.
// imagePart is optional: {mediaType, base64} for a vision call, omit for
// text-only.
async function callGroq(promptText, imagePart, opts){
  opts=opts||{};
  const apiKey=farmSettings.groq_api_key;
  if(!apiKey) throw new Error('No Groq API key set');
  let models;
  if(imagePart){
    if(!groqVisionModelCache) groqVisionModelCache=await discoverGroqVisionModel(apiKey);
    models = groqVisionModelCache
      ? [groqVisionModelCache, ...GROQ_VISION_MODELS.filter(m=>m!==groqVisionModelCache)]
      : GROQ_VISION_MODELS;
  } else {
    models=GROQ_TEXT_MODELS;
  }
  const content=imagePart
    ? [{type:'text', text:promptText}, {type:'image_url', image_url:{url:'data:'+imagePart.mediaType+';base64,'+imagePart.base64}}]
    : promptText;
  let lastErr;
  for(const model of models){
    const body={
      model,
      messages:[{role:'user', content}],
      temperature: opts.temperature!=null?opts.temperature:0.2,
      max_completion_tokens: opts.maxTokens||600,
    };
    if(opts.json) body.response_format={type:'json_object'};
    const controller=new AbortController();
    const timeoutId=setTimeout(()=>controller.abort(), opts.timeoutMs||GROQ_TIMEOUT_MS);
    let resp;
    try{
      resp=await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+apiKey},
        body:JSON.stringify(body),
        signal:controller.signal,
      });
    }catch(networkErr){
      clearTimeout(timeoutId);
      lastErr = networkErr.name==='AbortError' ? new Error('Groq ('+model+') timed out after '+((opts.timeoutMs||GROQ_TIMEOUT_MS)/1000)+'s') : networkErr;
      if(networkErr.name!=='AbortError') throw lastErr; // a hard connection failure won't fix itself by trying a different model name
      continue;
    }
    clearTimeout(timeoutId);
    if(resp.ok){
      const json=await resp.json();
      const text=json?.choices?.[0]?.message?.content;
      if(!text) throw new Error('Groq ('+model+') returned no readable text');
      return text;
    }
    const errBody=await resp.text().catch(()=>'');
    lastErr=new Error('Groq ('+model+') request failed ('+resp.status+'): '+errBody.slice(0,150).trim());
    // 404 = this model ID's been retired since this build shipped, worth
    // trying the next candidate; 429/5xx = same reasoning as before. For
    // vision specifically, a 404 on the cached discovered model means
    // discovery itself found something that's since stopped working —
    // clear it so the next call re-asks /models rather than repeating
    // the same dead answer indefinitely.
    if(resp.status===404 && imagePart && model===groqVisionModelCache) groqVisionModelCache=null;
    const worthRetrying = resp.status===404 || resp.status===429 || resp.status>=500;
    if(!worthRetrying) throw lastErr;
  }
  throw lastErr;
}

// The numeric/on-screen keyboard's "Go" key fires a plain Enter keydown on
// whichever field currently has focus — but with no real <form> anywhere
// in this app, that keydown does nothing unless something explicitly
// listens for it. Hand-wiring each field individually is how some screens
// ended up with working "Go" and others didn't. Instead, this scans the
// given container for the fields a "Go" key could plausibly apply to —
// visible, enabled, non-readonly text/number/date-style inputs — and wires
// only the LAST one, so Go earlier in the form still behaves like a normal
// keystroke, while Go on the last field acts exactly like tapping Save.
// Deliberately excludes textareas (their Enter is a real newline, not a
// submit), and selects/radios/checkboxes (no on-screen "Go" key involved).
function wireGoKeySubmit(saveBtnId, containerSelector){
  const container=document.querySelector(containerSelector || '.body');
  if(!container) return;
  const FIELD_SELECTOR='input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],input[type=url],input[type=search],input:not([type])';
  const fields=[...container.querySelectorAll(FIELD_SELECTOR)].filter(el=>!el.disabled && !el.readOnly && el.offsetParent!==null);
  if(!fields.length) return;
  const lastField=fields[fields.length-1];
  // Every field before the last gets its OWN explicit "move to the next
  // field" handler, and an enterkeyhint="next" so the keyboard actually
  // labels its action key "Next" — this used to be left entirely to the
  // browser's own guess at tab order, which is exactly why it was
  // unreliable (worked "on the 2nd attempt" sometimes): the keyboard's
  // Next button doesn't reliably know which field is "next" in a
  // dynamically-rendered form unless we say so ourselves. Doing this here
  // (rather than only on the Move screen) fixes the same intermittent
  // "Next doesn't advance" behaviour everywhere wireGoKeySubmit is
  // already used, matching what was seen "further down the process" too.
  fields.forEach((field,i)=>{
    if(i===fields.length-1){ field.setAttribute('enterkeyhint','done'); return; }
    field.setAttribute('enterkeyhint','next');
    field.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter' && e.keyCode!==13) return;
      e.preventDefault();
      const next=fields[i+1];
      next.focus();
      if(typeof next.select==='function') next.select();
    });
  });
  lastField.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter' && e.keyCode!==13) return;
    e.preventDefault();
    // Dismiss the on-screen keyboard straight away — it was staying open
    // over the "Saved"/"Updated" toast after Done, so a farmer who didn't
    // spot the toast underneath it could tap Done again and create a
    // duplicate record.
    lastField.blur();
    if(saveBtnId){
      const btn=document.getElementById(saveBtnId);
      if(btn && !btn.disabled) btn.click();
    }
    // With no dedicated Save button on this screen (fields auto-save on
    // change as you go, e.g. Move), the blur above already fired the
    // field's own onchange — that's this screen's equivalent of Save.
  });
}

// TB testing is a legal requirement, not an optional medicine — it must
// always be present in the Medicine list and can never be disabled. Runs
// on every load (both fresh seed and existing farms) so it's added
// retroactively for anyone who already had data before this was introduced.
//
// A TB (skin) test is two injections given together by the vet, 0.1ml
// each: Avian tuberculin and Bovine tuberculin (Si, 23 Sep 2026). Both are
// built-in locked medicine types — no withdrawal, £0 cost (the farmer
// doesn't pay for them), no dosage/kg. The old single "TB test" type is
// kept (never created any more, never offered) purely so historical
// records against it still count as a TB test.
//
// Only pushes to Supabase when called with sync=true — i.e. straight after
// loadFarmData has pulled this farm's real medicine types. Every other
// call site runs against local/pre-load data, and pushing from there is
// how the Pilot Farm ended up with 3 duplicate "TB test" rows (each device
// creating its own before the shared one had loaded). Duplicates are
// harmless anyway since TB records are matched by name, not a single id.
const TB_TUBERCULINS=[
  {kind:'avian', name:'Avian tuberculin'},
  {kind:'bovine', name:'Bovine tuberculin'},
];
const TB_TUBERCULIN_DOSE_ML=0.1;
const TB_LEGACY_TYPE_NAME='tb test';
function ensureTbTestMedicineType(sync){
  TB_TUBERCULINS.forEach(t=>{
    const existing=medicineTypes.find(m=>m.locked && m.name.trim().toLowerCase()===t.name.toLowerCase());
    if(existing){
      const changed = !existing.active || existing.withdrawal_days!==0 || existing.cost!==0 || existing.dosage_per_kg!=null || existing.type!=='TB test';
      existing.active=true; existing.withdrawal_days=0; existing.cost=0; existing.dosage_per_kg=null; existing.type='TB test';
      if(changed && sync && typeof syncMedicineTypeToSupabase==='function') syncMedicineTypeToSupabase(existing);
    } else {
      const tb={id:uuid(), name:t.name, type:'TB test', withdrawal_days:0, cost:0, dosage_per_kg:null, qty_unit:'ml', batch_no:null, expiry_date:null, active:true, locked:true};
      medicineTypes.push(tb);
      if(sync && typeof syncMedicineTypeToSupabase==='function') syncMedicineTypeToSupabase(tb);
    }
  });
}
// The built-in tuberculin type for a product name (case-insensitive), or null.
function tbTuberculinType(name){
  const n=(name||'').trim().toLowerCase();
  if(!TB_TUBERCULINS.some(t=>t.name.toLowerCase()===n)) return null;
  return medicineTypes.find(m=>m.locked && m.name.trim().toLowerCase()===n) || null;
}

function generateDemoAnimalRecords(){
  animals=[]; events={}; weights=[]; injuryRecords=[]; medicineRecords=[];

  for(let i=1;i<=100;i++){
    const breed = breeds[i%breeds.length];
    const named = i<=20;
    const id = uuid();
    const eid = '826 '+String(1000+Math.floor(i/10)).padStart(4,'0')+' '+String(10000000+i).padStart(8,'0');
    animals.push({
      id, tag_number:'A-'+(1000+i), eid, breed_id:breed.id, sex: i<=2?'M':'F',
      birth_date: randomPastDate(900), status:'active', purchase_price: named ? +(300+Math.random()*400).toFixed(2) : null,
      name: named?NAMES[i-1]:null, updated_at:new Date().toISOString(), created_seq:i
    });
    events[id]=[{event_type:'created', from_status:null, to_status:'active', reason:null, created_at: new Date().toISOString()}];

    // ---- health bucket: mix of sickly / very healthy / average animals ----
    const roll=Math.random();
    const bucket = roll<0.15 ? 'sickly' : (roll<0.28 ? 'veryhealthy' : 'average');

    // ---- weight / BCS history: 3-6 records over the last ~5 months ----
    const recordCount=randInt(3,6);
    let curWeight=randInt(220,400);
    let lastWeightVal=null;
    for(let w=recordCount;w>=1;w--){
      const daysBack=w*randInt(18,32);
      let bcsVal=null;
      if(bucket==='sickly') curWeight+=randInt(-6,2);
      else if(bucket==='veryhealthy') curWeight+=randInt(8,15);
      else curWeight+=randInt(-2,10);
      curWeight=Math.max(180,curWeight);
      const bcsRoll=Math.random();
      if(bucket==='sickly') bcsVal = bcsRoll<0.7 ? pick([1,1,2]) : null;
      else if(bucket==='veryhealthy') bcsVal = bcsRoll<0.7 ? 3 : null;
      else bcsVal = bcsRoll<0.7 ? pick([2,3,3,4]) : null;
      const includeWeight = Math.random()<0.85;
      if(!includeWeight && bcsVal==null) bcsVal = pick(bucket==='sickly'?[1,2]:bucket==='veryhealthy'?[3]:[2,3,4]);
      lastWeightVal=curWeight;
      weights.push({id:uuid(), animal_id:id, weight_kg: includeWeight?curWeight:null, bcs:bcsVal, note:null, recorded_at:daysAgoIso(daysBack)});
    }

    // ---- injuries: sickly animals injured more often and more severely ----
    const injuryChance = bucket==='sickly' ? 0.65 : (bucket==='veryhealthy' ? 0.06 : 0.22);
    if(Math.random()<injuryChance){
      const injuryCount = bucket==='sickly' && Math.random()<0.3 ? 2 : 1;
      for(let n=0;n<injuryCount;n++){
        const makeCurrent = bucket==='sickly' ? Math.random()<0.35 : Math.random()<0.1;
        const severity = bucket==='sickly' ? randInt(3,5) : (bucket==='veryhealthy' ? randInt(1,2) : randInt(1,3));
        const recordedDaysAgo = makeCurrent ? randInt(1,10) : randInt(20,300);
        const recordedAt=daysAgoIso(recordedDaysAgo);
        const resolvedAt = makeCurrent ? null : daysAgoIso(Math.max(0,recordedDaysAgo-randInt(3,25)));
        injuryRecords.push({
          id:uuid(), animal_id:id, photo_data:null,
          body_part:pick(INJURY_BODY_PARTS), cause:pick(INJURY_CAUSES), notes:null, severity,
          checklist:{bleeding:Math.random()<0.2, non_weight_bearing:Math.random()<0.2, hot_to_touch:Math.random()<0.25},
          recorded_at:recordedAt, resolved_at:resolvedAt,
          analysis_status:null, ai_diagnosis:null, ai_treatment:null, ai_confidence:null, ai_vet_recommended:null, analyzed_at:null,
        });
      }
    }

    // ---- medicine: deliberately left empty (per the farmer's request) so
    // demo animals start with a clean medicine history — a random junk
    // treatment record here would only get in the way of testing the
    // injury-medicine link against real, deliberately-entered data. TB
    // test records (below) are unaffected — they're a separate, purposeful
    // part of the seed data, not something to also strip out.

    // ---- TB test: every demo animal gets a recent, in-date TB test except
    // A-1024, deliberately left without one so the new move-risk warning
    // (and the "no TB test" flag generally) has something real to catch
    // when trying the feature against the seed data. ----
    if(i!==24){
      const tbType=tbTuberculinType('Bovine tuberculin');
      const tbId=tbType?tbType.id:null;
      if(tbId){
        const administeredAt=daysAgoIso(randInt(10,150)); // comfortably inside the 6-month window
        medicineRecords.push({
          id:uuid(), animal_id:id, medicine_type_id:tbId, product_name:'TB test',
          farmer_vet_id: pick(farmersVets).id,
          dose:null, dose_unit:null,
          reason:'routine', cost: +(15+Math.random()*10).toFixed(2),
          batch_no:null,
          expiry_date:null,
          animal_weight_kg: lastWeightVal,
          method_given:'Injection',
          photo_data:null,
          administered_at: administeredAt, withdrawal_until: administeredAt, // TB test itself carries no withdrawal period
          note:null,
        });
      }
    }
  }
}

function parseImportDate(val){
  if(val==null || val==='') return null;
  if(val instanceof Date) return isNaN(val.getTime())?null:val;
  if(typeof val==='number'){
    const excelEpoch=new Date(Date.UTC(1899,11,30));
    return new Date(excelEpoch.getTime()+val*86400000);
  }
  const s=String(val).trim();
  if(!s) return null;
  const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let d=+m[1], mo=+m[2], y=+m[3];
    if(y<100) y+=2000;
    return new Date(Date.UTC(y, mo-1, d, 12));
  }
  const d2=new Date(s);
  return isNaN(d2.getTime())?null:d2;
}
function importNum(val){
  if(val==null || val==='') return null;
  const n=typeof val==='number'?val:parseFloat(String(val).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?null:n;
}
function fmtExportDate(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d.getTime())) return '';
  const dd=String(d.getUTCDate()).padStart(2,'0');
  const mm=String(d.getUTCMonth()+1).padStart(2,'0');
  const yyyy=d.getUTCFullYear();
  return dd+'/'+mm+'/'+yyyy;
}

  const stamp=new Date().toISOString().slice(0,10);

async function runFarmDataImport(){

    const buf = await importFile.arrayBuffer();

    };

    const newBreeds=[];

      const key=(name||'').trim().toLowerCase();
