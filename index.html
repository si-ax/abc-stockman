      newBreeds.push(b);
      breedByName[key]=b.id;
      return b.id;
    };
    (breedsRows||[]).slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const id=ensureBreed(row[0]);
      const b=newBreeds.find(x=>x.id===id);
      if(b && row[1]!=null) b.price_per_kg=importNum(row[1]);
    });

    // ---- Animals ----
    const newAnimals=[];
    const newEvents={};
    const animalByTag={};
    const statusMap={active:'active', sold:'sold', dead:'dead', stolen:'stolen', swapped:'swapped'};
    let seq=1;
    const skipped={weights:0, medicine:0, injuries:0};
    animalsRows.slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const tag=String(row[0]).trim();
      if(!tag) return;
      const name=row[1]!=null?String(row[1]).trim():'';
      const breedId=ensureBreed(row[2]);
      const sexRaw=row[3]!=null?String(row[3]).trim().toUpperCase():'F';
      const sex = sexRaw==='M'?'M':'F';
      const dob=parseImportDate(row[4]) || new Date();
      const eid=row[5]!=null?String(row[5]).trim():null;
      const statusRaw=row[6]!=null?String(row[6]).trim().toLowerCase():'active';
      const status=statusMap[statusRaw]||'active';
      const purchasePrice=importNum(row[7]);
      const birthWeight=importNum(row[8]);
      const weanedWeight=importNum(row[9]);
      const id=uuid();
      newAnimals.push({
        id, tag_number:tag, eid:eid||null, breed_id:breedId, sex, birth_date:dob.toISOString(), status,
        purchase_price:purchasePrice, birth_weight_kg:birthWeight, weaned_weight_kg:weanedWeight,
        mother_id:null, father_id:null, photo_data:null,
        name:name||null, updated_at:new Date().toISOString(), created_seq:seq++,
      });
      const evs=[{event_type:'created', from_status:null, to_status:'active', reason:null, created_at:new Date().toISOString()}];
      if(status!=='active'){
        evs.push({event_type:EXIT_STATUSES[status]||status, from_status:'active', to_status:status, reason:'Imported from spreadsheet', created_at:new Date().toISOString()});
      }
      newEvents[id]=evs;
      animalByTag[tag.toLowerCase()]=id;
    });

    // ---- Weights ----
    const newWeights=[];
    (weightsRows||[]).slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const animalId=animalByTag[String(row[0]).trim().toLowerCase()];
      if(!animalId){ skipped.weights++; return; }
      const weight=importNum(row[2]);
      if(weight==null){ skipped.weights++; return; }
      const date=parseImportDate(row[1]) || new Date();
      const bcsRaw=importNum(row[3]);
      const bcs = bcsRaw!=null ? Math.max(1, Math.min(5, Math.round(bcsRaw))) : null;
      newWeights.push({id:uuid(), animal_id:animalId, weight_kg:weight, bcs, note:null, recorded_at:date.toISOString()});
    });

    // ---- Medicine (also builds Medicine types & Farmers/vets from what's referenced) ----
    const newMedicineTypes=[], newFarmersVets=[];
    const medTypeByName={}, farmerByName={};
    const ensureFarmerVet=(name)=>{
      const key=(name||'').trim().toLowerCase();
      if(!key) return null;
      if(farmerByName[key]) return farmerByName[key];
      const p={id:uuid(), name:(name||'').trim(), role:'farmer', active:true};
      newFarmersVets.push(p);
      farmerByName[key]=p.id;
      return p.id;
    };
    const reasonByLabel={};
    MED_REASON_OPTIONS.forEach(r=>{ reasonByLabel[r.label.toLowerCase().replace(/[\s\/]+/g,'')]=r.key; });
    const matchReason=(text)=>{
      if(!text) return 'other';
      const key=String(text).toLowerCase().replace(/[\s\/]+/g,'').replace(/,/g,'');
      if(reasonByLabel[key]) return reasonByLabel[key];
      const found=MED_REASON_OPTIONS.find(r=>key.includes(r.key));
      return found ? found.key : 'other';
    };
    const newMedicineRecords=[];
    (medicineRows||[]).slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const animalId=animalByTag[String(row[0]).trim().toLowerCase()];
      if(!animalId){ skipped.medicine++; return; }
      const givenDate=parseImportDate(row[1]) || new Date();
      const product=row[2]!=null?String(row[2]).trim():'';
      if(!product){ skipped.medicine++; return; }
      const batchNo=row[3]!=null?String(row[3]).trim():null;
      const doseAmount=importNum(row[4]);
      const doseUnit=row[5]!=null?String(row[5]).trim():'ml';
      const method=row[6]!=null?String(row[6]).trim():null;
      const withdrawalDate=parseImportDate(row[7]);
      const cost=importNum(row[8]) ?? 0;
      const reasonKey=matchReason(row[9]);
      const givenBy=row[10]!=null?String(row[10]).trim():null;
      const farmerVetId=ensureFarmerVet(givenBy);

      const key=product.toLowerCase();
      let medTypeId=medTypeByName[key];
      if(!medTypeId){
        const withdrawalDays = withdrawalDate ? Math.max(0, Math.round((withdrawalDate-givenDate)/86400000)) : 0;
        const mt={id:uuid(), name:product, withdrawal_days:withdrawalDays, dosage_per_kg:null, active:true};
        newMedicineTypes.push(mt);
        medTypeByName[key]=mt.id;
        medTypeId=mt.id;
      }
      newMedicineRecords.push({
        id:uuid(), animal_id:animalId, medicine_type_id:medTypeId, product_name:product,
        farmer_vet_id:farmerVetId, reason:reasonKey, cost,
        batch_no:batchNo, expiry_date:null,
        animal_weight_kg:null, dosage_amount:doseAmount, dosage_unit:doseUnit, method_given:method,
        photo_data:null, administered_at:givenDate.toISOString(),
        withdrawal_until:(withdrawalDate||givenDate).toISOString(),
      });
    });

    // ---- Injuries ----
    const newInjuryRecords=[];
    (injuriesRows||[]).slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const animalId=animalByTag[String(row[0]).trim().toLowerCase()];
      if(!animalId){ skipped.injuries++; return; }
      const date=parseImportDate(row[1]) || new Date();
      const bodyPart=row[2]!=null?String(row[2]).trim().toLowerCase():null;
      const sevRaw=importNum(row[3]);
      const severity = sevRaw!=null ? Math.max(1, Math.min(5, Math.round(sevRaw))) : null;
      const resolvedDate=parseImportDate(row[4]);
      newInjuryRecords.push({
        id:uuid(), animal_id:animalId, photo_data:null, description:null, severity,
        body_part:bodyPart, cause:null, notes:null,
        recorded_at:date.toISOString(), resolved_at: resolvedDate?resolvedDate.toISOString():null,
      });
    });

    if(!newAnimals.length){
      importError='No animals found to import \u2014 check the Animals tab has at least one row filled in below the header.';
      importBusy=false; render(); return;
    }

    const warnParts=[];
    if(skipped.weights) warnParts.push(skipped.weights+' weight row(s)');
    if(skipped.medicine) warnParts.push(skipped.medicine+' medicine row(s)');
    if(skipped.injuries) warnParts.push(skipped.injuries+' injury row(s)');
    const warnText = warnParts.length ? '\n\n'+warnParts.join(', ')+' were skipped because their Mgmt ID didn\u2019t match any animal on the Animals tab.' : '';

    const applyImport=async()=>{
      // ---- Apply: replace everything ----
      breeds = newBreeds;
      animals = newAnimals;
      events = newEvents;
      weights = newWeights;
      medicineTypes = newMedicineTypes;
      medicineRecords = newMedicineRecords;
      injuryRecords = newInjuryRecords;
      farmersVets = newFarmersVets;
      feedTypes = FEED_TYPES_SEED.map(name=>({id:uuid(), name, active:true}));
      feedRecords = [];
      feedUsageRecords = [];
      damageRecords = [];
      moveRecords = [];
      breedingRecords = [];
      usingFeed = true;
      usingFeedLog = [];
      feedLocation = 'barn';
      feedLocationLog = [];

      // clear session/selection state so nothing points at a deleted record
      selectedId=null; healthTarget=null; weighTarget=null; feedTarget=null;
      cameFromSummary=false; medBulkActive=false; medBulkCarry=null;
      expandedFlagKey=null; expandedBcmsGroupKey=null; expandedMedicineIds=new Set(); expandedMedicineAnimalId=null; expandedInjuryIds=new Set(); expandedInjuryAnimalId=null; expandedDamageId=null;
      settingsOpenSection=null; settingsShowAddForm=false;
      navStack=[];
      importFile=null; importError=''; importBusy=false;

      await persistAll();
      logMsg('Imported '+newAnimals.length+' animals, '+newWeights.length+' weights, '+newMedicineRecords.length+' medicine records, '+newInjuryRecords.length+' injuries from spreadsheet.');
      view='home';
      render();
      showSaveToast('Saved');
    };
    showConfirmModal(
      'This will erase ALL existing animals, weights, medicine, and injury records on this device and replace them with this file:\n\n'+
      newAnimals.length+' animal(s), '+newWeights.length+' weight record(s), '+newMedicineRecords.length+' medicine record(s), '+newInjuryRecords.length+' injury record(s).'+
      warnText+
      '\n\nThis cannot be undone. Continue?',
      applyImport,
      render
    );
    importBusy=false;
  } catch(e){
    importError='Couldn\u2019t read that file: '+e.message+'. Make sure it\u2019s a copy of the aBC Stockman template.';
    importBusy=false;
    render();
  }
}

// NATIVE REBUILD NOTE (not applicable to this prototype): this HTML build
// has no backend, so persistAll() below deliberately stores everything —
// every animal regardless of status, and its full weigh/medicine/injury
// history — since local storage is the only copy of the data that exists
// anywhere. That's correct for this prototype, but was NOT meant to carry
// over as the real design: the actual native app should only cache ACTIVE
// animals locally on-device, fetching an exited animal's full history from

// ---------- full device backup (Settings > Backup) ----------
// Genuinely everything on the device, losslessly — every field exactly as
// stored, not reshaped into friendly report columns. This exists for one
// purpose: restoring this exact device's data if the phone is lost,
// damaged, or replaced. It's deliberately separate from "Export farm
// data" below, which is a curated, human-readable subset (animals,
// weights, medicine, injuries only) meant for sharing with a vet or
// accountant — that one was never meant to capture Fodder, the Medicine
// Cabinet, Moves, Farm Damage, Farmers & Vets, or Breeding, and still
// doesn't; trying to force all of that into spreadsheet columns would be
// unreliable for something a farmer needs to actually trust in an
// emergency, so a full JSON backup is the correct tool for that job.
function backupSnapshot(){
  return {
    format:'abc-stockman-backup', version:1, exported_at:new Date().toISOString(), build:APP_BUILD_VERSION,
    data:{
      breeds, animals, events, weights,
      feedTypes, feedRecords, feedUsageRecords,
      medicineTypes, medicineRecords,
      injuryRecords, farmSettings, damageRecords, moveRecords, farmersVets,
      usingFeed, usingFeedLog, feedLocation, feedLocationLog,
      breedingRecords, breedPriceHistory, farmDetails,
      deviceFarmCode, deviceFarmName, currentFarmerId, currentFarmerName,
    },
  };
}
function exportFullBackup(){
  const json=JSON.stringify(backupSnapshot());
  const blob=new Blob([json], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='aBC_Stockman_Backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
// Replaces every field this app persists with whatever's in the backup —
// deliberately whole-device, not merged, so what's restored is exactly
// what existed at backup time, with nothing left over from before.
async function restoreFullBackup(parsed){
  const d=parsed.data;
  breeds=d.breeds||[]; animals=d.animals||[]; events=d.events||{}; weights=d.weights||[];
  feedTypes=d.feedTypes||[]; feedRecords=d.feedRecords||[]; feedUsageRecords=d.feedUsageRecords||[];
  medicineTypes=d.medicineTypes||[]; medicineRecords=d.medicineRecords||[];
  injuryRecords=d.injuryRecords||[]; farmSettings=d.farmSettings||{}; damageRecords=d.damageRecords||[]; moveRecords=d.moveRecords||[]; farmersVets=d.farmersVets||[];
  usingFeed=d.usingFeed!==undefined?d.usingFeed:true; usingFeedLog=d.usingFeedLog||[];
  feedLocation=d.feedLocation||'barn'; feedLocationLog=d.feedLocationLog||[];
  breedingRecords=d.breedingRecords||[]; breedPriceHistory=d.breedPriceHistory||[]; farmDetails=d.farmDetails||[];
  deviceFarmCode=d.deviceFarmCode||null; deviceFarmName=d.deviceFarmName||null;
  currentFarmerId=d.currentFarmerId||null; currentFarmerName=d.currentFarmerName||null;
  ensureTbTestMedicineType();
  await persistAll();
}

async function selectAnimalForMove(id){
  // Toggle, not just add — tapping an already-added animal in the picker
  // takes it back off the move immediately, rather than the farmer having
  // to wait until Done and then hunt for it in the "remove" list below.
  // Mistaps happen constantly with a long list of similar tag numbers.
  const wasIncluded=moveAnimalIds.includes(id);
  if(wasIncluded){
    moveAnimalIds=moveAnimalIds.filter(x=>x!==id);
    if(moveAnimalIds.length===0 && moveSessionRecordId){
      const idx=moveRecords.findIndex(r=>r.id===moveSessionRecordId);
      if(idx>-1) moveRecords.splice(idx,1);
      const deletedId=moveSessionRecordId;
      moveSessionRecordId=null;
      await persistAll();
      await deleteMoveFromSupabase(deletedId);
    } else {
      await commitMoveEntry();
    }
    return 'removed';
  }
  moveAnimalIds.push(id);
  const isNew = await commitMoveEntry();
  // modal is still the picker itself at this point (the only two callers —
  // the picker's own row tap, and its own Scan button — both run with the
  // picker as the active modal), so its search term can be carried
  // straight through to reopening it once any warning here is cleared.
  queueMoveRiskWarnings([id], {type:'movePickAnimal', term: modal && modal.term});
  return isNew;
}
// Shared by every place an animal (or several at once) gets added to the
// current move: the picker/scan flow above (always one at a time, via
// selectAnimalForMove), and the few places that pre-fill moveAnimalIds
// directly in a batch (multi-select from the Animal List, reversing a past
// move, pre-filling from an animal's own Summary). Each flagged animal
// gets its own popup in turn — queued, not merged into one combined
// message — so ticking through several one at a time is possible, while
// the "don't alert for any other animals in this move" checkbox lets the
// farmer clear the rest of the queue in one go when that's what's wanted.
// returnTo is what to restore modal to once the whole queue (or the
// suppression shortcut) is done — the picker, for the two callers above;
// left blank for the batch pre-fill call sites, which have no modal to
// return to, just the Move screen itself underneath.
function queueMoveRiskWarnings(ids, returnTo){
  if(moveWarningsSuppressed) return;
  if(moveDirection==='in') return; // on-farm field move — no TB/withdrawal check needed, the animal isn't leaving the farm
  const risky=[...new Set(ids)].filter(id=>animalMoveRisk(id));
  if(!risky.length) return;
  modal={type:'moveRiskWarning', animalId:risky[0], queue:risky.slice(1), returnTo:returnTo||null};
}
let medAddCurrentCabinetItem=null; // the cabinet batch currently resolved on the farmer path — module-level so bulk-carry-forward can read/reapply it

    const sel=document.getElementById('med-farmer-productname');
    if(sel){
      sel.value=medBulkCarry.productName;
      sel.dispatchEvent(new Event('change'));
      // If the carried record used one specific batch among several for

      if(medBulkCarry.cabinetItemId){
        const batchSel=document.getElementById('med-batchno-farmer-select');
        if(batchSel){ batchSel.value=medBulkCarry.cabinetItemId; batchSel.dispatchEvent(new Event('change')); }

    }
  }
  withdrawalInput.value=medBulkCarry.withdrawalDate;
  withdrawalInput.classList.toggle('amberfield', !!withdrawalInput.value);
}

function ageMonths(birthIso){
  if(!birthIso) return null;

  let m=(n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if(n.getDate() < b.getDate()) m--;

}
function lastBcsRecord(animalId){ return weights.filter(w=>w.animal_id===animalId && w.bcs!=null).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at))[0] || null; }

// "Last recorded" date, since that's about activity on this animal at
// all); pass 'bcs' or 'weight_kg' to find the most recent record that
// specifically has THAT value — needed because a farmer sometimes only
// logs one of the two on a given visit, so the single most-recent record
// overall can easily have the other field blank even when an older
// record does have it (previously this showed "Previous BCS: (none)"
// whenever the latest weigh-in happened to be weight-only, even with real
// BCS history sitting right there one record further back).
function previousWeighRecord(animalId, excludeId, field){
  return weights.filter(w=>w.animal_id===animalId && w.id!==excludeId && (field ? w[field]!=null : (w.weight_kg!=null||w.bcs!=null)))

function weightClosestTo(animalId, daysAgo){
  const target=new Date(); target.setDate(target.getDate()-daysAgo);
  const withW = weights.filter(w=>w.animal_id===animalId && w.weight_kg!=null);
  if(!withW.length) return null;
  let best=null, bestDiff=Infinity;
  withW.forEach(w=>{ const diff=Math.abs(new Date(w.recorded_at)-target); if(diff<bestDiff){bestDiff=diff; best=w;} });
  return best ? best.weight_kg : null;
}

// --- Health Score (0-100) ---
function bcsPoints(a){
  const lw=lastBcsRecord(a.id);
  if(!lw) return {points:0, note:'No BCS recorded'};
  if(lw.bcs===3) return {points:25, note:'BCS 3'};
  if(lw.bcs===2||lw.bcs===4) return {points:15, note:'BCS '+lw.bcs};
  return {points:5, note:'BCS '+lw.bcs};
}
function injuryPoints(a){
  const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-1);
  const recent=injuryRecords.filter(r=>r.animal_id===a.id && new Date(r.recorded_at)>=cutoff);
  if(!recent.length) return {points:20, note:'No injuries in past 12mo'};
  const rated=recent.filter(r=>r.severity!=null);
  if(!rated.length) return {points:15, note:'Injury logged but no severity level given'};
  const worst=Math.max(...rated.map(r=>r.severity));
  if(worst<=2) return {points:15, note:'Worst injury level '+worst};
  if(worst<=4) return {points:10, note:'Worst injury level '+worst};
  return {points:2, note:'Worst injury level '+worst};
}
function illnessPoints(a){
  const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-1);
  // Injury-treatment medicine counts here too, alongside Illness/Disease —
  // an animal needing treatment (e.g. antibiotics) because it couldn't
  // fight off infection from an injury is an illness event in its own
  // right, not just the injury itself (which is already reflected
  // separately in Injury history, via the injury record's own severity).
  // Preventative/Routine/Pregnancy are deliberately still excluded, since
  // none of those represent the animal actually being unwell.
  const count=medicineRecords.filter(r=>r.animal_id===a.id && (r.reason==='illness'||r.reason==='injury') && new Date(r.administered_at)>=cutoff).length;
  if(count===0) return {points:20, note:'No illness treatments in past 12mo'};
  if(count===1) return {points:15, note:'1 illness treatment in past 12mo'};
  return {points:5, note:count+' illness treatments in past 12mo'};
}
function weightTrendPoints(a){
  const current=lastWeightRecord(a.id);
  if(!current) return {points:15, note:'No weight recorded — assumed stable', assumed:true};
  const w90=weightClosestTo(a.id,90) ?? current.weight_kg;
  const pct = w90 ? ((current.weight_kg-w90)/w90)*100 : 0;
  // ASSUMPTION: thresholds not specified in the deck — using +/-2% and +/-10% as reasonable bands. Confirm with farm/vet.
  if(pct>=2) return {points:20, note:'Increasing ('+pct.toFixed(1)+'% vs ~90d ago)', assumed:true};
  if(pct>=-2) return {points:15, note:'Stable ('+pct.toFixed(1)+'% vs ~90d ago)', assumed:true};
  if(pct>=-10) return {points:9, note:'Slight decrease ('+Math.abs(pct).toFixed(1)+'% vs ~90d ago)', assumed:true};
  return {points:2, note:'Rapid decrease ('+Math.abs(pct).toFixed(1)+'% vs ~90d ago)', assumed:true};
}

// Used to highlight the D.O.B field on the animal details screen (green

  const {min:minP, max:maxP}=breedPrimeAge(a.breed_id);

function eidStatusColor(eid, birthDate){

// TB testing: locate the locked "TB test" medicine type and check whether
// an animal has a record of one within the last 6 months. No record at all
// counts as overdue. This is a warning-only check throughout the app — it
// never blocks a move, it just flags it.
// Which part of a TB test a medicine record is: 'avian' | 'bovine' |
// 'legacy' (the old single "TB test") | null. Matched by the linked type's
// name OR the record's own product name, so duplicate type rows, or a
// record saved against a type id that no longer exists, still count.
function tbRecordKind(r){
  const t=r.medicine_type_id?medicineTypes.find(m=>m.id===r.medicine_type_id):null;
  const names=[t&&t.locked?t.name:null, r.product_name].filter(Boolean).map(n=>n.trim().toLowerCase());
  for(const tb of TB_TUBERCULINS){ if(names.includes(tb.name.toLowerCase())) return tb.kind; }

// A tuberculin with no matching partner within a day either side.
const TB_PAIR_WINDOW_MS=36*3600*1000;
function tbPartnerOf(r, recs){
  const kind=tbRecordKind(r);

  if(!other) return null;
  const t=new Date(r.administered_at).getTime();
  return recs.find(x=>tbRecordKind(x)===other && Math.abs(new Date(x.administered_at).getTime()-t)<=TB_PAIR_WINDOW_MS) || null;
}
// Date of the animal's most recent COMPLETE TB test: both tuberculins
// recorded within a day of each other (the later of the pair), or an old
// single "TB test" record. A lone avian or bovine doesn't count.
function lastTbTestDate(animalId){
  const recs=medicineRecords.filter(r=>r.animal_id===animalId && tbRecordKind(r));
  let best=null;
  recs.forEach(r=>{
    const kind=tbRecordKind(r);
    let d=null;
    if(kind==='legacy') d=r.administered_at;
    else { const p=tbPartnerOf(r, recs); if(p) d = new Date(p.administered_at)>new Date(r.administered_at) ? p.administered_at : r.administered_at; }
    if(d && (!best || new Date(d)>new Date(best))) best=d;

// If this record is one tuberculin with its partner still missing, the
// missing one's name — used for the "don't forget" reminder after saving.
function tbMissingPartnerName(r){

  const recs=medicineRecords.filter(x=>x.animal_id===r.animal_id && tbRecordKind(x));
  if(tbPartnerOf(r, recs)) return null;

// Farm-wide TB testing interval (Settings > Farm > TB testing) — 6, 12, 24

const TB_TEST_INTERVAL_OPTIONS=[6,12,24,48];
function tbTestIntervalMonths(){

// the "Mark as sold" modal — by which point the animal may already have
// left the farm and been sold, too late for the warning to change
// anything. Surfacing it here, at the point of actually adding the animal
// to a move, is what the warning is supposed to be for.
function animalMoveRisk(animalId){
  return !!activeWithdrawal(animalId) || tbTestOverdue(animalId);
}
// --- Statutory reporting deadlines (BCMS/CTS) ---
// These track the *notification* deadlines that carry real legal weight —
// not the separate (and shorter) on-farm herd-register deadlines, which
// this app doesn't need to model since the app itself functions as that
// register. Each returns null once marked reported, or {daysLeft, overdue}
// while a report is still outstanding (daysLeft goes negative once overdue,
// but overdue is the flag to check — the obligation doesn't expire, it's
// just late). These are informational only and never block anything.
//
// Birth registration is only this farm's job for animals actually born
// here. A bought-in animal must already have a passport to be legally
// sold — which means its birth was necessarily registered by the previous
// keeper already — so it's identified here by having a purchase price
// recorded, and skipped entirely rather than guessed at from D.O.B./date
// patterns (an unknown D.O.B. or an already-overdue-looking one on a
// home-bred calf is exactly the case this warning most needs to catch,
// not a case to quietly wave through).
// Cattle get an individual BCMS/CTS birth registration (27 days) and death
// report (7 days) — sheep have no equivalent per-animal deadline for either
// (they're only tagged before moving, and fallen stock/flock-register rules
// apply to deaths instead), so these two checks only fire for cattle.
// Movement reporting (3 days, in moveReportStatus below) applies to both
// species equally, so that one is deliberately left species-agnostic.
function animalSpecies(a){
  const breed=breeds.find(b=>b.id===a.breed_id);
  return (breed && breed.species) || 'cattle';
}
function birthReportStatus(a){
  if(a.bcms_birth_reported || !a.birth_date) return null;
  if(a.purchase_price!=null) return null; // bought in (any price, including £0 for a free transfer) — previous keeper's obligation, not ours
  if(animalSpecies(a)!=='cattle') return null; // sheep have no individual birth-registration deadline
  const daysLeft = 27 - daysSince(a.birth_date);
  return { daysLeft, overdue: daysLeft<=0 };
}
function moveReportStatus(rec){
  if(rec.direction==='in') return null; // on-farm field move — never a BCMS reporting obligation
  if(rec.bcms_reported) return null;
  const daysLeft = 3 - daysSince(rec.date);
  return { daysLeft, overdue: daysLeft<=0 };
}
function deathReportStatus(a){
  if(a.status!=='dead' || a.bcms_death_reported) return null;
  if(animalSpecies(a)!=='cattle') return null; // sheep deaths go through fallen stock / the flock register, not a BCMS-style report
  const evs=events[a.id]||[];
  const deathEvent=evs.slice().reverse().find(e=>e.to_status==='dead');
  const deathDate = deathEvent ? deathEvent.created_at : a.updated_at;
  if(!deathDate) return null;
  const daysLeft = 7 - daysSince(deathDate);
  return { daysLeft, overdue: daysLeft<=0 };
}
function recencyScore(daysAgo){
  if(daysAgo==null) return 0;
  if(daysAgo<=30) return 50;
  if(daysAgo<=90) return 40;
  if(daysAgo<=180) return 25;
  if(daysAgo<=365) return 10;
  return 0;
}
function confidenceScore(a){
  const lastBcs=lastBcsRecord(a.id), lastW=lastWeightRecord(a.id);
  const bcsDays=lastBcs?daysSince(lastBcs.recorded_at):null;
  const wDays=lastW?daysSince(lastW.recorded_at):null;
  const bcsScore=recencyScore(bcsDays), wScore=recencyScore(wDays);
  const total=bcsScore+wScore;
  const label = total>=90?'HIGH' : total<=60?'LOW' : 'MEDIUM';
  return {total, label, breakdown:[
    {label:'BCS last recorded', note: bcsDays==null?'Never':bcsDays+' days ago', points:bcsScore},
    {label:'Weight last recorded', note: wDays==null?'Never':wDays+' days ago', points:wScore},
  ]};
}

// --- Market value & cost ---
function marketValue(a){
  const breed=breeds.find(b=>b.id===a.breed_id);
  const lastW=lastWeightRecord(a.id);
  if(!breed || breed.price_per_kg==null || !lastW) return null;
  return lastW.weight_kg * breed.price_per_kg;
}
function medicineCostTotal(a){
  return medicineRecords.filter(r=>r.animal_id===a.id && r.cost!=null).reduce((s,r)=>s+r.cost,0);
}
function totalCost(a){
  return (a.purchase_price||0) + medicineCostTotal(a);
}
function estimatedProfit(a){
  const mv=marketValue(a);
  if(mv==null) return null;
  return mv - totalCost(a);
}
// ================= END CALCULATIONS =================

// Was this animal 'active' on a given date, per its own status event history?
// Used to decide (a) whether it should share in a feed period's cost, and
// (b) the herd size to divide that period's cost across.
function wasAnimalActiveOnDate(animalId, dateStr){
  const evs=(events[animalId]||[]).filter(e=>e.created_at.slice(0,10)<=dateStr).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!evs.length) return false; // didn't exist yet on that date
  return evs[0].to_status==='active';
}
function activeAnimalCountOnDate(dateStr){
  return animals.filter(a=>wasAnimalActiveOnDate(a.id, dateStr)).length;
}
function feedRecordCost(r){ return r.total_cost!=null ? r.total_cost : (r.sack_price||0)*(r.sacks||0); }

// Guide cost, not an accurate expense (per the spec): each feed purchase's
// total cost is split evenly across whoever was active on the farm on the
// day that purchase was logged, and an animal accumulates a share for every
// purchase it was present for during its time on the farm.
function feedCostTotal(animalId){
  let total=0;
  feedRecords.filter(r=>!r.deleted_at).forEach(r=>{
    if(!wasAnimalActiveOnDate(animalId, r.start_date)) return;
    const herdSize=activeAnimalCountOnDate(r.start_date);
    if(herdSize>0) total += feedRecordCost(r)/herdSize;
  });
  return total;
}
function recentFeedRecords(monthsBack=1){
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-monthsBack);
  return feedRecords.filter(r=>!r.deleted_at && new Date(r.start_date)>=cutoff).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));
}
function medicineTypeName(id){const m=medicineTypes.find(x=>x.id===id); return m?m.name:'—';}
// ---------- Medicine Cabinet ----------
// medicineTypes doubles as the Medicine Cabinet: each entry (other than the
// locked TB-test entry, which isn't real stock) is one purchased batch —
// product name, type/category, batch, expiry, total size/qty, cost,
// supplier, default withdrawal & dosage/kg. disposed_at marks it gone.
let medCabinetExpandedType=null, medCabinetViewPrevExpanded=false, medCabinetPrevMonthsBack=12;
// Where "+ Add new person"-style shortcuts return to once a new cabinet
// item has been saved — null means the normal route (Settings, Medicine
// Cabinet expanded); set when reached via the green-plus shortcut from
// Add Animal Medicine so that screen's in-progress entry isn't lost.
let medCabAddPhoto=null;
let medCabEditTargetId=null; // set = editing (active) or viewing (disposed) an existing cabinet item; null = adding a new one
let medDisposeTargetId=null;
function activeCabinetItems(){ return medicineTypes.filter(m=>!m.locked && !m.disposed_at); }
function previousCabinetItems(monthsBack=12){
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-monthsBack);
  return medicineTypes.filter(m=>!m.locked && m.disposed_at && new Date(m.disposed_at)>=cutoff)
    .sort((a,b)=>new Date(b.disposed_at)-new Date(a.disposed_at));
}
// How much of this batch has actually gone out to animals — only doses
// drawn from the farmer's own cabinet count (a vet using their own stock
// doesn't touch this batch at all, even if the product name matches).
function cabinetUsed(m){
  return medicineRecords.filter(r=>r.medicine_type_id===m.id && r.stock==='farmer' && r.dosage_amount!=null)
    .reduce((sum,r)=>sum+r.dosage_amount, 0);
}
function cabinetRemaining(m){ return (m.qty_size||0) - cabinetUsed(m); }
// The effective £ per ml/tab/gr, derived from total cost over total size —
// replaces the old manually-set £/unit price with something that can't
// drift out of sync with what was actually paid for the batch.
function cabinetUnitCost(m){ return (m.cost!=null && m.qty_size) ? m.cost/m.qty_size : null; }
function cabinetExpiryStatus(m){
  if(!m.expiry_date) return null;
  const exp=new Date(m.expiry_date);
  if(exp < new Date()) return 'red';
  const monthOut=new Date(); monthOut.setMonth(monthOut.getMonth()+1);
  if(exp <= monthOut) return 'amber';
  return null;
}
function cabinetRemainingStatus(m){
  const remaining=cabinetRemaining(m);
  if(remaining<=0) return 'red';
  if(m.qty_size && remaining<=m.qty_size*0.1) return 'amber';
  return null;
}
function farmerVetName(id){ if(!id) return 'Vet fees'; const p=farmersVets.find(x=>x.id===id); return p?p.name:'—'; }
// Who logged an entry into the app (currentFarmerId, stamped at creation),
// as distinct from farmerVetName above which is "who administered this
// medicine" — a different field, farmer_vet_id, entered per medicine
// record and not tied to who's currently logged into the device.
function loggedByLabel(farmerId){ if(!farmerId) return 'Admin'; const p=farmersVets.find(x=>x.id===farmerId); return p?p.name:'(removed farm hand)'; }
const MED_REASON_OPTIONS=[

];
function medReasonLabel(key){ const r=MED_REASON_OPTIONS.find(x=>x.key===key); return r?r.label:(key||'—'); }
function animalMedicineHistory(animalId){return medicineRecords.filter(r=>r.animal_id===animalId).sort((a,b)=>new Date(b.administered_at)-new Date(a.administered_at));}
function activeWithdrawal(animalId){

  return medicineRecords.filter(r=>r.animal_id===animalId && new Date(r.withdrawal_until) > now)
    .sort((a,b)=>new Date(b.withdrawal_until)-new Date(a.withdrawal_until))[0] || null;

// ================= AI INSIGHTS (Claude Vision, runs automatically once online) =================
async function analyzeInjury(rec){
  if(!farmSettings.groq_api_key){
    rec.analysis_status='failed';
    logMsg('Insights: analysis needs a Groq API key set up in Settings \u2014 add yours to enable this.');
    await persistAll();
    await syncInjuryToSupabase(rec);
    render();
    return;
  }
  rec.analysis_status='analyzing';
  render();
  try{
    let media_type, base64;
    const dataMatch=(rec.photo_data||'').match(/^data:(image\/[a-zA-Z]+);base64,(.*)$/);
    if(dataMatch){
      media_type=dataMatch[1]; base64=dataMatch[2];
    } else if(rec.photo_data){
      // Now a Storage URL rather than inline base64 (see
      // uploadPhotoToStorage) — the model needs the actual bytes, not a
      // link, so fetch it back down and re-encode.
      const resp=await fetch(rec.photo_data);
      if(!resp.ok) throw new Error('Couldn\u2019t fetch the photo to analyze it (status '+resp.status+')');
      const blob=await resp.blob();
      media_type=blob.type||'image/jpeg';
      base64=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result.split(',')[1]);
        reader.onerror=()=>reject(new Error('image read failed'));
        reader.readAsDataURL(blob);
      });
    } else {
      throw new Error('No usable photo on this record');
    }
    const a=animals.find(x=>x.id===rec.animal_id);
    const ck=rec.checklist||{};
    const promptText=`You are assisting a farmer reviewing a livestock injury photo taken in the field.
Animal: ${a?(animalDisplayName(a)):'unknown'}${a?', '+breedName(a.breed_id):''}
Body part: ${rec.body_part||'not specified'}
Farmer's account of the cause: ${rec.cause||'(none given)'}
Farmer's notes: ${rec.notes||'(none given)'}
Farmer's severity rating (1=minor, 5=severe): ${rec.severity!=null?rec.severity:'not rated'}
Quick check from the farmer: bleeding=${!!ck.bleeding}, cannot_put_weight_on_it=${!!ck.non_weight_bearing}, hot_to_touch=${!!ck.hot_to_touch}

Look at the photo together with this information. Respond ONLY with JSON, no other text, in exactly this shape:
{"diagnosis": "short plain-language assessment of what this looks like, 1-2 sentences", "treatment": "practical next-step advice for the farmer, 2-3 sentences, plain language, field-appropriate", "confidence": "high", "vet_recommended": true}
(confidence must be exactly "high", "medium", or "low"; vet_recommended must be a real boolean)`;
    // a diagnosis needs more room to think than a quick tag/passport read
    const text=await callGroq(promptText, {mediaType:media_type, base64}, {json:true, maxTokens:500, timeoutMs:20000});
    let parsed;
    try{ parsed=parseAiJson(text); }catch(parseErr){ throw new Error('Reply couldn\u2019t be read as data: \u201c'+text.slice(0,120)+'\u201d'); }
    rec.ai_diagnosis=parsed.diagnosis||null;
    rec.ai_treatment=parsed.treatment||null;
    rec.ai_confidence=parsed.confidence||null;
    rec.ai_vet_recommended=!!parsed.vet_recommended;
    rec.analysis_status='analyzed';
    rec.analyzed_at=new Date().toISOString();
    logMsg('Insights: analysis ready for <b>'+(a?(animalDisplayName(a)):'an animal')+'</b>\u2019s injury.');
  }catch(e){
    rec.analysis_status='failed';
    logMsg('Insights: analysis failed (&ldquo;'+e.message+'&rdquo;) &mdash; will retry once reconnected.');
  }
  await persistAll();
  await syncInjuryToSupabase(rec);
  render();
}
let analysisRunning=false;
async function runPendingAnalyses(){
  if(analysisRunning) return;
  analysisRunning=true;
  const list=injuryRecords.filter(r=>r.photo_data && (r.analysis_status==='pending' || r.analysis_status==='failed'));
  for(const rec of list){
    if(!isOnline) break; // stop immediately if signal drops mid-batch
    await analyzeInjury(rec);
  }
  analysisRunning=false;
}

function render(){
  if(isLockedOut() && view!=='locked'){ view='locked'; }
  if(!suppressHistoryPush && lastSnapshot && lastSnapshot.view!==view){
    navStack.push(lastSnapshot);
    if(navStack.length>30) navStack.shift();
  }
  suppressHistoryPush=false;
  updateStats();
  const screen=document.getElementById('screen');
  // A same-screen re-render (e.g. toggling an expander) shouldn't reset
  // scroll to the top the way navigating to a genuinely different screen
  // should. screen.innerHTML below always creates a brand new .body
  // element, which starts at scrollTop 0 regardless — without this, the
  // whole list would flash to the top before any scrollIntoView call even
  // runs, then visibly animate all the way back down to wherever the
  // toggled row actually was. Fixed once, centrally, here, rather than
  // needing every individual toggle in the app to remember to do it.
  const sameScreen = lastSnapshot && lastSnapshot.view===view;
  const prevScrollEl = sameScreen ? document.querySelector('.body') : null;
  const savedScroll = prevScrollEl ? prevScrollEl.scrollTop : 0;
  // Same idea, but for focus + cursor position rather than scroll. Screens
  // that auto-save a field on blur (Move, Damage — no dedicated Save
  // button) call render() from inside that very field's onchange handler.
  // Since screen.innerHTML below throws away and recreates every element,
  // whatever had focus a moment ago (often the NEXT field, if the person
  // had just tabbed/Enter-ed forward into it) gets silently replaced by an
  // unfocused twin with the same id — so advancing focus and then
  // auto-saving in the same breath looked like "Next doesn't work" even
  // though the focus() call itself was firing correctly. Re-finding the
  // same id post-render and restoring both focus and cursor position
  // fixes that everywhere this pattern occurs, rather than patching each
  // auto-saving screen individually.
  const activeEl=document.activeElement;
  const focusedId = (activeEl && activeEl.id && screen.contains(activeEl)) ? activeEl.id : null;
  const focusedSelection = (focusedId && typeof activeEl.selectionStart==='number') ? [activeEl.selectionStart, activeEl.selectionEnd] : null;
  const dispatch={
    home:renderHome, herd:renderHerd, detail:renderDetail, animalDetails:renderAnimalDetails,
    archive:renderArchive, profitScore:renderProfitScore,
    add:renderAdd, settings:renderSettings, weigh:renderWeigh, feed:renderFeed, feedAdd:renderFeedAdd, medicine:renderMedicine, medicineAdd:renderMedicineAdd, medicineAddTbBulk:renderMedicineAddTbBulk, medCabinetAdd:renderMedCabinetAdd, medDispose:renderMedDispose, injury:renderInjury, injuryAdd:renderInjuryAdd,
    breeding:renderBreeding,
    move:renderMove,
    damage:renderDamageList, damageAdd:renderDamageAdd, healthScore:renderHealthScoreScreen,
    insights:renderInsights,
    reports:renderReports, reportDetail:renderReportDetail, ask:renderAsk, breedValue:renderBreedValue,
    login:renderLogin,
    bootLoading:renderBootLoading,
    supaLogin:renderSupaLogin,
    supaWaiting:renderSupaWaiting,
    locked:renderLocked,
    timeline:renderTimeline,
    walkthrough:renderWalkthrough,
  };
  screen.innerHTML = (dispatch[view]||renderHome)();
  lastSnapshot=snapshotState();
  if(sameScreen){
    const newScrollEl=document.querySelector('.body');
    if(newScrollEl) newScrollEl.scrollTop=savedScroll;
  }
  if(focusedId){
    const restored=document.getElementById(focusedId);
    if(restored && typeof restored.focus==='function'){
      restored.focus();
      if(focusedSelection && typeof restored.setSelectionRange==='function'){
        try{ restored.setSelectionRange(focusedSelection[0], focusedSelection[1]); }catch(e){ /* wrong input type for selection - ignore */ }
      }
    }
  }
  wireView();
  if(modal) renderModal();
  if(showFilterModal) renderFilterModal();
  updateSignalBadge();
}
function updateSignalBadge(){
  const btn=document.querySelector('.noServerIcon');
  if(!btn) return;
  btn.style.display='flex';
  btn.style.color = isOnline ? 'var(--green)' : 'var(--red)';
  const pending=pendingSyncCount()+recordsWithLocalOnlyPhotos().length;
  const badge = pending ? `<span style="position:absolute;top:-6px;right:-6px;background:var(--amber);color:#fff;font-size:10px;font-weight:800;line-height:1;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;">${pending>9?'9+':pending}</span>` : '';
  btn.innerHTML = (isOnline ? icon('wifiOn') : icon('wifiOff')) + badge;
  btn.title = (isOnline ? 'Signal OK' : 'No signal \u2014 changes are stored locally and synced when signal returns') + (pending ? ' \u2014 '+pending+' change'+(pending===1?'':'s')+' waiting to sync' : '');
}

function outstandingBcmsItems(){
  const items=[];
  moveRecords.forEach(r=>{
    const st=moveReportStatus(r);
    if(st) items.push({kind:'move', id:r.id, label:fmtShortDate(r.date)+(r.direction?' ('+(r.direction==='off'?'Off farm':'On farm')+')':''), sub:st.overdue?'OVERDUE':st.daysLeft+' day'+(st.daysLeft===1?'':'s')+' left', overdue:st.overdue});
  });
  animals.forEach(a=>{
    const bst=birthReportStatus(a);
    if(bst) items.push({kind:'birth', id:a.id, label:animalDisplayName(a), sub:bst.overdue?'OVERDUE':bst.daysLeft+' day'+(bst.daysLeft===1?'':'s')+' left', overdue:bst.overdue});
    const dst=deathReportStatus(a);
    if(dst) items.push({kind:'death', id:a.id, label:animalDisplayName(a), sub:dst.overdue?'OVERDUE':dst.daysLeft+' day'+(dst.daysLeft===1?'':'s')+' left', overdue:dst.overdue});
  });
  items.sort((x,y)=>(y.overdue?1:0)-(x.overdue?1:0));
  return items;
}
// Groups the flat BCMS item list into the three notification types for
// display, same shape as herdFlags() so they can share the same expander
// UI pattern ("Needs attention" style: dot + label + coloured count pill).
function outstandingBcmsGroups(){
  const all=outstandingBcmsItems();
  return [
    {key:'births', label:'Births', items:all.filter(it=>it.kind==='birth')},
    {key:'moves', label:'Moves', items:all.filter(it=>it.kind==='move')},
    {key:'deaths', label:'Deaths', items:all.filter(it=>it.kind==='death')},
  ].filter(g=>g.items.length).map(g=>({
    ...g,
    count:g.items.length,
    color: g.items.some(it=>it.overdue) ? 'red' : 'amber',
  }));
}
// Same shape as herdFlags()/outstandingBcmsGroups() — the 4 checks the

let expandedMedCabAttentionKey=null;
// The handful of one-time setup essentials a new farm needs before the
// app is actually usable day to day — surfaced on Attention so a new
// farmer (or a new co-farmer on an existing farm) can't miss them, same
// as any other outstanding issue. Each maps to exactly where to go fix
// it, via settingsSection matching the existing accordion keys in
// Settings, so tapping one jumps straight there rather than just naming
// the problem. All five checks here are farm-wide (shared by every farm
// member) — including the AI key, which moved from per-user to a single
// shared farm key (see the note on the userSettings/farmSettings
// declarations for why).
function systemSettingsIssues(){
  const issues=[];
  if(!farmSettings.cph || !farmSettings.cph.trim()){
    issues.push({key:'cph', label:'Farm CPH number not set', settingsSection:'farm'});
  }
  if(!breeds.filter(b=>b.active).length){
    issues.push({key:'breeds', label:'No breeds added yet', settingsSection:'breeds'});
  }
  if(farmSettings.manage_fodder_spend!==false && !feedTypes.filter(f=>f.active).length){
    issues.push({key:'feedtypes', label:'No fodder types added yet', settingsSection:'feedtypes'});
  }
  if(!activeCabinetItems().length){
    issues.push({key:'medtypes', label:'Medicine Cabinet is empty', settingsSection:'medtypes'});
  }
  if(farmSettings.use_ai===true && !farmSettings.groq_api_key){
    issues.push({key:'aikey', label:'AI is turned on but no API key is set', settingsSection:'useai'});
  }
  return issues;
}
// Stuck sync entries (10+ failed attempts — see SYNC_STUCK_THRESHOLD),
// surfaced the same way as any other outstanding issue rather than
// sitting invisibly in the queue forever. discardable is false for the
// handful of tables discardStuckSyncEntry() won't touch (animals, farm
// settings, user settings) — those still show up here so they're not
// missed, just without a delete action attached.
function syncIssues(){
  return stuckSyncEntries().map(e=>({
    key:e.key, label:e.label, attempts:e.attempts,

  }));
}

  {key:'easy', label:'Easy', color:'green'},

  {key:'caesarean', label:'Caesarean', color:'red'},

const MOTHERING_ABILITY_OPTIONS=[
  {key:'excellent', label:'Excellent', color:'green'},

function lastBreedingRecord(animalId, field){
  return breedingRecords.filter(r=>r.animal_id===animalId && r.field===field).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0] || null;
}
// Breeding-tile colour/warning logic, driven by the animal's own past
// birthing ease / mothering ability ratings — worst-signal-wins ordering.
function breedingTileStatus(a){
  const easeRec=lastBreedingRecord(a.id,'birthing_ease');
  const motherRec=lastBreedingRecord(a.id,'mothering_ability');
  const easeColor = easeRec ? (BIRTHING_EASE_OPTIONS.find(o=>o.key===easeRec.value)||{}).color : null;
  const motherColor = motherRec ? (MOTHERING_ABILITY_OPTIONS.find(o=>o.key===motherRec.value)||{}).color : null;

  if(a.offspring_status==='pregnant'){
    if(easeColor==='red') return {color:'var(--red)', warn:true};
    if(easeColor==='amber') return {color:'var(--amber)', warn:true};
    return {color:'var(--green)', warn:false}; // green if 'green' or if never recorded — no known problem
  }
  if(a.offspring_status==='with_offspring'){
    if(motherColor==='red') return {color:'var(--red)', warn:true};
    if(motherColor==='amber') return {color:'var(--amber)', warn:true};
    return {color:'var(--green)', warn:false}; // green if 'green' or if never recorded — no known problem
  }
  // neither pregnant nor with offspring — a general caution based on past record
  const hasRed = easeColor==='red' || motherColor==='red';
  const hasAmber = easeColor==='amber' || motherColor==='amber';
  if(hasRed) return {color:'var(--red)', warn:false};
  if(hasAmber) return {color:'var(--amber)', warn:false};
  return {color:null, warn:false};
}

function monthLabel(d){ return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'}); }
// Simple inline SVG multi-line chart — used for the Feed cost report's
// past-12-months-by-fodder-type breakdown. No external charting library.
function renderMultiLineChart(labels, series){
  const w=320, h=170, padL=30, padR=8, padT=10, padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const maxVal=Math.max(1, ...series.flatMap(s=>s.values));
  const n=labels.length;
  const xFor=(i)=> padL + (n<=1?0:(i/(n-1))*plotW);
  const yFor=(v)=> padT + plotH - (v/maxVal)*plotH;
  const colors=['#1a8a4a','#c98400','#b3261e','#2f6fed','#8a3ea1','#c2185b','#00838f','#6d4c41'];
  const gridLines=[0,0.5,1].map(f=>{
    const y=padT+plotH-f*plotH;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e5e5e5" stroke-width="1"/><text x="${padL-4}" y="${y+3}" font-size="7" fill="#767462" text-anchor="end">${fmtGBP(maxVal*f,0)}</text>`;
  }).join('');
  const xLabels=labels.map((lb,i)=>{
    if(n>8 && i%2!==0 && i!==n-1) return '';
    return `<text x="${xFor(i)}" y="${h-6}" font-size="7.5" fill="#767462" text-anchor="middle">${lb.split(' ')[0]}</text>`;
  }).join('');
  const lines=series.map((s,si)=>{
    const color=colors[si%colors.length];
    const pts=s.values.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
    const dots=s.values.map((v,i)=>`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="2.2" fill="${color}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const legend=series.map((s,si)=>{
    const color=colors[si%colors.length];
    return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;margin-bottom:4px;"><span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;flex-shrink:0;"></span><span style="font-size:11px;color:var(--ink);">${escapeHtml(s.type)}</span></span>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
      ${gridLines}
      ${lines}
      ${xLabels}
    </svg>
    <div style="display:flex;flex-wrap:wrap;margin-top:6px;">${legend}</div>`;
}
// Compact snapshot of the farm's local data, handed to the "Ask" feature as
// context. Deliberately current-state summaries rather than full history
// (no per-record event logs) to keep this a reasonable size regardless of
// herd size — the model reasons over "what's true now", not the whole
// timeline. Works fully offline since it only reads what's already in
// local storage.
function buildFarmDataContext(){
  const animalsData = animals.map(a=>{
    const lw=lastWeightRecord(a.id);
    const wd=activeWithdrawal(a.id);
    const openInj=worstOpenInjury(a);
    const mother=a.mother_id?animals.find(x=>x.id===a.mother_id):null;
    const father=a.father_id?animals.find(x=>x.id===a.father_id):null;
    return {
      name_or_tag: animalDisplayName(a),
      tag_number: a.tag_number,
      name: a.name||null,
      eid: a.eid||null,
      breed: breedName(a.breed_id),
      sex: a.sex==='F'?'female':'male',
      status: a.status,
      birth_date: a.birth_date ? a.birth_date.slice(0,10) : null,
      purchase_price_gbp: a.purchase_price!=null ? a.purchase_price : null,
      last_weight_kg: lw ? lw.weight_kg : null,
      last_weight_date: lw ? lw.recorded_at.slice(0,10) : null,
      last_bcs_1to5: lw ? lw.bcs : null,
      currently_in_medicine_withdrawal_until: wd ? wd.withdrawal_until.slice(0,10) : null,
      open_injury: openInj ? { body_part: openInj.body_part, severity_1to5: openInj.severity } : null,
      mother: mother ? animalDisplayName(mother) : null,
      father: father ? animalDisplayName(father) : null,
    };
  });
  const totalFeedCostGbp = +feedRecords.filter(r=>!r.deleted_at).reduce((s,r)=>s+feedRecordCost(r),0).toFixed(2);
  const totalMedicineCostGbp = +medicineRecords.reduce((s,r)=>s+(r.cost||0),0).toFixed(2);
  const movesSummary = moveRecords.map(r=>({
    date:r.date, direction:r.direction, location:r.location, animal_count:r.animal_ids.length, reported_to_bcms:!!r.bcms_reported,
  }));
  return {
    today: todayStr(),
    farm: {
      cph: farmSettings.cph||null,
      // What the farmer's told us about the farm itself (Settings > Farm details)
      details: farmDetails.map(d=>({ type:d.category, name:d.name, details:d.details||'' })),
    },
    animal_count: animals.length,
    animals: animalsData,
    totals: { feed_cost_gbp_alltime: totalFeedCostGbp, medicine_cost_gbp_alltime: totalMedicineCostGbp },
    moves: movesSummary,
    breeds_in_use: [...new Set(animalsData.map(a=>a.breed))],
  };
}
function reportVetSpendByMonth(monthsBack=6){
  const now=new Date(); const result=[];
  for(let m=0;m<monthsBack;m++){
    const d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    const total=medicineRecords.filter(r=>{
      if(r.cost==null) return false;
      const fv=farmersVets.find(p=>p.id===r.farmer_vet_id);
      if(!fv||fv.role!=='vet') return false;
      const rd=new Date(r.administered_at);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
    }).reduce((s,r)=>s+r.cost,0);
    result.push({label:monthLabel(d), total});
  }
  return result;
}
// Actual realised gain/loss per month, from animals actually sold, died,
// swapped or stolen — as opposed to the ROI/Livestock Value reports, which
// are estimates against animals still on the farm. Only animals with a
// recorded exit value count (set when the animal was marked as exited —
// see the exit modal); older records made before that field existed won't
// have one and are simply skipped, not treated as zero.
function reportRealizedByMonth(monthsBack=6){
  const now=new Date(); const result=[];
  for(let m=0;m<monthsBack;m++){
    const d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    const exited=animals.filter(a=>{
      if(a.realized_value==null || !a.realized_value_date) return false;
      const rd=new Date(a.realized_value_date);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
    });
    result.push({label:monthLabel(d), total:exited.reduce((s,a)=>s+a.realized_value,0), animals:exited});
  }
  return result;
}
function reportFeedCostByMonth(monthsBack=6, typeFilter=null){
  const now=new Date(); const result=[];
  for(let m=0;m<monthsBack;m++){
    const d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    const total=feedRecords.filter(r=>{
      if(r.deleted_at) return false;
      if(typeFilter && r.feed_type!==typeFilter) return false;
      const rd=new Date(r.start_date);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
    }).reduce((s,r)=>s+feedRecordCost(r),0);
    result.push({label:monthLabel(d), total});
  }
  return result;
}
// Past 12 months, one cost total per fodder type per month — feeds the
// multi-line chart on the Feed cost report. typeFilter restricts both
// which types get their own line AND which records count at all, so the
// chart and the month-by-month totals/list below it always agree.
function reportFeedCostByTypeMonth(monthsBack=12, typeFilter=null){
  const now=new Date();
  const months=[];
  for(let m=monthsBack-1;m>=0;m--) months.push(new Date(now.getFullYear(), now.getMonth()-m, 1));
  const live=feedRecords.filter(r=>!r.deleted_at && (!typeFilter || r.feed_type===typeFilter));
  const types=[...new Set(live.map(r=>r.feed_type))].sort();
  const series=types.map(type=>({
    type,
    values: months.map(d=>live.filter(r=>{
      if(r.feed_type!==type) return false;
      const rd=new Date(r.start_date);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
    }).reduce((s,r)=>s+feedRecordCost(r),0)),
  }));
  return {labels:months.map(monthLabel), series};
}
function reportLivestockValue(){
  const active=animals.filter(a=>a.status==='active');
  let total=0; const byBreed={};
  active.forEach(a=>{
    const mv=marketValue(a)||0;
    total+=mv;
    const bn=breedName(a.breed_id);
    byBreed[bn]=(byBreed[bn]||0)+mv;
  });
  return {total, count:active.length, byBreed};
}
function reportROI(){
  const active=animals.filter(a=>a.status==='active');
  let totalCostSum=0, totalValue=0; const rows=[];
  active.forEach(a=>{
    const mv=marketValue(a);
    if(mv==null) return;
    const cost=totalCost(a);
    totalCostSum+=cost; totalValue+=mv;
    rows.push({a, cost, value:mv, roi: cost>0?((mv-cost)/cost*100):null});
  });
  rows.sort((x,y)=>(y.roi==null?-999:y.roi)-(x.roi==null?-999:x.roi));
  return {totalCost:totalCostSum, totalValue, roiPct: totalCostSum>0?((totalValue-totalCostSum)/totalCostSum*100):null, rows};
}
function reportAnimalsToSell(recommend){
  const active=animals.filter(a=>a.status==='active');
  const scored=active.map(a=>{
    const hs=healthScore(a);
    const months=ageMonths(a.birth_date);
    const {min:minP, max:maxP}=breedPrimeAge(a.breed_id);
    const isPrime = months!=null && months>=minP && months<=maxP;
    const breeding = a.offspring_status==='pregnant'||a.offspring_status==='with_offspring';
    const profit=estimatedProfit(a);
    return {a, hs, isPrime, breeding, profit, months};
  });
  if(recommend){
    return scored.filter(s=>s.isPrime && s.hs.color!=='red' && !s.breeding && s.profit!=null && s.profit>0)
      .sort((x,y)=>(y.profit||0)-(x.profit||0));
  }
  return scored.filter(s=>!s.isPrime || s.breeding || s.hs.color==='red')
    .sort((x,y)=>x.months-y.months);
}

function worstOpenInjury(a){

function herdFlags(){
  const active=animals.filter(a=>a.status==='active');
  const byName=(a,b)=>animalDisplayName(a).localeCompare(animalDisplayName(b));
  const flags=[];
  const notWeighedCutoff=60;
  const notWeighed=active.filter(a=>{
    const lw=lastWeightRecord(a.id);
    if(!lw) return true;
    return (new Date()-new Date(lw.recorded_at))/86400000 > notWeighedCutoff;
  }).sort((a,b)=>{
    const lwA=lastWeightRecord(a.id), lwB=lastWeightRecord(b.id);
    const tA = lwA ? new Date(lwA.recorded_at).getTime() : -Infinity; // never weighed = most overdue = first
    const tB = lwB ? new Date(lwB.recorded_at).getTime() : -Infinity;
    return tA-tB || byName(a,b);
  });
  if(notWeighed.length) flags.push({key:'notweighed', label:'Unweighed 60+ days', count:notWeighed.length, color:'amber', animals:notWeighed, muted:!!userSettings.mute_weighing_notification});

  const redHealth=active.filter(a=>healthScore(a).color==='red')
    .sort((a,b)=>healthScore(a).total-healthScore(b).total || byName(a,b));
  if(redHealth.length) flags.push({key:'redhealth', label:'Health score is Red', count:redHealth.length, color:'red', animals:redHealth});

  const decliningWeight=active.filter(a=>{
    const b=healthScore(a).breakdown.find(x=>x.label==='Weight trend');
    return b && (b.note==='Rapid decrease' || b.note==='Slight decrease');
  }).sort(byName);
  if(decliningWeight.length) flags.push({key:'declining', label:'Weight trending down', count:decliningWeight.length, color:'amber', animals:decliningWeight});

  const now=new Date();
  const inWithdrawal=active.filter(a=>medicineRecords.some(r=>r.animal_id===a.id && new Date(r.withdrawal_until)>=now))
    .sort((a,b)=>new Date(activeWithdrawal(a.id).withdrawal_until)-new Date(activeWithdrawal(b.id).withdrawal_until) || byName(a,b));
  if(inWithdrawal.length) flags.push({key:'withdrawal', label:'In medicine withdrawal', count:inWithdrawal.length, color:'red', animals:inWithdrawal});

  const tbOverdueAnimals=active.filter(a=>tbTestOverdue(a.id)).sort(byName);
  if(tbOverdueAnimals.length) flags.push({key:'tboverdue', label:'TB test overdue or missing', count:tbOverdueAnimals.length, color:'red', animals:tbOverdueAnimals});

  const tbDueSoonAnimals=active.filter(a=>tbTestDueSoon(a.id))
    .sort((a,b)=>tbTestDueDate(a.id)-tbTestDueDate(b.id) || byName(a,b));
  if(tbDueSoonAnimals.length) flags.push({key:'tbduesoon', label:'TB test due within '+TB_DUE_SOON_WARNING_DAYS+' days', count:tbDueSoonAnimals.length, color:'amber', animals:tbDueSoonAnimals});

  const openInjury=active.filter(a=>injuryRecords.some(r=>r.animal_id===a.id && !r.resolved_at))
    .sort((a,b)=>{
      const sA=worstOpenInjury(a), sB=worstOpenInjury(b);
      const lvA = sA && sA.severity!=null ? sA.severity : -1;
      const lvB = sB && sB.severity!=null ? sB.severity : -1;
      return lvB-lvA || byName(a,b);
    });
  if(openInjury.length) flags.push({key:'openinjury', label:'Open injury', count:openInjury.length, color:'red', animals:openInjury});

  const breedingWarning=active.filter(a=>{
    if(a.offspring_status!=='pregnant' && a.offspring_status!=='with_offspring') return false;
    return breedingTileStatus(a).warn;
  }).sort((a,b)=>{
    const cA=breedingTileStatus(a).color, cB=breedingTileStatus(b).color;
    const rank=(c)=> c==='var(--red)' ? 0 : 1; // red worse than amber
    return rank(cA)-rank(cB) || byName(a,b);
  });
  if(breedingWarning.length) flags.push({key:'breedingwarning', label:'Pregnant/with calf \u2014 birthing or mothering concern', count:breedingWarning.length, color:'red', animals:breedingWarning});

  // An animal whose most recent move (by when it was logged, same as the
  // Move tile's own on/off colour) was OFF the farm and hasn't since had a
  // later move back ON — i.e. still out, whether at market, on someone
  // else's ground, or wherever else it went. This is informational
  // (amber), not a fault to fix, so it's last in the list.
  const offFarm=active.filter(a=>{
    const lm=lastMoveForAnimal(a.id);
    return lm && lm.direction==='off';
  }).sort(byName);
  if(offFarm.length) flags.push({key:'offfarm', label:'Off-farm animals', count:offFarm.length, color:'amber', animals:offFarm});

  return flags;
}

// Everything logged against "today" across the whole farm, for the Done
// Today report. Deliberately uses each record's own event-date field
// (recorded_at / administered_at / date / created_at / start_date) rather
// than a separate "logged at" timestamp, since the app doesn't keep one —
// this matches how every other report already treats these dates (e.g.
// Vet spend groups medicineRecords by administered_at). In the very common
// case of backdating an entry (logging a weigh-in a day late, say), that
// entry counts on the day it happened rather than the day it was typed in.
// NOTE: none of these records currently store WHICH farm hand logged them
// — only a device-level "current user" switch that isn't stamped onto
// individual records — so this can show WHAT got done today, not WHO on
// the team did it. Per-person attribution would need a separate change to
// stamp currentFarmerId onto every record type at creation time.
// farmerFilter: null/undefined = show everyone (default); '__admin__' = only
// entries with no farmer_id (created before this device had someone logged
// in, or under the shared "Admin" profile); otherwise a specific farmer's id.
function todaysActivity(farmerFilter){
  const t=todayStr();
  const matches=(rec)=>{
    if(farmerFilter==null) return true;
    if(farmerFilter==='__admin__') return !rec.farmer_id;
    return rec.farmer_id===farmerFilter;
  };
  const weighToday = weights.filter(w=>sameDay(w.recorded_at,t) && matches(w)).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at));
  const moveRecordsToday = moveRecords.filter(r=>r.date===t && matches(r));
  const movedAnimalIds = [...new Set(moveRecordsToday.flatMap(r=>r.animal_ids||[]))];
  const medToday = medicineRecords.filter(r=>sameDay(r.administered_at,t) && matches(r)).sort((a,b)=>new Date(b.administered_at)-new Date(a.administered_at));
  const injuryToday = injuryRecords.filter(r=>sameDay(r.recorded_at,t) && matches(r)).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at));
  const damageToday = damageRecords.filter(r=>sameDay(r.created_at,t) && matches(r)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const feedToday = feedRecords.filter(r=>!r.deleted_at && r.start_date===t && matches(r));
  const addedToday=[], exitedToday=[];
  animals.forEach(a=>{
    (events[a.id]||[]).forEach(ev=>{
      if(!sameDay(ev.created_at,t) || !matches(ev)) return;
      if(ev.event_type==='created') addedToday.push(a);
      else if(['sold','died','stolen','swapped'].includes(ev.event_type)) exitedToday.push({a, status:ev.event_type, farmer_id:ev.farmer_id});
    });
  });
  return {weighToday, moveRecordsToday, movedAnimalIds, medToday, injuryToday, damageToday, feedToday, addedToday, exitedToday};
}

// =====================================================================
// Farm Opportunities / Farm Intelligence (Reports > Insights)
// =====================================================================
// Looks at everything aBC already knows about the farm and asks Groq to
// find opportunities the farmer may not have considered: funding, savings,
// productivity, animal health, environment, compliance and anything else.
//
// Deliberately split into a UI-free engine — analyseFarmOpportunities() —
// so the same thing can later drive scheduled checks, "What's new?",
// application drafting, notifications etc. Nothing about any particular
// scheme is hard-coded here; it all comes from live research each run.
//
// Two Groq calls per run:
//   1. RESEARCH  — groq/compound (built-in web search). Returns research
//      notes plus the pages it actually looked at.
//   2. STRUCTURE — gpt-oss-120b with a strict JSON schema, turning farm
//      data + research into opportunity cards.
// Then plain code checks the result: any source link that wasn't among the
// pages the search actually found is removed (never trust a model-typed
// URL), statuses are forced to the four allowed values, "% chance"
// wording is stripped, and the list is capped.
// If web search isn't available on the key, it still runs step 2 on the
// model's own knowledge — clearly flagged, with no sources shown.
let farmOpportunitiesLatest=null; // latest saved run for this farm: {id, created_at, created_by_name, web_research, models, location, result}
let oppRunning=false, oppProgress='', oppError=null, oppStartedAt=null;
let oppOpen=null; // {id, section:'why'|'todo'}
let oppShowLow=false;

const OPP_STATUS={
  strong_match:{label:'Strong match', color:'var(--green)', rank:0},
  potential_match:{label:'Potential match', color:'var(--amber)', rank:1},
  needs_more_information:{label:'Needs more info', color:'var(--grey)', rank:2},
  low_relevance:{label:'Low relevance', color:'var(--grey-light)', rank:3},
};
const OPP_CATEGORIES=['funding','save_money','productivity','animal_health','environment','compliance','diversification','other'];
// Best fit for whatever category text the model actually returned. The
// smaller fallback model (used when the strict json_schema request isn't
// available) doesn't always send back the exact enum word (e.g. "Grant"
// instead of "funding"), so an exact-match-only check was quietly dumping
// almost everything into "other". Tries an exact match first, then a
// keyword guess, in a fixed priority order so an ambiguous word (e.g.
// "cost of poor health") lands somewhere sensible rather than the last
// pattern that happened to match.
// Same reasoning as normaliseOppCategory just above — the smaller
// fallback model doesn't always send back the exact enum word here either,
// which is why every "+ Add" suggestion was landing in Other regardless
// of what it was actually about.
function normaliseFarmDetailCategory(raw){
  const c=String(raw||'').trim().toLowerCase();
  if(['field','building','machinery','other','none'].includes(c)) return c;
  const tests=[
    ['field', /field|land|acre|pasture|grazing|soil|paddock/],
    ['building', /building|barn|shed|structure|housing|roof/],
    ['machinery', /machin|tractor|equipment|vehicle|trailer|quad|crush/],
    ['other', /./], // anything else that isn't clearly "none" still gets a place to add it, rather than being dropped
  ];
  for(const [cat,re] of tests){ if(re.test(c)) return cat; }
  return 'none';
}
function normaliseOppCategory(raw){
  const c=String(raw||'').trim().toLowerCase();
  if(OPP_CATEGORIES.includes(c)) return c;
  const tests=[
    ['funding', /fund|grant|subsid|payment scheme|capital (grant|item)/],
    ['animal_health', /health|welfare|vet|disease|injur|\btb\b|tubercul|medicine|treatment/],
    ['environment', /environ|biodivers|soil|water|habitat|hedge|woodland|carbon|climate|renewable|energy/],
    ['compliance', /complian|legal|record|report|regulat|inspection/],
    ['diversification', /divers|new (income|business|revenue)|rural business|tourism|let/],
    ['save_money', /sav(e|ing)|cost|expense|reduc/],
    ['productivity', /product|effic|weight|yield|growth|perform|gain/],

// ---- 1. Where is the farm? ----
// Coordinates -> country/county/council via postcodes.io (free, no key,
// works from the phone). Country matters most: England, Scotland, Wales
// and NI run completely different schemes.
async function reverseGeocodeFarm(){
  const loc=normaliseFarmLocation(farmSettings.farm_location);
  if(!loc) return {known:false, note:'No farm location recorded in aBC.'};
  if(typeof loc==='string') return {known:true, source:'text entered by the farmer', description:loc};
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), 8000);
    const r=await fetch('https://api.postcodes.io/postcodes?lon='+encodeURIComponent(loc.lng)+'&lat='+encodeURIComponent(loc.lat)+'&limit=1&widesearch=true', {signal:ctl.signal});
    clearTimeout(t);
    const j=await r.json();
    const p=j && j.result && j.result[0];
    if(!p) return {known:true, source:'coordinates only (no nearby postcode found)', latitude:loc.lat, longitude:loc.lng};
    return {known:true, source:'nearest postcode to the recorded coordinates (postcodes.io)',
      country:p.country||null, region:p.region||null, county:p.admin_county||null, local_authority:p.admin_district||null,
      parish:p.parish||null, postcode_district:p.outcode||null, latitude:loc.lat, longitude:loc.lng};
  }catch(e){
    return {known:true, source:'coordinates only (location lookup failed)', latitude:loc.lat, longitude:loc.lng};
  }
}

// A summary built for this purpose — patterns and totals rather than a line
// per animal (keeps it small enough for Groq's free tier), and nothing

function attentionCoveredTopics(){
  const items=[];
  herdFlags().forEach(f=>{ if(!f.muted && f.count) items.push(f.label+' ('+f.count+' animal'+(f.count===1?'':'s')+')'); });
  const bcms=outstandingBcmsItems().length; if(bcms) items.push('BCMS birth/death reporting overdue ('+bcms+')');
  medicineCabinetAttentionGroups().forEach(g=>{ items.push('Medicine Cabinet: '+g.label+' ('+g.count+')'); });
  systemSettingsIssues().forEach(i=>{ items.push(i.label); });
  syncIssues().forEach(()=>{ if(!items.includes('Some records haven\u2019t synced yet')) items.push('Some records haven\u2019t synced yet'); });
  return items;
}
function buildOpportunityFarmContext(location){

  const ctx={ today: todayStr(), location, notes_on_this_data:[
    'Everything below is recorded in the farmer\u2019s aBC app (KNOWN). Anything not listed is UNKNOWN \u2014 not zero or absent.',
    'Figures cover what has been entered in aBC, which may not be the whole farm or its whole history.'
  ]};
  try{
    const active=animals.filter(a=>a.status==='active');
    const groups={};
    active.forEach(a=>{
      const b=breeds.find(x=>x.id===a.breed_id);

      const g=groups[key]||(groups[key]={breed:key, species:(b&&b.species)||'cattle', count:0, female:0, male:0, age_under_12m:0, age_12_to_24m:0, age_over_24m:0, age_unknown:0, w:[], bcs:[], adg:[]});
      g.count++; if(a.sex==='F') g.female++; else g.male++;
      const m=a.birth_date?(now-new Date(a.birth_date))/(30.44*DAY):null;
      if(m==null) g.age_unknown++; else if(m<12) g.age_under_12m++; else if(m<24) g.age_12_to_24m++; else g.age_over_24m++;
      const ws=weights.filter(w=>w.animal_id===a.id && w.weight_kg!=null).sort((x,y)=>new Date(x.recorded_at)-new Date(y.recorded_at));
      if(ws.length) g.w.push(ws[ws.length-1].weight_kg);
      const lw=lastWeightRecord(a.id); if(lw && lw.bcs!=null) g.bcs.push(lw.bcs);
      const recent=ws.filter(w=>new Date(w.recorded_at)>=new Date(now-180*DAY));
      if(recent.length>=2){
        const days=(new Date(recent[recent.length-1].recorded_at)-new Date(recent[0].recorded_at))/DAY;
        if(days>=14) g.adg.push((recent[recent.length-1].weight_kg-recent[0].weight_kg)/days);
      }
    });
    ctx.livestock={
      active_animals:active.length,
      groups:Object.values(groups).map(g=>{
        const mean=avg(g.adg);

          age_under_12m:g.age_under_12m, age_12_to_24m:g.age_12_to_24m, age_over_24m:g.age_over_24m, age_unknown:g.age_unknown,
          animals_with_a_weight:g.w.length, avg_latest_weight_kg:avg(g.w),
          animals_with_bcs:g.bcs.length, avg_bcs_1to5:avg(g.bcs), bcs_below_2_5:g.bcs.filter(x=>x<2.5).length, bcs_above_4:g.bcs.filter(x=>x>4).length,
          animals_with_gain_data_last_180d:g.adg.length, avg_daily_gain_kg_last_180d:round(mean,3),
          lowest_daily_gain_kg:g.adg.length?round(Math.min(...g.adg),3):null, highest_daily_gain_kg:g.adg.length?round(Math.max(...g.adg),3):null,
          animals_gaining_under_half_group_average: (mean && mean>0) ? g.adg.filter(x=>x<mean/2).length : null };
      }),

      active_animals_not_weighed_in_60_days: active.filter(a=>{ const lw=lastWeightRecord(a.id); return !lw || (now-new Date(lw.recorded_at))/DAY>60; }).length,
    };
  }catch(e){ ctx.livestock={error:'could not summarise livestock'}; }
  try{
    const meds=medicineRecords.filter(r=>inLastYear(r.administered_at) && !tbRecordKind(r));
    const byReason={}, byProduct={}, perAnimal={};
    meds.forEach(r=>{
      const reason=medReasonLabel(r.reason); byReason[reason]=(byReason[reason]||0)+1;
      const p=r.product_name||'Unnamed'; const bp=byProduct[p]||(byProduct[p]={product:p, treatments:0, cost_gbp:0}); bp.treatments++; bp.cost_gbp+= (r.cost||0);
      perAnimal[r.animal_id]=(perAnimal[r.animal_id]||0)+1;
    });
    const vetCost=meds.filter(r=>{ const fv=farmersVets.find(p=>p.id===r.farmer_vet_id); return fv && fv.role==='vet'; }).reduce((s,r)=>s+(r.cost||0),0);
    ctx.animal_health_last_12_months={
      treatments:meds.length, treatment_cost_gbp:round(meds.reduce((s,r)=>s+(r.cost||0),0)), of_which_given_by_vet_gbp:round(vetCost),
      treatments_by_reason:byReason,
      top_products:Object.values(byProduct).sort((a,b)=>b.treatments-a.treatments).slice(0,5).map(p=>({...p, cost_gbp:round(p.cost_gbp)})),
      animals_treated_3_or_more_times:Object.values(perAnimal).filter(n=>n>=3).length,
      injuries_recorded:injuryRecords.filter(r=>inLastYear(r.created_at||r.recorded_at||r.date)).length,
      animals_with_open_injury:animals.filter(a=>a.status==='active' && worstOpenInjury(a)).length,
      tb_testing_interval_months:tbTestIntervalMonths(),
      active_animals_tb_test_overdue:animals.filter(a=>a.status==='active' && tbTestOverdue(a.id)).length,

  }catch(e){ ctx.animal_health_last_12_months={error:'could not summarise'}; }
  try{
    const exits=animals.filter(a=>a.status!=='active' && inLastYear(a.realized_value_date));
    const byStatus={}; exits.forEach(a=>{ byStatus[a.status]=(byStatus[a.status]||0)+1; });
    ctx.sales_and_losses_last_12_months={ animals_leaving_by_reason:byStatus,
      realised_profit_loss_gbp:round(exits.reduce((s,a)=>s+(a.realized_value||0),0)),
      animals_leaving_before_aBC_recorded_a_value:'not included' };
    const feed12=feedRecords.filter(r=>!r.deleted_at && inLastYear(r.purchased_at||r.date||r.created_at));
    ctx.costs_last_12_months={ fodder_gbp:round(feed12.reduce((s,r)=>s+feedRecordCost(r),0)),
      fodder_types:[...new Set(feed12.map(r=>{ const t=feedTypes.find(x=>x.id===r.feed_type_id); return t?t.name:null; }).filter(Boolean))].slice(0,10) };
    const br=breedingRecords.filter(r=>inLastYear(r.date||r.created_at)); const brBy={}; br.forEach(r=>{ brBy[r.field]=(brBy[r.field]||0)+1; });
    ctx.breeding_records_last_12_months=brBy;
    const mv=moveRecords.filter(r=>inLastYear(r.date));

    const firstDates=[...weights.map(w=>w.recorded_at), ...medicineRecords.map(r=>r.administered_at)].filter(Boolean).sort();
    ctx.aBC_records_start=firstDates.length?firstDates[0].slice(0,10):null;
  }catch(e){}
  ctx.already_shown_elsewhere_in_app = attentionCoveredTopics();
  ctx.farm_details_entered_by_farmer = farmDetails.map(d=>({ ref:d.id, type:d.category, name:d.name, details:d.details||'' }));
  if(!farmDetails.length) ctx.farm_details_entered_by_farmer_note='The farmer has not described any fields, buildings, machinery or other resources yet \u2014 land, soil, buildings, hedges etc. are all UNKNOWN.';
  return ctx;
}

// ---- Groq transport for this feature ----
// Like callGroq, but returns the whole response (needed for the search
// results compound used) and can try a richer request then a simpler one
// on a 400 (e.g. strict JSON schema not supported by that model).
async function groqChatWithFallbacks(models, makeBodies, timeoutMs){
  const apiKey=farmSettings.groq_api_key;
  if(!apiKey) throw new Error('No Groq API key set');
  let lastErr;
  for(const model of models){
    const bodies=makeBodies(model);
    for(let i=0;i<bodies.length;i++){
      const controller=new AbortController();
      const tid=setTimeout(()=>controller.abort(), timeoutMs);
      let resp;
      try{
        resp=await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+apiKey},
          body:JSON.stringify(bodies[i]), signal:controller.signal });
      }catch(e){
        clearTimeout(tid);
        lastErr = e.name==='AbortError' ? Object.assign(new Error(model+' took longer than '+Math.round(timeoutMs/1000)+'s'),{status:'timeout'}) : e;
        if(e.name!=='AbortError') throw lastErr;
        break; // next model
      }
      clearTimeout(tid);
      if(resp.ok) return {model, json:await resp.json()};
      const txt=await resp.text().catch(()=> '');
      lastErr=Object.assign(new Error('Groq ('+model+') '+resp.status+': '+txt.slice(0,220).trim()), {status:resp.status});
      if(resp.status===401 || resp.status===403) throw lastErr;
      if(resp.status===400 && i<bodies.length-1) continue; // try the simpler request
      break; // 404/413/429/5xx/400: next model
    }
  }
  throw lastErr;
}
function extractUrls(text){
  const out=new Set();
  (String(text||'').match(/https?:\/\/[^\s"'<>\)\]\\]+/g)||[]).forEach(u=>out.add(u.replace(/[.,;:]+$/,'')));
  return [...out];
}
function normUrl(u){ try{ const x=new URL(u); return (x.hostname.replace(/^www\./,'')+x.pathname.replace(/\/+$/,'')).toLowerCase(); }catch(e){ return null; } }

      properties:{ item:{type:'string'}, why:{type:'string'}, farm_detail_category:{type:'string', enum:['field','building','machinery','other','none']} }}},
    opportunities:{type:'array', items:{type:'object', additionalProperties:false,
      required:['title','category','section','status','summary','why_relevant','known_farm_evidence','inferred','unknown_or_missing','potential_benefit','estimated_value','estimated_value_basis','actions','source_name','source_url','source_date','confidence','requires_official_confirmation','involves_application'],
