// ---- The engine ----
// farmContext: from buildOpportunityFarmContext(). opts.onProgress(text).
// Resolves {result, webResearch, models, researchUrls}.
async function analyseFarmOpportunities(farmContext, opts){
  opts=opts||{};
  const progress=t=>{ if(opts.onProgress) opts.onProgress(t); };
  const ctxJson=JSON.stringify(farmContext);
  const where=farmContext.location && (farmContext.location.country || farmContext.location.description) || 'unknown (no location recorded)';
  const models=[];

  // Step 1: research with web search.
  progress('Searching for current schemes and opportunities\u2026 this usually takes 30\u201390 seconds');
  let research='', researchUrls=[], webResearch=false, researchDiag=null;
  try{
    const researchPrompt=
`You are an experienced UK agricultural adviser researching opportunities for ONE specific livestock farm. Today is ${farmContext.today}.
Farm jurisdiction: ${where}. Do NOT assume schemes from one UK nation apply in another (England, Scotland, Wales and Northern Ireland differ). Do not invent geographic eligibility.

FARM DATA (the farmer's own records; anything not listed is unknown):
${ctxJson}

TASK: Use web search to find CURRENT opportunities (open now, or opening/likely within the next 12 months) relevant to THIS farm. Search broadly \u2014 not just grants: national schemes and payments for land management, environment, capital items, productivity, animal health and welfare; local/regional, county, National Park, protected-landscape, catchment and water-company schemes; energy and renewables; plus practical cost-saving or productivity angles suggested by the farm's own figures. Look for opportunities created by COMBINATIONS of farm facts. Prefer official sources (gov.uk, defra, rural payments agencies, gov.scot, ruralpayments.org, gov.wales, daera-ni.gov.uk, local councils, national parks, official funding bodies); commercial sites only for discovery.
Never put personal identifiers in search queries.

OUTPUT research notes, at most ~500 words \u2014 be concise, this is notes for another AI step, not a report. One short block per finding: name; jurisdiction; open/closed/opening date; who is eligible; key criteria; published payment rates or amounts (only as published); the exact source URL you read; date published/updated if shown. Say plainly when something could not be confirmed.`;
    // groq/compound (and compound-mini) were retired by Groq on 21 Sep
    // 2026 \u2014 requests to them now 404/410 outright. browser_search is
    // Groq's replacement: a built-in tool on the same gpt-oss-120b/20b
    // models this feature already uses for structuring, so no separate
    // model and no extra account access needed. tool_choice:'required'
    // makes sure it actually searches rather than answering from memory
    // and skipping the tool.
    // A plain network error ("Failed to fetch" — the request never even
    // got a response) is worth one automatic retry: this call runs far
    // longer than a normal reply while the model actually browses the
    // web, giving a brief mobile signal drop far more chance to land in
    // the middle of it than a quick request would ever see.
    let r;
    for(let attempt=1; attempt<=2; attempt++){
      try{
        r=await groqChatWithFallbacks(['openai/gpt-oss-120b','openai/gpt-oss-20b'], model=>[
          {model, messages:[{role:'user', content:researchPrompt}], temperature:0.3, max_completion_tokens:1500,
            tools:[{type:'browser_search'}], tool_choice:'required'},
        ], 150000);
        break;
      }catch(e){
        const isNetworkError = /Failed to fetch|NetworkError|Load failed/i.test((e&&e.message)||'');
        if(!isNetworkError || attempt===2) throw e;
        progress('Web search connection dropped \u2014 trying once more\u2026');
      }
    }
    const msg=r.json && r.json.choices && r.json.choices[0] && r.json.choices[0].message || {};

    // executed_tools is Groq's own record of whether the tool actually ran
    // (the model can ignore tool_choice on rare occasions) \u2014 that, not
    // just having a research paragraph, is what \u201creal web research\u201d means.
    webResearch = !!research && Array.isArray(msg.executed_tools) && msg.executed_tools.length>0;
    if(!webResearch){
      researchDiag = 'Groq answered (model '+r.model+') but didn\u2019t actually run a web search this time'+(research?' \u2014 it answered from its own knowledge instead.':'.');
    }
    models.push(r.model);
  }catch(e){
    // A 401/403 here means THIS key can't use the compound/web-search
    // models specifically \u2014 common even on an otherwise-working Groq
    // key, since compound access isn't automatic on every account. That's
    // not the same as the key being bad, so it doesn't abort the whole
    // check \u2014 just carries on without web research. Only a 401/403 from
    // the structuring step below (which every working key can reach)
    // means the key itself is the problem.
    console.warn('Opportunity research step failed, continuing without web research:', e.status, e.message);
    research=''; researchUrls=[]; webResearch=false;
    researchDiag = 'Web search request failed: '+(e.status?'('+e.status+') ':'')+(e.message||String(e));
  }

  // Step 2: structure into opportunity cards.
  progress('Checking what applies to your farm and organising the results\u2026');
  const structurePrompt=
`You are an experienced UK agricultural adviser looking at ONE livestock farm as a whole. Using the farm data and ${webResearch?'the research notes':'your own knowledge (NO current web research was available)'}, identify opportunities the farmer may not have considered and return them in the JSON schema.

RULES \u2014 follow strictly:
- Separate KNOWN (explicitly in the farm data) from INFERRED (your reasonable interpretation) from UNKNOWN (needs confirming). Never present an inference as a fact. E.g. known "280m altitude" \u2192 inferred "may indicate upland characteristics", never "eligible for an upland scheme".
- known_farm_evidence: only facts actually present in the farm data, stated plainly (e.g. "Barn recorded as poor condition, roof leaks"). No invented numbers.
- Status: strong_match = known facts appear to meet the published criteria (still subject to confirmation); potential_match = some match but key eligibility info missing; needs_more_information = could be relevant but aBC lacks the facts; low_relevance = considered but a poor fit.
- NEVER give a percentage or numerical chance of success. NEVER say the farmer will receive funding.
- Money: only use payment rates/amounts that appear in the research notes, and say where from. Otherwise estimated_value = null and potential_benefit describes the benefit in words (labour saved, lower costs, better sale value, reduced risk...). If you estimate, say it is an estimate and give the basis.
- Do NOT restrict to grants. Include opportunities from the farm's own records (e.g. low weight gain in a group, repeat treatments, missing records) and from combinations of facts.
- The farm data's already_shown_elsewhere_in_app list is exactly what the app's own Attention screen is already telling this farmer right now \u2014 things like animals not weighed recently, TB tests overdue, open injuries, or medicine withdrawal. Attention is effectively its own report on those already, so do NOT create an opportunity that just restates one of them (e.g. no "weigh your animals more often" when unweighed animals are already listed there). You MAY use one as supporting evidence for a genuinely different, non-obvious opportunity it points to (e.g. a funding angle, or a cost pattern behind it), but only if the opportunity itself is not that same restated to-do.
- ${webResearch?'source_url MUST be copied exactly from the ALLOWED SOURCE URLS list, or null. source_name = organisation/page name. source_date = date shown in the notes or null.':'No research was available, so source_name, source_url and source_date MUST be null. Phrase any scheme as "check whether it is currently open".'}
- Jurisdiction: ${where}. Never apply one UK nation's scheme to another.
- unknown_or_missing: only information that would materially change THIS opportunity; set farm_detail_category to where the farmer could record it in aBC (field, building, machinery, other) or "none".
- actions: 1\u20134 short, concrete next steps.
- Quality over quantity, and BE CONCISE in every field (this saves your daily quota): at most 6 with section "main" (most relevant, valuable, actionable, current first), up to 2 less-obvious ones with section "other", and up to 2 low_relevance. Keep summary/potential_benefit to one sentence each, and why_relevant/known_farm_evidence/actions to short phrases, not sentences.
- data_gaps: up to 5 pieces of farm information that would most improve future analysis (e.g. total land area, tenancy, soil types) \u2014 only if genuinely missing from the farm data. Never suggest feed rations, feed intake, or anything about fodder \u2014 that's already covered by the app's own Fodder records and out of scope here.
- headline: one friendly sentence summarising what you found.
- Plain UK English a farmer would use. Short sentences.

FARM DATA:
${ctxJson}

${webResearch?'RESEARCH NOTES:\n'+research+'\n\nALLOWED SOURCE URLS:\n'+researchUrls.join('\n'):'RESEARCH NOTES: none available.'}`;
  const r2=await groqChatWithFallbacks(['openai/gpt-oss-120b','openai/gpt-oss-20b'], model=>[
    {model, messages:[{role:'user', content:structurePrompt}], temperature:0.2, max_completion_tokens:3500, reasoning_effort:'medium',
      response_format:{type:'json_schema', json_schema:{name:'farm_opportunities', strict:true, schema:OPP_SCHEMA}}},
    {model, messages:[{role:'user', content:structurePrompt+'\n\nReturn ONLY a JSON object with keys headline, opportunities, data_gaps as described. No other text.'}], temperature:0.2, max_completion_tokens:3500,
      response_format:{type:'json_object'}},
  ], 120000);
  models.push(r2.model);
  const text=r2.json && r2.json.choices && r2.json.choices[0] && r2.json.choices[0].message && r2.json.choices[0].message.content;
  if(!text) throw new Error('Groq returned no results');
  let raw;
  try{ raw=parseAiJson(text); }catch(e){ throw new Error('Groq\u2019s answer couldn\u2019t be read as data'); }
  return { result:validateOpportunities(raw, researchUrls, webResearch), webResearch, models, researchUrls, researchDiag };
}

// ---- Plain-code checks on whatever the model returned ----
function validateOpportunities(raw, researchUrls, webResearch){
  const allowed=new Map(); (researchUrls||[]).forEach(u=>{ const n=normUrl(u); if(n) allowed.set(n,u); });
  const arr=x=>Array.isArray(x)?x.filter(s=>typeof s==='string' && s.trim()).map(s=>s.trim()):[];
  const noOdds=s=>typeof s==='string' ? s.replace(/[^.]*\b\d{1,3}\s*%\s*(chance|likelihood|probability|likely)[^.]*\.?/gi,'').trim() : s;
  const cats=['field','building','machinery','other','none'];
  const opps=(Array.isArray(raw && raw.opportunities)?raw.opportunities:[]).map((o,i)=>{
    if(!o || typeof o!=='object' || !o.title) return null;
    let url=typeof o.source_url==='string'?o.source_url.trim():null, verified=false;
    if(url){
      const n=normUrl(url);
      if(webResearch && n && allowed.has(n)){ url=allowed.get(n); verified=true; }
      else { url=null; }
    }
    return {
      id:'o'+i,
      title:String(o.title).slice(0,120),
      category:normaliseOppCategory(o.category),
      section:o.section==='other'?'other':'main',
      status:OPP_STATUS[o.status]?o.status:'needs_more_information',
      summary:noOdds(o.summary||''),
      why_relevant:arr(o.why_relevant).map(noOdds),
      known_farm_evidence:arr(o.known_farm_evidence),
      inferred:arr(o.inferred).map(noOdds),
      unknown_or_missing:(Array.isArray(o.unknown_or_missing)?o.unknown_or_missing:[]).map(u=>typeof u==='string'?{item:u, farm_detail_category:'none'}:u)
        .filter(u=>u && u.item).map(u=>({item:String(u.item), farm_detail_category:normaliseFarmDetailCategory(u.farm_detail_category)})),
      potential_benefit:noOdds(o.potential_benefit||''),
      estimated_value:(o.estimated_value && String(o.estimated_value).trim())||null,
      estimated_value_basis:(o.estimated_value_basis && String(o.estimated_value_basis).trim())||null,
      actions:arr(o.actions),
      source_name:(webResearch && o.source_name)||null,
      source_url:url, source_verified:verified,
      source_date:(webResearch && o.source_date)||null,
      confidence:['high','medium','low'].includes(o.confidence)?o.confidence:'low',
      requires_official_confirmation:o.requires_official_confirmation!==false,
      involves_application:!!o.involves_application,
    };
  }).filter(Boolean);
  const byRank=(a,b)=>OPP_STATUS[a.status].rank-OPP_STATUS[b.status].rank;
  const low=opps.filter(o=>o.status==='low_relevance').slice(0,2);
  const main=opps.filter(o=>o.status!=='low_relevance' && o.section==='main').sort(byRank).slice(0,6);
  const other=opps.filter(o=>o.status!=='low_relevance' && o.section==='other').sort(byRank).slice(0,2);
  const gaps=(Array.isArray(raw && raw.data_gaps)?raw.data_gaps:[]).map(g=>typeof g==='string'?{item:g, why:'', farm_detail_category:'other'}:g)
    .filter(g=>g && g.item).slice(0,5).map(g=>({item:String(g.item), why:String(g.why||''), farm_detail_category:normaliseFarmDetailCategory(g.farm_detail_category)}));
  return { headline:noOdds(String(raw && raw.headline || '')), opportunities:[...main, ...other, ...low], data_gaps:gaps };
}

// ---- Running it from the app ----
function oppFriendlyError(e){
  const m=(e && e.message)||String(e);
  if(e && (e.status===401 || e.status===403)) return 'Groq rejected the API key. Check it in Settings > Use AI?';
  if(e && e.status===429) return 'Groq\u2019s usage limit for this key has been reached. Wait a minute and try again \u2014 if it keeps happening, the free-tier daily limit may be used up for today.';
  if(e && e.status===413) return 'There was too much farm data to send to Groq in one go on this key\u2019s plan.';
  if(e && e.status==='timeout') return 'Groq took too long to answer. Try again \u2014 web research can be slow at busy times.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Couldn\u2019t reach Groq \u2014 check the phone has signal and try again.';
  return 'Something went wrong: '+m;
}

async function runFarmOpportunities(){

  if(view==='reportDetail' && reportType==='insights') render();
  try{
    const location=await reverseGeocodeFarm();
    const ctx=buildOpportunityFarmContext(location);
    const res=await analyseFarmOpportunities(ctx, {onProgress:setOppProgress});
    const rec={ id:uuid(), created_at:new Date().toISOString(),
      created_by_name:(currentFarmerName&&currentFarmerName!=='Admin')?currentFarmerName:((authUser&&authUser.email)||currentFarmerName||'Admin'),
      web_research:res.webResearch, research_diag:res.researchDiag||null, models:res.models.join(' + '), location, result:res.result };
    farmOpportunitiesLatest=rec;
    await persistAll();
    if(authFarmId) await queuedSync('farm_opportunities:'+rec.id, {table:'farm_opportunities', method:'insert', label:'farm opportunities', payload:{
      id:rec.id, farm_id:authFarmId, created_at:rec.created_at, created_by_name:rec.created_by_name,
      web_research:rec.web_research, research_diag:rec.research_diag, models:rec.models, location:rec.location, result:rec.result }});
    logMsg('Farm opportunities checked \u2014 '+rec.result.opportunities.filter(o=>o.status!=='low_relevance').length+' found'+(rec.web_research?'':' (no web research)')+'.');
  }catch(e){
    oppError=oppFriendlyError(e);
    logMsg('Farm opportunities check failed: '+escapeHtml((e&&e.message)||String(e)));

// ---------- Export farm summary (PDF) ----------
// A plain-English PDF of the farm — for handing to any AI assistant when
// Insights itself can't run (Groq's daily limit used up, or no key set at
// all). Reuses the exact same farm summary Insights builds, just laid out
// as readable prose instead of JSON — same numbers either way. Entirely
// client-side (jsPDF), so it works with no Groq key and no web research.
let pdfExporting=false;
function pdfAddHeading(doc, y, text){
  if(y>270){ doc.addPage(); y=18; }
  doc.setFont(undefined,'bold'); doc.setFontSize(12); doc.setTextColor(30,90,50);
  doc.text(text, 14, y);
  doc.setTextColor(20,20,20);
  return y+7;
}
function pdfAddLines(doc, y, lines, opts){
  opts=opts||{};
  doc.setFont(undefined, opts.bold?'bold':'normal'); doc.setFontSize(opts.size||10);
  const wrapped=doc.splitTextToSize((lines||[]).join('\n')||'\u2014', 182);
  wrapped.forEach(line=>{
    if(y>280){ doc.addPage(); y=18; }
    doc.text(line, 14, y);
    y+=5;
  });
  return y+2;
}
async function buildFarmSummaryPdfBlob(){
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF();
  let location=null;
  try{ location=await reverseGeocodeFarm(); }catch(e){}
  const ctx=buildOpportunityFarmContext(location);
  let y=18;
  doc.setFont(undefined,'bold'); doc.setFontSize(16); doc.setTextColor(30,90,50);
  doc.text('aBC Stockman \u2014 Farm Summary', 14, y); y+=8;
  doc.setTextColor(20,20,20); doc.setFont(undefined,'normal'); doc.setFontSize(10);
  const locText = location && location.country ? [location.local_authority, location.county, location.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ') : (location && location.description) || 'Location not recorded';
  doc.text('Generated '+fmtDateTimeShort(new Date().toISOString())+'  \u2014  '+locText, 14, y); y+=10;

  doc.setFillColor(240,247,242); doc.rect(14,y-4,182,20,'F');
  y=pdfAddLines(doc, y, ['Suggested prompt for whichever AI assistant you paste this into:',
    '\u201cHere is a summary of my UK livestock farm. What funding, savings or improvements might be worth looking into?\u201d'], {size:9});
  y+=4;

  y=pdfAddHeading(doc, y, 'Livestock ('+ctx.livestock.active_animals+' active animals)');
  if(ctx.livestock.groups && ctx.livestock.groups.length){
    ctx.livestock.groups.forEach(g=>{
      y=pdfAddLines(doc, y, [g.breed+' ('+g.species+'): '+g.count+' animals, '+g.female+' female / '+g.male+' male.'+
        ' Ages: '+g.age_under_12m+' under 12mo, '+g.age_12_to_24m+' 12\u201324mo, '+g.age_over_24m+' over 24mo.'+
        (g.avg_latest_weight_kg!=null?' Avg latest weight '+g.avg_latest_weight_kg+'kg ('+g.animals_with_a_weight+' weighed).':' No weights recorded.')+
        (g.avg_bcs_1to5!=null?' Avg BCS '+g.avg_bcs_1to5+'.':'')+
        (g.avg_daily_gain_kg_last_180d!=null?' Avg daily gain (180d) '+g.avg_daily_gain_kg_last_180d+'kg.':'')]);
    });
  } else y=pdfAddLines(doc, y, ['No livestock recorded.']);
  y=pdfAddLines(doc, y, ['Never weighed: '+ctx.livestock.active_animals_never_weighed+'. Not weighed in 60+ days: '+ctx.livestock.active_animals_not_weighed_in_60_days+'.']);

  y=pdfAddHeading(doc, y, 'Animal health (last 12 months)');
  const h=ctx.animal_health_last_12_months;
  y=pdfAddLines(doc, y, [
    'Treatments: '+h.treatments+', total cost \u00a3'+h.treatment_cost_gbp+' (of which \u00a3'+h.of_which_given_by_vet_gbp+' by vet).',
    'By reason: '+Object.entries(h.treatments_by_reason||{}).map(([k,v])=>k+': '+v).join(', ')||'none recorded',
    'Animals treated 3+ times: '+h.animals_treated_3_or_more_times+'. Open injuries: '+h.animals_with_open_injury+'. Injuries recorded: '+h.injuries_recorded+'.',
    'TB testing interval: every '+h.tb_testing_interval_months+' months. Currently overdue: '+h.active_animals_tb_test_overdue+'. In medicine withdrawal: '+h.active_animals_in_medicine_withdrawal+'.',
  ]);

  y=pdfAddHeading(doc, y, 'Sales, losses and costs (last 12 months)');
  const s=ctx.sales_and_losses_last_12_months||{}, c=ctx.costs_last_12_months||{};
  y=pdfAddLines(doc, y, [
    'Animals leaving the farm: '+Object.entries(s.animals_leaving_by_reason||{}).map(([k,v])=>k+': '+v).join(', ')||'none',
    'Realised profit/loss: \u00a3'+(s.realised_profit_loss_gbp!=null?s.realised_profit_loss_gbp:'\u2014'),
    'Fodder cost: \u00a3'+(c.fodder_gbp!=null?c.fodder_gbp:'\u2014')+(c.fodder_types&&c.fodder_types.length?' ('+c.fodder_types.join(', ')+')':''),
  ]);

  y=pdfAddHeading(doc, y, 'Farm details (fields, buildings, machinery, other)');
  if(farmDetails.length){
    FARM_DETAIL_CATEGORIES.forEach(cat=>{
      const items=farmDetails.filter(d=>d.category===cat);
      if(!items.length) return;
      y=pdfAddLines(doc, y, [FARM_DETAIL_TYPES[cat].label+':'], {bold:true});
      items.forEach(d=>{ y=pdfAddLines(doc, y, ['\u2022 '+d.name+(d.details?' \u2014 '+d.details:' (no further detail added)')]); });
    });
  } else {
    y=pdfAddLines(doc, y, ['Nothing added yet \u2014 see Settings > Farm details in the app.']);
  }

  y=pdfAddHeading(doc, y, ' ');
  y=pdfAddLines(doc, y, ['Generated by aBC Stockman. This is a factual summary of the farm\u2019s own records \u2014 it does not include any funding or eligibility assessment.'], {size:8});
  return doc;
}
async function runExportFarmSummary(){
  if(pdfExporting) return;
  if(!(window.jspdf && window.jspdf.jsPDF)){
    showInfoModal('This needs an internet connection the first time it\u2019s used (to load the PDF tool) \u2014 try again once you have signal.');
    return;
  }
  pdfExporting=true; render();
  try{
    const doc=await buildFarmSummaryPdfBlob();
    const fname='aBC-Stockman-Farm-Summary-'+todayStr()+'.pdf';

  }catch(e){
    pdfExporting=false; render();
    showInfoModal('Couldn\u2019t create the PDF: '+((e&&e.message)||String(e)));
  }

    </div>`:''}
    ${todoOpen?`<div style="margin-top:6px;">
      ${x.actions.length?x.actions.map((a,i)=>`<div style="display:flex;gap:8px;font-size:14px;padding:3px 0;"><span style="width:18px;flex-shrink:0;font-weight:800;color:var(--primary);">${i+1}.</span><span style="flex:1;">${escapeHtml(a)}</span></div>`).join(''):'<div style="font-size:13.5px;color:var(--grey);">No specific steps suggested.</div>'}
      ${x.involves_application?`<div style="font-size:12.5px;color:var(--grey);margin-top:6px;">Help preparing the application is coming in a later update.</div>`:''}
    </div>`:''}
  </div>`;
}

function renderReportDetail(){
  const type=reportType;
  let title='Report', body='';
  if(type==='donetoday'){
    title='Done today';
    const d=todaysActivity(reportDoneTodayFarmerFilter);
    const movedCount=d.movedAnimalIds.length;
    const activeFarmersForFilter=farmersVets.filter(p=>p.role==='farmer' && p.active).sort((a,b)=>a.name.localeCompare(b.name));
    const rowsDef=[
      {key:'today-weigh', label:'Weighed / BCS', count:d.weighToday.length, color:'var(--green)'},
      {key:'today-move', label:'Moved', count:movedCount, color:'var(--primary)'},
      {key:'today-med', label:'Medicine given', count:d.medToday.length, color:'var(--red)'},
      {key:'today-injury', label:'Injuries logged', count:d.injuryToday.length, color:'var(--red)'},
      {key:'today-damage', label:'Farm damage logged', count:d.damageToday.length, color:'var(--amber)'},
      {key:'today-feed', label:'Fodder logged', count:d.feedToday.length, color:'var(--amber)'},
      {key:'today-added', label:'Animals added', count:d.addedToday.length, color:'var(--green)'},
      {key:'today-exited', label:'Animals exited', count:d.exitedToday.length, color:'var(--grey)'},
    ];
    const totalToday=rowsDef.reduce((s,r)=>s+r.count,0);
    body=`
      <div class="formrow"><label>Done by</label><div class="formctrl"><select id="doneTodayFarmerFilter">
        <option value="" ${!reportDoneTodayFarmerFilter?'selected':''}>All</option>
        <option value="__admin__" ${reportDoneTodayFarmerFilter==='__admin__'?'selected':''}>Admin (no one logged in)</option>
        ${activeFarmersForFilter.map(f=>`<option value="${f.id}" ${reportDoneTodayFarmerFilter===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
      </select></div></div>
      <div style="font-size:15px;color:var(--grey);margin:10px 0;">Everything recorded against today's date${reportDoneTodayFarmerFilter?', filtered to who was logged in when it was logged':', farm-wide'}. Tap a row for the detail behind it.</div>
      ${totalToday===0?`<div class="empty" style="padding:14px 4px;">Nothing recorded for today${reportDoneTodayFarmerFilter?' by this filter':' yet'}.</div>`:rowsDef.map(r=>{
        const open=reportExpandedKey===r.key;
        return `
        <div style="margin-bottom:4px;">
          <button data-togglereportmonth="${r.key}" ${r.count>0?'':'disabled'} style="width:100%;background:none;border:none;text-align:left;padding:0;cursor:${r.count>0?'pointer':'default'};">
            <div class="row" style="cursor:${r.count>0?'pointer':'default'};${r.count===0?'opacity:.4;':''}">
              <span style="font-size:16px;">${r.label}</span>
              <span style="display:flex;align-items:center;gap:8px;"><span style="font-weight:800;font-size:19px;color:${r.color};">${r.count}</span>${r.count>0?`<span style="width:20px;height:20px;flex-shrink:0;color:var(--grey);">${icon(open?'triangleDown':'triangleRight')}</span>`:''}</span>
            </div>
          </button>
          ${open?`<div style="background:#f3f3f3;border-radius:8px;padding:10px 12px;margin:2px 0 8px;">
            ${r.key==='today-weigh'?d.weighToday.map(w=>{
              const an=animals.find(a=>a.id===w.animal_id);
              const parts=[]; if(w.weight_kg!=null) parts.push(w.weight_kg+'kg'); if(w.bcs!=null) parts.push('BCS '+w.bcs);
              return `<div><div class="row" data-gotoanimalscreen="${an?an.id:''}" data-gotoscreen="detail"><span style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${an?animalDisplayName(an):'Unknown'}</span><span style="color:var(--grey);">${parts.join(', ')||'\u2014'}</span></div>${!reportDoneTodayFarmerFilter?`<div style="font-size:12px;color:var(--grey);padding:0 12px 6px;">by ${loggedByLabel(w.farmer_id)}</div>`:''}</div>`;
            }).join(''):''}
            ${r.key==='today-move'?d.moveRecordsToday.map(m=>`<div><div class="row" data-gotomoverecord="${m.id}"><div><div class="name" style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${m.direction==='off'?'Off farm':m.direction==='on'?'On farm':'Move'}${m.location?' \u2014 '+escapeHtml(m.location):''}</div><div class="id" style="font-size:13px;">${(m.animal_ids||[]).length} animal${(m.animal_ids||[]).length===1?'':'s'}</div></div></div>${!reportDoneTodayFarmerFilter?`<div style="font-size:12px;color:var(--grey);padding:0 12px 6px;">by ${loggedByLabel(m.farmer_id)}</div>`:''}</div>`).join(''):''}
            ${r.key==='today-med'?d.medToday.map(rec=>{
              const an=animals.find(a=>a.id===rec.animal_id);
              return `<div><div class="row" data-gotoanimalscreen="${an?an.id:''}" data-gotoscreen="medicine"><span style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${an?animalDisplayName(an):'Unknown'}</span><span style="color:var(--grey);">${escapeHtml(rec.product_name||medicineTypeName(rec.medicine_type_id)||'Vet fees')}</span></div>${!reportDoneTodayFarmerFilter?`<div style="font-size:12px;color:var(--grey);padding:0 12px 6px;">by ${loggedByLabel(rec.farmer_id)}</div>`:''}</div>`;
            }).join(''):''}
            ${r.key==='today-injury'?d.injuryToday.map(rec=>{
              const an=animals.find(a=>a.id===rec.animal_id);
              return `<div><div class="row" data-gotoanimalscreen="${an?an.id:''}" data-gotoscreen="injury"><span style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${an?animalDisplayName(an):'Unknown'}</span><span style="color:var(--grey);">${escapeHtml(rec.body_part||'')}${rec.severity!=null?' (level '+rec.severity+')':''}</span></div>${!reportDoneTodayFarmerFilter?`<div style="font-size:12px;color:var(--grey);padding:0 12px 6px;">by ${loggedByLabel(rec.farmer_id)}</div>`:''}</div>`;
            }).join(''):''}
            ${r.key==='today-damage'?d.damageToday.map(rec=>`<div><div class="row" style="cursor:default;"><div><div class="name" style="font-size:16px;">${escapeHtml(rec.summary||'Damage')}</div><div class="id" style="font-size:13px;">${escapeHtml(rec.location||'')}</div></div><span class="pill ${rec.urgency==='high'?'red':rec.urgency==='med'?'amber':'green'}" style="text-transform:capitalize;">${rec.urgency||''}</span></div>${!reportDoneTodayFarmerFilter?`<div style="font-size:12px;color:var(--grey);padding:0 12px 6px;">by ${loggedByLabel(rec.farmer_id)}</div>`:''}</div>`).join(''):''}
            ${r.key==='today-feed'?d.feedToday.map(rec=>`<div><div class="row" style="cursor:default;"><div><div class="name" style="font-size:16px;">${escapeHtml(rec.feed_type||'Fodder')}</div><div class="id" style="font-size:13px;">${rec.supplier?escapeHtml(rec.supplier):''}</div></div><span style="font-weight:700;">${rec.total_cost!=null?fmtGBP(rec.total_cost):''}</span></div>${!reportDoneTodayFarmerFilter?`<div style="font-size:12px;color:var(--grey);padding:0 12px 6px;">by ${loggedByLabel(rec.farmer_id)}</div>`:''}</div>`).join(''):''}
            ${r.key==='today-added'?d.addedToday.map(a=>{
              const ev=(events[a.id]||[]).find(e=>e.event_type==='created');
              return `<div><div class="row" data-gotoanimalscreen="${a.id}" data-gotoscreen="detail"><span style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${animalDisplayName(a)}</span><span style="color:var(--grey);">${breedName(a.breed_id)}</span></div>${!reportDoneTodayFarmerFilter?`<div style="font-size:12px;color:var(--grey);padding:0 12px 6px;">by ${loggedByLabel(ev&&ev.farmer_id)}</div>`:''}</div>`;
            }).join(''):''}
            ${r.key==='today-exited'?d.exitedToday.map(({a,status,farmer_id})=>`<div><div class="row" data-gotoanimalscreen="${a.id}" data-gotoscreen="detail"><span style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${animalDisplayName(a)}</span><span style="color:var(--grey);">${ANIMAL_STATUS_LABELS[status]||status}</span></div>${!reportDoneTodayFarmerFilter?`<div style="font-size:12px;color:var(--grey);padding:0 12px 6px;">by ${loggedByLabel(farmer_id)}</div>`:''}</div>`).join(''):''}
          </div>`:''}
        </div>`;
      }).join('')}`;
  }
  else if(type==='vetspend'){
    title='Vet spend (monthly)';
    const rows=reportVetSpendByMonth(6);
    const max=Math.max(1,...rows.map(r=>r.total));
    body=`
      <div style="font-size:15px;color:var(--grey);margin-bottom:10px;">Medicine costs where the administering vet was marked as a vet in Farmers &amp; Vets. Farmer-administered costs aren't counted here. Tap a month to see what made it up.</div>
      ${rows.map(r=>{
        const key='vet-'+r.label;
        const open=reportExpandedKey===key;
        const monthRecords = r.total>0 ? medicineRecords.filter(rec=>{
          if(rec.cost==null) return false;
          const fv=farmersVets.find(p=>p.id===rec.farmer_vet_id);
          if(!fv||fv.role!=='vet') return false;
          return monthLabel(new Date(rec.administered_at))===r.label;
        }).sort((a,b)=>b.cost-a.cost) : [];
        return `
        <div style="margin-bottom:4px;">
          <button data-togglereportmonth="${key}" ${r.total>0?'':'disabled'} style="width:100%;background:none;border:none;text-align:left;padding:0;cursor:${r.total>0?'pointer':'default'};">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:3px;"><span>${r.label}</span><span style="display:flex;align-items:center;gap:8px;"><span style="font-weight:700;">${fmtGBP(r.total)}</span>${r.total>0?`<span style="width:20px;height:20px;flex-shrink:0;color:var(--grey);">${icon(open?'triangleDown':'triangleRight')}</span>`:''}</span></div>
            <div style="background:#eee;border-radius:4px;height:10px;overflow:hidden;"><div style="background:var(--red);height:100%;width:${(r.total/max*100).toFixed(0)}%;"></div></div>
          </button>
          ${open?`<div style="margin:8px 0 4px;">
            ${monthRecords.map(rec=>{
              const an=animals.find(a=>a.id===rec.animal_id);
              return `<div class="row" data-gotoanimalscreen="${an?an.id:''}" data-gotoscreen="medicine"><div><div class="name" style="font-size:16px;">${an?(animalDisplayName(an)):'Unknown'}</div><div class="id" style="font-size:13px;">${rec.product_name||'Vet fees'}</div></div><span style="font-weight:700;">${fmtGBP(rec.cost)}</span></div>`;
            }).join('')}
          </div>`:''}
        </div>`;
      }).join('')}
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-weight:800;font-size:17px;"><span>6-month total</span><span>${fmtGBP(rows.reduce((s,r)=>s+r.total,0))}</span></div>`;
  }
  else if(type==='feedcost'){
    title='Fodder cost (monthly)';
    const rows=reportFeedCostByMonth(6, reportFeedTypeFilter);
    const max=Math.max(1,...rows.map(r=>r.total));
    const byType=reportFeedCostByTypeMonth(12, reportFeedTypeFilter);
    body=`
      ${reportFeedTypeFilter?`<div style="font-size:13px;color:var(--grey);margin-bottom:6px;">Filtered to <b style="color:var(--ink);">${escapeHtml(reportFeedTypeFilter)}</b> only.</div>`:''}
      <label style="margin-top:2px;">Past 12 months, by fodder type</label>
      ${byType.series.length? renderMultiLineChart(byType.labels, byType.series) : '<div class="empty" style="padding:10px 4px;">No fodder purchases logged yet.</div>'}

      <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:12px;"></div>
      <div style="font-size:15px;color:var(--grey);margin-bottom:10px;">Total farm fodder spend logged each month, from the Fodder screen. Tap a month to see the individual entries.</div>
      ${rows.map(r=>{
        const key='feed-'+r.label;
        const open=reportExpandedKey===key;
        const monthEntries = r.total>0 ? feedRecords.filter(rec=>!rec.deleted_at && (!reportFeedTypeFilter || rec.feed_type===reportFeedTypeFilter) && monthLabel(new Date(rec.start_date))===r.label).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date)) : [];
        return `
        <div style="margin-bottom:4px;">
          <button data-togglereportmonth="${key}" ${r.total>0?'':'disabled'} style="width:100%;background:none;border:none;text-align:left;padding:0;cursor:${r.total>0?'pointer':'default'};">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:3px;"><span>${r.label}</span><span style="display:flex;align-items:center;gap:8px;"><span style="font-weight:700;">${fmtGBP(r.total)}</span>${r.total>0?`<span style="width:20px;height:20px;flex-shrink:0;color:var(--grey);">${icon(open?'triangleDown':'triangleRight')}</span>`:''}</span></div>
            <div style="background:#eee;border-radius:4px;height:10px;overflow:hidden;"><div style="background:var(--amber);height:100%;width:${(r.total/max*100).toFixed(0)}%;"></div></div>
          </button>
          ${open?`<div style="margin:8px 0 4px;">
            ${monthEntries.map(rec=>`<div class="row" data-gotofeedrecord="${rec.id}"><div><div class="name" style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${fmtDate(rec.start_date)}</div><div class="id" style="font-size:13px;">${rec.feed_type||'Feed'}</div></div><span style="font-weight:700;">${fmtGBP(feedRecordCost(rec))}</span></div>`).join('')}
          </div>`:''}
        </div>`;
      }).join('')}
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-weight:800;"><span>6-month total</span><span>${fmtGBP(rows.reduce((s,r)=>s+r.total,0))}</span></div>`;
  }
  else if(type==='livestockvalue'){
    title='Livestock value';
    const r=reportLivestockValue();
    body=`
      <div style="text-align:center;margin:10px 0 18px;">
        <div style="font-size:34px;font-weight:800;color:var(--green);">${fmtGBP(r.total)}</div>
        <div style="font-size:15px;color:var(--grey);">${r.count} active animals</div>
      </div>
      ${Object.entries(r.byBreed).sort((a,b)=>b[1]-a[1]).map(([breed,val])=>{
        const key='breed-'+breed;
        const open=reportExpandedKey===key;
        const breedObj = breeds.find(b=>b.name===breed);
        const breedAnimals = animals.filter(a=>a.status==='active' && breedName(a.breed_id)===breed).map(a=>({a, mv:marketValue(a), lw:lastWeightRecord(a.id)})).sort((x,y)=>(y.mv||0)-(x.mv||0));
        return `
        <div style="margin-bottom:4px;">
          <button data-togglereportmonth="${key}" style="width:100%;background:#f3f3f3;border:none;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:16px;"><span>${breed}${breedObj && breedObj.price_per_kg!=null?` <span style="color:var(--grey);font-weight:400;font-size:13px;">(${fmtGBP(breedObj.price_per_kg)}/kg)</span>`:''}</span><span style="display:flex;align-items:center;gap:8px;"><span style="font-weight:700;">${fmtGBP(val)}</span><span style="color:var(--grey);width:20px;height:20px;flex-shrink:0;">${icon(open?'triangleDown':'triangleRight')}</span></span></div>
          </button>
          ${open?`<div style="margin:2px 0 4px;">
            ${breedAnimals.map(({a,mv,lw})=>{
              const missing = mv==null || mv===0;
              return `<div class="row" data-gotoanimalscreen="${a.id}" data-gotoscreen="profitScore">
                <span data-gotoanimaldetails="${a.id}" style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${animalDisplayName(a)}</span>
                <span style="flex:1;text-align:center;color:var(--grey);font-size:13px;">${lw?lw.weight_kg+'kg':'\u2014'}</span>
                <span style="font-weight:700;color:${missing?'var(--red)':'inherit'};">${fmtGBP(mv||0)}</span>
              </div>`;
            }).join('')}
          </div>`:''}
        </div>`;
      }).join('')}`;
  }
  else if(type==='roi'){
    title='ROI \u2014 cost vs current value';
    const r=reportROI();
    body=`
      <div style="margin:10px 0 18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 4px;"><span style="font-size:15px;color:var(--grey);">Total cost (purchase + medicine)</span><span style="font-size:19px;font-weight:800;color:var(--red);">${fmtGBPSmart(r.totalCost)}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 4px;"><span style="font-size:15px;color:var(--grey);">Worth now</span><span style="font-size:19px;font-weight:800;color:var(--green);">${fmtGBPSmart(r.totalValue)}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-top:1px solid var(--line);margin-top:4px;"><span style="font-size:15px;color:var(--grey);">ROI</span><span style="font-size:19px;font-weight:800;color:${r.roiPct!=null&&r.roiPct<0?'var(--red)':'var(--green)'};">${r.roiPct!=null?fmtPct(r.roiPct,1):'\u2014'}</span></div>
      </div>
      ${r.rows.slice(0,roiShowCount).map(row=>`
        <div class="row" data-gotoanimalscreen="${row.a.id}" data-gotoscreen="profitScore">
          <div><div class="name" data-gotoanimaldetails="${row.a.id}" style="text-decoration:underline;text-decoration-color:var(--line);">${animalDisplayName(row.a)}</div><div class="id" style="font-size:13px;">${fmtGBPSmart(row.cost)} <span style="font-size:16px;font-weight:800;">&rarr;</span> ${fmtGBPSmart(row.value-row.cost)} profit</div></div>
          <span class="pill ${row.roi==null?'':(row.roi>=0?'green':'red')}" style="font-size:13.5px;">${row.roi!=null?fmtPct(row.roi):'\u2014'}</span>
        </div>`).join('')}
      ${r.rows.length>roiShowCount?`<button id="roi-showmore" class="fullbtn ghost" style="margin-top:10px;">Show 25 more (${r.rows.length-roiShowCount} left)</button>`:''}`;
  }
  else if(type==='sellyes' || type==='sellno'){
    const recommend = type==='sellyes';
    title = 'Sell/Keep';
    const rows=reportAnimalsToSell(recommend);
    body=`
      <div class="radiogroup" style="display:flex;gap:10px;margin:2px 0 12px;">
        <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:none;font-size:16px;font-weight:700;padding:10px;border-radius:8px;cursor:pointer;border:2px solid ${recommend?'var(--green)':'var(--line)'};background:${recommend?'var(--green-bg)':'#fff'};color:${recommend?'var(--green)':'var(--grey)'};margin:0;"><input type="radio" name="sellKeepRadio" id="sellKeepSell" ${recommend?'checked':''} style="accent-color:var(--green);"> Sell</label>
        <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:none;font-size:16px;font-weight:700;padding:10px;border-radius:8px;cursor:pointer;border:2px solid ${!recommend?'var(--red)':'var(--line)'};background:${!recommend?'var(--red-bg)':'#fff'};color:${!recommend?'var(--red)':'var(--grey)'};margin:0;"><input type="radio" name="sellKeepRadio" id="sellKeepKeep" ${!recommend?'checked':''} style="accent-color:var(--red);"> Keep</label>
      </div>
      <div style="font-size:15px;color:var(--grey);margin-bottom:10px;">${recommend
        ? 'At Prime age, healthy, not currently pregnant or with offspring, and showing a profit \u2014 good candidates to consider selling now, ordered by profit (highest first).'
        : 'Below or past Prime age, currently pregnant/with offspring, or health score are worth keeping for now.'}
        ${recommend?` Tap an animal to see exactly why it\u2019s listed here.<br><br><b style="color:var(--ink);">Press and hold an animal to select several, then tap Move to send them to market.</b>`:''}</div>
      ${rows.length?`
      <div style="display:flex;align-items:center;gap:8px;padding:2px 10px;font-size:13px;color:var(--grey);font-weight:800;text-transform:uppercase;">
        <span style="flex:1;">Animal</span>
        <span style="width:64px;text-align:right;">Profit</span>
        <span style="width:56px;text-align:center;">Health</span>
        <span style="width:20px;flex-shrink:0;"></span>
      </div>`:''}
      ${rows.length? rows.slice(0,sellShowCount).map(row=>{
        const key='sell-'+row.a.id;
        const open=reportExpandedKey===key;
        const rowSelected = recommend && herdSelectMode && herdSelectedIds.includes(row.a.id);
        const reasons=[];
        if(recommend){
          reasons.push('At Prime age ('+row.months+' months)');
          reasons.push('Health score is '+row.hs.color.charAt(0).toUpperCase()+row.hs.color.slice(1)+' ('+row.hs.total+'/100)');
          reasons.push('Not currently pregnant or with offspring');
          if(row.profit!=null) reasons.push('Showing an estimated profit of '+fmtGBP(row.profit,0));
        } else {
          if(!row.isPrime) reasons.push(row.months+' months old \u2014 outside this breed\u2019s Prime age range');
          if(row.breeding) reasons.push('Currently pregnant or with offspring');
          if(row.hs.color==='red') reasons.push('Health score is Red ('+row.hs.total+'/100)');
        }
        return `
        <div style="margin-bottom:4px;" ${recommend?`data-sellrow="${row.a.id}"`:''}>
          <div data-togglereportmonth="${key}" style="cursor:pointer;">
            <div class="row" style="cursor:pointer;${rowSelected?'background:#e3e3e3;':''}">
              <div style="flex:1;min-width:0;"><div class="name" data-gotoanimalscreen="${row.a.id}" data-gotoscreen="detail" style="font-size:${farmSettings.use_animal_names===false?'13px':'16px'};text-decoration:underline;text-decoration-color:var(--line);">${animalDisplayName(row.a)}</div><div class="id" style="font-size:13px;">${row.months} months old</div></div>
              <span style="width:64px;text-align:right;font-weight:800;font-size:15px;color:${row.profit==null?'var(--grey)':(row.profit>=0?'var(--green)':'var(--red)')};">${row.profit!=null?fmtGBP(row.profit,0):'\u2014'}</span>
              <span class="pill ${row.hs.color}" style="width:56px;text-align:center;flex-shrink:0;font-size:15px;">${row.hs.total}</span>
              <span style="width:20px;height:20px;flex-shrink:0;color:var(--grey);">${icon(open?'triangleDown':'triangleRight')}</span>
            </div>
          </div>

// Shared by the in-progress move (as soon as animals are added, replacing
// the auto-save note) and every past move record in "View previous" —
// same label, same checkbox, same behaviour either way, so ticking it off
// doesn't require leaving the screen and finding the record again in the
// expanded history the way it used to.
function bcmsCheckboxRow(rec){
  if(!rec || rec.direction==='in') return ''; // on-farm field moves don't need a BCMS report row
  const rowSt=moveReportStatus(rec);
  const isReported=rec.bcms_reported;
  const label = isReported ? 'Reported to '+bcmsLink()+(rec.bcms_reported_at?' on '+fmtDate(rec.bcms_reported_at):'')
    : rowSt&&rowSt.overdue ? 'Report to '+bcmsLink()+' \u2014 OVERDUE'
    : rowSt ? 'Report to '+bcmsLink()+' within '+rowSt.daysLeft+' day'+(rowSt.daysLeft===1?'':'s')
    : 'Report to '+bcmsLink();
  const labelColor = isReported ? 'var(--green)' : (rowSt&&rowSt.overdue?'var(--red)':'#7a5406');
  return `<label style="display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 4px 0;font-size:13px;font-weight:700;color:${labelColor};cursor:pointer;">
    <span style="text-align:right;">${label}</span>
    <input type="checkbox" data-markmovebcms="${rec.id}" ${isReported?'checked':''} style="width:20px;height:20px;flex-shrink:0;accent-color:var(--green);">
  </label>`;
}
function renderMove(){
  if(!moveDate) moveDate=todayStr();
  const today=todayStr();
  // Up to a week ahead — a farmer with an early market run often sets the
  // move up the night before to save time in the morning.
  const maxMoveDate=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const chosen = moveAnimalIds.map(id=>animals.find(a=>a.id===id)).filter(Boolean)
    .sort((a,b)=>(animalDisplayName(a)).localeCompare(animalDisplayName(b)));
  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>Move Animal</span><span></span></div>
    <div class="body bigtext">
      <div class="formrow"><label>Date</label><div class="formctrl">
        ${dateFieldWithJump(`<input type="date" id="moveDateInput" value="${moveDate}" max="${maxMoveDate}" style="text-align:center;flex:1;min-width:0;">`,'moveDateInput')}
      </div></div>

      <div class="formrow"><label>On/off farm?</label><div class="formctrl radiogroup" style="justify-content:flex-end;gap:14px;">
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="moveDirectionRadio" id="moveDirectionOn" ${moveDirection==='on'?'checked':''}> On</label>
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="moveDirectionRadio" id="moveDirectionOff" ${moveDirection==='off'?'checked':''}> Off</label>
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="moveDirectionRadio" id="moveDirectionIn" ${moveDirection==='in'?'checked':''}> In</label>
      </div></div>

      ${(moveDirection==='on'||moveDirection==='off'||moveDirection==='in')?`
      <div class="formrow"><label>${moveDirection==='on'?'From':moveDirection==='off'?'Destination':'To'}</label><div class="formctrl">
        <input type="text" id="moveLocation" list="moveLocationList" placeholder="${moveDirection==='in'?'e.g. North Field':'e.g. Buxton Market'}" value="${moveLocationVal.replace(/"/g,'&quot;')}">
      </div></div>
      <datalist id="moveLocationList">${[...new Set(moveRecords.filter(r=>r.direction===moveDirection).map(r=>r.location).filter(Boolean))].sort().map(l=>`<option value="${escapeHtml(l)}">`).join('')}</datalist>

      ${moveDirection!=='in'?`
      <div class="formrow"><label>${moveDirection==='on'?'From CPH':'Destination CPH'}</label><div class="formctrl">
        <input type="text" inputmode="numeric" id="moveDestCph" maxlength="11" placeholder="e.g. 12/345/6789" value="${moveDestCphVal.replace(/"/g,'&quot;')}">
      </div></div>`:''}`:''}

      <label style="margin-top:16px;display:none;">Reason (optional)</label>
      <textarea id="moveReason" maxlength="500" style="min-height:90px;display:none;" oninput="document.getElementById('moveCharCount').textContent=(500-this.value.length)+' characters remaining'">${moveReasonVal}</textarea>
      <div id="moveCharCount" style="font-size:13px;color:var(--grey);text-align:right;margin-top:2px;display:none;">${500-moveReasonVal.length} characters remaining</div>
      <div class="field-error" id="err-movevalidation"></div>
      ${(()=>{
        const activeRec = moveSessionRecordId ? moveRecords.find(r=>r.id===moveSessionRecordId) : null;
        // Falls back to the auto-save note whenever nothing's actually been
        // saved yet — not just when the Animals list is empty. It's
        // possible to pick an animal before Direction/Location are set
        // (commitMoveEntry silently declines to save until both exist), so
        // checking chosen.length alone could leave neither message showing.
        if(activeRec && activeRec.direction==='in') return `<div style="font-size:13px;color:var(--primary-dark);text-align:center;margin-top:8px;">In-farm move \u2014 no BCMS report or TB check needed.</div>`;
        return activeRec ? bcmsCheckboxRow(activeRec) : `<div style="font-size:13px;color:var(--primary-dark);text-align:center;margin-top:8px;">Move details auto-save when an animal is added.</div>`;
      })()}

      <label style="margin-top:18px;">Animals</label>
      ${(moveDirection!=='in' && chosen.some(a=>animalMoveRisk(a.id))) ? `<div class="banner" style="display:block;">Some animals are in withdrawal or missing a TB test. Move still recorded.</div>` : ''}
      ${chosen.length? chosen.map(a=>{
        const risky = moveDirection!=='in' && animalMoveRisk(a.id);
        return `
        <div style="display:flex;align-items:center;gap:8px;margin:6px 0;">
          <div style="position:relative;flex:1;">
            <input type="text" value="${animalDisplayName(a)}" readonly style="width:100%;background:#f3f3f3;color:var(--ink);${risky?'padding-right:42px;':''}">
            ${risky?`<span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;color:var(--red);pointer-events:none;" title="In withdrawal or TB test overdue/missing">${icon('syringe')}</span>`:''}
          </div>
          <button data-removemoveanimal="${a.id}" style="width:30px;height:30px;flex-shrink:0;background:var(--red);border:none;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;padding:7px;">${icon('close')}</button>

function factorColorClass(key, points){
  const maps = {
    bcs: {0:'red',25:'green',15:'amber',5:'red'},
    illness: {20:'green',15:'amber',5:'red'},
    injury: {20:'green',15:'amber',10:'amber',2:'red'},
    weighttrend: {20:'green',15:'amber',9:'amber',2:'red'},
    age: {15:'green',9:'amber',7:'amber',5:'amber',3:'red'},
  };
  return (maps[key] && maps[key][points]) || 'amber';
}
function colorVarFor(c){ return c==='green'?'var(--green)':c==='red'?'var(--red)':'var(--amber)'; }
function confColorClass(conf){ return conf.label==='HIGH'?'green':conf.label==='LOW'?'red':'amber'; }
// Confidence pill: coloured background + label combined into one chip (used
// on both the Health Score screen and the Market Value screen — same size
// on both so Market Value no longer reads smaller than Health).
function confidencePill(conf, fontSize){
  return `<span class="pill ${confColorClass(conf)}" style="font-size:${fontSize}px;padding:4px 11px;">${conf.label}</span>`;
}

let sortColumn='name', sortDir='asc';
let showFilterModal=false;

function renderHerd(){
  const useEidOnly = farmSettings.use_animal_names===false;
  const term=searchTerm.toLowerCase();
  let list = animals.filter(a=>{
    if(a.status!==statusFilter) return false;
    if(term && !(a.tag_number.toLowerCase().includes(term) || (a.name||'').toLowerCase().includes(term) || (a.eid||'').toLowerCase().replace(/\s+/g,'').includes(term.replace(/\s+/g,'')) || breedName(a.breed_id).toLowerCase().includes(term))) return false;
    if(filterBreedId && a.breed_id!==filterBreedId) return false;
    if(filterOffFarm){
      const lm=lastMoveForAnimal(a.id);
      if(!(lm && lm.direction==='off')) return false;
    }
    if(filterBcs!=null){
      const bcsRec=lastBcsRecord(a.id);
      if(!bcsRec || bcsRec.bcs!==filterBcs) return false;
    }
    if(filterHealth && healthScore(a).color!==filterHealth) return false;
    if(filterUnweighed60){
      const lw=lastWeightRecord(a.id);
      if(!(!lw || (new Date()-new Date(lw.recorded_at))/86400000 > 60)) return false;
    }
    if(filterTbOverdue && !tbTestOverdue(a.id)) return false;
    if(filterOpenInjury && !injuryRecords.some(r=>r.animal_id===a.id && !r.resolved_at)) return false;
    return true;
  });
  // Non-active statuses (Died/Sold/Swapped/Stolen/Removed) accumulate over
  // years and could otherwise grow into a huge list — default to the last
  // 12 months with an explicit "show more" rather than always listing the
  // farm's entire exit history.
  let hiddenOlderCount=0;
  if(statusFilter!=='active' && !herdShowAllHistory){
    const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-1);
    const withinYear = list.filter(a=>new Date(a.updated_at||a.created_at) >= cutoff);
    hiddenOlderCount = list.length - withinYear.length;
    list = withinYear;
  }
  list = list.map(a=>({
    a, profit: estimatedProfit(a), bcsRec: lastBcsRecord(a.id), hs: healthScore(a)
  }));
  const dir = sortDir==='asc'?1:-1;
  list.sort((x,y)=>{
    let primary=0;
    if(sortColumn==='name') primary = dir*((animalDisplayName(x.a)).localeCompare(animalDisplayName(y.a)));
    else if(sortColumn==='profit') primary = dir*((x.profit??-Infinity)-(y.profit??-Infinity));
    else if(sortColumn==='bcs') primary = dir*((x.bcsRec?x.bcsRec.bcs:-1)-(y.bcsRec?y.bcsRec.bcs:-1));
    else if(sortColumn==='health') primary = dir*(x.hs.total-y.hs.total);
    if(primary!==0 || sortColumn==='name') return primary;
    // Tie-break on whatever's shown in the Name column (name/EID/Mgmt ID,
    // per farmSettings.use_animal_names) so animals sharing a score don't
    // jump around unpredictably between renders.
    return (animalDisplayName(x.a)).localeCompare(animalDisplayName(y.a));
  });
  const arrow=(col)=> sortColumn===col ? `<span class="arrow">${sortDir==='asc'?'▲':'▼'}</span>` : '';
  const th=(col,label)=>`<th class="${sortColumn===col?'sorted':''}" data-sort="${col}">${label}${arrow(col)}</th>`;

  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>${herdSelectMode?herdSelectedIds.length+' selected':'Animal List'}</span><span></span></div>
    <div class="body bigtext">
      <div class="stickyhead">
        <div class="searchrow"><div class="searchwrap"><input type="text" id="searchInput" autocomplete="off" placeholder="Search tag, name, breed" value="${searchTerm.replace(/"/g,'&quot;')}">${searchClearMarkup('searchInput')}</div></div>
        ${list.length?(()=>{
          const allOn = herdSelectMode && list.every(({a})=>herdSelectedIds.includes(a.id));
          return `<button id="herdSelectAllBtn" class="fullbtn ghost" data-allselected="${allOn?1:0}" style="margin-top:6px;${allOn?'background:#e4e4e4;border-color:#c8c8c8;':''}">${allOn?'Deselect all':'Select all'} (${list.length})</button>`;
        })():''}
      </div>
      ${list.length? `
      <table class="listtable">
        <thead><tr>${useEidOnly?'':'<th style="width:34px;"></th>'}${th('name',useEidOnly?'EID':'Name')}<th style="width:64px;text-align:right;" class="${sortColumn==='profit'?'sorted':''}" data-sort="profit">Profit${arrow('profit')}</th><th style="width:44px;text-align:center;" class="${sortColumn==='bcs'?'sorted':''}" data-sort="bcs">BCS${arrow('bcs')}</th><th style="width:44px;text-align:center;" class="${sortColumn==='health'?'sorted':''}" data-sort="health">Health${arrow('health')}</th></tr></thead>
        <tbody>
          ${list.map(({a,profit,bcsRec,hs})=>{
            const bcsCol = bcsRec ? injSevColorClassGeneric(bcsColorClass(bcsRec.bcs)) : null;
            const profitCol = profit==null ? null : (profit>0 ? 'green' : 'red');
            const healthCol = hs.color;
            const rowSelected = herdSelectMode && herdSelectedIds.includes(a.id);
            return `<tr data-openrow="${a.id}" style="${rowSelected?'background:#e3e3e3;':''}">
              ${useEidOnly?'':`<td class="idcell">${eidShortDisplay(a)}</td>`}
              <td class="namecell" data-openname="${a.id}" style="font-size:14.5px;">${animalDisplayName(a)}</td>
              <td style="text-align:right;" data-openprofit="${a.id}">${profit==null?'<span style="color:var(--grey);">—</span>':`<span class="pill ${profitCol}" style="font-size:13px;">${fmtGBP(profit,0)}</span>`}</td>
              <td style="text-align:center;" data-openbcs="${a.id}">${bcsRec?`<span class="circledot ${bcsCol}" style="font-size:13px;">${bcsRec.bcs}</span>`:'<span style="color:var(--grey);">—</span>'}</td>
              <td class="heartcell" style="text-align:center;" data-openhealth="${a.id}">${heartFilledIcon(healthCol==='green'?'var(--green)':healthCol==='red'?'var(--red)':'var(--amber)')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : '<div class="empty">No animals match.</div>'}
      ${hiddenOlderCount>0?`<button id="herdShowAllHistory" class="fullbtn ghost" style="margin-top:10px;">Show ${hiddenOlderCount} more from over 12 months ago</button>`:''}
    </div>
    ${footerBar(herdSelectMode ? [
      {id:'herd-help', icon:'help', label:'Help'},
      {id:'herd-tbtest', icon:'syringe', label:'TB test', bordered:true},
      {id:'herd-move', icon:'pin', label:'Move', primary:true},
      {id:'herd-home', icon:'home', label:'Home', home:true},
    ] : [
      {id:'herd-help', icon:'help', label:'Help'},
      {id:'herd-filter', icon:'filter', label:(statusFilter!=='active'||filterBreedId||filterOffFarm||filterBcs!=null||filterHealth||filterUnweighed60||filterTbOverdue||filterOpenInjury)?'Filter \u25cf':'Filter', primary:true},
      {id:'herd-scan', icon:'camera', label:'Scan', primary:true},
      {id:'herd-home', icon:'home', label:'Home', home:true},
    ])}`;
}
function injSevColorClassGeneric(cls){ return cls.replace('bcs-',''); }
function fmtShortDate(iso){ const d=new Date(iso); return d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(-2); }
function fmtMonYY(iso){ const d=new Date(iso); return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(-2); }
function lastFeedRecordForType(typeName){
  return feedRecords.filter(r=>r.feed_type===typeName && !r.deleted_at).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date))[0] || null;
}
function urgencyRank(u){ return u==='high'?3:u==='med'?2:1; }
function urgencyColorVar(u){ return u==='high'?'var(--red)':u==='med'?'var(--amber)':'var(--grey-light)'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function sameDay(iso, dateStr){ return iso && iso.slice(0,10)===dateStr; }
function findRecordForAnimalDate(animalId, dateStr){
  return weights.filter(w=>w.animal_id===animalId && sameDay(w.recorded_at, dateStr)).slice(-1)[0] || null;
}
function openDamageRecords(){
  return damageRecords.filter(d=>!d.fixed_at && !d.not_going_to_fix)
    .sort((a,b)=> urgencyRank(b.urgency)-urgencyRank(a.urgency) || new Date(b.created_at)-new Date(a.created_at));
}

      {id:'sum-help', icon:'help', label:'Help'},
      {id:'sum-remove', icon:'trash', label:'Remove', danger:true},

function fmtTimelineDate(iso){
  const d=new Date(iso), now=new Date();
  const monthsAgo=(now.getFullYear()-d.getFullYear())*12 + (now.getMonth()-d.getMonth());
  const dayMonth=d.getDate()+' '+d.toLocaleString('en-GB',{month:'long'});
  return monthsAgo>12 ? dayMonth+' '+String(d.getFullYear()).slice(-2) : dayMonth;
}
function buildTimeline(animalId){
  const items=[];
  (events[animalId]||[]).forEach(e=>{
    let text;
    if(e.event_type==='created'){
      const a=animals.find(x=>x.id===animalId);
      text='Animal added'+(a&&a.purchase_price?' ('+fmtGBP(a.purchase_price,0)+')':'');
    } else if(e.event_type==='restored'){ text='Restored to active'+(e.reason?' ('+e.reason.slice(0,20)+(e.reason.length>20?'\u2026':'')+')':''); }
    else if(e.event_type==='voided'){ text='Voided (accidental entry)'; }
    else { text='Marked '+e.to_status; }
    items.push({date:e.created_at, text, kind:'status', ref:e});
  });
  weights.filter(w=>w.animal_id===animalId).forEach(w=>{
    const parts=[];
    if(w.weight_kg!=null) parts.push('Weighed '+w.weight_kg+'kg');
    if(w.bcs!=null) parts.push('BCS '+w.bcs);
    items.push({date:w.recorded_at, text:parts.join(', '), kind:'weight', ref:w});
  });
  injuryRecords.filter(r=>r.animal_id===animalId).forEach(r=>{
    const bp=r.body_part?(' '+bodyPartLabel(r.body_part).toLowerCase()):'';
    const lvl=r.severity!=null?(' (level '+r.severity+')'):'';
    items.push({date:r.recorded_at, text:'Injury added'+bp+lvl, kind:'injury', ref:r});
    if(r.resolved_at) items.push({date:r.resolved_at, text:'Injury recovered'+bp+lvl, kind:'injury', ref:r});
  });
  medicineRecords.filter(r=>r.animal_id===animalId).forEach(r=>{
    items.push({date:r.administered_at, text:'Medicine ('+medicineTypeName(r.medicine_type_id)+')', kind:'medicine', ref:r});
  });
  moveRecords.filter(r=>r.animal_ids.includes(animalId)).forEach(r=>{
    const reasonPart = r.reason ? ' ('+r.reason.slice(0,20)+(r.reason.length>20?'\u2026':'')+')' : '';
    items.push({date:r.created_at, text:'Moved'+reasonPart, kind:'move', ref:r});
  });
  breedingRecords.filter(r=>r.animal_id===animalId).forEach(r=>{
    const fieldLabel = r.field==='birthing_ease' ? 'Birthing ease' : 'Mothering ability';
    const valLabel = (r.field==='birthing_ease' ? BIRTHING_EASE_OPTIONS : MOTHERING_ABILITY_OPTIONS).find(o=>o.key===r.value);
    items.push({date:r.created_at, text:fieldLabel+': '+(valLabel?valLabel.label:(r.value?r.value:'Not set')), kind:'breeding', ref:r});
  });
  return items.sort((a,b)=>new Date(b.date)-new Date(a.date));
}

let timelineKindFilter=null; // null = show everything; 'weighttrend' | 'bcstrend' = only weight/BCS entries with a trend arrow; 'weighbcs' = every weigh-in record (whichever of weight/BCS it has), no trend arrow — used by the Weigh screen's own "View history" link
function weightTrendArrow(prev, cur){
  if(prev==null || cur==null || prev===cur) return null;
  return {color: cur>prev?'var(--green)':'var(--red)', up: cur>prev};
}
function bcsTrendArrow(prev, cur){
  if(prev==null || cur==null || prev===cur) return null;
  const improving = Math.abs(cur-3) < Math.abs(prev-3);
  return {color: improving?'var(--green)':'var(--red)', up: cur>prev};
}
function renderTimeline(){
  const a=animals.find(x=>x.id===selectedId);
  if(!a) return '<div class="empty">Animal not found.</div>';
  const fullItems=buildTimeline(a.id);
  const isTrendView = timelineKindFilter==='weighttrend' || timelineKindFilter==='bcstrend';
  let items;
  if(timelineKindFilter==='weighttrend') items=fullItems.filter(it=>it.kind==='weight' && it.ref.weight_kg!=null);
  else if(timelineKindFilter==='bcstrend') items=fullItems.filter(it=>it.kind==='weight' && it.ref.bcs!=null);
  else if(timelineKindFilter==='weighbcs') items=fullItems.filter(it=>it.kind==='weight');
  else items=fullItems;
  const introText = timelineKindFilter==='weighttrend' ? 'Weight records only. '
    : timelineKindFilter==='bcstrend' ? 'BCS records only. '
    : timelineKindFilter==='weighbcs' ? 'Weight and BCS records only. '
    : '';
  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>${headerIdName(a,26)}</span><span></span></div>
    <div class="body">
      <div style="font-size:13px;color:var(--grey);margin:6px 0 10px;">${introText}Click on an item for more details:</div>
      ${items.length? items.map((it,i)=>{
        let arrow=null;
        let text=it.text;
        if(timelineKindFilter==='weighttrend') text='Weighed '+it.ref.weight_kg+'kg';
        else if(timelineKindFilter==='bcstrend') text='BCS '+it.ref.bcs+' - '+BCS_LABELS[it.ref.bcs];
        if(isTrendView){
          const prevItem=items[i+1]; // items are date-desc, so i+1 is the older/previous record
          if(prevItem){
            arrow = timelineKindFilter==='weighttrend'
              ? weightTrendArrow(prevItem.ref.weight_kg, it.ref.weight_kg)
              : bcsTrendArrow(prevItem.ref.bcs, it.ref.bcs);
          }
        }
        return `
        <button data-timelineitem="${fullItems.indexOf(it)}" style="width:100%;text-align:left;background:#f3f3f3;border:none;border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;gap:10px;align-items:baseline;">
          <span style="font-style:italic;color:var(--grey);font-size:13px;flex-shrink:0;width:78px;">${fmtTimelineDate(it.date)}</span>
          <span style="font-size:14px;color:var(--ink);flex:1;">${text}</span>
          ${arrow?`<span style="font-size:20px;line-height:1;font-weight:800;color:${arrow.color};flex-shrink:0;">${arrow.up?'\u25b2':'\u25bc'}</span>`:''}
        </button>`;
      }).join('') : `<div class="empty">${(isTrendView||timelineKindFilter==='weighbcs')?'No records yet.':'No activity recorded yet.'}</div>`}
    </div>
    ${footerBar([
      {id:'timeline-help', icon:'help', label:'Help'},
      {id:'timeline-home', icon:'home', label:'Home', home:true},
    ])}`;
}

function renderProfitScore(){

  if(!a) return '<div class="empty">Animal not found.</div>';
  const breed=breeds.find(b=>b.id===a.breed_id);
  const lastW=lastWeightRecord(a.id);
  const conf=confidenceScore(a);
  const mv=marketValue(a);
  const medCost=medicineCostTotal(a);
  const profit=estimatedProfit(a);
  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>${headerIdName(a,26)}</span><span></span></div>
    <div class="body">
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
        <span style="width:32px;height:32px;color:var(--green);flex-shrink:0;">${icon('scale')}</span>
        <span style="font-size:20px;font-weight:800;color:var(--green);">${lastW?lastW.weight_kg+'kg':'\u2014'} &times; ${breed&&breed.price_per_kg!=null?fmtGBP(breed.price_per_kg):'\u2014'}/kg = ${mv!=null?fmtGBPSmart(mv):'\u2014'}</span>
      </div>

function urgencyBcsColor(n){ const c=bcsColorClass(n); return c==='bcs-green'?'var(--green)':c==='bcs-amber'?'var(--amber)':'var(--red)'; }
// Weigh/BCS summary tile colour = worse of last-BCS colour and weight-trend colour (same bands used in Health Score)
function weighBcsTileColor(a){
  const bcsC = factorColorClass('bcs', bcsPoints(a).points);
  const wtC = factorColorClass('weighttrend', weightTrendPoints(a).points);
  const rank = {green:0, amber:1, red:2};
  return rank[wtC] > rank[bcsC] ? wtC : bcsC;
}

async function commitWeighEntry(silent){
  if(!weighTarget) return;
  const weightInput=document.getElementById('w-weight');
  const raw = weightInput ? weightInput.value.trim() : '';
  const val = raw ? parseFloat(raw) : null;
  if(raw && (isNaN(val) || val<=0)) return; // ignore invalid partial typing, don't commit garbage
  if(val==null && !currentBcsValue) return; // nothing to save yet

  const a=animals.find(x=>x.id===weighTarget);
  if(!a) return;
  const recordedIso = weighDate===todayStr() ? new Date().toISOString() : new Date(weighDate+'T12:00:00').toISOString();

  let rec = weighSessionRecordId ? weights.find(w=>w.id===weighSessionRecordId) : findRecordForAnimalDate(a.id, weighDate);
  const isNew = !rec;
  if(rec){
    rec.weight_kg = val;
    rec.bcs = currentBcsValue;
    rec.recorded_at = recordedIso;
    rec.farmer_id = currentFarmerId;
  } else {
    rec = {id:uuid(), animal_id:a.id, weight_kg:val, bcs:currentBcsValue, note:null, recorded_at:recordedIso, farmer_id:currentFarmerId};
    weights.push(rec);
  }
  weighSessionRecordId = rec.id;
  if(authFarmId){
    const { error: upsertErr } = await sb.from('weights').upsert({ ...rec, farm_id: authFarmId });
    if(upsertErr){ logMsg('<span style="color:var(--red);">Couldn\u2019t sync this weigh entry to the shared farm database \u2014 '+escapeHtml(upsertErr.message)+'.</span>'); }
  }
  await persistAll();
  if(!silent) render();
  return isNew;
}

async function commitMoveEntry(){
  const location = moveLocationVal.trim();
  const destCph = moveDestCphVal.trim();
  if(!location || moveAnimalIds.length===0 || !moveDirection) return; // not enough to save yet — no error shown, just don't persist
  if(moveDirection!=='in' && !destCph) return; // origin/destination CPH required for on/off farm moves; not needed for an on-farm field move
  const reason = moveReasonVal.trim();
  const recordedIso = moveDate===todayStr() ? new Date().toISOString() : new Date(moveDate+'T12:00:00').toISOString();

  let rec = moveSessionRecordId ? moveRecords.find(r=>r.id===moveSessionRecordId) : null;
  const isNew = !rec;
  if(rec){
    rec.date=moveDate; rec.location=location||null; rec.reason=reason||null;
    rec.animal_ids=[...moveAnimalIds]; rec.created_at=recordedIso; rec.direction=moveDirection;
    rec.dest_cph = moveDirection==='in' ? null : (destCph||null); rec.farmer_id = currentFarmerId;
  } else {
    rec={id:uuid(), date:moveDate, location:location||null, reason:reason||null, animal_ids:[...moveAnimalIds], created_at:recordedIso, direction:moveDirection,
      dest_cph: moveDirection==='in' ? null : (destCph||null), bcms_reported:false, farmer_id:currentFarmerId};
    moveRecords.push(rec);
  }
  moveSessionRecordId=rec.id;
  await persistAll();
  await syncMoveToSupabase(rec);
  return isNew;
}

let moveHistoryExpanded=false, expandedMoveHistoryId=null, moveHistoryScope=null; // scope: null = all moves, or an animal id = just that animal's moves
function pastMoveRecords(scope){
  const list = scope ? moveRecords.filter(r=>r.animal_ids.includes(scope)) : moveRecords.slice();
  return list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}
// Farm-level 6-day standstill: triggered by the most recent on-farm move.
// Countdown shown = 7 - days elapsed since that move's date; once it reaches
// zero (or below) the standstill has lifted and nothing is shown.
// Farm-level 6-day standstill: triggered by the most recent on-farm move.
// Countdown shown = 7 - days elapsed since that move's date; once it reaches
// zero (or below) the standstill has lifted and nothing is shown.
// Sorted by created_at (an exact timestamp), not date (a plain day string)
// — two on-farm moves can share the same calendar date (e.g. an animal
// moved on and then returned again later the same day), and a date-only
// sort can't reliably tell which one actually happened more recently.
function standstillStatus(){
  const onMoves = moveRecords.filter(r=>r.direction==='on');
  if(!onMoves.length) return null;
  const latest = onMoves.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  const daysLeft = 7 - daysSince(latest.date);
  if(daysLeft<=0) return null;
  return {daysLeft, record:latest};
}
// Most recent move record involving a given animal, so we can tell whether
// it was last moved off the farm (and so is presumed to still be off-farm).
function lastMoveForAnimal(animalId){
  const recs=moveRecords.filter(r=>r.animal_ids.includes(animalId)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  return recs[0]||null;
}
// Any move record (on or off) that's outstanding a BCMS report — used to
// flag the Home Move tile, since the 3-day reporting duty applies to both
// directions, not just the on-farm standstill. Pass an animal id to scope
// this to just that animal's own moves (e.g. the "View previous" bar when
// looking at one animal shouldn't turn red because of an unrelated
// animal's unreported move elsewhere in the herd).
function unreportedMoveCount(scope){
  const list = scope ? moveRecords.filter(r=>r.animal_ids.includes(scope)) : moveRecords;
  return list.filter(r=>!r.bcms_reported).length;
}

// A fodder record's status is 'using' | 'stored' | 'exhausted'. using_started_at
// and exhausted_at record when it last entered those two states — used to show
// the "was Using ... was Exhausted" range in View Previous.
// feedUsageRecords is the audit trail of actual USING periods for a fodder
// record — [{id, feed_record_id, start_date, end_date, end_status}]. A new
// entry starts whenever a record becomes Using; end_date/end_status are
// filled in when it stops (moves to Storage or Exhausted). Storage periods
// themselves aren't tracked — only when the fodder was actually being fed
// out, which is what the usage report needs.
function activeFeedRecords(){
  // Using first (what's actually being fed out matters most day-to-day),
  // then Stored, then alphabetically by type within each — not by purchase
  // date, which isn't that useful once you're just checking what's active.
  return feedRecords.filter(r=>!r.deleted_at && r.status!=='exhausted')
    .sort((a,b)=> (a.status==='using')!==(b.status==='using') ? (a.status==='using'?-1:1) : a.feed_type.localeCompare(b.feed_type));
}
function previousFeedRecords(monthsBack=12){
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-monthsBack);
  return feedRecords.filter(r=>!r.deleted_at && r.status==='exhausted' && r.exhausted_at && new Date(r.exhausted_at)>=cutoff)
    .sort((a,b)=>new Date(b.exhausted_at)-new Date(a.exhausted_at));
}
// Blocks a second status change on the same fodder record on the same
// day — otherwise a quick Using→Storage→Using round trip would leave a
// meaningless same-day entry in the usage audit trail.
function feedUsageChangedToday(recId){
  const t=todayStr();
  return feedUsageRecords.some(u=>u.feed_record_id===recId && (u.start_date===t || u.end_date===t));
}
function feedUsageRecordsFor(recId){
  return feedUsageRecords.filter(u=>u.feed_record_id===recId).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));
}
// Inclusive day count — the start date itself counts as day 1.
function feedUsageDays(u){
  const end=u.end_date||todayStr();
  return Math.round((new Date(end)-new Date(u.start_date))/86400000)+1;
}
function feedUsageTotalDays(recId){
  return feedUsageRecordsFor(recId).reduce((sum,u)=>sum+feedUsageDays(u),0);
}
function setFeedStatus(rec, status){
  const t=todayStr();
  let usageRec;
  if(status==='using'){
    usageRec={id:uuid(), feed_record_id:rec.id, start_date:t, end_date:null, end_status:null};
    feedUsageRecords.push(usageRec);
  } else {
    const open=feedUsageRecords.find(u=>u.feed_record_id===rec.id && u.end_date===null);
    if(open){ open.end_date=t; open.end_status=status; usageRec=open; }
  }
  rec.status=status;
  if(status==='using') rec.using_started_at=new Date().toISOString();
  else if(status==='exhausted') rec.exhausted_at=new Date().toISOString();
  else if(status==='stored') rec.exhausted_at=null; // clear a stale exhausted date if it's ever restored
  // setFeedStatus is called synchronously from many places (sometimes
  // twice in a row, for a clash pair) and its callers already handle
  // persistAll() themselves — these two run in the background rather
  // than being awaited here, same best-effort approach as elsewhere
  // pending the real offline queue.
  syncFeedToSupabase(rec);
  if(usageRec) syncFeedUsageToSupabase(usageRec);
}
// Sets a fodder record to Using — but first checks whether another record
// of the same type is already the one being fed out, since only one really
// should be at a time. If so, asks whether to mark that one exhausted
// before this one takes over (same question whether this is triggered from
// the Add screen or by switching status on an existing Active record).
// onDone runs once whatever the farmer decided has been persisted.
function markFeedUsing(rec, onDone){
  if(feedUsageChangedToday(rec.id)){
    showInfoModal('This fodder record\u2019s status has already changed today \u2014 try again tomorrow.');
    return;
  }
  const clash=feedRecords.find(r=>!r.deleted_at && r.id!==rec.id && r.feed_type===rec.feed_type && r.status==='using');
  if(clash){
    if(feedUsageChangedToday(clash.id)){
      showInfoModal('The current '+escapeHtml(clash.feed_type)+' record\u2019s status has already changed today \u2014 try again tomorrow.');
      return;
    }
    showConfirmModal('This will mark the current '+escapeHtml(rec.feed_type)+' record as being exhausted', async()=>{
      setFeedStatus(clash, 'exhausted');
      setFeedStatus(rec, 'using');
      await persistAll();
      onDone();
    }, ()=>{
      // "No, store this fodder" — leave the clashing record as Using; rec
      // keeps whatever status it already had (Stored, for a brand-new
      // record; unchanged, if switched from the Active list).
      onDone();
    }, 'Yes', 'No, store this fodder');
    return;
  }
  setFeedStatus(rec, 'using');
  persistAll();
  onDone();
}

  if(!ck) return null;
  const concerns=[];
  if(ck.bleeding) concerns.push('bleeding');
  if(ck.non_weight_bearing) concerns.push('cannot put weight on it');
  if(ck.hot_to_touch) concerns.push('hot to touch');
  if(!concerns.length) return {text:'No concerning signs flagged.', color:'var(--green)'};
  if(concerns.length===1) return {text:'Flagged: '+concerns[0]+'. Worth keeping a close eye on.', color:'var(--amber)'};
  return {text:'Flagged: '+concerns.join(', ')+'. This combination is worth a vet call if it doesn\u2019t improve quickly.', color:'var(--red)'};
}

// -> {rag:'red'|'amber'|'green', hits:{key:bool}, missingEssential:[labels], missingUseful:[labels]}
// Rated on the KEY details only (Si, 23 Sep): green = every key detail;
// amber = all but one; red = anything less, or blank. The "useful to add"
// items are still checked and shown as suggestions but don't move the rating.
function farmDetailRating(category, name, details){
  const def=FARM_DETAIL_TYPES[category]||FARM_DETAIL_TYPES.other;
  const d=details||'';
  const text=((name||'')+' \n '+d).toLowerCase();
  const hits={};
  def.checks.forEach(c=>{ hits[c.key] = c.test ? !!c.test(text,d) : c.re.test(text); });
  const ess=def.checks.filter(c=>c.essential), use=def.checks.filter(c=>!c.essential);
  const essHit=ess.filter(c=>hits[c.key]).length, useHit=use.filter(c=>hits[c.key]).length;
  let rag='red';
  if(d.trim()){
    if(essHit===ess.length) rag='green';
    else if(essHit===ess.length-1) rag='amber';
  }
  return { rag, hits,
    missingEssential: ess.filter(c=>!hits[c.key]).map(c=>c.label),
    missingUseful: use.filter(c=>!hits[c.key]).map(c=>c.label) };
}
const FD_RAG_TEXT={green:'Good detail', amber:'Some gaps', red:'Needs more detail'};

}

function fdShortLabel(l){ return l.replace(/\s*\(.*\)\s*$/,'').toLowerCase(); }
