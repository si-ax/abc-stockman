// ================= CALCULATIONS (per calculations deck) =================
function ageMonths(birthIso){
  if(!birthIso) return null;
  const b=new Date(birthIso), n=new Date();
  let m=(n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if(n.getDate() < b.getDate()) m--;
  return Math.max(0, m);
}
function lastBcsRecord(animalId){ return weights.filter(w=>w.animal_id===animalId && w.bcs!=null).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at))[0] || null; }
function lastWeightRecord(animalId){ return weights.filter(w=>w.animal_id===animalId && w.weight_kg!=null).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at))[0] || null; }
// field: omit for "most recent record with either value" (used for the
// "Last recorded" date, since that's about activity on this animal at
// all); pass 'bcs' or 'weight_kg' to find the most recent record that
// specifically has THAT value — needed because a farmer sometimes only
// logs one of the two on a given visit, so the single most-recent record
// overall can easily have the other field blank even when an older
// record does have it (previously this showed "Previous BCS: (none)"
// whenever the latest weigh-in happened to be weight-only, even with real
// BCS history sitting right there one record further back).
function previousWeighRecord(animalId, excludeId, field){
  return weights.filter(w=>w.animal_id===animalId && w.id!==excludeId && (field ? w[field]!=null : (w.weight_kg!=null||w.bcs!=null)))
    .sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at))[0] || null;
}
function weightClosestTo(animalId, daysAgo){
  const target=new Date(); target.setDate(target.getDate()-daysAgo);
  const withW = weights.filter(w=>w.animal_id===animalId && w.weight_kg!=null);
  if(!withW.length) return null;
  let best=null, bestDiff=Infinity;
  withW.forEach(w=>{ const diff=Math.abs(new Date(w.recorded_at)-target); if(diff<bestDiff){bestDiff=diff; best=w;} });
  return best ? best.weight_kg : null;
}

// --- Health Score (0-100) ---
function bcsPoints(a){
  const lw=lastBcsRecord(a.id);
  if(!lw) return {points:0, note:'No BCS recorded'};
  if(lw.bcs===3) return {points:25, note:'BCS 3'};
  if(lw.bcs===2||lw.bcs===4) return {points:15, note:'BCS '+lw.bcs};
  return {points:5, note:'BCS '+lw.bcs};
}
function injuryPoints(a){
  const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-1);
  const recent=injuryRecords.filter(r=>r.animal_id===a.id && new Date(r.recorded_at)>=cutoff);
  if(!recent.length) return {points:20, note:'No injuries in past 12mo'};
  const rated=recent.filter(r=>r.severity!=null);
  if(!rated.length) return {points:15, note:'Injury logged but no severity level given'};
  const worst=Math.max(...rated.map(r=>r.severity));
  if(worst<=2) return {points:15, note:'Worst injury level '+worst};
  if(worst<=4) return {points:10, note:'Worst injury level '+worst};
  return {points:2, note:'Worst injury level '+worst};
}
function illnessPoints(a){
  const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-1);
  // Injury-treatment medicine counts here too, alongside Illness/Disease —
  // an animal needing treatment (e.g. antibiotics) because it couldn't
  // fight off infection from an injury is an illness event in its own
  // right, not just the injury itself (which is already reflected
  // separately in Injury history, via the injury record's own severity).
  // Preventative/Routine/Pregnancy are deliberately still excluded, since
  // none of those represent the animal actually being unwell.
  const count=medicineRecords.filter(r=>r.animal_id===a.id && (r.reason==='illness'||r.reason==='injury') && new Date(r.administered_at)>=cutoff).length;
  if(count===0) return {points:20, note:'No illness treatments in past 12mo'};
  if(count===1) return {points:15, note:'1 illness treatment in past 12mo'};
  return {points:5, note:count+' illness treatments in past 12mo'};
}
function weightTrendPoints(a){
  const current=lastWeightRecord(a.id);
  if(!current) return {points:15, note:'No weight recorded — assumed stable', assumed:true};
  const w90=weightClosestTo(a.id,90) ?? current.weight_kg;
  const pct = w90 ? ((current.weight_kg-w90)/w90)*100 : 0;
  // ASSUMPTION: thresholds not specified in the deck — using +/-2% and +/-10% as reasonable bands. Confirm with farm/vet.
  if(pct>=2) return {points:20, note:'Increasing ('+pct.toFixed(1)+'% vs ~90d ago)', assumed:true};
  if(pct>=-2) return {points:15, note:'Stable ('+pct.toFixed(1)+'% vs ~90d ago)', assumed:true};
  if(pct>=-10) return {points:9, note:'Slight decrease ('+Math.abs(pct).toFixed(1)+'% vs ~90d ago)', assumed:true};
  return {points:2, note:'Rapid decrease ('+Math.abs(pct).toFixed(1)+'% vs ~90d ago)', assumed:true};
}
function breedPrimeAge(breedId){
  const b=breeds.find(x=>x.id===breedId);
  return { min: (b&&b.min_prime_months!=null)?b.min_prime_months:18, max: (b&&b.max_prime_months!=null)?b.max_prime_months:30 };
}
// Used to highlight the D.O.B field on the animal details screen (green
// background) when the animal currently sits in its breed's Prime age
// range — same range agePointsCalc() below scores against, so the visual
// cue and the Health Score's Age factor always agree with each other.
function isPrimeAge(a){
  const months=ageMonths(a.birth_date);
  if(months===null) return false;
  const {min:minP, max:maxP}=breedPrimeAge(a.breed_id);
  return months>=minP && months<=maxP;
}
function agePointsCalc(a){
  const months=ageMonths(a.birth_date);
  if(months===null) return {points:9, note:'D.O.B not recorded — age assumed Approaching Prime', assumed:true};
  const {min:minP, max:maxP}=breedPrimeAge(a.breed_id);
  const minMinus20=minP*0.8, maxPlus20=maxP*1.2;
  if(months<=minMinus20) return {points:7, note:months+'mo — well below Prime'};
  if(months<minP) return {points:9, note:months+'mo — approaching Prime'};
  if(months<=maxP) return {points:15, note:months+'mo — in Prime range'};
  if(months<=maxPlus20) return {points:5, note:months+'mo — just past Prime'};
  return {points:3, note:months+'mo — well past Prime'};
}
function healthScore(a){
  const bcs=bcsPoints(a), inj=injuryPoints(a), ill=illnessPoints(a), wt=weightTrendPoints(a), age=agePointsCalc(a);
  const total=bcs.points+inj.points+ill.points+wt.points+age.points;
  const color = total>=90?'green' : total<=50?'red' : 'amber';
  return {total, color, breakdown:[
    {label:'Body condition score', ...bcs},
    {label:'Injury history', ...inj},
    {label:'Illness history', ...ill},
    {label:'Weight trend', ...wt},
    {label:'Age', ...age},
  ]};
}

// --- Confidence (0-100) ---
function daysSince(iso){ if(!iso) return null; return Math.floor((new Date()-new Date(iso))/86400000); }
// Calves must get two approved ear tags, usually within 20 days of birth.
// No EID yet + within 20 days of birth = amber warning; no EID and past 20
// days (or no D.O.B. recorded at all, treated as overdue) = red.
function eidStatusColor(eid, birthDate){
  if(eid) return null;
  if(!birthDate) return 'red';
  return daysSince(birthDate) > 20 ? 'red' : 'amber';
}
// TB testing: locate the locked "TB test" medicine type and check whether
// an animal has a record of one within the last 6 months. No record at all
// counts as overdue. This is a warning-only check throughout the app — it
// never blocks a move, it just flags it.
function tbTestTypeId(){
  const t=medicineTypes.find(m=>m.locked && m.name.trim().toLowerCase()==='tb test');
  return t?t.id:null;
}
function lastTbTestDate(animalId){
  const tbId=tbTestTypeId();
  if(!tbId) return null;
  const recs=medicineRecords.filter(r=>r.animal_id===animalId && r.medicine_type_id===tbId)
    .sort((a,b)=>new Date(b.administered_at)-new Date(a.administered_at));
  return recs.length ? recs[0].administered_at : null;
}
function tbTestOverdue(animalId){
  const last=lastTbTestDate(animalId);
  if(!last) return true;
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-6);
  return new Date(last) < cutoff;
}
// Combined move risk check: an animal that's still in an active medicine
// withdrawal, or overdue/missing a TB test, is a legal/food-safety hazard
// to move at all — on farm or off — regardless of whether the farmer's eye
// happens to catch it. This used to only ever surface at the very end, in
// the "Mark as sold" modal — by which point the animal may already have
// left the farm and been sold, too late for the warning to change
// anything. Surfacing it here, at the point of actually adding the animal
// to a move, is what the warning is supposed to be for.
function animalMoveRisk(animalId){
  return !!activeWithdrawal(animalId) || tbTestOverdue(animalId);
}
// --- Statutory reporting deadlines (BCMS/CTS) ---
// These track the *notification* deadlines that carry real legal weight —
// not the separate (and shorter) on-farm herd-register deadlines, which
// this app doesn't need to model since the app itself functions as that
// register. Each returns null once marked reported, or {daysLeft, overdue}
// while a report is still outstanding (daysLeft goes negative once overdue,
// but overdue is the flag to check — the obligation doesn't expire, it's
// just late). These are informational only and never block anything.
//
// Birth registration is only this farm's job for animals actually born
// here. A bought-in animal must already have a passport to be legally
// sold — which means its birth was necessarily registered by the previous
// keeper already — so it's identified here by having a purchase price
// recorded, and skipped entirely rather than guessed at from D.O.B./date
// patterns (an unknown D.O.B. or an already-overdue-looking one on a
// home-bred calf is exactly the case this warning most needs to catch,
// not a case to quietly wave through).
function birthReportStatus(a){
  if(a.bcms_birth_reported || !a.birth_date) return null;
  if(a.purchase_price!=null) return null; // bought in (any price, including £0 for a free transfer) — previous keeper's obligation, not ours
  const daysLeft = 27 - daysSince(a.birth_date);
  return { daysLeft, overdue: daysLeft<=0 };
}
function moveReportStatus(rec){
  if(rec.bcms_reported) return null;
  const daysLeft = 3 - daysSince(rec.date);
  return { daysLeft, overdue: daysLeft<=0 };
}
function deathReportStatus(a){
  if(a.status!=='dead' || a.bcms_death_reported) return null;
  const evs=events[a.id]||[];
  const deathEvent=evs.slice().reverse().find(e=>e.to_status==='dead');
  const deathDate = deathEvent ? deathEvent.created_at : a.updated_at;
  if(!deathDate) return null;
  const daysLeft = 7 - daysSince(deathDate);
  return { daysLeft, overdue: daysLeft<=0 };
}
function recencyScore(daysAgo){
  if(daysAgo==null) return 0;
  if(daysAgo<=30) return 50;
  if(daysAgo<=90) return 40;
  if(daysAgo<=180) return 25;
  if(daysAgo<=365) return 10;
  return 0;
}
function confidenceScore(a){
  const lastBcs=lastBcsRecord(a.id), lastW=lastWeightRecord(a.id);
  const bcsDays=lastBcs?daysSince(lastBcs.recorded_at):null;
  const wDays=lastW?daysSince(lastW.recorded_at):null;
  const bcsScore=recencyScore(bcsDays), wScore=recencyScore(wDays);
  const total=bcsScore+wScore;
  const label = total>=90?'HIGH' : total<=60?'LOW' : 'MEDIUM';
  return {total, label, breakdown:[
    {label:'BCS last recorded', note: bcsDays==null?'Never':bcsDays+' days ago', points:bcsScore},
    {label:'Weight last recorded', note: wDays==null?'Never':wDays+' days ago', points:wScore},
  ]};
}

// --- Market value & cost ---
function marketValue(a){
  const breed=breeds.find(b=>b.id===a.breed_id);
  const lastW=lastWeightRecord(a.id);
  if(!breed || breed.price_per_kg==null || !lastW) return null;
  return lastW.weight_kg * breed.price_per_kg;
}
function medicineCostTotal(a){
  return medicineRecords.filter(r=>r.animal_id===a.id && r.cost!=null).reduce((s,r)=>s+r.cost,0);
}
function totalCost(a){
  return (a.purchase_price||0) + medicineCostTotal(a);
}
function estimatedProfit(a){
  const mv=marketValue(a);
  if(mv==null) return null;
  return mv - totalCost(a);
}

// Was this animal 'active' on a given date, per its own status event history?
// Used to decide (a) whether it should share in a feed period's cost, and
// (b) the herd size to divide that period's cost across.
function wasAnimalActiveOnDate(animalId, dateStr){
  const evs=(events[animalId]||[]).filter(e=>e.created_at.slice(0,10)<=dateStr).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!evs.length) return false; // didn't exist yet on that date
  return evs[0].to_status==='active';
}
function activeAnimalCountOnDate(dateStr){
  return animals.filter(a=>wasAnimalActiveOnDate(a.id, dateStr)).length;
}
function feedRecordCost(r){ return r.total_cost!=null ? r.total_cost : (r.sack_price||0)*(r.sacks||0); }

// Guide cost, not an accurate expense (per the spec): each feed purchase's
// total cost is split evenly across whoever was active on the farm on the
// day that purchase was logged, and an animal accumulates a share for every
// purchase it was present for during its time on the farm.
function feedCostTotal(animalId){
  let total=0;
  feedRecords.filter(r=>!r.deleted_at).forEach(r=>{
    if(!wasAnimalActiveOnDate(animalId, r.start_date)) return;
    const herdSize=activeAnimalCountOnDate(r.start_date);
    if(herdSize>0) total += feedRecordCost(r)/herdSize;
  });
  return total;
}
function recentFeedRecords(monthsBack=1){
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-monthsBack);
  return feedRecords.filter(r=>!r.deleted_at && new Date(r.start_date)>=cutoff).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));
}

// medicineTypes doubles as the Medicine Cabinet: each entry (other than the
// locked TB-test entry, which isn't real stock) is one purchased batch —
// product name, type/category, batch, expiry, total size/qty, cost,
// supplier, default withdrawal & dosage/kg. disposed_at marks it gone.

// Where "+ Add new person"-style shortcuts return to once a new cabinet

let medDisposeTargetId=null;
function activeCabinetItems(){ return medicineTypes.filter(m=>!m.locked && !m.disposed_at); }
function previousCabinetItems(monthsBack=12){

  return medicineTypes.filter(m=>!m.locked && m.disposed_at && new Date(m.disposed_at)>=cutoff)

}
// How much of this batch has actually gone out to animals — only doses
// drawn from the farmer's own cabinet count (a vet using their own stock
// doesn't touch this batch at all, even if the product name matches).
function cabinetUsed(m){
  return medicineRecords.filter(r=>r.medicine_type_id===m.id && r.stock==='farmer' && r.dosage_amount!=null)
    .reduce((sum,r)=>sum+r.dosage_amount, 0);
}
function cabinetRemaining(m){ return (m.qty_size||0) - cabinetUsed(m); }
// The effective £ per ml/tab/gr, derived from total cost over total size —
// replaces the old manually-set £/unit price with something that can't
// drift out of sync with what was actually paid for the batch.
function cabinetUnitCost(m){ return (m.cost!=null && m.qty_size) ? m.cost/m.qty_size : null; }
function cabinetExpiryStatus(m){
  if(!m.expiry_date) return null;
  const exp=new Date(m.expiry_date);
  if(exp < new Date()) return 'red';
  const monthOut=new Date(); monthOut.setMonth(monthOut.getMonth()+1);
  if(exp <= monthOut) return 'amber';
  return null;
}
function cabinetRemainingStatus(m){
  const remaining=cabinetRemaining(m);
  if(remaining<=0) return 'red';
  if(m.qty_size && remaining<=m.qty_size*0.1) return 'amber';
  return null;
}

// ================= AI INSIGHTS (Claude Vision, runs automatically once online) =================
async function analyzeInjury(rec){
  if(!userSettings.gemini_api_key){
    rec.analysis_status='failed';
    logMsg('Insights: analysis needs a Gemini API key set up in Settings \u2014 add yours to enable this.');
    await persistAll();
    await syncInjuryToSupabase(rec);
    render();
    return;
  }
  rec.analysis_status='analyzing';
  render();
  try{
    let media_type, base64;
    const dataMatch=(rec.photo_data||'').match(/^data:(image\/[a-zA-Z]+);base64,(.*)$/);
    if(dataMatch){
      media_type=dataMatch[1]; base64=dataMatch[2];
    } else if(rec.photo_data){
      // Now a Storage URL rather than inline base64 (see
      // uploadPhotoToStorage) — Gemini's inline_data needs the actual
      // bytes, not a link, so fetch it back down and re-encode.
      const resp=await fetch(rec.photo_data);
      if(!resp.ok) throw new Error('Couldn\u2019t fetch the photo to analyze it (status '+resp.status+')');
      const blob=await resp.blob();
      media_type=blob.type||'image/jpeg';
      base64=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result.split(',')[1]);
        reader.onerror=()=>reject(new Error('image read failed'));
        reader.readAsDataURL(blob);
      });
    } else {
      throw new Error('No usable photo on this record');
    }
    const a=animals.find(x=>x.id===rec.animal_id);
    const ck=rec.checklist||{};
    const promptText=`You are assisting a farmer reviewing a livestock injury photo taken in the field.
Animal: ${a?(animalDisplayName(a)):'unknown'}${a?', '+breedName(a.breed_id):''}
Body part: ${rec.body_part||'not specified'}
Farmer's account of the cause: ${rec.cause||'(none given)'}
Farmer's notes: ${rec.notes||'(none given)'}
Farmer's severity rating (1=minor, 5=severe): ${rec.severity!=null?rec.severity:'not rated'}
Quick check from the farmer: bleeding=${!!ck.bleeding}, cannot_put_weight_on_it=${!!ck.non_weight_bearing}, hot_to_touch=${!!ck.hot_to_touch}

Look at the photo together with this information. Respond ONLY with JSON, no other text, in exactly this shape:
{"diagnosis": "short plain-language assessment of what this looks like, 1-2 sentences", "treatment": "practical next-step advice for the farmer, 2-3 sentences, plain language, field-appropriate", "confidence": "high", "vet_recommended": true}
(confidence must be exactly "high", "medium", or "low"; vet_recommended must be a real boolean)`;
    // Same model-candidate/timeout/retry pattern as readAnimalFromPassportGemini
    // and askFarmQuestionGemini — this used to call api.anthropic.com
    // directly with no key, which only ever worked inside a Claude.ai
    // artifact preview, not on a real deployed site like this one.
    const GEMINI_TIMEOUT_MS=20000; // a diagnosis needs more room than a quick tag/passport read
    let lastErr, parsed;
    for(const model of GEMINI_MODEL_CANDIDATES){
      const controller=new AbortController();
      const timeoutId=setTimeout(()=>controller.abort(), GEMINI_TIMEOUT_MS);
      let resp;
      try{
        resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent', {
          method:'POST',
          headers:{'Content-Type':'application/json', 'x-goog-api-key':userSettings.gemini_api_key},
          body:JSON.stringify({
            contents:[{parts:[{text:promptText},{inline_data:{mime_type:media_type, data:base64}}]}],
            generationConfig:{temperature:0.2, maxOutputTokens:500, thinkingConfig:{thinkingBudget:0}},
          }),
          signal:controller.signal,
        });
      }catch(networkErr){
        const timedOut = networkErr.name==='AbortError';
        lastErr = timedOut ? new Error('Gemini ('+model+') timed out after '+(GEMINI_TIMEOUT_MS/1000)+'s (weak/slow signal)') : networkErr;
        if(!timedOut) throw lastErr;
        continue;
      } finally {
        clearTimeout(timeoutId);
      }
      if(resp.ok){
        const json=await resp.json();
        const text=json?.candidates?.[0]?.content?.parts?.[0]?.text;
        const finishReason=json?.candidates?.[0]?.finishReason;
        if(!text) throw new Error('Gemini ('+model+') returned no readable text (finishReason: '+(finishReason||'unknown')+')');
        const cleaned=text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
        try{ parsed=JSON.parse(cleaned); }catch(parseErr){ throw new Error('Gemini ('+model+') reply couldn\u2019t be read as data: \u201c'+cleaned.slice(0,120)+'\u201d'); }
        break;
      }
      const errBody=await resp.text().catch(()=>'');
      lastErr=new Error('Gemini ('+model+') request failed ('+resp.status+'): '+errBody.slice(0,150).trim());
      const worthRetrying = resp.status===404 || resp.status===429 || resp.status>=500;
      if(!worthRetrying) throw lastErr;
    }
    if(!parsed) throw lastErr;
    rec.ai_diagnosis=parsed.diagnosis||null;
    rec.ai_treatment=parsed.treatment||null;
    rec.ai_confidence=parsed.confidence||null;
    rec.ai_vet_recommended=!!parsed.vet_recommended;
    rec.analysis_status='analyzed';
    rec.analyzed_at=new Date().toISOString();
    logMsg('Insights: analysis ready for <b>'+(a?(animalDisplayName(a)):'an animal')+'</b>\u2019s injury.');
  }catch(e){
    rec.analysis_status='failed';
    logMsg('Insights: analysis failed (&ldquo;'+e.message+'&rdquo;) &mdash; will retry once reconnected.');
  }
  await persistAll();
  await syncInjuryToSupabase(rec);
  render();
}

function render(){
  if(isLockedOut() && view!=='locked'){ view='locked'; }
  if(!suppressHistoryPush && lastSnapshot && lastSnapshot.view!==view){
    navStack.push(lastSnapshot);
    if(navStack.length>30) navStack.shift();
  }
  suppressHistoryPush=false;
  updateStats();
  const screen=document.getElementById('screen');
  // A same-screen re-render (e.g. toggling an expander) shouldn't reset
  // scroll to the top the way navigating to a genuinely different screen
  // should. screen.innerHTML below always creates a brand new .body
  // element, which starts at scrollTop 0 regardless — without this, the
  // whole list would flash to the top before any scrollIntoView call even
  // runs, then visibly animate all the way back down to wherever the
  // toggled row actually was. Fixed once, centrally, here, rather than
  // needing every individual toggle in the app to remember to do it.
  const sameScreen = lastSnapshot && lastSnapshot.view===view;
  const prevScrollEl = sameScreen ? document.querySelector('.body') : null;
  const savedScroll = prevScrollEl ? prevScrollEl.scrollTop : 0;
  // Same idea, but for focus + cursor position rather than scroll. Screens
  // that auto-save a field on blur (Move, Damage — no dedicated Save
  // button) call render() from inside that very field's onchange handler.
  // Since screen.innerHTML below throws away and recreates every element,
  // whatever had focus a moment ago (often the NEXT field, if the person
  // had just tabbed/Enter-ed forward into it) gets silently replaced by an
  // unfocused twin with the same id — so advancing focus and then
  // auto-saving in the same breath looked like "Next doesn't work" even
  // though the focus() call itself was firing correctly. Re-finding the
  // same id post-render and restoring both focus and cursor position
  // fixes that everywhere this pattern occurs, rather than patching each
  // auto-saving screen individually.
  const activeEl=document.activeElement;
  const focusedId = (activeEl && activeEl.id && screen.contains(activeEl)) ? activeEl.id : null;
  const focusedSelection = (focusedId && typeof activeEl.selectionStart==='number') ? [activeEl.selectionStart, activeEl.selectionEnd] : null;
  const dispatch={
    home:renderHome, herd:renderHerd, detail:renderDetail, animalDetails:renderAnimalDetails,
    archive:renderArchive, profitScore:renderProfitScore,
    add:renderAdd, settings:renderSettings, weigh:renderWeigh, feed:renderFeed, feedAdd:renderFeedAdd, medicine:renderMedicine, medicineAdd:renderMedicineAdd, medCabinetAdd:renderMedCabinetAdd, medDispose:renderMedDispose, injury:renderInjury, injuryAdd:renderInjuryAdd,
    breeding:renderBreeding,
    move:renderMove,
    damage:renderDamageList, damageAdd:renderDamageAdd, healthScore:renderHealthScoreScreen,
    insights:renderInsights,
    reports:renderReports, reportDetail:renderReportDetail, ask:renderAsk, breedValue:renderBreedValue,
    login:renderLogin,
    supaLogin:renderSupaLogin,
    supaWaiting:renderSupaWaiting,
    locked:renderLocked,
    timeline:renderTimeline,
    walkthrough:renderWalkthrough,
  };
  screen.innerHTML = (dispatch[view]||renderHome)();
  lastSnapshot=snapshotState();
  if(sameScreen){
    const newScrollEl=document.querySelector('.body');
    if(newScrollEl) newScrollEl.scrollTop=savedScroll;
  }
  if(focusedId){
    const restored=document.getElementById(focusedId);
    if(restored && typeof restored.focus==='function'){
      restored.focus();
      if(focusedSelection && typeof restored.setSelectionRange==='function'){
        try{ restored.setSelectionRange(focusedSelection[0], focusedSelection[1]); }catch(e){ /* wrong input type for selection - ignore */ }
      }
    }
  }
  wireView();
  if(modal) renderModal();
  if(showFilterModal) renderFilterModal();
  updateSignalBadge();
}

function renderLocked(){
  return `
    <div style="display:flex;flex-direction:column;min-height:100%;">
      <div style="border:1px solid var(--line);border-radius:14px;margin:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column;flex:1;">
        <div style="padding:32px 22px 4px;text-align:center;">
          <div style="font-size:16px;font-weight:700;margin-bottom:10px;">This trial has ended</div>
          <div style="font-size:14px;color:var(--grey);">This is a prototype build of aBC Stockman \u2014 its trial period has ended. Get in touch to keep using it.</div>
        </div>
        <div style="padding:22px 22px 4px;">
          <label>Unlock code</label>
          <input type="password" id="lockoutPassword" autocapitalize="off" autocorrect="off" spellcheck="false">
          ${lockoutError?`<div class="field-error" style="margin-top:8px;">${lockoutError}</div>`:''}
        </div>
        <div style="flex:1;"></div>
        <div style="padding:16px 22px 22px;">
          <button id="lockoutUnlockBtn" class="fullbtn" style="margin-top:0;">Unlock</button>
        </div>
      </div>
    </div>`;
}

function outstandingBcmsItems(){
  const items=[];
  moveRecords.forEach(r=>{
    const st=moveReportStatus(r);
    if(st) items.push({kind:'move', id:r.id, label:fmtShortDate(r.date)+(r.direction?' ('+(r.direction==='off'?'Off farm':'On farm')+')':''), sub:st.overdue?'OVERDUE':st.daysLeft+' day'+(st.daysLeft===1?'':'s')+' left', overdue:st.overdue});
  });
  animals.forEach(a=>{
    const bst=birthReportStatus(a);
    if(bst) items.push({kind:'birth', id:a.id, label:animalDisplayName(a), sub:bst.overdue?'OVERDUE':bst.daysLeft+' day'+(bst.daysLeft===1?'':'s')+' left', overdue:bst.overdue});
    const dst=deathReportStatus(a);
    if(dst) items.push({kind:'death', id:a.id, label:animalDisplayName(a), sub:dst.overdue?'OVERDUE':dst.daysLeft+' day'+(dst.daysLeft===1?'':'s')+' left', overdue:dst.overdue});
  });
  items.sort((x,y)=>(y.overdue?1:0)-(x.overdue?1:0));
  return items;
}

const BIRTHING_EASE_OPTIONS=[
  {key:'easy', label:'Easy', color:'green'},
  {key:'assisted', label:'Assisted', color:'amber'},
  {key:'difficult', label:'Difficult', color:'red'},
  {key:'caesarean', label:'Caesarean', color:'red'},

const MOTHERING_ABILITY_OPTIONS=[
  {key:'excellent', label:'Excellent', color:'green'},
  {key:'very_good', label:'Very good', color:'green'},

  {key:'fair', label:'Fair', color:'amber'},

function lastBreedingRecord(animalId, field){
  return breedingRecords.filter(r=>r.animal_id===animalId && r.field===field).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0] || null;
}
// Breeding-tile colour/warning logic, driven by the animal's own past
// birthing ease / mothering ability ratings — worst-signal-wins ordering.
function breedingTileStatus(a){
  const easeRec=lastBreedingRecord(a.id,'birthing_ease');
  const motherRec=lastBreedingRecord(a.id,'mothering_ability');
  const easeColor = easeRec ? (BIRTHING_EASE_OPTIONS.find(o=>o.key===easeRec.value)||{}).color : null;
  const motherColor = motherRec ? (MOTHERING_ABILITY_OPTIONS.find(o=>o.key===motherRec.value)||{}).color : null;

  if(a.offspring_status==='pregnant'){
    if(easeColor==='red') return {color:'var(--red)', warn:true};
    if(easeColor==='amber') return {color:'var(--amber)', warn:true};
    return {color:'var(--green)', warn:false}; // green if 'green' or if never recorded — no known problem
  }
  if(a.offspring_status==='with_offspring'){
    if(motherColor==='red') return {color:'var(--red)', warn:true};
    if(motherColor==='amber') return {color:'var(--amber)', warn:true};
    return {color:'var(--green)', warn:false}; // green if 'green' or if never recorded — no known problem
  }
  // neither pregnant nor with offspring — a general caution based on past record
  const hasRed = easeColor==='red' || motherColor==='red';
  const hasAmber = easeColor==='amber' || motherColor==='amber';
  if(hasRed) return {color:'var(--red)', warn:false};
  if(hasAmber) return {color:'var(--amber)', warn:false};
  return {color:null, warn:false};
}

function monthLabel(d){ return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'}); }
// Simple inline SVG multi-line chart — used for the Feed cost report's
// past-12-months-by-fodder-type breakdown. No external charting library.
function renderMultiLineChart(labels, series){
  const w=320, h=170, padL=30, padR=8, padT=10, padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const maxVal=Math.max(1, ...series.flatMap(s=>s.values));
  const n=labels.length;
  const xFor=(i)=> padL + (n<=1?0:(i/(n-1))*plotW);
  const yFor=(v)=> padT + plotH - (v/maxVal)*plotH;
  const colors=['#1a8a4a','#c98400','#b3261e','#2f6fed','#8a3ea1','#c2185b','#00838f','#6d4c41'];
  const gridLines=[0,0.5,1].map(f=>{
    const y=padT+plotH-f*plotH;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e5e5e5" stroke-width="1"/><text x="${padL-4}" y="${y+3}" font-size="7" fill="#767462" text-anchor="end">${fmtGBP(maxVal*f,0)}</text>`;
  }).join('');
  const xLabels=labels.map((lb,i)=>{
    if(n>8 && i%2!==0 && i!==n-1) return '';
    return `<text x="${xFor(i)}" y="${h-6}" font-size="7.5" fill="#767462" text-anchor="middle">${lb.split(' ')[0]}</text>`;
  }).join('');
  const lines=series.map((s,si)=>{
    const color=colors[si%colors.length];
    const pts=s.values.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
    const dots=s.values.map((v,i)=>`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="2.2" fill="${color}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const legend=series.map((s,si)=>{
    const color=colors[si%colors.length];
    return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;margin-bottom:4px;"><span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;flex-shrink:0;"></span><span style="font-size:11px;color:var(--ink);">${escapeHtml(s.type)}</span></span>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
      ${gridLines}
      ${lines}
      ${xLabels}
    </svg>
    <div style="display:flex;flex-wrap:wrap;margin-top:6px;">${legend}</div>`;
}
// Compact snapshot of the farm's local data, handed to the "Ask" feature as
// context. Deliberately current-state summaries rather than full history
// (no per-record event logs) to keep this a reasonable size regardless of
// herd size — the model reasons over "what's true now", not the whole
// timeline. Works fully offline since it only reads what's already in
// local storage.
function buildFarmDataContext(){
  const animalsData = animals.map(a=>{
    const lw=lastWeightRecord(a.id);
    const wd=activeWithdrawal(a.id);
    const openInj=worstOpenInjury(a);
    const mother=a.mother_id?animals.find(x=>x.id===a.mother_id):null;
    const father=a.father_id?animals.find(x=>x.id===a.father_id):null;
    return {
      name_or_tag: animalDisplayName(a),
      tag_number: a.tag_number,
      name: a.name||null,
      eid: a.eid||null,
      breed: breedName(a.breed_id),
      sex: a.sex==='F'?'female':'male',
      status: a.status,
      birth_date: a.birth_date ? a.birth_date.slice(0,10) : null,
      purchase_price_gbp: a.purchase_price!=null ? a.purchase_price : null,
      last_weight_kg: lw ? lw.weight_kg : null,
      last_weight_date: lw ? lw.recorded_at.slice(0,10) : null,
      last_bcs_1to5: lw ? lw.bcs : null,
      currently_in_medicine_withdrawal_until: wd ? wd.withdrawal_until.slice(0,10) : null,
      open_injury: openInj ? { body_part: openInj.body_part, severity_1to5: openInj.severity } : null,
      mother: mother ? animalDisplayName(mother) : null,
      father: father ? animalDisplayName(father) : null,
    };
  });
  const totalFeedCostGbp = +feedRecords.filter(r=>!r.deleted_at).reduce((s,r)=>s+feedRecordCost(r),0).toFixed(2);
  const totalMedicineCostGbp = +medicineRecords.reduce((s,r)=>s+(r.cost||0),0).toFixed(2);
  const movesSummary = moveRecords.map(r=>({
    date:r.date, direction:r.direction, location:r.location, animal_count:r.animal_ids.length, reported_to_bcms:!!r.bcms_reported,
  }));
  return {
    today: todayStr(),
    farm: { cph: farmSettings.cph||null },
    animal_count: animals.length,
    animals: animalsData,
    totals: { feed_cost_gbp_alltime: totalFeedCostGbp, medicine_cost_gbp_alltime: totalMedicineCostGbp },
    moves: movesSummary,
    breeds_in_use: [...new Set(animalsData.map(a=>a.breed))],
  };
}
function reportVetSpendByMonth(monthsBack=6){
  const now=new Date(); const result=[];
  for(let m=0;m<monthsBack;m++){
    const d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    const total=medicineRecords.filter(r=>{
      if(r.cost==null) return false;
      const fv=farmersVets.find(p=>p.id===r.farmer_vet_id);
      if(!fv||fv.role!=='vet') return false;
      const rd=new Date(r.administered_at);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
    }).reduce((s,r)=>s+r.cost,0);
    result.push({label:monthLabel(d), total});
  }
  return result;
}
// Actual realised gain/loss per month, from animals actually sold, died,
// swapped or stolen — as opposed to the ROI/Livestock Value reports, which
// are estimates against animals still on the farm. Only animals with a
// recorded exit value count (set when the animal was marked as exited —
// see the exit modal); older records made before that field existed won't
// have one and are simply skipped, not treated as zero.
function reportRealizedByMonth(monthsBack=6){
  const now=new Date(); const result=[];
  for(let m=0;m<monthsBack;m++){
    const d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    const exited=animals.filter(a=>{
      if(a.realized_value==null || !a.realized_value_date) return false;
      const rd=new Date(a.realized_value_date);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
    });
    result.push({label:monthLabel(d), total:exited.reduce((s,a)=>s+a.realized_value,0), animals:exited});
  }
  return result;
}
function reportFeedCostByMonth(monthsBack=6, typeFilter=null){
  const now=new Date(); const result=[];
  for(let m=0;m<monthsBack;m++){
    const d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    const total=feedRecords.filter(r=>{
      if(r.deleted_at) return false;
      if(typeFilter && r.feed_type!==typeFilter) return false;
      const rd=new Date(r.start_date);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
    }).reduce((s,r)=>s+feedRecordCost(r),0);
    result.push({label:monthLabel(d), total});
  }
  return result;
}
// Past 12 months, one cost total per fodder type per month — feeds the
// multi-line chart on the Feed cost report. typeFilter restricts both
// which types get their own line AND which records count at all, so the
// chart and the month-by-month totals/list below it always agree.
function reportFeedCostByTypeMonth(monthsBack=12, typeFilter=null){
  const now=new Date();
  const months=[];
  for(let m=monthsBack-1;m>=0;m--) months.push(new Date(now.getFullYear(), now.getMonth()-m, 1));
  const live=feedRecords.filter(r=>!r.deleted_at && (!typeFilter || r.feed_type===typeFilter));
  const types=[...new Set(live.map(r=>r.feed_type))].sort();
  const series=types.map(type=>({
    type,
    values: months.map(d=>live.filter(r=>{
      if(r.feed_type!==type) return false;
      const rd=new Date(r.start_date);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
    }).reduce((s,r)=>s+feedRecordCost(r),0)),
  }));
  return {labels:months.map(monthLabel), series};
}
function reportLivestockValue(){
  const active=animals.filter(a=>a.status==='active');
  let total=0; const byBreed={};
  active.forEach(a=>{
    const mv=marketValue(a)||0;
    total+=mv;
    const bn=breedName(a.breed_id);
    byBreed[bn]=(byBreed[bn]||0)+mv;
  });
  return {total, count:active.length, byBreed};
}
function reportROI(){
  const active=animals.filter(a=>a.status==='active');
  let totalCostSum=0, totalValue=0; const rows=[];
  active.forEach(a=>{
    const mv=marketValue(a);
    if(mv==null) return;
    const cost=totalCost(a);
    totalCostSum+=cost; totalValue+=mv;
    rows.push({a, cost, value:mv, roi: cost>0?((mv-cost)/cost*100):null});
  });
  rows.sort((x,y)=>(y.roi==null?-999:y.roi)-(x.roi==null?-999:x.roi));
  return {totalCost:totalCostSum, totalValue, roiPct: totalCostSum>0?((totalValue-totalCostSum)/totalCostSum*100):null, rows};
}
function reportAnimalsToSell(recommend){
  const active=animals.filter(a=>a.status==='active');
  const scored=active.map(a=>{
    const hs=healthScore(a);
    const months=ageMonths(a.birth_date);
    const {min:minP, max:maxP}=breedPrimeAge(a.breed_id);
    const isPrime = months!=null && months>=minP && months<=maxP;
    const breeding = a.offspring_status==='pregnant'||a.offspring_status==='with_offspring';
    const profit=estimatedProfit(a);
    return {a, hs, isPrime, breeding, profit, months};
  });
  if(recommend){
    return scored.filter(s=>s.isPrime && s.hs.color!=='red' && !s.breeding && s.profit!=null && s.profit>0)
      .sort((x,y)=>(y.profit||0)-(x.profit||0));
  }
  return scored.filter(s=>!s.isPrime || s.breeding || s.hs.color==='red')
    .sort((x,y)=>x.months-y.months);
}

// Per-flag-type detail shown alongside each animal in an Insights expander,
// so the farmer can often see what they need without drilling further in.
function worstOpenInjury(a){
  const rated=openInjuries(a.id).filter(r=>r.severity!=null);
  if(!rated.length) return openInjuries(a.id)[0] || null;
  return [...rated].sort((x,y)=>y.severity-x.severity || new Date(y.recorded_at)-new Date(x.recorded_at))[0];
}
function insightDetail(flagKey, a){
  if(flagKey==='notweighed'){
    const lw=lastWeightRecord(a.id);
    const text = lw ? 'Last weighed '+fmtShortDate(lw.recorded_at) : 'Never weighed';
    return '<span style="font-size:13px;background:var(--amber);color:#fff;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;">'+text+'</span>';
  }
  if(flagKey==='redhealth'){
    return '<span style="font-size:13px;background:var(--red);color:#fff;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;">Score: '+healthScore(a).total+'</span>';
  }
  if(flagKey==='declining'){
    const b=healthScore(a).breakdown.find(x=>x.label==='Weight trend');
    if(!(b && b.note)) return '';
    return '<span style="font-size:13px;background:var(--amber);color:#fff;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;">'+b.note+'</span>';
  }
  if(flagKey==='withdrawal'){
    const wd=activeWithdrawal(a.id);
    if(!wd) return '';
    return '<span style="font-size:13px;background:var(--red);color:#fff;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;">Until '+fmtShortDate(wd.withdrawal_until)+'</span>';
  }
  if(flagKey==='openinjury'){
    const inj=worstOpenInjury(a);
    if(!inj) return '';
    const levelText = inj.severity!=null ? ' (level '+inj.severity+')' : '';
    const bg = inj.severity!=null ? injurySeverityColor(inj.severity) : 'var(--grey)';
    return '<span style="font-size:13px;background:'+bg+';color:#fff;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;">'+bodyPartLabel(inj.body_part)+levelText+'</span>';
  }
  if(flagKey==='breedingwarning'){
    const bs=breedingTileStatus(a);
    const easeRec=lastBreedingRecord(a.id,'birthing_ease');
    const motherRec=lastBreedingRecord(a.id,'mothering_ability');
    const parts=[];
    if(easeRec) parts.push('Ease: '+(BIRTHING_EASE_OPTIONS.find(o=>o.key===easeRec.value)||{}).label);
    if(motherRec) parts.push('Mothering: '+(MOTHERING_ABILITY_OPTIONS.find(o=>o.key===motherRec.value)||{}).label);
    return '<span style="font-size:13px;background:'+bs.color+';color:#fff;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;">'+parts.join(', ')+'</span>';
  }
  if(flagKey==='offfarm'){
    const lm=lastMoveForAnimal(a.id);
    if(!lm) return '';
    const text=(lm.location?escapeHtml(lm.location)+' \u2014 ':'')+fmtShortDate(lm.date);
    return '<span style="font-size:13px;background:var(--amber);color:#fff;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;">'+text+'</span>';
  }
  return '';
}
function herdFlags(){
  const active=animals.filter(a=>a.status==='active');
  const byName=(a,b)=>animalDisplayName(a).localeCompare(animalDisplayName(b));
  const flags=[];
  const notWeighedCutoff=60;
  const notWeighed=active.filter(a=>{
    const lw=lastWeightRecord(a.id);
    if(!lw) return true;
    return (new Date()-new Date(lw.recorded_at))/86400000 > notWeighedCutoff;
  }).sort((a,b)=>{
    const lwA=lastWeightRecord(a.id), lwB=lastWeightRecord(b.id);
    const tA = lwA ? new Date(lwA.recorded_at).getTime() : -Infinity; // never weighed = most overdue = first
    const tB = lwB ? new Date(lwB.recorded_at).getTime() : -Infinity;
    return tA-tB || byName(a,b);
  });
  if(notWeighed.length) flags.push({key:'notweighed', label:'Unweighed 60+ days', count:notWeighed.length, color:'amber', animals:notWeighed, muted:!!userSettings.mute_weighing_notification});

  const redHealth=active.filter(a=>healthScore(a).color==='red')
    .sort((a,b)=>healthScore(a).total-healthScore(b).total || byName(a,b));
  if(redHealth.length) flags.push({key:'redhealth', label:'Health score is Red', count:redHealth.length, color:'red', animals:redHealth});

  const decliningWeight=active.filter(a=>{
    const b=healthScore(a).breakdown.find(x=>x.label==='Weight trend');
    return b && (b.note==='Rapid decrease' || b.note==='Slight decrease');
  }).sort(byName);
  if(decliningWeight.length) flags.push({key:'declining', label:'Weight trending down', count:decliningWeight.length, color:'amber', animals:decliningWeight});

  const now=new Date();
  const inWithdrawal=active.filter(a=>medicineRecords.some(r=>r.animal_id===a.id && new Date(r.withdrawal_until)>=now))
    .sort((a,b)=>new Date(activeWithdrawal(a.id).withdrawal_until)-new Date(activeWithdrawal(b.id).withdrawal_until) || byName(a,b));
  if(inWithdrawal.length) flags.push({key:'withdrawal', label:'In medicine withdrawal', count:inWithdrawal.length, color:'red', animals:inWithdrawal});

  const openInjury=active.filter(a=>injuryRecords.some(r=>r.animal_id===a.id && !r.resolved_at))
    .sort((a,b)=>{
      const sA=worstOpenInjury(a), sB=worstOpenInjury(b);
      const lvA = sA && sA.severity!=null ? sA.severity : -1;
      const lvB = sB && sB.severity!=null ? sB.severity : -1;
      return lvB-lvA || byName(a,b);
    });
  if(openInjury.length) flags.push({key:'openinjury', label:'Open injury', count:openInjury.length, color:'red', animals:openInjury});

  const breedingWarning=active.filter(a=>{
    if(a.offspring_status!=='pregnant' && a.offspring_status!=='with_offspring') return false;
    return breedingTileStatus(a).warn;
  }).sort((a,b)=>{
    const cA=breedingTileStatus(a).color, cB=breedingTileStatus(b).color;
    const rank=(c)=> c==='var(--red)' ? 0 : 1; // red worse than amber
    return rank(cA)-rank(cB) || byName(a,b);
  });
  if(breedingWarning.length) flags.push({key:'breedingwarning', label:'Pregnant/with calf \u2014 birthing or mothering concern', count:breedingWarning.length, color:'red', animals:breedingWarning});

  // An animal whose most recent move (by when it was logged, same as the
  // Move tile's own on/off colour) was OFF the farm and hasn't since had a
  // later move back ON — i.e. still out, whether at market, on someone
  // else's ground, or wherever else it went. This is informational
  // (amber), not a fault to fix, so it's last in the list.
  const offFarm=active.filter(a=>{
    const lm=lastMoveForAnimal(a.id);
    return lm && lm.direction==='off';
  }).sort(byName);
  if(offFarm.length) flags.push({key:'offfarm', label:'Off-farm animals', count:offFarm.length, color:'amber', animals:offFarm});

  return flags;
}

// Everything logged against "today" across the whole farm, for the Done
// Today report. Deliberately uses each record's own event-date field
// (recorded_at / administered_at / date / created_at / start_date) rather
// than a separate "logged at" timestamp, since the app doesn't keep one —
// this matches how every other report already treats these dates (e.g.
// Vet spend groups medicineRecords by administered_at). In the very common
// case of backdating an entry (logging a weigh-in a day late, say), that
// entry counts on the day it happened rather than the day it was typed in.
// NOTE: none of these records currently store WHICH farm hand logged them
// — only a device-level "current user" switch that isn't stamped onto
// individual records — so this can show WHAT got done today, not WHO on
// the team did it. Per-person attribution would need a separate change to
// stamp currentFarmerId onto every record type at creation time.
// farmerFilter: null/undefined = show everyone (default); '__admin__' = only
// entries with no farmer_id (created before this device had someone logged
// in, or under the shared "Admin" profile); otherwise a specific farmer's id.
function todaysActivity(farmerFilter){
  const t=todayStr();
  const matches=(rec)=>{
    if(farmerFilter==null) return true;
    if(farmerFilter==='__admin__') return !rec.farmer_id;
    return rec.farmer_id===farmerFilter;
  };
  const weighToday = weights.filter(w=>sameDay(w.recorded_at,t) && matches(w)).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at));
  const moveRecordsToday = moveRecords.filter(r=>r.date===t && matches(r));
  const movedAnimalIds = [...new Set(moveRecordsToday.flatMap(r=>r.animal_ids||[]))];
  const medToday = medicineRecords.filter(r=>sameDay(r.administered_at,t) && matches(r)).sort((a,b)=>new Date(b.administered_at)-new Date(a.administered_at));
  const injuryToday = injuryRecords.filter(r=>sameDay(r.recorded_at,t) && matches(r)).sort((a,b)=>new Date(b.recorded_at)-new Date(a.recorded_at));
  const damageToday = damageRecords.filter(r=>sameDay(r.created_at,t) && matches(r)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const feedToday = feedRecords.filter(r=>!r.deleted_at && r.start_date===t && matches(r));
  const addedToday=[], exitedToday=[];
  animals.forEach(a=>{
    (events[a.id]||[]).forEach(ev=>{
      if(!sameDay(ev.created_at,t) || !matches(ev)) return;
      if(ev.event_type==='created') addedToday.push(a);
      else if(['sold','died','stolen','swapped'].includes(ev.event_type)) exitedToday.push({a, status:ev.event_type, farmer_id:ev.farmer_id});
    });
  });
  return {weighToday, moveRecordsToday, movedAnimalIds, medToday, injuryToday, damageToday, feedToday, addedToday, exitedToday};
}

function renderBreedValue(){
  const b=breeds.find(x=>x.id===breedValueTargetId);
  if(!b) return '<div class="empty">Breed not found.</div>';
  const history=breedPriceHistory.filter(h=>h.breed_id===b.id).sort((x,y)=>new Date(y.changed_at)-new Date(x.changed_at));
  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>Breed value</span><span></span></div>
    <div class="body">
      <div style="font-size:13px;color:var(--grey);margin:6px 0 10px;">${b.name} \u2014 £/kg over time, most recent first.</div>
      ${history.length? history.map((h,i)=>{
        const prev=history[i+1]; // list is date-desc, so i+1 is the older/previous record
        const arrow = prev ? weightTrendArrow(prev.price_per_kg, h.price_per_kg) : null;
        return `
        <div style="background:#f3f3f3;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;">
          <span style="font-style:italic;color:var(--grey);font-size:13px;flex-shrink:0;width:88px;">${fmtDate(h.changed_at)}</span>
          <span style="font-size:16px;color:var(--ink);flex:1;font-weight:700;">${fmtGBP(h.price_per_kg)}/kg</span>
          ${arrow?`<span style="font-size:20px;line-height:1;font-weight:800;color:${arrow.color};flex-shrink:0;">${arrow.up?'\u25b2':'\u25bc'}</span>`:''}
        </div>`;
      }).join('') : '<div class="empty">No £/kg history recorded yet for this breed.</div>'}
    </div>
    ${footerBar([
      {id:'breedvalue-help', icon:'help', label:'Help'},
      {id:'breedvalue-home', icon:'home', label:'Home', home:true},
    ])}`;
}

      ${r.rows.slice(0,roiShowCount).map(row=>`
        <div class="row" data-gotoanimalscreen="${row.a.id}" data-gotoscreen="profitScore">
          <div><div class="name" data-gotoanimaldetails="${row.a.id}" style="text-decoration:underline;text-decoration-color:var(--line);">${animalDisplayName(row.a)}</div><div class="id" style="font-size:13px;">${fmtGBPSmart(row.cost)} <span style="font-size:16px;font-weight:800;">&rarr;</span> ${fmtGBPSmart(row.value-row.cost)} profit</div></div>
          <span class="pill ${row.roi==null?'':(row.roi>=0?'green':'red')}" style="font-size:13.5px;">${row.roi!=null?fmtPct(row.roi):'\u2014'}</span>
        </div>`).join('')}

  }
  else if(type==='sellyes' || type==='sellno'){
    const recommend = type==='sellyes';
    title = recommend ? 'Animals to sell' : 'Animals to keep';
    const rows=reportAnimalsToSell(recommend);
    body=`
      <div style="font-size:15px;color:var(--grey);margin-bottom:10px;">${recommend
        ? 'At Prime age, healthy, not currently pregnant or with offspring, and showing a profit \u2014 good candidates to consider selling now, ordered by profit (highest first).'
        : 'Below or past Prime age, currently pregnant/with offspring, or health score are worth keeping for now.'}
        ${recommend?` Tap an animal to see exactly why it\u2019s listed here.<br><br><b style="color:var(--ink);">Press and hold an animal to select several, then tap Move to send them to market.</b>`:''}</div>
      ${rows.length?`
      <div style="display:flex;align-items:center;gap:8px;padding:2px 10px;font-size:13px;color:var(--grey);font-weight:800;text-transform:uppercase;">
        <span style="flex:1;">Animal</span>
        <span style="width:64px;text-align:right;">Profit</span>
        <span style="width:56px;text-align:center;">Health</span>
        <span style="width:20px;flex-shrink:0;"></span>
      </div>`:''}
      ${rows.length? rows.slice(0,sellShowCount).map(row=>{
        const key='sell-'+row.a.id;
        const open=reportExpandedKey===key;
        const rowSelected = recommend && herdSelectMode && herdSelectedIds.includes(row.a.id);
        const reasons=[];
        if(recommend){
          reasons.push('At Prime age ('+row.months+' months)');
          reasons.push('Health score is '+row.hs.color.charAt(0).toUpperCase()+row.hs.color.slice(1)+' ('+row.hs.total+'/100)');
          reasons.push('Not currently pregnant or with offspring');
          if(row.profit!=null) reasons.push('Showing an estimated profit of '+fmtGBP(row.profit,0));
        } else {
          if(!row.isPrime) reasons.push(row.months+' months old \u2014 outside this breed\u2019s Prime age range');
          if(row.breeding) reasons.push('Currently pregnant or with offspring');
          if(row.hs.color==='red') reasons.push('Health score is Red ('+row.hs.total+'/100)');
        }
        return `
        <div style="margin-bottom:4px;" ${recommend?`data-sellrow="${row.a.id}"`:''}>
          <div data-togglereportmonth="${key}" style="cursor:pointer;">
            <div class="row" style="cursor:pointer;${rowSelected?'background:#e3e3e3;':''}">
              <div style="flex:1;min-width:0;"><div class="name" data-gotoanimalscreen="${row.a.id}" data-gotoscreen="detail" style="font-size:${farmSettings.use_animal_names===false?'13px':'16px'};text-decoration:underline;text-decoration-color:var(--line);">${animalDisplayName(row.a)}</div><div class="id" style="font-size:13px;">${row.months} months old</div></div>

  else if(type==='realized'){
    title='Realised profit/loss (monthly)';
    const allRows=reportRealizedByMonth(realizedMonthsBack);
    const rows=allRows.filter(r=>r.animals.length>0);
    const overallTotal=rows.reduce((s,r)=>s+r.total,0);
    body=`
      <div style="font-size:15px;color:var(--grey);margin-bottom:10px;">Actual gain or loss from animals sold, died, swapped or stolen \u2014 the real figure entered (or corrected) when each one was marked as exited, not an estimate. Only months with an exit are shown. Tap a month to see which animals made it up.</div>
      ${rows.length?rows.map(r=>{
        const key='realized-'+r.label;
        const open=reportExpandedKey===key;
        return `
        <div style="margin-bottom:4px;">
          <div data-togglereportmonth="${key}" style="cursor:pointer;">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:3px;padding:2px 0;"><span>${r.label}</span><span style="display:flex;align-items:center;gap:8px;"><span style="font-weight:700;color:${r.total<0?'var(--red)':r.total>0?'var(--green)':'inherit'};">${fmtGBPSmart(r.total)}</span><span style="width:20px;height:20px;flex-shrink:0;color:var(--grey);">${icon(open?'triangleDown':'triangleRight')}</span></span></div>
          </div>
          ${open?`<div style="margin:2px 0 4px;">
            ${r.animals.map(a=>`<div class="row" data-gotoanimalscreen="${a.id}" data-gotoscreen="detail"><span style="font-size:16px;text-decoration:underline;text-decoration-color:var(--line);">${animalDisplayName(a)}</span><span style="color:var(--grey);font-size:13px;flex:1;text-align:center;">${ANIMAL_STATUS_LABELS[a.status]||a.status}</span><span style="font-weight:700;color:${a.realized_value<0?'var(--red)':'var(--green)'};">${fmtGBPSmart(a.realized_value)}</span></div>`).join('')}
          </div>`:''}
        </div>`;
      }).join('') : `<div class="empty" style="padding:10px 4px;">No exits recorded in the last ${realizedMonthsBack} months.</div>`}
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-weight:800;font-size:17px;"><span>${realizedMonthsBack}-month total</span><span style="color:${overallTotal<0?'var(--red)':overallTotal>0?'var(--green)':'inherit'};">${fmtGBPSmart(overallTotal)}</span></div>
      <button id="realized-showmore" class="fullbtn ghost" style="margin-top:10px;">Show previous 12 months</button>`;
  }
  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>${(type==='sellyes'&&herdSelectMode)?herdSelectedIds.length+' selected':title}</span><span></span></div>
    <div class="body">${body}</div>
    ${footerBar((type==='sellyes'&&herdSelectMode) ? [
      {id:'reportdetail-help', icon:'help', label:'Help'},
      {id:'reportdetail-move', icon:'pin', label:'Move', primary:true},
      {id:'reportdetail-home', icon:'home', label:'Home', home:true},
    ] : type==='feedcost' ? [
      {id:'reportdetail-help', icon:'help', label:'Help'},
      {id:'reportdetail-feedfilter', icon:'filter', label:reportFeedTypeFilter?'Filter \u25cf':'Filter', primary:true},
      {id:'reportdetail-home', icon:'home', label:'Home', home:true},
    ] : [{id:'reportdetail-help', icon:'help', label:'Help'}, {id:'reportdetail-home', icon:'home', label:'Home', home:true}])}`;
}

// Shared by the in-progress move (as soon as animals are added, replacing
// the auto-save note) and every past move record in "View previous" —
// same label, same checkbox, same behaviour either way, so ticking it off
// doesn't require leaving the screen and finding the record again in the
// expanded history the way it used to.
function bcmsCheckboxRow(rec){
  if(!rec) return '';
  const rowSt=moveReportStatus(rec);
  const isReported=rec.bcms_reported;
  const label = isReported ? 'Reported to '+bcmsLink()+(rec.bcms_reported_at?' on '+fmtDate(rec.bcms_reported_at):'')
    : rowSt&&rowSt.overdue ? 'Report to '+bcmsLink()+' \u2014 OVERDUE'
    : rowSt ? 'Report to '+bcmsLink()+' within '+rowSt.daysLeft+' day'+(rowSt.daysLeft===1?'':'s')
    : 'Report to '+bcmsLink();
  const labelColor = isReported ? 'var(--green)' : (rowSt&&rowSt.overdue?'var(--red)':'#7a5406');
  return `<label style="display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 4px 0;font-size:13px;font-weight:700;color:${labelColor};cursor:pointer;">
    <span style="text-align:right;">${label}</span>
    <input type="checkbox" data-markmovebcms="${rec.id}" ${isReported?'checked':''} style="width:20px;height:20px;flex-shrink:0;accent-color:var(--green);">
  </label>`;
}
function renderMove(){
  if(!moveDate) moveDate=todayStr();
  const today=todayStr();
  // Up to a week ahead — a farmer with an early market run often sets the
  // move up the night before to save time in the morning.
  const maxMoveDate=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const chosen = moveAnimalIds.map(id=>animals.find(a=>a.id===id)).filter(Boolean)
    .sort((a,b)=>(animalDisplayName(a)).localeCompare(animalDisplayName(b)));
  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>Move Animal</span><span></span></div>
    <div class="body bigtext">
      <div class="formrow"><label>Date</label><div class="formctrl">
        ${dateFieldWithJump(`<input type="date" id="moveDateInput" value="${moveDate}" max="${maxMoveDate}" style="text-align:center;flex:1;min-width:0;">`,'moveDateInput')}
      </div></div>

      <div class="formrow"><label>On/off farm?</label><div class="formctrl radiogroup" style="justify-content:flex-end;gap:14px;">
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="moveDirectionRadio" id="moveDirectionOn" ${moveDirection==='on'?'checked':''}> On</label>
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="moveDirectionRadio" id="moveDirectionOff" ${moveDirection==='off'?'checked':''}> Off</label>
      </div></div>

      ${(moveDirection==='on'||moveDirection==='off')?`
      <div class="formrow"><label>${moveDirection==='on'?'From':'Destination'}</label><div class="formctrl">
        <input type="text" id="moveLocation" list="moveLocationList" placeholder="e.g. Buxton Market" value="${moveLocationVal.replace(/"/g,'&quot;')}">
      </div></div>
      <datalist id="moveLocationList">${[...new Set(moveRecords.map(r=>r.location).filter(Boolean))].sort().map(l=>`<option value="${escapeHtml(l)}">`).join('')}</datalist>

      <div class="formrow"><label>${moveDirection==='on'?'From CPH':'Destination CPH'}</label><div class="formctrl">
        <input type="text" inputmode="numeric" id="moveDestCph" maxlength="11" placeholder="e.g. 12/345/6789" value="${moveDestCphVal.replace(/"/g,'&quot;')}">
      </div></div>`:''}

      <label style="margin-top:16px;display:none;">Reason (optional)</label>
      <textarea id="moveReason" maxlength="500" style="min-height:90px;display:none;" oninput="document.getElementById('moveCharCount').textContent=(500-this.value.length)+' characters remaining'">${moveReasonVal}</textarea>
      <div id="moveCharCount" style="font-size:13px;color:var(--grey);text-align:right;margin-top:2px;display:none;">${500-moveReasonVal.length} characters remaining</div>
      <div class="field-error" id="err-movevalidation"></div>
      ${(()=>{
        const activeRec = moveSessionRecordId ? moveRecords.find(r=>r.id===moveSessionRecordId) : null;
        // Falls back to the auto-save note whenever nothing's actually been
        // saved yet — not just when the Animals list is empty. It's
        // possible to pick an animal before Direction/Location are set
        // (commitMoveEntry silently declines to save until both exist), so
        // checking chosen.length alone could leave neither message showing.
        return activeRec ? bcmsCheckboxRow(activeRec) : `<div style="font-size:13px;color:var(--primary-dark);text-align:center;margin-top:8px;">Move details auto-save when an animal is added.</div>`;
      })()}

      <label style="margin-top:18px;">Animals</label>
      ${chosen.some(a=>animalMoveRisk(a.id)) ? `<div class="banner" style="display:block;">Some animals are in withdrawal or missing a TB test. Move still recorded.</div>` : ''}
      ${chosen.length? chosen.map(a=>{
        const risky = animalMoveRisk(a.id);
        return `
        <div style="display:flex;align-items:center;gap:8px;margin:6px 0;">
          <div style="position:relative;flex:1;">
            <input type="text" value="${animalDisplayName(a)}" readonly style="width:100%;background:#f3f3f3;color:var(--ink);${risky?'padding-right:42px;':''}">
            ${risky?`<span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;color:var(--red);pointer-events:none;" title="In withdrawal or TB test overdue/missing">${icon('syringe')}</span>`:''}
          </div>
          <button data-removemoveanimal="${a.id}" style="width:30px;height:30px;flex-shrink:0;background:var(--red);border:none;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;padding:7px;">${icon('close')}</button>

function factorColorClass(key, points){
  const maps = {
    bcs: {0:'red',25:'green',15:'amber',5:'red'},
    illness: {20:'green',15:'amber',5:'red'},
    injury: {20:'green',15:'amber',10:'amber',2:'red'},
    weighttrend: {20:'green',15:'amber',9:'amber',2:'red'},
    age: {15:'green',9:'amber',7:'amber',5:'amber',3:'red'},
  };
  return (maps[key] && maps[key][points]) || 'amber';
}
function colorVarFor(c){ return c==='green'?'var(--green)':c==='red'?'var(--red)':'var(--amber)'; }
function confColorClass(conf){ return conf.label==='HIGH'?'green':conf.label==='LOW'?'red':'amber'; }
// Confidence pill: coloured background + label combined into one chip (used
// on both the Health Score screen and the Market Value screen — same size
// on both so Market Value no longer reads smaller than Health).
function confidencePill(conf, fontSize){
  return `<span class="pill ${confColorClass(conf)}" style="font-size:${fontSize}px;padding:4px 11px;">${conf.label}</span>`;
}

let sortColumn='name', sortDir='asc';
let showFilterModal=false;

function renderHerd(){
  const useEidOnly = farmSettings.use_animal_names===false;
  const term=searchTerm.toLowerCase();
  let list = animals.filter(a=>{
    if(a.status!==statusFilter) return false;
    if(term && !(a.tag_number.toLowerCase().includes(term) || (a.name||'').toLowerCase().includes(term) || (a.eid||'').toLowerCase().replace(/\s+/g,'').includes(term.replace(/\s+/g,'')) || breedName(a.breed_id).toLowerCase().includes(term))) return false;
    if(filterBreedId && a.breed_id!==filterBreedId) return false;
    return true;
  });
  // Non-active statuses (Died/Sold/Swapped/Stolen/Removed) accumulate over
  // years and could otherwise grow into a huge list — default to the last
  // 12 months with an explicit "show more" rather than always listing the
  // farm's entire exit history.
  let hiddenOlderCount=0;
  if(statusFilter!=='active' && !herdShowAllHistory){
    const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-1);
    const withinYear = list.filter(a=>new Date(a.updated_at||a.created_at) >= cutoff);
    hiddenOlderCount = list.length - withinYear.length;
    list = withinYear;
  }
  list = list.map(a=>({
    a, profit: estimatedProfit(a), bcsRec: lastBcsRecord(a.id), hs: healthScore(a)
  }));
  const dir = sortDir==='asc'?1:-1;
  list.sort((x,y)=>{
    let primary=0;
    if(sortColumn==='name') primary = dir*((animalDisplayName(x.a)).localeCompare(animalDisplayName(y.a)));
    else if(sortColumn==='profit') primary = dir*((x.profit??-Infinity)-(y.profit??-Infinity));
    else if(sortColumn==='bcs') primary = dir*((x.bcsRec?x.bcsRec.bcs:-1)-(y.bcsRec?y.bcsRec.bcs:-1));
    else if(sortColumn==='health') primary = dir*(x.hs.total-y.hs.total);
    if(primary!==0 || sortColumn==='name') return primary;
    // Tie-break on whatever's shown in the Name column (name/EID/Mgmt ID,
    // per farmSettings.use_animal_names) so animals sharing a score don't
    // jump around unpredictably between renders.
    return (animalDisplayName(x.a)).localeCompare(animalDisplayName(y.a));
  });
  const arrow=(col)=> sortColumn===col ? `<span class="arrow">${sortDir==='asc'?'▲':'▼'}</span>` : '';

              <td class="heartcell" style="text-align:center;" data-openhealth="${a.id}">${heartFilledIcon(healthCol==='green'?'var(--green)':healthCol==='red'?'var(--red)':'var(--amber)')}</td>

function injSevColorClassGeneric(cls){ return cls.replace('bcs-',''); }
function fmtShortDate(iso){ const d=new Date(iso); return d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(-2); }
function fmtMonYY(iso){ const d=new Date(iso); return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(-2); }
function lastFeedRecordForType(typeName){
  return feedRecords.filter(r=>r.feed_type===typeName && !r.deleted_at).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date))[0] || null;
}
function urgencyRank(u){ return u==='high'?3:u==='med'?2:1; }
function urgencyColorVar(u){ return u==='high'?'var(--red)':u==='med'?'var(--amber)':'var(--grey-light)'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function sameDay(iso, dateStr){ return iso && iso.slice(0,10)===dateStr; }
function findRecordForAnimalDate(animalId, dateStr){
  return weights.filter(w=>w.animal_id===animalId && sameDay(w.recorded_at, dateStr)).slice(-1)[0] || null;
}
function openDamageRecords(){
  return damageRecords.filter(d=>!d.fixed_at && !d.not_going_to_fix)
    .sort((a,b)=> urgencyRank(b.urgency)-urgencyRank(a.urgency) || new Date(b.created_at)-new Date(a.created_at));
}

          const label = wd ? `Medicine<br><span style="font-size:11px;font-weight:700;line-height:14px;display:inline-block;">(${days} Day${days===1?'':'s'})</span>` : 'Medicine<br><span style="font-size:11px;line-height:14px;display:inline-block;">&nbsp;</span>';
          return tile('sum-medicine','syringe',label,wd?{fill:'var(--red)'}:{});
        })()}
        ${(()=>{
          const label = openInj.length ? `Injury<br><span style="font-size:11px;font-weight:700;line-height:14px;display:inline-block;">(${openInj.length})</span>` : 'Injury<br><span style="font-size:11px;line-height:14px;display:inline-block;">&nbsp;</span>';

        ${tile('sum-value','pound','Market Value<br><span style="font-size:11px;line-height:14px;display:inline-block;">&nbsp;</span>',{fill:profitColor||'var(--grey)', iconHtml:poundIcon()})}

      </div>

      {id:'sum-help', icon:'help', label:'Help'},
      {id:'sum-remove', icon:'trash', label:'Remove', danger:true},
      {id:'sum-timeline', icon:'calendar', label:'Timeline', primary:true},

function fmtTimelineDate(iso){
  const d=new Date(iso), now=new Date();
  const monthsAgo=(now.getFullYear()-d.getFullYear())*12 + (now.getMonth()-d.getMonth());
  const dayMonth=d.getDate()+' '+d.toLocaleString('en-GB',{month:'long'});
  return monthsAgo>12 ? dayMonth+' '+String(d.getFullYear()).slice(-2) : dayMonth;
}
function buildTimeline(animalId){
  const items=[];
  (events[animalId]||[]).forEach(e=>{
    let text;
    if(e.event_type==='created'){
      const a=animals.find(x=>x.id===animalId);
      text='Animal added'+(a&&a.purchase_price?' ('+fmtGBP(a.purchase_price,0)+')':'');
    } else if(e.event_type==='restored'){ text='Restored to active'+(e.reason?' ('+e.reason.slice(0,20)+(e.reason.length>20?'\u2026':'')+')':''); }
    else if(e.event_type==='voided'){ text='Voided (accidental entry)'; }
    else { text='Marked '+e.to_status; }
    items.push({date:e.created_at, text, kind:'status', ref:e});
  });
  weights.filter(w=>w.animal_id===animalId).forEach(w=>{
    const parts=[];
    if(w.weight_kg!=null) parts.push('Weighed '+w.weight_kg+'kg');
    if(w.bcs!=null) parts.push('BCS '+w.bcs);
    items.push({date:w.recorded_at, text:parts.join(', '), kind:'weight', ref:w});
  });
  injuryRecords.filter(r=>r.animal_id===animalId).forEach(r=>{
    const bp=r.body_part?(' '+bodyPartLabel(r.body_part).toLowerCase()):'';
    const lvl=r.severity!=null?(' (level '+r.severity+')'):'';
    items.push({date:r.recorded_at, text:'Injury added'+bp+lvl, kind:'injury', ref:r});
    if(r.resolved_at) items.push({date:r.resolved_at, text:'Injury recovered'+bp+lvl, kind:'injury', ref:r});
  });
  medicineRecords.filter(r=>r.animal_id===animalId).forEach(r=>{
    items.push({date:r.administered_at, text:'Medicine ('+medicineTypeName(r.medicine_type_id)+')', kind:'medicine', ref:r});
  });
  moveRecords.filter(r=>r.animal_ids.includes(animalId)).forEach(r=>{
    const reasonPart = r.reason ? ' ('+r.reason.slice(0,20)+(r.reason.length>20?'\u2026':'')+')' : '';
    items.push({date:r.created_at, text:'Moved'+reasonPart, kind:'move', ref:r});
  });
  breedingRecords.filter(r=>r.animal_id===animalId).forEach(r=>{
    const fieldLabel = r.field==='birthing_ease' ? 'Birthing ease' : 'Mothering ability';
    const valLabel = (r.field==='birthing_ease' ? BIRTHING_EASE_OPTIONS : MOTHERING_ABILITY_OPTIONS).find(o=>o.key===r.value);
    items.push({date:r.created_at, text:fieldLabel+': '+(valLabel?valLabel.label:(r.value?r.value:'Not set')), kind:'breeding', ref:r});
  });
  return items.sort((a,b)=>new Date(b.date)-new Date(a.date));
}

let timelineKindFilter=null; // null = show everything; 'weighttrend' | 'bcstrend' = only weight/BCS entries with a trend arrow; 'weighbcs' = every weigh-in record (whichever of weight/BCS it has), no trend arrow — used by the Weigh screen's own "View history" link
function weightTrendArrow(prev, cur){
  if(prev==null || cur==null || prev===cur) return null;
  return {color: cur>prev?'var(--green)':'var(--red)', up: cur>prev};
}
function bcsTrendArrow(prev, cur){
  if(prev==null || cur==null || prev===cur) return null;
  const improving = Math.abs(cur-3) < Math.abs(prev-3);
  return {color: improving?'var(--green)':'var(--red)', up: cur>prev};
}
function renderTimeline(){
  const a=animals.find(x=>x.id===selectedId);
  if(!a) return '<div class="empty">Animal not found.</div>';
  const fullItems=buildTimeline(a.id);
  const isTrendView = timelineKindFilter==='weighttrend' || timelineKindFilter==='bcstrend';
  let items;
  if(timelineKindFilter==='weighttrend') items=fullItems.filter(it=>it.kind==='weight' && it.ref.weight_kg!=null);
  else if(timelineKindFilter==='bcstrend') items=fullItems.filter(it=>it.kind==='weight' && it.ref.bcs!=null);
  else if(timelineKindFilter==='weighbcs') items=fullItems.filter(it=>it.kind==='weight');
  else items=fullItems;
  const introText = timelineKindFilter==='weighttrend' ? 'Weight records only. '
    : timelineKindFilter==='bcstrend' ? 'BCS records only. '
    : timelineKindFilter==='weighbcs' ? 'Weight and BCS records only. '
    : '';
  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>${headerIdName(a,26)}</span><span></span></div>
    <div class="body">
      <div style="font-size:13px;color:var(--grey);margin:6px 0 10px;">${introText}Click on an item for more details:</div>
      ${items.length? items.map((it,i)=>{
        let arrow=null;
        let text=it.text;
        if(timelineKindFilter==='weighttrend') text='Weighed '+it.ref.weight_kg+'kg';
        else if(timelineKindFilter==='bcstrend') text='BCS '+it.ref.bcs+' - '+BCS_LABELS[it.ref.bcs];
        if(isTrendView){
          const prevItem=items[i+1]; // items are date-desc, so i+1 is the older/previous record
          if(prevItem){
            arrow = timelineKindFilter==='weighttrend'
              ? weightTrendArrow(prevItem.ref.weight_kg, it.ref.weight_kg)
              : bcsTrendArrow(prevItem.ref.bcs, it.ref.bcs);
          }
        }
        return `
        <button data-timelineitem="${fullItems.indexOf(it)}" style="width:100%;text-align:left;background:#f3f3f3;border:none;border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;gap:10px;align-items:baseline;">
          <span style="font-style:italic;color:var(--grey);font-size:13px;flex-shrink:0;width:78px;">${fmtTimelineDate(it.date)}</span>
          <span style="font-size:14px;color:var(--ink);flex:1;">${text}</span>
          ${arrow?`<span style="font-size:20px;line-height:1;font-weight:800;color:${arrow.color};flex-shrink:0;">${arrow.up?'\u25b2':'\u25bc'}</span>`:''}
        </button>`;
      }).join('') : `<div class="empty">${(isTrendView||timelineKindFilter==='weighbcs')?'No records yet.':'No activity recorded yet.'}</div>`}
    </div>
    ${footerBar([
      {id:'timeline-help', icon:'help', label:'Help'},
      {id:'timeline-home', icon:'home', label:'Home', home:true},
    ])}`;
}
