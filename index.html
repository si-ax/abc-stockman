// Weigh/BCS summary tile colour = worse of last-BCS colour and weight-trend colour (same bands used in Health Score)
function weighBcsTileColor(a){
  const bcsC = factorColorClass('bcs', bcsPoints(a).points);
  const wtC = factorColorClass('weighttrend', weightTrendPoints(a).points);
  const rank = {green:0, amber:1, red:2};
  return rank[wtC] > rank[bcsC] ? wtC : bcsC;
}

async function commitWeighEntry(silent){
  if(!weighTarget) return;
  const weightInput=document.getElementById('w-weight');
  const raw = weightInput ? weightInput.value.trim() : '';
  const val = raw ? parseFloat(raw) : null;
  if(raw && (isNaN(val) || val<=0)) return; // ignore invalid partial typing, don't commit garbage
  if(val==null && !currentBcsValue) return; // nothing to save yet

  const a=animals.find(x=>x.id===weighTarget);
  if(!a) return;
  const recordedIso = weighDate===todayStr() ? new Date().toISOString() : new Date(weighDate+'T12:00:00').toISOString();

  let rec = weighSessionRecordId ? weights.find(w=>w.id===weighSessionRecordId) : findRecordForAnimalDate(a.id, weighDate);
  const isNew = !rec;
  if(rec){
    rec.weight_kg = val;
    rec.bcs = currentBcsValue;
    rec.recorded_at = recordedIso;
    rec.farmer_id = currentFarmerId;
  } else {
    rec = {id:uuid(), animal_id:a.id, weight_kg:val, bcs:currentBcsValue, note:null, recorded_at:recordedIso, farmer_id:currentFarmerId};
    weights.push(rec);
  }
  weighSessionRecordId = rec.id;
  if(authFarmId){
    const { error: upsertErr } = await sb.from('weights').upsert({ ...rec, farm_id: authFarmId });
    if(upsertErr){ logMsg('<span style="color:var(--red);">Couldn\u2019t sync this weigh entry to the shared farm database \u2014 '+escapeHtml(upsertErr.message)+'.</span>'); }
  }
  await persistAll();
  if(!silent) render();
  return isNew;
}

async function commitMoveEntry(){
  const location = moveLocationVal.trim();
  const destCph = moveDestCphVal.trim();
  if(!location || moveAnimalIds.length===0 || !moveDirection) return; // not enough to save yet — no error shown, just don't persist
  if(!destCph) return; // origin/destination CPH required for both directions before we persist
  const reason = moveReasonVal.trim();
  const recordedIso = moveDate===todayStr() ? new Date().toISOString() : new Date(moveDate+'T12:00:00').toISOString();

  let rec = moveSessionRecordId ? moveRecords.find(r=>r.id===moveSessionRecordId) : null;
  const isNew = !rec;
  if(rec){
    rec.date=moveDate; rec.location=location||null; rec.reason=reason||null;
    rec.animal_ids=[...moveAnimalIds]; rec.created_at=recordedIso; rec.direction=moveDirection;
    rec.dest_cph = destCph||null; rec.farmer_id = currentFarmerId;
  } else {
    rec={id:uuid(), date:moveDate, location:location||null, reason:reason||null, animal_ids:[...moveAnimalIds], created_at:recordedIso, direction:moveDirection,
      dest_cph: destCph||null, bcms_reported:false, farmer_id:currentFarmerId};
    moveRecords.push(rec);
  }
  moveSessionRecordId=rec.id;
  await persistAll();
  await syncMoveToSupabase(rec);
  return isNew;
}

let moveHistoryExpanded=false, expandedMoveHistoryId=null, moveHistoryScope=null; // scope: null = all moves, or an animal id = just that animal's moves
function pastMoveRecords(scope){
  const list = scope ? moveRecords.filter(r=>r.animal_ids.includes(scope)) : moveRecords.slice();
  return list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}
// Farm-level 6-day standstill: triggered by the most recent on-farm move.
// Countdown shown = 7 - days elapsed since that move's date; once it reaches
// zero (or below) the standstill has lifted and nothing is shown.
// Farm-level 6-day standstill: triggered by the most recent on-farm move.
// Countdown shown = 7 - days elapsed since that move's date; once it reaches
// zero (or below) the standstill has lifted and nothing is shown.
// Sorted by created_at (an exact timestamp), not date (a plain day string)
// — two on-farm moves can share the same calendar date (e.g. an animal
// moved on and then returned again later the same day), and a date-only
// sort can't reliably tell which one actually happened more recently.
function standstillStatus(){
  const onMoves = moveRecords.filter(r=>r.direction==='on');
  if(!onMoves.length) return null;
  const latest = onMoves.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  const daysLeft = 7 - daysSince(latest.date);
  if(daysLeft<=0) return null;
  return {daysLeft, record:latest};
}
// Most recent move record involving a given animal, so we can tell whether
// it was last moved off the farm (and so is presumed to still be off-farm).
function lastMoveForAnimal(animalId){
  const recs=moveRecords.filter(r=>r.animal_ids.includes(animalId)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  return recs[0]||null;
}
// Any move record (on or off) that's outstanding a BCMS report — used to
// flag the Home Move tile, since the 3-day reporting duty applies to both
// directions, not just the on-farm standstill. Pass an animal id to scope
// this to just that animal's own moves (e.g. the "View previous" bar when
// looking at one animal shouldn't turn red because of an unrelated
// animal's unreported move elsewhere in the herd).
function unreportedMoveCount(scope){
  const list = scope ? moveRecords.filter(r=>r.animal_ids.includes(scope)) : moveRecords;
  return list.filter(r=>!r.bcms_reported).length;
}
let feedViewExpanded=false;
let feedLocation='barn'; // 'barn' | 'pasture' — simplified Fodder screen (see renderFeedOriginal for the prior per-sack-cost version)
let feedLocationLog=[]; // [{date, location, changed_at}] — history of location changes, tracked separately from fodder purchase records
let feedLastDate=null; // remembers the date across saves within a session, so logging several purchases for the same day doesn't need retyping it each time
let expandedFeedIds=new Set(), expandedFeedUsageIds=new Set();
// A fodder record's status is 'using' | 'stored' | 'exhausted'. using_started_at
// and exhausted_at record when it last entered those two states — used to show
// the "was Using ... was Exhausted" range in View Previous.
// feedUsageRecords is the audit trail of actual USING periods for a fodder
// record — [{id, feed_record_id, start_date, end_date, end_status}]. A new
// entry starts whenever a record becomes Using; end_date/end_status are
// filled in when it stops (moves to Storage or Exhausted). Storage periods
// themselves aren't tracked — only when the fodder was actually being fed
// out, which is what the usage report needs.
function activeFeedRecords(){
  // Using first (what's actually being fed out matters most day-to-day),
  // then Stored, then alphabetically by type within each — not by purchase
  // date, which isn't that useful once you're just checking what's active.
  return feedRecords.filter(r=>!r.deleted_at && r.status!=='exhausted')
    .sort((a,b)=> (a.status==='using')!==(b.status==='using') ? (a.status==='using'?-1:1) : a.feed_type.localeCompare(b.feed_type));
}
function previousFeedRecords(monthsBack=12){
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-monthsBack);
  return feedRecords.filter(r=>!r.deleted_at && r.status==='exhausted' && r.exhausted_at && new Date(r.exhausted_at)>=cutoff)
    .sort((a,b)=>new Date(b.exhausted_at)-new Date(a.exhausted_at));
}
// Blocks a second status change on the same fodder record on the same
// day — otherwise a quick Using→Storage→Using round trip would leave a
// meaningless same-day entry in the usage audit trail.
function feedUsageChangedToday(recId){
  const t=todayStr();
  return feedUsageRecords.some(u=>u.feed_record_id===recId && (u.start_date===t || u.end_date===t));
}
function feedUsageRecordsFor(recId){
  return feedUsageRecords.filter(u=>u.feed_record_id===recId).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));
}
// Inclusive day count — the start date itself counts as day 1.
function feedUsageDays(u){
  const end=u.end_date||todayStr();
  return Math.round((new Date(end)-new Date(u.start_date))/86400000)+1;
}
function feedUsageTotalDays(recId){
  return feedUsageRecordsFor(recId).reduce((sum,u)=>sum+feedUsageDays(u),0);
}
function setFeedStatus(rec, status){
  const t=todayStr();
  let usageRec;
  if(status==='using'){
    usageRec={id:uuid(), feed_record_id:rec.id, start_date:t, end_date:null, end_status:null};
    feedUsageRecords.push(usageRec);
  } else {
    const open=feedUsageRecords.find(u=>u.feed_record_id===rec.id && u.end_date===null);
    if(open){ open.end_date=t; open.end_status=status; usageRec=open; }
  }
  rec.status=status;
  if(status==='using') rec.using_started_at=new Date().toISOString();
  else if(status==='exhausted') rec.exhausted_at=new Date().toISOString();
  else if(status==='stored') rec.exhausted_at=null; // clear a stale exhausted date if it's ever restored
  // setFeedStatus is called synchronously from many places (sometimes
  // twice in a row, for a clash pair) and its callers already handle
  // persistAll() themselves — these two run in the background rather
  // than being awaited here, same best-effort approach as elsewhere
  // pending the real offline queue.
  syncFeedToSupabase(rec);
  if(usageRec) syncFeedUsageToSupabase(usageRec);
}
// Sets a fodder record to Using — but first checks whether another record
// of the same type is already the one being fed out, since only one really
// should be at a time. If so, asks whether to mark that one exhausted
// before this one takes over (same question whether this is triggered from
// the Add screen or by switching status on an existing Active record).
// onDone runs once whatever the farmer decided has been persisted.
function markFeedUsing(rec, onDone){
  if(feedUsageChangedToday(rec.id)){
    showInfoModal('This fodder record\u2019s status has already changed today \u2014 try again tomorrow.');
    return;
  }
  const clash=feedRecords.find(r=>!r.deleted_at && r.id!==rec.id && r.feed_type===rec.feed_type && r.status==='using');
  if(clash){
    if(feedUsageChangedToday(clash.id)){
      showInfoModal('The current '+escapeHtml(clash.feed_type)+' record\u2019s status has already changed today \u2014 try again tomorrow.');
      return;
    }
    showConfirmModal('This will mark the current '+escapeHtml(rec.feed_type)+' record as being exhausted', async()=>{
      setFeedStatus(clash, 'exhausted');
      setFeedStatus(rec, 'using');
      await persistAll();
      onDone();
    }, ()=>{
      // "No, store this fodder" — leave the clashing record as Using; rec
      // keeps whatever status it already had (Stored, for a brand-new
      // record; unchanged, if switched from the Active list).
      onDone();
    }, 'Yes', 'No, store this fodder');
    return;
  }
  setFeedStatus(rec, 'using');
  persistAll();
  onDone();
}

function quickCheckRead(ck){
  if(!ck) return null;
  const concerns=[];
  if(ck.bleeding) concerns.push('bleeding');
  if(ck.non_weight_bearing) concerns.push('cannot put weight on it');
  if(ck.hot_to_touch) concerns.push('hot to touch');
  if(!concerns.length) return {text:'No concerning signs flagged.', color:'var(--green)'};
  if(concerns.length===1) return {text:'Flagged: '+concerns[0]+'. Worth keeping a close eye on.', color:'var(--amber)'};
  return {text:'Flagged: '+concerns.join(', ')+'. This combination is worth a vet call if it doesn\u2019t improve quickly.', color:'var(--red)'};
}

      {id:'inj-home', icon:'home', label:'Home', home:true},
    ])}`;
}

function renderInjuryAdd(){
  const a=animals.find(x=>x.id===healthTarget);
  if(!a) return '<div class="empty">Animal not found.</div>';
  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>${headerIdName(a,26)}</span><span></span></div>
    <div class="body">
      ${photoCaptureBlockModal('injphoto', injAddPhoto, 'Click to take photo of injury')}

      <div class="formrow" style="margin-top:12px;"><label style="color:var(--red);">Body part</label><div class="formctrl"><select id="inj-bodypart">
        <option value="">\u2014</option>
        <option value="head">Head</option>
        <option value="neck">Neck</option>
        <option value="leg">Leg</option>
        <option value="body">Body</option>
        <option value="tail">Tail</option>
      </select></div></div>

      <div class="formrow"><label style="color:var(--red);">Injury level</label><div class="formctrl"><select id="inj-level">

      <textarea id="inj-notes" style="min-height:90px;" placeholder="What happened and anything else worth recording"></textarea>

      <label style="margin-top:14px;">Quick check (optional)</label>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="display:flex;align-items:center;justify-content:space-between;gap:8px;text-transform:none;font-size:13px;color:var(--ink);"><span style="flex:1;text-align:right;">Bleeding</span><input type="checkbox" id="chk-bleeding" style="accent-color:var(--green);"></label>
        <label style="display:flex;align-items:center;justify-content:space-between;gap:8px;text-transform:none;font-size:13px;color:var(--ink);"><span style="flex:1;text-align:right;">Cannot put weight on it</span><input type="checkbox" id="chk-weightbearing" style="accent-color:var(--green);"></label>
        <label style="display:flex;align-items:center;justify-content:space-between;gap:8px;text-transform:none;font-size:13px;color:var(--ink);"><span style="flex:1;text-align:right;">Hot to touch</span><input type="checkbox" id="chk-hot" style="accent-color:var(--green);"></label>
      </div>
      <div style="font-size:13px;color:var(--grey);margin-top:6px;">Quick checks help analyse the injury</div>
    </div>
    ${footerBar([
      {id:'injadd-help', icon:'help', label:'Help'},
      {id:'injadd-save', icon:'save', label:'Save', primary:true},
      {id:'injadd-home', icon:'home', label:'Home', home:true},
    ])}`;
}

function renderSettings(){
  const section=(key, label, countText, bodyHtml, addFormHtml)=>{
    const open=settingsOpenSection===key;
    const inAddMode = open && settingsShowAddForm;
    return `
    <div id="settingsSection-${key}" style="margin:8px 0;">
      <button class="damagebar" data-togglesettings="${key}" style="background:var(--grey);font-size:16px;padding:13px 14px;">
        <span style="flex:1;text-align:left;">${label}</span>
        ${countText?`<span class="pill" style="background:rgba(255,255,255,.28);font-size:15px;margin-right:8px;">${countText}</span>`:''}
        <span style="width:20px;height:20px;flex-shrink:0;">${icon(open?'triangleDown':'triangleRight')}</span>
      </button>
      ${open?`<div class="damagepanel">${inAddMode?addFormHtml:bodyHtml}</div>`:''}
    </div>`;
  };

  const miniField=(labelText, inputHtml)=>`<div><label style="font-size:9px;color:var(--grey);font-weight:800;text-transform:uppercase;display:block;margin-bottom:2px;">${labelText}</label>${inputHtml}</div>`;

  const breedsBody = sortedBreeds(breeds).map(b=>`
    <div class="row" style="cursor:default;align-items:flex-start;">
      <div style="flex:1;min-width:0;">
        <div class="name">${b.name}</div><div class="id">${b.species}</div>
        <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;">
          ${miniField('Min Prime (mo)', `<input type="number" data-breed-minprime="${b.id}" value="${b.min_prime_months!=null?b.min_prime_months:18}" style="width:64px;padding:6px 8px;font-size:13px;">`)}
          ${miniField('Max Prime (mo)', `<input type="number" data-breed-maxprime="${b.id}" value="${b.max_prime_months!=null?b.max_prime_months:30}" style="width:64px;padding:6px 8px;font-size:13px;">`)}
          <div style="display:flex;align-items:flex-end;gap:4px;">
            ${miniField('£/kg', `<input type="number" inputmode="decimal" data-breed-price="${b.id}" value="${b.price_per_kg!=null?b.price_per_kg:''}" placeholder="\u2014" style="width:64px;padding:6px 8px;font-size:13px;">`)}
            <button data-breedvaluehistory="${b.id}" title="See £/kg over time" style="background:none;border:none;color:var(--primary);width:30px;height:30px;flex-shrink:0;padding:0;">${icon('lineChart')}</button>
          </div>
        </div>
      </div>
      <button data-toggle-breed="${b.id}" title="${b.active?'Active \u2014 tap to deactivate':'Deactivated \u2014 tap to reactivate'}" style="background:none;border:none;width:30px;height:30px;flex-shrink:0;color:${b.active?'var(--grey)':'var(--red)'};padding:0;">${icon('noentry')}</button>
    </div>`).join('') || '<div class="empty" style="padding:8px 4px;">No breeds yet.</div>';
  const breedsAddForm = `
    <div style="margin-top:10px;">
      <label>New breed name</label>
      <input type="text" id="newBreedName" placeholder="e.g. Dexter">
      <label>Min Prime age (months)</label>
      <input type="number" id="newBreedMinPrime" value="18">
      <label>Max Prime age (months)</label>
      <input type="number" id="newBreedMaxPrime" value="30">
    </div>`;

  const feedTypesBody = sortedBreeds(feedTypes).map(f=>{
    const last=lastFeedRecordForType(f.name);
    return `
    <div class="row" style="cursor:default;align-items:flex-start;">
      <div style="flex:1;min-width:0;">
        <div class="name">${f.name}</div>
        ${last ? `<div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;">
          ${miniField('Last cost', `<div style="font-size:13px;font-weight:700;color:var(--ink);padding:6px 0;">${fmtGBP(feedRecordCost(last))}</div>`)}
          ${miniField('Last qty', `<div style="font-size:13px;font-weight:700;color:var(--ink);padding:6px 0;">${fmtQty(last.sacks)}</div>`)}
          ${miniField('Last date', `<div style="font-size:13px;font-weight:700;color:var(--ink);padding:6px 0;">${fmtMonYY(last.start_date)}</div>`)}
        </div>` : `<div style="font-size:13px;color:var(--grey);margin-top:6px;">No purchases recorded yet</div>`}
      </div>
      <button data-toggle-feedtype="${f.id}" title="${f.active?'Active \u2014 tap to deactivate':'Deactivated \u2014 tap to reactivate'}" style="background:none;border:none;width:30px;height:30px;flex-shrink:0;color:${f.active?'var(--grey)':'var(--red)'};padding:0;">${icon('noentry')}</button>
    </div>`;
  }).join('') || '<div class="empty" style="padding:8px 4px;">No feed types yet.</div>';
  const feedTypesAddForm = `
    <div style="margin-top:10px;">
      <label>New fodder type name</label>
      <input type="text" id="newFeedTypeName" placeholder="e.g. Barley">
    </div>`;

  const medCabinetBody=(()=>{
    const active=activeCabinetItems();
    const byType={};
    active.forEach(m=>{ const t=m.type||'Other'; (byType[t]=byType[t]||[]).push(m); });
    const typeNames=Object.keys(byType).sort((a,b)=>a.localeCompare(b));
    const renderItemRow=(m)=>{
      const expStatus=cabinetExpiryStatus(m);
      const remStatus=cabinetRemainingStatus(m);
      const remaining=cabinetRemaining(m);
      return `
      <div class="row" data-editmedcab="${m.id}" style="cursor:pointer;align-items:center;">
        <div style="flex:1;min-width:0;">
          <div class="name">${escapeHtml(m.name)}</div>
          <div style="font-size:12.5px;color:var(--grey);margin-top:2px;">Batch ${escapeHtml(m.batch_no||'\u2014')}<br>Exp ${expStatus?`<span style="display:inline-block;background:var(--${expStatus}-bg);color:var(--${expStatus});font-weight:700;border-radius:20px;padding:1px 8px;">${m.expiry_date?fmtDate(m.expiry_date):'\u2014'}</span>`:(m.expiry_date?fmtDate(m.expiry_date):'\u2014')}</div>
        </div>
        <div style="text-align:right;margin-right:10px;flex-shrink:0;">
          <div style="font-size:14px;font-weight:800;${remStatus?`color:var(--${remStatus});`:'color:var(--ink);'}">${remaining} / ${m.qty_size!=null?m.qty_size:'\u2014'}${m.qty_unit||''}</div>
          <div style="font-size:10.5px;color:var(--grey);text-transform:uppercase;">remaining</div>
        </div>
        <button data-disposemed="${m.id}" title="Dispose of this medicine" style="background:none;border:none;width:30px;height:30px;flex-shrink:0;color:var(--red);padding:0;">${icon('trash')}</button>
      </div>`;
    };
    const typesHtml = typeNames.length ? typeNames.map(t=>{
      const items=byType[t].slice().sort((a,b)=>a.name.localeCompare(b.name));
      const open=medCabinetExpandedType===t;
      return `
      <div style="margin:6px 0;">
        <button class="damagebar" data-toggle-medcabtype="${escapeHtml(t)}" style="background:var(--green);color:#fff;font-size:16px;padding:13px 14px;">
          <span style="flex:1;text-align:left;">${escapeHtml(t)}</span>
          <span class="pill" style="background:rgba(255,255,255,.28);font-size:15px;margin-right:8px;">${items.length}</span>
          <span style="width:20px;height:20px;flex-shrink:0;">${icon(open?'triangleDown':'triangleRight')}</span>
        </button>
        ${open?`<div class="damagepanel">${items.map(renderItemRow).join('')}</div>`:''}
      </div>`;
    }).join('') : '<div class="empty" style="padding:8px 4px;">No medicine yet \u2014 click Add.</div>';

    const previous=previousCabinetItems(medCabinetPrevMonthsBack);
    const renderPrevRow=(m)=>`
      <div class="row" data-viewmedcab="${m.id}" style="cursor:pointer;">
        <span>${fmtShortDate(m.disposal_date||m.disposed_at)}&nbsp;&nbsp;&nbsp;${escapeHtml(m.name)}</span>
        <span style="color:var(--grey);width:16px;height:16px;flex-shrink:0;">${icon('triangleRight')}</span>
      </div>`;
    const prevHtml = `
      <button id="medCabinetPrevToggle" class="damagebar" style="background:var(--grey-light);color:var(--ink);font-size:16px;padding:13px 14px;margin-top:22px;">
        <span>View previous</span><span style="width:20px;height:20px;flex-shrink:0;">${icon(medCabinetViewPrevExpanded?'triangleDown':'triangleRight')}</span>
      </button>
      ${medCabinetViewPrevExpanded? (previous.length? previous.map(renderPrevRow).join('') + `<button id="medCabinetPrevShowMore" class="fullbtn ghost" style="margin-top:10px;">Show previous ${medCabinetPrevMonthsBack} months</button>` : `<div class="empty" style="padding:10px 4px;">None disposed in the last ${medCabinetPrevMonthsBack} months.</div><button id="medCabinetPrevShowMore" class="fullbtn ghost" style="margin-top:10px;">Show previous ${medCabinetPrevMonthsBack} months</button>`) : ''}`;
    return typesHtml + prevHtml;
  })();

  const farmersVetsBody = sortedBreeds(farmersVets).map(p=>`
    <div class="row" style="cursor:default;">
      <div><div class="name">${p.name}</div><div class="id">${p.role}</div></div>
      <button data-toggle-farmervet="${p.id}" title="${p.active?'Active \u2014 tap to deactivate':'Deactivated \u2014 tap to reactivate'}" style="background:none;border:none;width:30px;height:30px;flex-shrink:0;color:${p.active?'var(--grey)':'var(--red)'};padding:0;">${icon('noentry')}</button>
    </div>`).join('') || '<div class="empty" style="padding:8px 4px;">No farmers or vets yet.</div>';
  const farmersVetsAddForm = `
    <div style="margin-top:10px;">
      <label>Role</label>
      <select id="newFarmerVetRole"><option value="farmer" selected>Farmer</option><option value="vet">Vet</option></select>
      <label>Name</label>
      <input type="text" id="newFarmerVetName" placeholder="e.g. Dr. Smith">
    </div>`;

  const testDataBody = `
    <div style="font-size:13px;color:var(--grey);padding:2px 2px 12px;">Switch between the built-in demo dataset (animals, breeds, fodder types, medicine types, and farmers &amp; vets, for trying the app out) and a completely empty system ready for real farm records. The Admin login always stays available either way.</div>
    <div class="formrow" style="padding:0 2px;"><label>Test data</label><div class="formctrl radiogroup" style="justify-content:flex-end;gap:14px;">
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="testDataRadio" id="testDataLoaded" ${farmSettings.test_data_mode!=='cleared'?'checked':''}> Loaded</label>
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="testDataRadio" id="testDataClear" ${farmSettings.test_data_mode==='cleared'?'checked':''}> Clear</label>
    </div></div>`;

  return `
    <div class="appbar"><button class="back" data-genericback="1">${icon('back')}</button><span>Settings</span><span></span></div>
    <div class="body">
      <div class="formrow"><label>Farm CPH number</label><div class="formctrl">
        <input type="text" inputmode="numeric" id="cphInput" maxlength="11" placeholder="e.g. 12/345/6789" value="${farmSettings.cph?escapeHtml(farmSettings.cph):''}">
      </div></div>

      <div class="formrow"><label>Farm location</label><div class="formctrl" style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="farmLocationInput" placeholder="Not captured" readonly value="${farmSettings.farm_location?farmSettings.farm_location.lat+', '+farmSettings.farm_location.lng:''}" style="flex:1;background:#f3f3f3;color:var(--grey);">
        <button id="farmLocationBtn" style="background:none;border:none;cursor:pointer;color:var(--ink);width:30px;height:30px;flex-shrink:0;padding:0;">${icon('pin')}</button>
      </div></div>
      <div class="field-error" id="err-farmlocation" style="padding:0 2px;"></div>

      <div class="formrow"><label>Animal names/<br>Mgmt ID? <button class="helpcircle" id="useAnimalNamesHelp" style="margin-left:2px;">?</button></label><div class="formctrl radiogroup" style="justify-content:flex-end;gap:14px;">
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="useAnimalNamesRadio" id="useAnimalNamesYes" ${farmSettings.use_animal_names!==false?'checked':''}> Yes</label>
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="useAnimalNamesRadio" id="useAnimalNamesNo" ${farmSettings.use_animal_names===false?'checked':''}> No</label>
      </div></div>
      <div style="border-top:1px solid var(--line);margin:12px 0 4px;"></div>

      ${section('breeds', 'Breeds', breeds.length, breedsBody, breedsAddForm)}
      ${section('feedtypes', 'Fodder types', feedTypes.length, feedTypesBody, feedTypesAddForm)}
      ${section('medtypes', 'Medicine Cabinet', activeCabinetItems().length, medCabinetBody, '')}
      ${section('farmersvets', 'Farmers & vets', farmersVets.length, farmersVetsBody, farmersVetsAddForm)}
      ${section('testdata', 'Test data', '', testDataBody, '')}
      <div id="settingsSection-useai" style="margin:8px 0;">
        <button class="damagebar" data-togglesettings="useai" style="background:var(--grey);font-size:16px;padding:13px 14px;">
          <span>Use AI?</span>
          <span style="width:20px;height:20px;flex-shrink:0;">${icon(settingsOpenSection==='useai'?'triangleDown':'triangleRight')}</span>
        </button>
        ${settingsOpenSection==='useai'?`<div class="damagepanel">
          <div class="formrow" style="border-bottom:none;margin-top:0;"><label>Use AI?</label><div class="formctrl radiogroup" style="justify-content:flex-end;gap:14px;">
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="useAiRadio" id="useAiYes" ${userSettings.use_ai===true?'checked':''}> Yes</label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;"><input type="radio" name="useAiRadio" id="useAiNo" ${userSettings.use_ai!==true?'checked':''}> No</label>
          </div></div>
          <div style="font-size:13px;color:var(--grey);margin-top:8px;">Turns on the "Ask" feature in Reports \u2014 lets you type or speak a question and get an answer using your own farm records, plus general farming knowledge. Also used for enhanced tag reading \u2014 when scanning an EID tag, this is tried first and reads angled, worn, or stylised tags far better than the built-in offline reader (which is still used as an automatic fallback if there's no signal or the request fails, so tag scanning always still works either way). Off by default. You'll be limited to your own usage allowance per day; the AI provider only sees your question (for Ask) or the tag photo (for tag reading), plus a summary of your records needed to answer it, nothing more.</div>
          ${userSettings.use_ai===true?`
          <div style="border-top:1px solid var(--line);margin:14px 0 0;padding-top:14px;">
            <label style="margin-top:0;">Gemini API key</label>
            <input type="text" id="geminiApiKey" placeholder="Paste your key here" value="${userSettings.gemini_api_key?escapeHtml(userSettings.gemini_api_key):''}" autocapitalize="off" autocorrect="off" spellcheck="false">
            <div style="font-size:13px;color:var(--grey);margin-top:8px;">Free to get from Google AI Studio, with a daily usage allowance (that allowance is shared across every scan/question made on this key, so is worth keeping an eye on if several people share one). The key is stored only on this device and sent only to Google.</div>
            <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;font-size:13px;color:var(--link);">Get a Gemini API key from Google AI Studio &rarr;</a>
          </div>`:''}
        </div>`:''}
      </div>

      <div id="settingsSection-backup" style="margin:8px 0;">
        <button class="damagebar" data-togglesettings="backup" style="background:var(--green);font-size:16px;padding:13px 14px;">
          <span>Backup</span>
          <span style="width:20px;height:20px;flex-shrink:0;">${icon(settingsOpenSection==='backup'?'triangleDown':'triangleRight')}</span>
        </button>
        ${settingsOpenSection==='backup'?`<div class="damagepanel">
          <div style="font-size:13px;color:var(--grey);margin-bottom:10px;">Everything on this device \u2014 animals, weights, medicine, the Medicine Cabinet, injuries, fodder, farm damage, moves, farmers &amp; vets, breeding, and settings. Keep this somewhere safe: if the phone is lost, damaged, or replaced, restoring this file brings everything back exactly as it was.</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="flex:1;font-size:14px;color:var(--ink);">Click here to backup your data:</span>
            <button id="backupGoBtn" title="Download backup" style="background:var(--green);border:none;border-radius:8px;width:52px;height:52px;flex-shrink:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
              <span style="width:28px;height:28px;">${icon('save')}</span>
            </button>
          </div>
          <div id="backupStatus" style="font-size:12px;color:var(--primary);margin-top:8px;display:none;"></div>
          <div style="border-top:1px solid var(--line);margin:16px 0;"></div>
          <button id="backupRestoreToggle" style="width:100%;background:none;border:none;display:flex;align-items:center;justify-content:space-between;padding:2px 0;cursor:pointer;">
            <span style="font-size:14px;font-weight:700;color:var(--ink);">Restore from backup file</span>
            <span style="width:18px;height:18px;flex-shrink:0;color:var(--grey);">${icon(backupRestoreOpen?'triangleDown':'triangleRight')}</span>
          </button>
          ${backupRestoreOpen?`
          <div style="margin-top:10px;">
            <div class="warnbanner" style="display:block;">
              <div style="font-weight:800;margin-bottom:2px;">WARNING!</div>
              <div>Any data not in the backup will be deleted. This cannot be undone.</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:14px;">
              <span style="flex:1;font-size:14px;color:var(--ink);">Select backup file:</span>
              <button id="backupRestoreSelectBtn" title="${backupRestoreFile?'Change file':'Select backup file'}" style="background:#fff;border:1px solid var(--line);border-radius:8px;width:52px;height:52px;flex-shrink:0;color:var(--grey-light);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
                <span style="width:32px;height:32px;">${icon('folder')}</span>
              </button>
            </div>
            <input type="file" id="backupRestoreFileInput" accept=".json" style="display:none;">
            ${backupRestoreFile?`<div style="font-size:12.5px;color:var(--ink);margin-top:8px;display:flex;align-items:center;gap:6px;"><span style="width:16px;height:16px;flex-shrink:0;color:var(--primary);">${icon('save')}</span>${escapeHtml(backupRestoreFile.name)}</div>`:''}
            ${backupRestoreError?`<div class="field-error" style="margin-top:8px;">${escapeHtml(backupRestoreError)}</div>`:''}
            ${backupRestoreFile?`<button id="backupRestoreGoBtn" class="fullbtn danger" ${backupRestoreBusy?'disabled':''} style="margin-top:12px;">${backupRestoreBusy?'Restoring\u2026':'Restore \u2014 replace everything'}</button>`:''}
          </div>`:''}
        </div>`:''}
      </div>

      <div id="settingsSection-export" style="margin:8px 0;">
        <button class="damagebar" data-togglesettings="export" style="background:var(--grey);font-size:16px;padding:13px 14px;">
          <span>Export farm data (spreadsheet)</span>
          <span style="width:20px;height:20px;flex-shrink:0;">${icon(settingsOpenSection==='export'?'triangleDown':'triangleRight')}</span>
        </button>
        ${settingsOpenSection==='export'?`<div class="damagepanel">
          <div style="font-size:13px;color:var(--grey);margin-bottom:10px;">A readable spreadsheet of animals, weights, medicine, and injuries \u2014 handy for sharing with a vet or accountant. For backing up the device itself, use Backup above instead \u2014 this doesn't include fodder, the Medicine Cabinet, moves, farm damage, farmers &amp; vets, or breeding.</div>
          <button id="exportGoBtn" class="fullbtn" style="margin-top:0;">Export</button>
          <div id="exportStatus" style="font-size:12px;color:var(--primary);margin-top:8px;display:none;"></div>
        </div>`:''}
      </div>

      <div id="settingsSection-import" style="margin:8px 0;">
        <button class="damagebar" data-togglesettings="import" style="background:var(--grey);font-size:16px;padding:13px 14px;">
          <span>Import farm data (spreadsheet)</span>
          <span style="width:20px;height:20px;flex-shrink:0;">${icon(settingsOpenSection==='import'?'triangleDown':'triangleRight')}</span>
        </button>

// Closes whatever modal is open without rebuilding the underlying screen —
// used where the screen behind the modal has in-progress, unsaved field
// values that a full render() would wipe out.
// ---------- camera-based tag scan (real OCR reader) ----------
// Opens the phone's actual camera, then runs the captured photo through an
// on-device OCR engine (Tesseract.js, loaded from CDN — see the <script> tag
// near the top of the file) to read the printed EID digits off the tag
// itself. No RFID/NFC hardware integration — this is a photo read, same as
// a farmer squinting at the tag, so lighting/focus/angle all matter.
let ocrWorkerPromise=null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise=(async()=>{
      const worker=await Tesseract.createWorker('eng');
      // Letters need to stay in the allowed set (not just digits) so things
      // like the "UK" country mark on the tag get read AS letters and
      // discarded cleanly — forcing everything into 0-9 was making Tesseract
      // mis-guess the country mark, the crown logo, and the tag's plastic
      // button/stud as extra stray digits, which then got glued onto the
      // real number.
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ ',
        tessedit_pageseg_mode: '6', // treat the photo as one uniform block of text
      });
      return worker;
    })();
  }
  return ocrWorkerPromise;
}
// Basic contrast boost before OCR: grayscale + hard threshold. Ear tags are
// usually dark digits on a light tag, so this cheap pass measurably helps
// Tesseract lock onto the digits instead of scratches, mud, or background.
function preprocessImageForOcr(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(img.src);
      const maxDim=1600;
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){ const scale=maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const imageData=ctx.getImageData(0,0,w,h);
      const d=imageData.data;
      for(let i=0;i<d.length;i+=4){
        const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        const v=gray>140?255:0;
        d[i]=d[i+1]=d[i+2]=v;
      }
      ctx.putImageData(imageData,0,0);
      canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('canvas export failed')), 'image/png');
    };
    img.onerror=()=>reject(new Error('image load failed'));
    img.src=URL.createObjectURL(file);
  });
}
// Pulls the tag number out of raw OCR text. A printed ear tag isn't one
// monolithic number — it's normally two groups (a herd mark and an
// individual animal number, e.g. "777777" and "301234"), plus a country
// mark ("UK"/"GB", or "XI" for Northern Ireland) and a crown/logo graphic
// that OCR sometimes mis-guesses as a stray extra digit or two. Digit
// groups are extracted by looking at each recognised word on its own and
// only keeping substantial ones (4+ digits) — short 1-3 digit leftovers
// are almost always misread noise, not part of the tag number.
//
// The country mark is printed as letters but the electronic EID uses a
// numeric equivalent (UK/GB → 826, XI → 899) — OCR can only ever read it
// as text, so it's spotted separately here and translated to the number
// it actually represents on the chip, then prepended.
//
// Caveat worth knowing: this assumes the tag is a WYSIWYG bovine EID tag,
// where the printed herd mark + individual number are the exact same
// digits encoded on the chip after the country code. That's only true for
// newer tags issued under the bovine EID rollout (new calves onward) — the
// bulk of existing UK cattle still carry the older tag numbering, which
// isn't guaranteed to decompose into a clean herd+animal-number EID this
// way. So a scanned "EID" here is a best-effort reconstruction from the
// tag face, not a guaranteed read of the actual electronic chip contents.
function extractEidFromOcrText(rawText){
  if(!rawText) return null;
  const upper=rawText.toUpperCase();
  let countryPrefix=null;
  if(/\bXI\b/.test(upper)) countryPrefix='899';
  else if(/\b(UK|GB)\b/.test(upper)) countryPrefix='826';
  const words=rawText.split(/\s+/).filter(Boolean);
  const groups=words.map(w=>w.replace(/\D/g,'')).filter(g=>g.length>=4);
  if(!groups.length) return null;
  const combined=groups.join('');
  if(combined.length<6) return null; // too little to be confident this is a real tag read
  return (countryPrefix ? countryPrefix+' ' : '') + groups.join(' ');
}
// Runs the full read pipeline on one captured photo using the on-device
// offline reader: preprocess -> OCR -> extract digits. Updates statusEl (if
// given) with progress so the first scan on a device — which has to
// download the OCR engine — doesn't look like it's hung.
async function readEidFromPhotoTesseract(file, statusEl){
  if(statusEl && !ocrWorkerPromise){ statusEl.style.display='block'; statusEl.style.color='var(--grey)'; statusEl.textContent='Loading tag reader (first scan only)\u2026'; }
  if(!ocrWorkerPromise) updateScanningOverlay('Loading tag reader (first scan only)\u2026');
  const worker=await getOcrWorker();
  if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--grey)'; statusEl.textContent='Reading tag\u2026'; }
  updateScanningOverlay('Reading tag\u2026');
  const processed=await preprocessImageForOcr(file);
  const { data:{ text } }=await worker.recognize(processed);
  return extractEidFromOcrText(text);
}
// Same read, via the Gemini vision API instead of the offline reader —
// genuinely reads the image rather than pattern-matching character shapes,
// so handles angled/worn/stylised tags far better. Requires the farmer's
// own Gemini API key (Settings > Use AI?) and a live connection;
// throws on any failure so the caller can fall back cleanly rather than
// silently returning a wrong answer.
// Google renames/retires Flash models often (this app has already hit one
// retirement mid-project) — gemini-flash-latest is Google's own
// self-updating alias for exactly this reason, so try that first. It's not
// 100% risk-free itself (occasionally points to an experimental release,
// and Google's docs note it can be re-pointed with 2 weeks' notice), so
// gemini-3.6-flash — the current GA/stable release as of Sept 2026 — is
// kept as a pinned second attempt if the alias specifically 404s. Worth
// revisiting this pinned fallback occasionally as models keep moving.
const GEMINI_MODEL_CANDIDATES=['gemini-flash-latest', 'gemini-3.6-flash'];
async function readEidFromPhotoGemini(file, statusEl){
  if(!userSettings.gemini_api_key) throw new Error('no Gemini key configured');
  if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--grey)'; statusEl.textContent='Reading tag\u2026'; }
  updateScanningOverlay('Reading tag\u2026');
  const base64=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=()=>reject(new Error('image read failed'));
    reader.readAsDataURL(file);
  });
  // Prompt is deliberately specific about the OFFICIAL printed structure
  // (per DEFRA/BCMS/gov.scot ear tag specs), not just "read the digits" —
  // giving Gemini the real shape to expect measurably improves reads of
  // angled/worn tags AND photos of a screen/photo of a tag (moire/glare
  // confuses generic OCR far more than a model that knows what it's
  // looking for). Since 1 Jan 2000 UK cattle tags print as: two-letter
  // country code (UK/GB, or XI for NI) + a 6-digit herd number + a second
  // 6-digit group (1 check digit + the animal's 5-digit individual number)
  // — e.g. "UK 123456 700002". Older/replacement tags can deviate from
  // this, so the model isn't told to reject anything that doesn't match.
  // The "don't omit unclear digits" instruction matters a lot in practice:
  // a model note like "...smudged" for an unclear digit reads as prose
  // text and gets silently dropped by the word-length filter downstream —
  // one of the most common ways a genuinely OK read still returns nothing.
  const prompt='This is a photo of a UK/EU bovine (cattle) ear tag — it may be at an angle, worn, on a curved surface, or itself a photo of a tag shown on a screen/photo. Official UK ear tags (since 1 Jan 2000) print as: a two-letter country code (UK, GB, or XI for Northern Ireland), then a 6-digit herd number, then a second 6-digit group made up of a check digit plus the animal\u2019s 5-digit individual number — for example "UK 123456 700002". Some older or replacement tags may not exactly match this pattern; read what is actually printed either way. Read ONLY the printed country code and digit groups exactly as shown on the tag itself, ignoring any crown/logo graphic, extra management-info text, scratches, plastic stud, or background. If any single digit is smudged or unclear, give your single best guess for that digit rather than leaving it out or describing it in words — never omit a digit. Reply with ONLY the country code (if visible) followed by the digit groups exactly as printed, separated by single spaces, and nothing else — no explanation, no punctuation, no extra words.';
  const GEMINI_TIMEOUT_MS=10000; // a farmer with a weak signal shouldn't be
  // left staring at "Reading tag..." for the 30-60s a browser's own default
  // timeout can take before giving up — bail out and fall back to the
  // offline reader well before that becomes the frustrating part.
  let lastErr;
  for(const model of GEMINI_MODEL_CANDIDATES){
    // Newer "Auth key" format keys (the ones starting AQ. rather than
    // AIza) need to go in the x-goog-api-key header rather than a ?key=
    // query param — the query-param style is the older convention and
    // doesn't reliably authenticate an Auth key.
    let resp;
    const controller=new AbortController();
    const timeoutId=setTimeout(()=>controller.abort(), GEMINI_TIMEOUT_MS);
    let timedOut=false;
    try{
      resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'x-goog-api-key':userSettings.gemini_api_key},
        body:JSON.stringify({
          contents:[{parts:[{text:prompt},{inline_data:{mime_type:file.type||'image/jpeg', data:base64}}]}],
          // thinkingBudget:0 turns off "thinking" for this model family —
          // reading a tag doesn't need reasoning, and leaving thinking on
          // was the actual root cause of tags not being read at all: with
          // maxOutputTokens this low, a thinking model spends the whole
          // budget on its internal reasoning and has zero tokens left to
          // write the answer, coming back with an EMPTY text field and
          // finishReason MAX_TOKENS — which looks exactly like "Gemini
          // couldn't read the tag" but is really "Gemini never got to
          // answer". maxOutputTokens is bumped up too, as a second safety
          // margin, since not every candidate model necessarily honours
          // thinkingBudget:0 (unsupported models should just ignore the
          // field rather than erroring, but this keeps things working
          // either way).
          generationConfig:{temperature:0, maxOutputTokens:300, thinkingConfig:{thinkingBudget:0}},
        }),
        signal:controller.signal,
      });
    }catch(networkErr){
      timedOut = networkErr.name==='AbortError';
      lastErr = timedOut
        ? new Error('Gemini ('+model+') timed out after '+(GEMINI_TIMEOUT_MS/1000)+'s (weak/slow signal)')
        : networkErr;
      // A hard connection failure (no signal at all) won't fix itself by
      // trying a different model name — but a timeout specifically means
      // the connection worked and the server was just slow, which the
      // other model might not be, so that one IS worth a second try.
      if(!timedOut) throw lastErr;
      continue;
    } finally {
      clearTimeout(timeoutId);
    }
    if(resp.ok){
      const json=await resp.json();
      const text=json?.candidates?.[0]?.content?.parts?.[0]?.text;
      const finishReason=json?.candidates?.[0]?.finishReason;
      if(!text) throw new Error('Gemini ('+model+') returned no readable text (finishReason: '+(finishReason||'unknown')+')');
      const digits=extractEidFromOcrText(text);
      // IMPORTANT: this used to silently return null here on a parse miss,
      // which the caller treated as an ordinary (non-error) empty result —
      // so the farmer only ever saw "couldn't read a tag number from that
      // photo" with no clue Gemini had actually returned something. That
      // hid the real failure mode: Gemini often DOES read the tag fine but
      // in a shape extractEidFromOcrText doesn't recognise (extra words,
      // an unexpected separator, digit groups outside the 4+ digit filter,
      // etc). Throwing here instead surfaces the raw text in the on-screen
      // error (via geminiError below), which is what's needed to tell
      // "Gemini genuinely can't read this tag" apart from "Gemini read it
      // but our parser choked on the reply" — two very different bugs.
      if(!digits) throw new Error('Gemini ('+model+') read the text \u201c'+text.trim().replace(/\s+/g,' ').slice(0,80)+'\u201d but a tag number couldn\u2019t be parsed out of it');
      return digits;
    }
    const errBody=await resp.text().catch(()=>'');
    lastErr=new Error('Gemini ('+model+') request failed ('+resp.status+'): '+errBody.slice(0,150).trim());
    // Worth trying the next candidate on: 404 (this model's gone), 429
    // (rate-limited — the other model may have separate quota), or any
    // 5xx (temporary server-side trouble, like the 503 that first exposed
    // this gap — that's model-load related, not something a different
    // model name is guaranteed to share). NOT worth retrying on 400/401/
    // 403 — those are request-format or key problems that would fail
    // identically on every model, so a second call would just waste time
    // confirming the same failure twice.
    const worthRetrying = resp.status===404 || resp.status===429 || resp.status>=500;
    if(!worthRetrying) throw lastErr;
  }
  throw lastErr;
}
// Main entry point every scan flow calls. Tries Gemini first when a key's
// configured — falls straight back to the offline Tesseract reader on ANY
// failure (no key, no signal, bad response, rate limit, whatever) so a
// scan never just breaks; it only ever gets quietly less accurate. Returns
// which engine actually produced the result (or failed) alongside the
// digits, so a failed read can tell the farmer something more useful than
// just "couldn't read it" — that detail used to only go to the internal
// activity log, which isn't somewhere a phone user would ever find it.
// Extracts several fields at once from a photo of a passport page (EID,
// breed, sex, DOB, mgmt/herd ID, dam/sire EID) — structured multi-field
// extraction like this genuinely needs a vision model's judgement, not
// just OCR, so unlike tag scanning there's no offline Tesseract fallback:
// without a Gemini key this feature just isn't available, and the caller
// says so up front.
async function readAnimalFromPassportGemini(file){
  if(!userSettings.gemini_api_key) throw new Error('no Gemini key configured');
  updateScanningOverlay('Reading passport\u2026');
  const base64=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=()=>reject(new Error('image read failed'));
    reader.readAsDataURL(file);
  });
  // Deliberately scoped to the individual animal's own details plus its
  // parents' EIDs — not the keeper/holding info on the cover or movement
  // history, which aren't useful here.
  // Dam's number is commonly printed on a passport; sire's number is rarer
  // (often unknown in a suckler herd) but included when it's there too —
  // both are just off-farm EID references at this point, same as if the
  // farmer had typed them into the Mother/Father picker by hand.
  // Modern (post-2011, CPP52) UK passports are a single page. Breed is
  // printed as an official 2-3 letter code (e.g. LIM, BRB, AA), NOT the
  // full breed name — asked to translate it rather than return the raw
  // code, since the app matches against full breed names configured on
  // the farm. "X" on the end (e.g. LIMX) means a cross of that breed.
  const prompt='This is a photo of a page from a UK (or EU) cattle passport for one individual animal. Modern UK passports (since 2011, form CPP52) are a single page; the animal\u2019s own ear tag number is usually printed in the top-right corner, formatted as a country code (e.g. UK) followed by a 6-digit herd number, then a check digit, then a 5-digit sequence number \u2014 transcribe it exactly as printed, spaces included. Breed is printed as the breed name in full (e.g. "HEREFORD"), sometimes followed by "X" or "CROSS" meaning the animal is a cross of that breed (e.g. "HEREFORD X" = Hereford Cross) \u2014 transcribe the breed exactly as printed, X/Cross suffix included, do not guess a code or translate it into anything else. Extract these details if visible on this page, and reply with ONLY a single JSON object and nothing else \u2014 no markdown fences, no explanation: {"eid":"the animal\u2019s own official ear tag number, as printed (country code plus digit groups), or null if not visible","breed":"the breed exactly as printed, X/Cross suffix included if present, or null","sex":"M or F, or null","dob":"date of birth as YYYY-MM-DD, or null","mgmt_id":"any herd mark, management number, or name printed for this specific animal, or null","dam_eid":"the dam\u2019s official ear tag number if printed \u2014 may be labelled Dam, Genetic Dam, or Birth Dam \u2014 or null","sire_eid":"the sire\u2019s (father\u2019s) official ear tag number if printed, or null \u2014 often blank/unknown, that\u2019s normal"}. Use null for anything not actually visible on this page rather than guessing. Do not include keeper/holding details or movement history.';
  const GEMINI_TIMEOUT_MS=12000;
  let lastErr;
  for(const model of GEMINI_MODEL_CANDIDATES){
    const controller=new AbortController();
    const timeoutId=setTimeout(()=>controller.abort(), GEMINI_TIMEOUT_MS);
    let timedOut=false;
    let resp;
    try{
      resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'x-goog-api-key':userSettings.gemini_api_key},
        body:JSON.stringify({
          contents:[{parts:[{text:prompt},{inline_data:{mime_type:file.type||'image/jpeg', data:base64}}]}],
          generationConfig:{temperature:0, maxOutputTokens:500, thinkingConfig:{thinkingBudget:0}},
        }),
        signal:controller.signal,
      });
    }catch(networkErr){
      timedOut = networkErr.name==='AbortError';
      lastErr = timedOut
        ? new Error('Gemini ('+model+') timed out after '+(GEMINI_TIMEOUT_MS/1000)+'s (weak/slow signal)')
        : networkErr;
      if(!timedOut) throw lastErr;
      continue;
    } finally {
      clearTimeout(timeoutId);
    }
    if(resp.ok){
      const json=await resp.json();
      const text=json?.candidates?.[0]?.content?.parts?.[0]?.text;
      const finishReason=json?.candidates?.[0]?.finishReason;
      if(!text) throw new Error('Gemini ('+model+') returned no readable text (finishReason: '+(finishReason||'unknown')+')');
      const cleaned=text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
      let parsed;
      try{ parsed=JSON.parse(cleaned); }catch(parseErr){ throw new Error('Gemini ('+model+') reply couldn\u2019t be read as data: \u201c'+cleaned.slice(0,120)+'\u201d'); }
      return parsed;
    }
    const errBody=await resp.text().catch(()=>'');
    lastErr=new Error('Gemini ('+model+') request failed ('+resp.status+'): '+errBody.slice(0,150).trim());
    const worthRetrying = resp.status===404 || resp.status===429 || resp.status>=500;
    if(!worthRetrying) throw lastErr;
  }
  throw lastErr;
}
// Same JSON-completion pattern as readAnimalFromPassportGemini, but
// text-only (no inline_data) — used by the "Ask" report to run the
// farmer's own Gemini key instead of the sandbox-only Claude endpoint,
// so Ask actually works once this app is used outside a Claude preview.
async function askFarmQuestionGemini(promptText){
  if(!userSettings.gemini_api_key) throw new Error('no Gemini key configured');
  const GEMINI_TIMEOUT_MS=20000; // answers need more room than a single tag read
  let lastErr;
  for(const model of GEMINI_MODEL_CANDIDATES){
    const controller=new AbortController();
    const timeoutId=setTimeout(()=>controller.abort(), GEMINI_TIMEOUT_MS);
    let timedOut=false;
    let resp;
    try{
      resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'x-goog-api-key':userSettings.gemini_api_key},
        body:JSON.stringify({
          contents:[{parts:[{text:promptText}]}],
          generationConfig:{temperature:0.2, maxOutputTokens:1024, thinkingConfig:{thinkingBudget:0}},
        }),
        signal:controller.signal,
      });
    }catch(networkErr){
      timedOut = networkErr.name==='AbortError';
      lastErr = timedOut
        ? new Error('Gemini ('+model+') timed out after '+(GEMINI_TIMEOUT_MS/1000)+'s (weak/slow signal)')
        : networkErr;
      if(!timedOut) throw lastErr;
      continue;
    } finally {
      clearTimeout(timeoutId);
    }
    if(resp.ok){
      const json=await resp.json();
      const text=json?.candidates?.[0]?.content?.parts?.[0]?.text;
      const finishReason=json?.candidates?.[0]?.finishReason;
      if(!text) throw new Error('Gemini ('+model+') returned no readable text (finishReason: '+(finishReason||'unknown')+')');
      const cleaned=text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
      let parsed;
      try{ parsed=JSON.parse(cleaned); }catch(parseErr){ throw new Error('Gemini ('+model+') reply couldn\u2019t be read as data: \u201c'+cleaned.slice(0,120)+'\u201d'); }
      return parsed;
    }
    const errBody=await resp.text().catch(()=>'');
    lastErr=new Error('Gemini ('+model+') request failed ('+resp.status+'): '+errBody.slice(0,150).trim());
    const worthRetrying = resp.status===404 || resp.status===429 || resp.status>=500;
    if(!worthRetrying) throw lastErr;
  }
  throw lastErr;
}
async function readEidFromPhoto(file, statusEl){
  if(userSettings.use_ai===true && userSettings.gemini_api_key){
    try{
      const digits=await readEidFromPhotoGemini(file, statusEl);
      return {digits, engineUsed:'gemini'};
    }catch(e){
      logMsg('Gemini tag read failed, falling back to offline reader: '+e.message);
      updateScanningOverlay('Gemini unavailable \u2014 trying offline reader\u2026');
      try{
        const digits=await readEidFromPhotoTesseract(file, statusEl);
        return {digits, engineUsed:'tesseract', geminiError:e.message};
      }catch(e2){
        return {digits:null, engineUsed:'tesseract', engineError:e2.message, geminiError:e.message};
      }
    }
  }
  try{
    const digits=await readEidFromPhotoTesseract(file, statusEl);
    return {digits, engineUsed:'tesseract'};
  }catch(e2){
    return {digits:null, engineUsed:'tesseract', engineError:e2.message};
  }
}
// Routes a scanned EID straight to the right outcome for the context it was
// scanned from — no extra "look up" confirm tap needed.
async function processScannedEid(eid, mode, statusEl){
  const norm=s=>s.replace(/\s+/g,'').toLowerCase();
  const activeOnly = mode!=='lookup';
  const match=animals.find(a=>a.eid && norm(a.eid)===norm(eid) && (!activeOnly || a.status==='active'));
  if(match){
    if(mode==='lookup'){ modal=null; selectedId=match.id; view='detail'; render(); }
    else if(mode==='weigh'){ selectAnimalForWeigh(match.id); }
    else if(mode==='medBulk'){ selectAnimalForMedBulk(match.id); }
    else if(mode==='move'){
      const result=await selectAnimalForMove(match.id);
      renderModal();
      showSaveToast(result==='removed'?'Removed':'Added');
    }
    return;
  }
  if(mode==='lookup'){
    showConfirmModal('No animal found with EID '+eid+'. Add as a new animal?', ()=>{
      newAnimalMotherId=null; newAnimalMotherExternalEid=null; newAnimalFatherId=null; newAnimalFatherExternalEid=null; newAnimalPhoto=null;
      newAnimalPassportScanned=false;
      newAnimalEid=eid; view='add'; render();
    });
    return;
  }
  if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--red)'; statusEl.textContent='No active animal found with EID '+eid+'.'; }
}
// Opens the camera, then actually reads the tag from the photo taken.
function performTagScan(mode, statusElId){
  triggerScanCameraCapture(async(file)=>{
    const statusEl=statusElId ? document.getElementById(statusElId) : null;
    if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--grey)'; statusEl.textContent='Reading tag\u2026'; }
    showScanningOverlay('Reading tag\u2026');
    try{
      const result=await readEidFromPhoto(file, statusEl);
      if(!result.digits){
        // Tells the farmer (and, when they describe it back, us) exactly
        // which reader was actually in play, not just "it didn't work" —
        // that distinction used to be invisible outside the internal log.
        // Includes the actual Gemini error text (truncated) rather than
        // just "it failed", so a report-back gives the real status/reason
        // immediately instead of needing another round to dig it out.
        let engineNote = result.engineUsed==='gemini' ? ' (read via Gemini)'
          : result.geminiError ? ' (Gemini failed \u2014 '+result.geminiError.slice(0,150)+' \u2014 then fell back to the offline reader, which also couldn\u2019t read it)'
          : (userSettings.use_ai===true && userSettings.gemini_api_key) ? '' : ' (offline reader \u2014 AI/Gemini key not set up)';
        const msg='Couldn\u2019t read a tag number from that photo'+engineNote+' \u2014 try again with better light/focus, or enter the EID manually.';
        if(statusEl){ statusEl.style.color='var(--red)'; statusEl.textContent=msg; } else showInfoModal(msg);
        return;
      }
      processScannedEid(result.digits, mode, statusEl);
    } catch(err){
      const msg='Couldn\u2019t read the tag (check you have a signal for the tag reader to load, then try again).';
      if(statusEl){ statusEl.style.display='block'; statusEl.style.color='var(--red)'; statusEl.textContent=msg; } else showInfoModal(msg);
    } finally {
      hideScanningOverlay();
    }
  });
}
function triggerScanCameraCapture(onPhotoTaken){
  let input=document.getElementById('scanCameraInput');
  if(!input){
    input=document.createElement('input');
    input.type='file';
    input.accept='image/*';
    input.capture='environment';
    input.id='scanCameraInput';
    input.style.display='none';
    document.body.appendChild(input);
  }
  input.onchange=()=>{
    const file=input.files && input.files[0];
    input.value=''; // reset so scanning again with the same photo still fires change
    if(!file) return; // camera cancelled — no tag "read"
    onPhotoTaken(file);
  };
  input.click();
}
// Fills the New Animal form from a passport-scan result — shared by the
// live scan handler (view==='add' wiring) and the resume-after-reload
// flow in the app boot sequence, so a scan interrupted by an iOS
// background-reload can be recovered rather than silently lost. Assumes
// the New Animal form is already the DOM currently rendered. Returns the
// list of field labels actually filled in.
function applyPassportScanResult(result){
  const filled=[];
  if(result.eid){
    newAnimalEid=String(result.eid).trim();
    const btnText=document.getElementById('enterEidBtnText');
    if(btnText) btnText.textContent='EID: '+newAnimalEid;
    filled.push('EID');
  }
  if(result.breed){
    const rawBreed=String(result.breed).trim();
    // Passports print a trailing "X" (or "Cross") to mean cross-bred —
    // strip it before matching against the farm's breed list, and use it
    // to set the separate cross toggle instead, rather than trying to
    // match a breed literally named e.g. "Hereford X".
    const crossSuffix=rawBreed.match(/\s*(x|cross)\s*$/i);
    const breedForMatching = crossSuffix ? rawBreed.slice(0, crossSuffix.index).trim() : rawBreed;
    const activeBreeds=breeds.filter(b=>b.active);
    const match=activeBreeds.find(b=>b.name.toLowerCase()===breedForMatching.toLowerCase())
      || activeBreeds.find(b=>breedForMatching.toLowerCase().includes(b.name.toLowerCase()) || b.name.toLowerCase().includes(breedForMatching.toLowerCase()));
    const breedSelect=document.getElementById('f-breed');
    if(match && breedSelect){ breedSelect.value=match.id; filled.push('Breed'); }
    if(crossSuffix){
      newAnimalIsCross=true;
      const crossBtn=document.getElementById('breedCrossToggle');
      if(crossBtn) crossBtn.style.color='var(--ink)';
      filled.push('Cross-bred (X)');
    }
  }
  if(result.sex==='M' || result.sex==='F'){
    const radio=document.getElementById(result.sex==='M'?'sexM':'sexF');
    if(radio){ radio.checked=true; filled.push('Sex'); }
  }
  if(result.dob && /^\d{4}-\d{2}-\d{2}$/.test(result.dob)){
    const birthInput=document.getElementById('f-birth');
    if(birthInput){ birthInput.value=result.dob; filled.push('D.O.B.'); }
  }
  const tagInput=document.getElementById('f-tag');
  if(result.mgmt_id && tagInput && !tagInput.value.trim()){
    tagInput.value=String(result.mgmt_id).trim();
    filled.push('Mgmt ID');
  }
  // Same rule as typing an EID into the Mother/Father picker by hand: a
  // match on this farm links straight to that animal; anything else (no
  // match, or off this farm entirely) is stored as an off-farm EID
  // reference. There's no "click save twice to confirm" step here the way
  // there is in the picker — that exists to catch a mistyped EID, which
  // doesn't apply to a value read straight off an official document.
  const norm=s=>s.replace(/\s+/g,'').toLowerCase();
  if(result.dam_eid){
    const eid=String(result.dam_eid).trim();
    const found=animals.find(x=>x.eid && norm(x.eid)===norm(eid) && x.sex==='F');
    if(found){ newAnimalMotherId=found.id; newAnimalMotherExternalEid=null; }
    else { newAnimalMotherId=null; newAnimalMotherExternalEid=eid; }
    const btn=document.getElementById('pickMother');
    if(btn){ btn.innerHTML=found?escapeHtml(animalDisplayName(found)):escapeHtml(eid)+'<br>(off-farm)'; btn.classList.add('set'); btn.style.background=''; btn.style.border=''; }
    filled.push('Mother');
  }
  if(result.sire_eid){
    const eid=String(result.sire_eid).trim();
    const found=animals.find(x=>x.eid && norm(x.eid)===norm(eid) && x.sex==='M');
    if(found){ newAnimalFatherId=found.id; newAnimalFatherExternalEid=null; }
    else { newAnimalFatherId=null; newAnimalFatherExternalEid=eid; }
    const btn=document.getElementById('pickFather');
    if(btn){ btn.innerHTML=found?escapeHtml(animalDisplayName(found)):escapeHtml(eid)+'<br>(off-farm)'; btn.classList.add('set'); btn.style.background=''; btn.style.border=''; }
    filled.push('Father');
  }
  if(filled.length){
    // Hide the row directly rather than a full re-render — a render()
    // here would rebuild the form from scratch and wipe out everything
    // just written straight into these fields, none of which renderAdd()
    // itself knows how to pre-fill.
    newAnimalPassportScanned=true;
    const orSpan=document.getElementById('scanPassportOr');
    const group=document.getElementById('scanPassportGroup');
    if(orSpan) orSpan.remove();
    if(group) group.remove();
  }
  return filled;
}
// Recover a passport scan interrupted mid-flow — see the note above on
// why a reload (iOS memory reclaim, Android tab discard, or an app
// update) can silently wipe an in-progress scan without warning. Called
// once at boot, and again every time the app regains the foreground
// (see the visibilitychange listener near the end of the boot sequence)
// — the boot-time call alone only ever caught this after a full manual
// reload, not the moment the person actually switches back to the app,
// which is when it's most likely to actually matter.
async function checkForInterruptedPassportScan(){
  if(!(authUser && authFarmId && deviceFarmCode)) return; // only once properly signed in and paired, not mid-login
  if(modal) return; // don't interrupt something else already on screen
  try{
    const pendingRaw=localStorage.getItem(LS_PREFIX+'pendingPassportScan');
    if(!pendingRaw) return;
    const pending=JSON.parse(pendingRaw);
    if(Date.now()-(pending.savedAt||0) >= 24*60*60*1000){
      localStorage.removeItem(LS_PREFIX+'pendingPassportScan');
      return;
    }
    showConfirmModal('Adding an animal from a passport scan looks like it got interrupted before it was saved \u2014 want to pick up where it left off?', ()=>{
      view='add'; newAnimalEid=null; newAnimalMotherId=null; newAnimalMotherExternalEid=null; newAnimalFatherId=null; newAnimalFatherExternalEid=null; newAnimalPhoto=null; newAnimalPassportScanned=false; newAnimalIsCross=false;
      render();
      const filled=applyPassportScanResult(pending.result);
      try{ localStorage.removeItem(LS_PREFIX+'pendingPassportScan'); }catch(e){ /* best-effort only */ }
      if(filled.length){ showSaveToast('Resumed \u2014 filled in from passport'); logMsg('Resumed an interrupted passport scan \u2014 filled in: <b>'+filled.join(', ')+'</b>. Please check before saving.'); }
    }, ()=>{
      try{ localStorage.removeItem(LS_PREFIX+'pendingPassportScan'); }catch(e){ /* best-effort only */ }
    }, 'Resume', 'Discard');
  }catch(e){ /* corrupt or missing — nothing to recover */ }
}
// otherwise show the browser's own "This page says" chrome around it.
// settingsSection (optional) names a Settings section key ('breeds',
// 'medtypes', etc.) — when given, every literal occurrence of the word
// "Settings" in the text becomes a tappable link that jumps straight to
// Settings with that section already expanded, instead of the farmer
// having to go find it themselves.
function showInfoModal(text, settingsSection, suppressLabel, onSuppress){
  modal={type:'infoText', text, settingsSection, suppressLabel, onSuppress};
  renderModal();
}
// Bulleted "you're missing these" popup — used instead of small inline error
// text so a farmer can't miss what still needs filling in.
// Scrolls to and briefly highlights the first missing mandatory field, so
// it's obvious at a glance what still needs filling in — replacing a tiny
// red caption that was easy to miss or scroll straight past. Takes pairs of
// [fieldId, label] in form order; only the first missing one is surfaced,
// matching the existing convention of validating top-to-bottom.
function highlightFirstMissingField(pairs){
  for(const [fieldId, label] of pairs){
    const field=document.getElementById(fieldId);
    if(!field) continue;
    // Radio buttons always report their own static value regardless of
    // whether they're checked — "missing" for a radio group means none of
    // them are checked, not that this one's value is blank.
    const isRadio = field.type==='radio';
    if(isRadio){
      if(document.querySelector('input[name="'+field.name+'"]:checked')) continue;
    } else if(field.value && field.value.trim()){
      continue; // has a value — not the culprit
    }
    field.scrollIntoView({block:'center', behavior:'smooth'});
    if(isRadio){
      // Highlight the whole radio group's row, not just one small circle —
      // a tinted single radio button would be easy to miss.
      const row=field.closest('.formrow');
      const target=row||field;
      const prevBg=target.style.background;
      target.style.background='var(--red-bg)';
      const clearHighlight=()=>{ target.style.background=prevBg; document.querySelectorAll('input[name="'+field.name+'"]').forEach(el=>el.removeEventListener('change', clearHighlight)); };
      document.querySelectorAll('input[name="'+field.name+'"]').forEach(el=>el.addEventListener('change', clearHighlight));
      return true;
    }
    const prevBg=field.style.background;
    const prevBorder=field.style.border;
    field.style.background='var(--red-bg)';
    // Plain inputs/selects already show a border (background tint alone
    // reads as "highlighted"), but buttons like the parent pickers render
    // with border:none — background tint alone is easy to miss on those,
    // so give every field an explicit red border too for a consistent look.
    field.style.border='2px solid var(--red)';
    setTimeout(()=>{ field.focus({preventScroll:true}); }, 300);
    // Stays highlighted until the farmer actually fixes it, rather than
    // fading on a timer — a few-second auto-clear meant it could vanish
    // again before they'd even scrolled back up to look at it.
    const clearHighlight=()=>{ field.style.background=prevBg; field.style.border=prevBorder; field.removeEventListener('input', clearHighlight); field.removeEventListener('change', clearHighlight); };
    field.addEventListener('input', clearHighlight);
    field.addEventListener('change', clearHighlight);
    return true;
  }
  return false;
}
