<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ABC Stockman — Phase 1</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1A8A4A">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="aBC Stockman">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111; --paper:#ffffff; --card:#ffffff;
    --primary:#1a8a4a; --primary-dark:#136337;
    --green:#1a8a4a; --green-bg:#e3f5ea;
    --amber:#c98400; --amber-bg:#fdf0d8;
    --yellow:#e0b400;
    --red:#d13b30; --red-bg:#fbe2e0;
    --grey:#5c5949; --grey-light:#c9c9c9; --line:#e4e4e4; --link:#1565c0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#f3f3f3;color:var(--ink);font-family:'Inter',sans-serif;padding:24px 18px 60px;}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0;}
  .wrap{max-width:960px;margin:0 auto;}
  .top{margin-bottom:20px;}
  .top h1{font-size:30px;color:var(--ink);}
  .top p{font-size:14px;color:var(--grey);margin:6px 0 0;max-width:660px;line-height:1.5;}
  .banner{background:var(--amber-bg);color:#7a5406;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:8px;margin-top:10px;display:inline-block;}
  .grid{display:flex;justify-content:center;}

  .phone{background:#1c1c1c;border-radius:34px;padding:14px;box-shadow:0 2px 0 var(--line);position:relative;}
  .screen{background:var(--paper);border-radius:22px;overflow:hidden;min-height:600px;display:flex;flex-direction:column;}
  .appbar{background:var(--paper);color:var(--ink);padding:12px 14px;font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;min-height:22px;border-bottom:1px solid var(--line);}
  .appbar button.back{background:none;border:none;color:var(--ink);cursor:pointer;padding:0 4px 0 0;display:flex;align-items:center;}
  .appbar button.back svg{width:26px;height:26px;}
  .appbar .signal{color:var(--red);display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;}
  .appbar .help{background:none;border:none;cursor:pointer;color:var(--grey);display:flex;align-items:center;}
  .body{flex:1;overflow-y:auto;padding:10px 10px 4px;}

  /* ---- icon-grid hub screens (Home, Animal Summary) ---- */
  .icongrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 4px;}
  .icontile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;position:relative;font-family:inherit;}
  .icontile:active{opacity:.6;background:#f7f7f7;}
  .icontile .ticon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;}
  .icontile .ticon svg{width:44px;height:44px;}
  .icontile .ticon .comboIcon svg{width:100%;height:100%;}
  .icontile .tlabel{font-size:13px;font-weight:700;color:var(--ink);text-align:center;}
  .icontile .tbadge{position:absolute;top:6px;right:calc(50% - 34px);background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .icontile.disabled .ticon svg{opacity:.35;}
  .icontile.disabled .tlabel{color:var(--grey);}
  .icontile.filled{border-color:transparent;}
  .icontile.filled:active{opacity:.75;}
  .amberfield{background:var(--amber-bg)!important;border-color:var(--amber)!important;}

  /* ---- footer icon bar (persistent action bar) ---- */
  .footerbar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);background:#fff;padding:5px 20px;flex:0 0 auto;}
  .footericon.primary{background:var(--primary);color:#fff;border-radius:12px;padding:6px 16px;}
  .footericon.primary svg{color:#fff;}
  .footericon{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 10px;font-family:inherit;color:var(--grey);}
  .footericon svg{width:30px;height:30px;}
  .footericon.active{color:var(--primary);}
  .footericon.warn{color:var(--amber);}
  .footericon.warn .flabel{color:var(--amber);font-weight:800;}
  .footericon.danger{background:var(--red);color:#fff;border-radius:12px;padding:6px 16px;}
  .footericon.danger svg{color:#fff;}
  .footericon.danger .flabel{color:#fff;}
  .footericon.bordered{border:1.5px solid var(--line);border-radius:12px;padding:5px 14px;}
  .footericon.home svg{color:var(--primary);}
  .footericon.home{border:1.5px solid var(--primary);border-radius:12px;padding:6px 16px;}
  .footericon.home .flabel{color:var(--primary);}
  .footericon .flabel{font-size:9.5px;font-weight:700;}

  /* ---- brief auto-dismiss confirmation toast (lives in #phoneFrame, outside
     #screen, so it survives the render() innerHTML swap that follows a save) ---- */
  .savetoast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:82%;text-align:center;white-space:pre-line;}
  .savetoast.show{opacity:1;}
  /* Full-frame scanning overlay — shown the instant a tag photo is taken
     and hidden only once a result (success or failure) comes back, so a
     farmer never sees the app go quiet for the several seconds a Gemini
     call (plus, on failure, a Tesseract fallback + first-run engine
     download) can genuinely take. Unlike .savetoast this does NOT
     auto-dismiss on a timer — it's tied to the actual scan finishing. */
  .scanoverlay{position:absolute;inset:0;background:rgba(17,17,17,.55);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;color:#fff;text-align:center;padding:0 30px;}
  .scanoverlay.show{display:flex;}
  .scanoverlay .spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:scanoverlayspin .8s linear infinite;}
  .scanoverlay .msg{font-size:15px;font-weight:700;}
  @keyframes scanoverlayspin{to{transform:rotate(360deg);}}
  .noServerIcon{position:absolute;top:14px;right:14px;width:22px;height:22px;color:var(--red);z-index:45;cursor:pointer;background:none;border:none;padding:0;}

  /* ---- animal list table ---- */
  .listtable{width:100%;border-collapse:collapse;}
  .listtable thead th{position:sticky;top:0;background:#fff;font-size:11px;text-transform:uppercase;color:var(--grey);text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  .listtable thead th.sorted{color:var(--ink);}
  .listtable thead th .arrow{font-size:9px;margin-left:2px;}
  .listtable tbody tr{border-bottom:1px solid var(--line);cursor:pointer;}
  .listtable tbody tr:active{background:#f7f7f7;}
  .listtable td{padding:9px 4px;font-size:13px;vertical-align:middle;}
  .listtable td.idcell{color:var(--grey);font-size:10.5px;font-weight:600;}
  .listtable td.namecell{font-weight:700;text-decoration:underline;text-decoration-color:var(--line);}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;}
  .pill.green{background:var(--green);}
  .pill.amber{background:var(--amber);}
  .pill.red{background:var(--red);}
  .circledot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;}
  .circledot.green{background:var(--green);}
  .circledot.amber{background:var(--amber);}
  .circledot.red{background:var(--red);}
  .heartcell svg{width:26px;height:26px;}

  .searchrow{display:flex;gap:6px;margin-bottom:8px;}
  .searchwrap{position:relative;flex:1;}
  .searchwrap input{padding-right:32px;}
  .searchClearBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--grey);width:22px;height:22px;display:none;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  .searchClearBtn.show{display:flex;}
  .searchrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
  .chip{font-size:14.5px;font-weight:700;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--grey);}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}

  .row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;}
  .row:hover{border-color:var(--primary);}
  .row .id{font-size:11px;color:var(--grey);font-weight:600;}
  .row .name{font-size:14px;font-weight:600;}
  .badge{font-size:10.5px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
  .badge.active{background:var(--green-bg);color:var(--green);}
  .badge.exit{background:var(--amber-bg);color:var(--amber);}
  .badge.voided{background:var(--grey);color:#fff;}
  .empty{padding:40px 20px;text-align:center;color:var(--grey);font-size:13px;}

  label{display:block;font-size:12.5px;font-weight:700;text-transform:uppercase;color:var(--grey);margin:12px 0 4px;}
  /* one step bigger than the app-wide default, for the screens with the most spare room */
  .bigtext label{font-size:14px;}
  .bigtext input[type=text],.bigtext input[type=number],.bigtext input[type=date],.bigtext select,.bigtext textarea{font-size:16.5px;}
  input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;font-family:inherit;background:#fff;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  textarea{resize:vertical;min-height:56px;}
  .field-error{color:var(--red);font-size:13px;margin-top:3px;}
  .fullbtn{width:100%;background:var(--primary);color:#fff;border:none;padding:11px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-top:16px;}
  .datewheel-wrap{position:relative;height:150px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .datewheel-col{height:150px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .datewheel-col::-webkit-scrollbar{display:none;}
  .datewheel-spacer{height:50px;flex-shrink:0;}
  .datewheel-item{height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:19px;font-weight:700;color:var(--grey);}
  .datewheel-highlight{position:absolute;top:50px;left:0;right:0;height:50px;border-top:2px solid var(--primary);border-bottom:2px solid var(--primary);pointer-events:none;background:rgba(46,125,50,0.06);}
  .fullbtn:disabled{opacity:.4;cursor:not-allowed;}
  .fullbtn.danger{background:var(--red);}
  .fullbtn.ghost{background:#fff;color:var(--ink);border:1px solid var(--primary);}

  .detailhead{padding:10px 2px 6px;text-align:center;}
  .detailhead .tag{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--grey);letter-spacing:.05em;}
  .detailhead .name{font-family:'Barlow Condensed',sans-serif;font-size:26px;color:var(--ink);}
  .detailhead .meta{font-size:12.5px;color:var(--grey);margin-top:2px;}
  .statusline{margin:6px 0 4px;text-align:center;}

  .actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .actionbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;}
  .actionbtn:hover{border-color:var(--primary);}
  .actionbtn .actionicon{width:18px;height:18px;flex-shrink:0;}
  .actionbtn.voidbtn{grid-column:1/-1;color:var(--red);border-color:var(--red-bg);}
  .bcsgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:2px;}
  .bcsbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 0;font-size:26px;font-weight:800;cursor:pointer;color:var(--ink);}
  .bcsbtn.on.bcs-green{background:var(--green);color:#fff;border-color:var(--green);}
  .bcsbtn.on.bcs-amber{background:var(--amber);color:#fff;border-color:var(--amber);}
  .bcsbtn.on.bcs-red{background:var(--red);color:#fff;border-color:var(--red);}
  .warnbanner{background:var(--red-bg);color:var(--red);font-size:12px;font-weight:600;padding:10px 12px;border-radius:8px;margin:8px 0;}
  .sevbadge{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px;}
  .sevbadge.sev-bcs-green{background:var(--green-bg);color:var(--green);}
  .sevbadge.sev-bcs-amber{background:var(--amber-bg);color:var(--amber);}
  .sevbadge.sev-bcs-red{background:var(--red-bg);color:var(--red);}
  .thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0;}
  .valuecard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;}
  .valuerow{display:flex;gap:8px;}
  .valuebox{flex:1;border-radius:8px;padding:8px 10px;}
  .valuelabel{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--grey);}
  .valuenum{font-size:22px;font-weight:700;font-family:'Barlow Condensed',sans-serif;}
  .breakdown{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;}
  .bkhead{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink);}
  .bkrow{display:flex;justify-content:space-between;font-size:15px;color:#3a3d2e;padding:5px 0;}

  .eventlist{margin-top:14px;}
  .event{border-left:2px solid var(--line);padding:2px 0 10px 12px;margin-left:4px;position:relative;}
  .event::before{content:'';width:8px;height:8px;background:var(--primary);border-radius:50%;position:absolute;left:-5px;top:5px;}
  .event .etype{font-weight:700;font-size:12.5px;text-transform:capitalize;}
  .event .ets{font-size:10.5px;color:var(--grey);}
  .event .ereason{font-size:12px;color:var(--grey);margin-top:2px;font-style:italic;}

  .modal-backdrop{position:absolute;inset:0;background:rgba(17,17,17,.5);display:flex;align-items:flex-end;z-index:5;}
  .modal{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px 16px 20px;}
  .modal h3{font-size:16px;color:var(--ink);margin-bottom:2px;}
  .modal .sub{font-size:12.5px;color:var(--grey);margin-bottom:8px;}

  .damagebar{width:100%;border:none;border-radius:8px;padding:10px 12px;color:#fff;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left;}
  .damagepanel{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:10px 12px 14px;margin-top:-2px;}
  .urgencychip{flex:1;padding:10px 0;border-radius:20px;border:3px solid transparent;font-weight:700;font-size:16px;cursor:pointer;color:#fff;opacity:.55;}
  .urgencychip[data-urgency="low"]{background:var(--grey-light);color:var(--ink);}
  .urgencychip[data-urgency="med"]{background:var(--amber);}
  .urgencychip[data-urgency="high"]{background:var(--red);}
  .urgencychip.on{opacity:1;border-color:var(--ink);}
  .formrow{display:flex;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);gap:12px;}
  .formrow.compact{padding:6px 2px;border-bottom:none;}
  .formrow>label{margin:0;font-size:12.5px;font-weight:800;text-transform:uppercase;color:var(--ink);flex:0 0 30%;}
  .formrow>.formctrl{flex:1;min-width:0;}
  .formrow input,.formrow select{margin:0;}
  .formrow .withunit{display:flex;align-items:center;gap:6px;}
  .formrow .withunit input{flex:1;min-width:0;}
  .formrow .withunit span{font-weight:800;font-size:13px;color:var(--ink);flex-shrink:0;}
  .eidrow{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);}
  .eidbtn{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--primary);font-weight:800;font-size:15px;cursor:pointer;padding:0;}
  .eidbtn svg{width:20px;height:20px;}
  .helpcircle{background:var(--red);border:none;color:#fff;width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;font-weight:800;font-family:inherit;line-height:1;}
  .helpcircle svg{width:15px;height:15px;}
  #eidModalScan svg,#eidModalSave svg{width:24px;height:24px;}
  .parentbtn{flex:1;background:#e8e8e8;border:none;border-radius:8px;padding:12px 8px;font-weight:700;color:#666;font-size:13.5px;cursor:pointer;}
  .parentbtn.set{background:var(--green-bg);color:var(--green);}
  .radiogroup{display:flex;align-items:center;gap:8px;}
  .radiogroup input[type=radio]{width:22px;height:22px;accent-color:var(--primary);margin:0;}
  .radiogroup label{font-weight:800;font-size:15px;margin-right:14px;text-transform:none;}

  /* ---- mobile: app fills the real screen, desktop chrome collapses ---- */
  @media(max-width:680px){
    html,body{height:100%;margin:0;overflow:hidden;}
    body{padding:0;}
    .wrap{max-width:none;height:100%;display:flex;flex-direction:column;}
    .top{flex:0 0 auto;padding:8px 14px 4px;margin-bottom:0;}
    .top h1{display:none;}
    .top p{display:none;}
    .banner{font-size:11px;padding:5px 9px;margin-top:0;}
    .grid{flex:1;min-height:0;display:block;position:relative;}
    .grid > div:first-child{height:100%;display:flex;flex-direction:column;}
    .phone{background:none;border-radius:0;padding:0;box-shadow:none;flex:1;min-height:0;display:flex;flex-direction:column;}
    .screen{border-radius:0;min-height:0;flex:1;display:flex;flex-direction:column;}
    .appbar{flex:0 0 auto;}
    .body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .stickyhead{position:sticky;top:0;background:var(--paper);z-index:2;padding-top:6px;margin-bottom:2px;}
    .footerbar{flex:0 0 auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>aBC Stockman — pilot build</h1>
    <p>Animals and weigh/BCS entries now sync to the shared farm database. Feed, medicine, injuries, damage, and moves still run on local device storage for now, as this migrates one piece at a time.</p>
  </div>

  <div class="grid">
    <div>
      <div class="phone" id="phoneFrame">
        <div class="screen" id="screen" style="position:relative;">
          <!-- rendered by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Real OCR for the tag scanner (reads the printed EID digits off the actual
     photo instead of faking a result). Needs internet on first use per
     device, to download the OCR engine/model — after that it's cached by
     the browser and works offline. This is here for realistic demoing;
     flagged as something to reconsider before any "true offline" build. -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- Supabase client — Phase 1 of the local-storage-to-cloud migration.
     Currently only the `animals` table reads/writes through this; every
     other entity still lives in localStorage until its own slice lands. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// Bumped by hand every time a new build is handed over in chat — check this
// against what's quoted in the chat message to confirm the phone has
// actually picked up the latest version (not a stale cached one).
const APP_BUILD_VERSION = '2026-09-16x';

// A running list of what changed in each build, shown to the user under
// Settings > What's new. Newest entry first. Add a new entry here by hand
// whenever APP_BUILD_VERSION is bumped for a build that's actually being
// handed over (not every internal iteration) — keep bullets short and
// written for the farmer, not the changelog-as-commit-log habit.
const APP_CHANGELOG = [
  {
    version: '2026-09-16x',
    date: '16 Sep 2026',
    bullets: [
      "The \u201cinterrupted scan\u201d recovery prompt now appears as soon as you switch back to the app, not just after a full reload.",
      "Photos (animal, injury, farm damage, medicine cabinet) now upload to proper cloud storage instead of being saved as huge blocks of text in the database \u2014 smaller, faster records, no visible change to how it works."
    ]
  },
  {
    version: '2026-09-16w',
    date: '16 Sep 2026',
    bullets: [
      "Fixed Injury photo analysis (Insights) \u2014 it was calling an API that only ever worked in testing, so it silently never worked on a real phone. It now uses your own Gemini key, same as passport scanning and Ask."
    ]
  },
  {
    version: '2026-09-16v',

// ---- Supabase (Phase 1: auth + the `animals` table only) ----
// Publishable key is safe to expose client-side by design — it can't do
// anything the Row Level Security policies on the project don't allow.
const SUPABASE_URL = 'https://wazkqsqkondxqukcxvdr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mC9h-rr6K1xcM1RZChZb4w_V9zdak-P';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let authUser = null;       // the signed-in Supabase user, once logged in
let authFarmId = null;     // which farm that user belongs to (from farm_members)
let authEmail = '';        // in-progress value of the login screen's email field
let magicLinkSent = false; // true once we've asked Supabase to send the email
let authError = null;      // last auth-related error message, if any

// Looks up which farm (if any) the signed-in user belongs to, and — if
// they belong to one — pulls that farm's animals down from Supabase into
// the local `animals` array so the rest of the app (which still reads
// that array synchronously everywhere) works unchanged. Only `animals`
// is cloud-backed so far; everything else is still local until its own
// migration slice lands.
async function resolveFarmMembership(){
  if(!authUser) return;
  const { data: memberships, error: memErr } = await sb.from('farm_members').select('farm_id').eq('user_id', authUser.id).limit(1);
  if(memErr){ authError = memErr.message; return; }
  authFarmId = (memberships && memberships[0]) ? memberships[0].farm_id : null;
  if(!authFarmId) return;
  const { data: remoteAnimals, error: animErr } = await sb.from('animals').select('*').order('created_seq', {ascending:true});
  if(animErr){ authError = animErr.message; return; }
  animals = remoteAnimals || [];
  const { data: remoteWeights, error: weightErr } = await sb.from('weights').select('*');
  if(weightErr){ authError = weightErr.message; return; }
  weights = remoteWeights || [];
  const { data: remoteDamage, error: damageErr } = await sb.from('damage_records').select('*');
  if(damageErr){ authError = damageErr.message; return; }
  damageRecords = remoteDamage || [];
  const { data: remoteInjuries, error: injuryErr } = await sb.from('injury_records').select('*');
  if(injuryErr){ authError = injuryErr.message; return; }
  injuryRecords = remoteInjuries || [];
  const { data: remoteMoves, error: moveErr } = await sb.from('move_records').select('*');
  if(moveErr){ authError = moveErr.message; return; }
  moveRecords = remoteMoves || [];
  const { data: remoteMeds, error: medErr } = await sb.from('medicine_records').select('*');
  if(medErr){ authError = medErr.message; return; }
  medicineRecords = remoteMeds || [];
  const { data: remoteFeed, error: feedErr } = await sb.from('feed_records').select('*');
  if(feedErr){ authError = feedErr.message; return; }
  feedRecords = remoteFeed || [];
  const { data: remoteFeedUsage, error: feedUsageErr } = await sb.from('feed_usage_records').select('*');
  if(feedUsageErr){ authError = feedUsageErr.message; return; }
  feedUsageRecords = remoteFeedUsage || [];

  const { data: remoteBreeds, error: breedErr } = await sb.from('breeds').select('*');
  if(breedErr){ authError = breedErr.message; return; }
  breeds = remoteBreeds || [];
  const { data: remoteBreedPriceHistory, error: bphErr } = await sb.from('breed_price_history').select('*');
  if(bphErr){ authError = bphErr.message; return; }
  breedPriceHistory = remoteBreedPriceHistory || [];
  const { data: remoteFeedTypes, error: feedTypeErr } = await sb.from('feed_types').select('*');
  if(feedTypeErr){ authError = feedTypeErr.message; return; }
  feedTypes = remoteFeedTypes || [];
  const { data: remoteMedTypes, error: medTypeErr } = await sb.from('medicine_types').select('*');
  if(medTypeErr){ authError = medTypeErr.message; return; }
  medicineTypes = remoteMedTypes || [];
  ensureTbTestMedicineType();
  const { data: remoteFarmersVets, error: fvErr } = await sb.from('farmers_vets').select('*');
  if(fvErr){ authError = fvErr.message; return; }
  farmersVets = remoteFarmersVets || [];

  // Farm-wide settings — one shared row per farm. Created from whatever's
  // currently in the local default if this farm doesn't have one yet
  // (e.g. the very first person to sign in on it).
  const { data: remoteFarmSettings, error: fsErr } = await sb.from('farm_settings').select('*').eq('farm_id', authFarmId).maybeSingle();
  if(fsErr){ authError = fsErr.message; return; }
  if(remoteFarmSettings){
    farmSettings.cph = remoteFarmSettings.cph||'';
    farmSettings.farm_location = remoteFarmSettings.farm_location;
    farmSettings.typical_gestation_days = remoteFarmSettings.typical_gestation_days??283;
    farmSettings.use_animal_names = remoteFarmSettings.use_animal_names!==false;
  } else {
    await sb.from('farm_settings').insert({ farm_id:authFarmId, cph:farmSettings.cph||null, farm_location:farmSettings.farm_location||null, typical_gestation_days:farmSettings.typical_gestation_days||283, use_animal_names:farmSettings.use_animal_names!==false });
  }

  // Per-user settings — this signed-in person's own row only, never
  // shared with the rest of the farm (see the note on userSettings).
  const { data: remoteUserSettings, error: usErr } = await sb.from('user_settings').select('*').eq('user_id', authUser.id).maybeSingle();
  if(usErr){ authError = usErr.message; return; }
  if(remoteUserSettings){
    userSettings.use_ai = !!remoteUserSettings.use_ai;
    userSettings.gemini_api_key = remoteUserSettings.gemini_api_key||null;
    userSettings.mute_weighing_notification = !!remoteUserSettings.mute_weighing_notification;
  } else {
    await sb.from('user_settings').insert({ user_id:authUser.id, use_ai:!!userSettings.use_ai, gemini_api_key:userSettings.gemini_api_key||null, mute_weighing_notification:!!userSettings.mute_weighing_notification });
  }

  // Animal event history — stored flat in Supabase (one row per event),
  // but the rest of the app expects `events` keyed by animal id, each
  // holding its own chronological array, so it's regrouped here on the
  // way in. created_at ascending keeps each animal's history in the
  // order it actually happened.
  const { data: remoteEvents, error: eventsErr } = await sb.from('animal_events').select('*').order('created_at', {ascending:true});
  if(eventsErr){ authError = eventsErr.message; return; }
  events = {};
  (remoteEvents||[]).forEach(e=>{
    if(!events[e.animal_id]) events[e.animal_id]=[];
    events[e.animal_id].push({id:e.id, event_type:e.event_type, from_status:e.from_status, to_status:e.to_status, reason:e.reason, note:e.note, created_at:e.created_at, farmer_id:e.farmer_id});
  });

  const { data: remoteBreeding, error: breedingErr } = await sb.from('breeding_records').select('*');
  if(breedingErr){ authError = breedingErr.message; return; }
  breedingRecords = remoteBreeding || [];
}

// Pushes one animal's current full state up to Supabase — called after
// any local edit, wherever authFarmId is set. There's no offline queue
// yet (that's Phase 4), so a failed sync here doesn't block or roll back
// the local change (the person's already seen it save), it just gets
// logged so it's visible that this device and the shared database have
// drifted apart until the next successful sync.
async function syncAnimalToSupabase(a){
  if(!authFarmId) return;
  const { error } = await sb.from('animals').update({
    tag_number:a.tag_number, eid:a.eid, breed_id:a.breed_id, sex:a.sex, birth_date:a.birth_date, status:a.status,
    purchase_price:a.purchase_price, birth_weight_kg:a.birth_weight_kg, weaned_weight_kg:a.weaned_weight_kg,
    mother_id:a.mother_id, mother_external_eid:a.mother_external_eid, father_id:a.father_id, father_external_eid:a.father_external_eid,
    photo_data:a.photo_data, name:a.name, updated_at:a.updated_at,
    realized_value:a.realized_value??null, realized_value_date:a.realized_value_date??null, fallen_stock_ref:a.fallen_stock_ref??null,
    bcms_birth_reported:a.bcms_birth_reported??null, bcms_birth_reported_at:a.bcms_birth_reported_at??null,
    bcms_death_reported:a.bcms_death_reported??null, bcms_death_reported_at:a.bcms_death_reported_at??null,
    offspring_status:a.offspring_status??null, offspring_due_date:a.offspring_due_date??null, offspring_until_date:a.offspring_until_date??null,
    is_cross:!!a.is_cross,
  }).eq('id', a.id);
  if(error){ logMsg('<span style="color:var(--red);">Couldn\u2019t sync '+(animalDisplayName(a))+' to the shared farm database \u2014 '+escapeHtml(error.message)+'. This device\u2019s copy is up to date but other devices won\u2019t see this change yet.</span>'); }
}

function pad(n){return n.toString().padStart(2,'0');}
function nowStr(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;const v=c=='x'?r:(r&0x3|0x8);return v.toString(16);});}
function logMsg(msg){
  const el=document.getElementById('log');
  if(!el) return; // desktop testing panel removed — activity log has nowhere to render, still fine to no-op
  const line=document.createElement('div');
  line.innerHTML='<span class="t">'+nowStr()+'</span>'+msg;
  el.appendChild(line);
  el.scrollTop=el.scrollHeight;
}

// Brief auto-dismiss confirmation toast. Lives in #phoneFrame (a parent of
// #screen) rather than inside #screen itself, so it isn't wiped out by the
// innerHTML swap the very next render() call performs (e.g. Weigh/BCS save
// immediately re-renders to switch screens or reset the picker).
let saveToastTimer=null;
function showSaveToast(msg){
  const frame=document.getElementById('phoneFrame');
  if(!frame) return;
  let el=document.getElementById('saveToast');
  if(!el){
    el=document.createElement('div');
    el.id='saveToast';
    el.className='savetoast';
    frame.appendChild(el);
  }
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(saveToastTimer);
  // A longer, more informative toast (e.g. two lines: "Weight +72kg" /
  // "BCS improving") needs more than the bare-word default to actually
  // read before it fades.
  const duration = msg.includes('\n') ? 3200 : 2000;
  saveToastTimer=setTimeout(()=>{ el.classList.remove('show'); }, duration);
}
// Persistent "reading tag…" spinner — deliberately separate from
// showSaveToast above, which auto-hides after 2s regardless of whether the
// scan is still running. A Gemini read plus (on failure) a Tesseract
// fallback can easily take 10-15s+, especially on a first-run device still
// downloading the offline OCR engine, so a 2s toast made the app look
// dead/frozen for the rest of that time. This has no timer at all — it's
// shown the instant a photo is taken and only ever hidden once the actual
// scan promise resolves, in performTagScan's try/finally.
function showScanningOverlay(msg){
  const frame=document.getElementById('phoneFrame');
  if(!frame) return;
  let el=document.getElementById('scanOverlay');
  if(!el){
    el=document.createElement('div');
    el.id='scanOverlay';
    el.className='scanoverlay';
    el.innerHTML='<div class="spinner"></div><div class="msg" id="scanOverlayMsg"></div>';
    frame.appendChild(el);
  }
  document.getElementById('scanOverlayMsg').textContent=msg||'Reading tag\u2026';
  el.classList.add('show');
}
function updateScanningOverlay(msg){
  const msgEl=document.getElementById('scanOverlayMsg');
  if(msgEl) msgEl.textContent=msg;
}
function hideScanningOverlay(){
  const el=document.getElementById('scanOverlay');
  if(el) el.classList.remove('show');
}

// ---------- storage (tries window.storage first for the Claude viewer;
// falls back to localStorage so data actually persists when installed as a
// standalone PWA, where window.storage doesn't exist) ----------
let storageDegraded=false;
const LS_PREFIX='abcstockman:';
function hasLocalStorage(){
  try{
    if(typeof localStorage==='undefined') return false;
    const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const lsAvailable = hasLocalStorage();
const mem={};
async function safeGet(key){
  if(!storageDegraded && typeof window.storage!=='undefined'){
    try{ const r=await window.storage.get(key,false); return r.value; }
    catch(e){
      const m=(e&&e.message||'').toLowerCase();
      if(m.includes('not found')||m.includes('404')) return null;
      storageDegraded=true;
    }
  }
  if(lsAvailable){ const v=localStorage.getItem(LS_PREFIX+key); return v===null?null:v; }
  return key in mem ? mem[key] : null;
}
async function safeSet(key,value){
  if(!storageDegraded && typeof window.storage!=='undefined'){
    try{ await window.storage.set(key,value,false); return; }
    catch(e){ storageDegraded=true; }
  }
  if(lsAvailable){ try{ localStorage.setItem(LS_PREFIX+key,value); return; }catch(e){ /* quota or disabled — fall through to memory */ } }
  mem[key]=value;
}

// CPH numbers are entered on a numeric keypad (no slash key), formatted as
// NN/NNN/NNNN — this strips anything non-numeric and re-inserts the slashes
// at the right positions as the farmer types.
function formatCph(raw){
  const digits=(raw||'').replace(/\D/g,'').slice(0,9);
  let out=digits.slice(0,2);
  if(digits.length>2) out+='/'+digits.slice(2,5);
  if(digits.length>5) out+='/'+digits.slice(5,9);
  return out;
}
// UK bovine EID structure (per DEFRA/GOV.WALES spec): 826 (3-digit UK
// country code) + 0 (series number) + 6-digit herd number + 5-digit
// individual animal number = 15 digits total, e.g. "826 0 123456 70000".
// Same idea as formatCph — strip non-digits and re-insert the grouping
// spaces as the farmer types or a scan result comes in.
const BCMS_URL='https://secure.services.defra.gov.uk/wps/portal/ctso';
// Wraps just the word "BCMS" in a real link to the DEFRA CTS portal,
// opening in a new tab. Used inline within plain text/labels/buttons.
// stopPropagation matters specifically where this sits inside a clickable
// checkbox <label> (move/birth reporting) — without it, tapping the link
// would also toggle the checkbox underneath it; native browser behavior
// already prevents the reverse (nested <a> doesn't get swallowed by the
// label's own forwarding), but this makes the checkbox side explicit too.
function bcmsLink(text, plain){
  text = text===undefined ? 'BCMS' : text;
  // plain=true keeps it clickable but drops the blue — for the rare case
  // where it sits on a solid dark background (currently just the overdue
  // birth-registration banner) where blue-on-red is genuinely hard to read.
  // The underline alone still marks it as a link.
  const style = plain ? 'color:inherit;text-decoration:underline;text-underline-offset:3px;' : 'color:#2f6fed;text-decoration:underline;text-underline-offset:3px;';
  return `<a href="${BCMS_URL}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="${style}">${text}</a>`;
}
function formatEid(raw){
  const digits=(raw||'').replace(/\D/g,'').slice(0,15);
  let out=digits.slice(0,3);
  if(digits.length>3) out+=' '+digits.slice(3,4);
  if(digits.length>4) out+=' '+digits.slice(4,10);
  if(digits.length>10) out+=' '+digits.slice(10,15);
  return out;
}

function eidShortDisplay(a){ return a.eid ? '..'+a.eid.slice(-3) : '…'; }
// Header EID + name: partial EID sits to the left, sized 75% of the name's
// font, so the name can run as large as the header allows. In EID-only mode
// this collapses to just the full EID at the requested size — there's
// nothing else to show alongside it.
function headerIdName(a, nameSize){
  if(farmSettings.use_animal_names===false){
    // Full EIDs are long (15 digits + spaces) — a little smaller than the
    // name/tag would be, so it has a better chance of fitting on one line.
    const eidOnlySize=(nameSize*0.85).toFixed(1);
    return `<span style="font-size:${eidOnlySize}px;font-weight:800;">${animalDisplayName(a)}</span>`;
  }
  const eidSize=(nameSize*0.75).toFixed(1);
  return `<span style="font-size:${eidSize}px;font-weight:600;color:var(--grey);">${eidShortDisplay(a)}</span> <span style="font-size:${nameSize}px;font-weight:800;">${animalDisplayName(a)}</span>`;
}
function fmtGBP(amount, decimals){
  if(decimals===undefined) decimals=2;
  if(amount==null || isNaN(amount)) return '£\u2014';
  const sign = amount<0 ? '-' : '';
  const parts = Math.abs(amount).toFixed(decimals).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign+'£'+parts.join('.');
}
// Same as fmtGBP but drops the pence entirely when they'd just be ".00" —
// used on screens (Market Value) that want to stay as compact as possible;
// a farmer who genuinely prices to the penny still sees it.
function fmtGBPSmart(amount){
  if(amount==null || isNaN(amount)) return '£\u2014';
  const rounded=Math.round(amount*100)/100;
  const isWhole=Math.abs(rounded-Math.round(rounded))<0.001;
  return fmtGBP(rounded, isWhole?0:2);
}
// Thousand-separated quantity, e.g. 5000 -> "5,000" — keeps any decimal
// part (fractional sacks/bales) as-is rather than rounding it away.
function fmtQty(n){
  if(n==null || isNaN(n)) return '';
  const parts = String(n).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
// Whole-number percentage with thousand separators, e.g. 9207 -> "9,207%" —
// small purchase-price/cost animals can show percentages this large.
// decimals defaults to 0; pass 1 to keep a decimal place (e.g. the ROI
// report's aggregate figure, which showed one before this was added).
function fmtPct(value, decimals){
  if(decimals===undefined) decimals=0;
  if(value==null || isNaN(value)) return '\u2014';
  const sign = value<0 ? '-' : '';
  const parts=Math.abs(value).toFixed(decimals).split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign+parts.join('.')+'%';
}

// Uploads a captured photo (data: URL) to the shared 'photos' Storage
// bucket and returns its public URL — used by wirePhotoCaptureModal so
// every photo across the app (animal, injury, damage, medicine cabinet)
// lands in Storage instead of being stored as base64 text in a database
// column. Path is farmId/idPrefix/uuid.ext — the farmId segment is what
// the bucket's upload policy actually checks.
async function uploadPhotoToStorage(dataUrl, idPrefix){
  const match=dataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.*)$/);
  if(!match) throw new Error('not a usable image');
  const mimeType=match[1], base64=match[2];
  const ext=(mimeType.split('/')[1]||'jpg').replace('jpeg','jpg');
  const safePrefix=(idPrefix||'photo').replace(/[^a-zA-Z0-9_-]/g,'');
  const path=authFarmId+'/'+safePrefix+'/'+uuid()+'.'+ext;
  const byteChars=atob(base64);
  const byteNumbers=new Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++) byteNumbers[i]=byteChars.charCodeAt(i);
  const blob=new Blob([new Uint8Array(byteNumbers)], {type:mimeType});
  const { error } = await sb.storage.from('photos').upload(path, blob, {contentType:mimeType, upsert:false});
  if(error) throw error;
  const { data } = sb.storage.from('photos').getPublicUrl(path);
  return data.publicUrl;
}
function wirePhotoCaptureModal(idPrefix, onCapture){
  const cameraInput=document.getElementById(idPrefix+'InputCamera');
  const libraryInput=document.getElementById(idPrefix+'InputLibrary');
  const handle=(input)=>{
    const file=input.files && input.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=async()=>{
      const dataUrl=reader.result;
      if(authFarmId){
        showScanningOverlay('Uploading photo\u2026');
        try{
          const url=await uploadPhotoToStorage(dataUrl, idPrefix);
          hideScanningOverlay();
          onCapture(url);
          return;
        }catch(err){
          hideScanningOverlay();
          logMsg('<span style="color:var(--red);">Couldn\u2019t upload this photo to the shared farm database (check you have a signal) \u2014 kept on this device only for now.</span>');
        }
      }
      onCapture(dataUrl);
    };
    reader.readAsDataURL(file);
  };
  document.getElementById(idPrefix+'PreviewBtn').onclick=()=>{
    const img=document.getElementById(idPrefix+'PreviewBtn').querySelector('img');
    modal = img ? {type:'photoView', idPrefix, src:img.src} : {type:'photoPick', idPrefix};
    renderModal();
  };
  cameraInput.onchange=()=>handle(cameraInput);
  libraryInput.onchange=()=>handle(libraryInput);
}
// Swaps just the preview image in place — used after a photo capture instead
// of a full render(), so it doesn't wipe out other fields already typed into
// the surrounding form (a farmer rarely fills a form top-to-bottom).
function updatePhotoPreview(idPrefix, dataUrl){
  const btn=document.getElementById(idPrefix+'PreviewBtn');
  if(!btn) return;

}
// After picking a value from a <select>, jump straight to the next field —
// but only if that next field is somewhere to type text (and bring the
// keypad up with it). A select or date picker next is left alone, since
// there's nothing useful to auto-focus into.
function wireSelectAutoAdvance(selectId, nextFieldId){
  const sel=document.getElementById(selectId);
  const next=document.getElementById(nextFieldId);
  if(!sel || !next) return;
  sel.addEventListener('change', ()=>{
    if(!sel.value) return;
    const tag=next.tagName.toLowerCase();
    const type=(next.type||'').toLowerCase();
    const isTextLike = tag==='textarea' || (tag==='input' && (type==='text'||type==='number'||type===''));
    if(isTextLike) next.focus();
  });
}
// Same idea, but for after picking a date — if the next field is somewhere

function wireDateAutoAdvance(dateId, nextFieldId){

  dateEl.addEventListener('change', ()=>{
    if(!dateEl.value) return;

    const type=(next.type||'').toLowerCase();
    const isTextLike = tag==='textarea' || (tag==='input' && (type==='text'||type==='number'||type===''));

// The numeric/on-screen keyboard's "Go" key fires a plain Enter keydown on
// whichever field currently has focus — but with no real <form> anywhere
// in this app, that keydown does nothing unless something explicitly
// listens for it. Hand-wiring each field individually is how some screens
// ended up with working "Go" and others didn't. Instead, this scans the
// given container for the fields a "Go" key could plausibly apply to —
// visible, enabled, non-readonly text/number/date-style inputs — and wires
// only the LAST one, so Go earlier in the form still behaves like a normal
// keystroke, while Go on the last field acts exactly like tapping Save.
// Deliberately excludes textareas (their Enter is a real newline, not a
// submit), and selects/radios/checkboxes (no on-screen "Go" key involved).
function wireGoKeySubmit(saveBtnId, containerSelector){
  const container=document.querySelector(containerSelector || '.body');
  if(!container) return;
  const FIELD_SELECTOR='input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],input[type=url],input[type=search],input:not([type])';
  const fields=[...container.querySelectorAll(FIELD_SELECTOR)].filter(el=>!el.disabled && !el.readOnly && el.offsetParent!==null);
  if(!fields.length) return;
  const lastField=fields[fields.length-1];
  // Every field before the last gets its OWN explicit "move to the next
  // field" handler, and an enterkeyhint="next" so the keyboard actually
  // labels its action key "Next" — this used to be left entirely to the
  // browser's own guess at tab order, which is exactly why it was
  // unreliable (worked "on the 2nd attempt" sometimes): the keyboard's
  // Next button doesn't reliably know which field is "next" in a
  // dynamically-rendered form unless we say so ourselves. Doing this here
  // (rather than only on the Move screen) fixes the same intermittent
  // "Next doesn't advance" behaviour everywhere wireGoKeySubmit is
  // already used, matching what was seen "further down the process" too.
  fields.forEach((field,i)=>{
    if(i===fields.length-1){ field.setAttribute('enterkeyhint','done'); return; }
    field.setAttribute('enterkeyhint','next');
    field.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter' && e.keyCode!==13) return;
      e.preventDefault();
      const next=fields[i+1];
      next.focus();
      if(typeof next.select==='function') next.select();
    });
  });
  lastField.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter' && e.keyCode!==13) return;
    e.preventDefault();
    // Dismiss the on-screen keyboard straight away — it was staying open
    // over the "Saved"/"Updated" toast after Done, so a farmer who didn't
    // spot the toast underneath it could tap Done again and create a
    // duplicate record.
    lastField.blur();
    if(saveBtnId){
      const btn=document.getElementById(saveBtnId);
      if(btn && !btn.disabled) btn.click();
    }
    // With no dedicated Save button on this screen (fields auto-save on
    // change as you go, e.g. Move), the blur above already fired the
    // field's own onchange — that's this screen's equivalent of Save.
  });
}

function generateDemoAnimalRecords(){
  animals=[]; events={}; weights=[]; injuryRecords=[]; medicineRecords=[];

  for(let i=1;i<=100;i++){
    const breed = breeds[i%breeds.length];
    const named = i<=20;
    const id = uuid();
    const eid = '826 '+String(1000+Math.floor(i/10)).padStart(4,'0')+' '+String(10000000+i).padStart(8,'0');
    animals.push({
      id, tag_number:'A-'+(1000+i), eid, breed_id:breed.id, sex: i<=2?'M':'F',
      birth_date: randomPastDate(900), status:'active', purchase_price: named ? +(300+Math.random()*400).toFixed(2) : null,
      name: named?NAMES[i-1]:null, updated_at:new Date().toISOString(), created_seq:i
    });
    events[id]=[{event_type:'created', from_status:null, to_status:'active', reason:null, created_at: new Date().toISOString()}];

    // ---- health bucket: mix of sickly / very healthy / average animals ----
    const roll=Math.random();
    const bucket = roll<0.15 ? 'sickly' : (roll<0.28 ? 'veryhealthy' : 'average');

    // ---- weight / BCS history: 3-6 records over the last ~5 months ----
    const recordCount=randInt(3,6);
    let curWeight=randInt(220,400);
    let lastWeightVal=null;
    for(let w=recordCount;w>=1;w--){
      const daysBack=w*randInt(18,32);
      let bcsVal=null;
      if(bucket==='sickly') curWeight+=randInt(-6,2);
      else if(bucket==='veryhealthy') curWeight+=randInt(8,15);
      else curWeight+=randInt(-2,10);
      curWeight=Math.max(180,curWeight);
      const bcsRoll=Math.random();
      if(bucket==='sickly') bcsVal = bcsRoll<0.7 ? pick([1,1,2]) : null;
      else if(bucket==='veryhealthy') bcsVal = bcsRoll<0.7 ? 3 : null;
      else bcsVal = bcsRoll<0.7 ? pick([2,3,3,4]) : null;
      const includeWeight = Math.random()<0.85;
      if(!includeWeight && bcsVal==null) bcsVal = pick(bucket==='sickly'?[1,2]:bucket==='veryhealthy'?[3]:[2,3,4]);
      lastWeightVal=curWeight;
      weights.push({id:uuid(), animal_id:id, weight_kg: includeWeight?curWeight:null, bcs:bcsVal, note:null, recorded_at:daysAgoIso(daysBack)});
    }

    // ---- injuries: sickly animals injured more often and more severely ----
    const injuryChance = bucket==='sickly' ? 0.65 : (bucket==='veryhealthy' ? 0.06 : 0.22);
    if(Math.random()<injuryChance){
      const injuryCount = bucket==='sickly' && Math.random()<0.3 ? 2 : 1;
      for(let n=0;n<injuryCount;n++){
        const makeCurrent = bucket==='sickly' ? Math.random()<0.35 : Math.random()<0.1;
        const severity = bucket==='sickly' ? randInt(3,5) : (bucket==='veryhealthy' ? randInt(1,2) : randInt(1,3));
        const recordedDaysAgo = makeCurrent ? randInt(1,10) : randInt(20,300);
        const recordedAt=daysAgoIso(recordedDaysAgo);
        const resolvedAt = makeCurrent ? null : daysAgoIso(Math.max(0,recordedDaysAgo-randInt(3,25)));
        injuryRecords.push({
          id:uuid(), animal_id:id, photo_data:null,
          body_part:pick(INJURY_BODY_PARTS), cause:pick(INJURY_CAUSES), notes:null, severity,
          checklist:{bleeding:Math.random()<0.2, non_weight_bearing:Math.random()<0.2, hot_to_touch:Math.random()<0.25},
          recorded_at:recordedAt, resolved_at:resolvedAt,
          analysis_status:null, ai_diagnosis:null, ai_treatment:null, ai_confidence:null, ai_vet_recommended:null, analyzed_at:null,
        });
      }
    }

    // ---- medicine: deliberately left empty (per the farmer's request) so
    // demo animals start with a clean medicine history — a random junk
    // treatment record here would only get in the way of testing the
    // injury-medicine link against real, deliberately-entered data. TB
    // test records (below) are unaffected — they're a separate, purposeful
    // part of the seed data, not something to also strip out.

    // ---- TB test: every demo animal gets a recent, in-date TB test except
    // A-1024, deliberately left without one so the new move-risk warning
    // (and the "no TB test" flag generally) has something real to catch
    // when trying the feature against the seed data. ----
    if(i!==24){
      const tbId=tbTestTypeId();
      if(tbId){
        const administeredAt=daysAgoIso(randInt(10,150)); // comfortably inside the 6-month window
        medicineRecords.push({
          id:uuid(), animal_id:id, medicine_type_id:tbId, product_name:'TB test',
          farmer_vet_id: pick(farmersVets).id,
          dose:null, dose_unit:null,
          reason:'routine', cost: +(15+Math.random()*10).toFixed(2),
          batch_no:null,
          expiry_date:null,
          animal_weight_kg: lastWeightVal,
          method_given:'Injection',
          photo_data:null,
          administered_at: administeredAt, withdrawal_until: administeredAt, // TB test itself carries no withdrawal period
          note:null,
        });
      }
    }
  }
}

function parseImportDate(val){
  if(val==null || val==='') return null;
  if(val instanceof Date) return isNaN(val.getTime())?null:val;
  if(typeof val==='number'){
    const excelEpoch=new Date(Date.UTC(1899,11,30));
    return new Date(excelEpoch.getTime()+val*86400000);
  }
  const s=String(val).trim();
  if(!s) return null;
  const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let d=+m[1], mo=+m[2], y=+m[3];
    if(y<100) y+=2000;
    return new Date(Date.UTC(y, mo-1, d, 12));
  }
  const d2=new Date(s);
  return isNaN(d2.getTime())?null:d2;
}
function importNum(val){
  if(val==null || val==='') return null;
  const n=typeof val==='number'?val:parseFloat(String(val).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?null:n;
}
function fmtExportDate(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d.getTime())) return '';
  const dd=String(d.getUTCDate()).padStart(2,'0');
  const mm=String(d.getUTCMonth()+1).padStart(2,'0');
  const yyyy=d.getUTCFullYear();
  return dd+'/'+mm+'/'+yyyy;
}

async function runFarmDataImport(){
  if(!importFile) return;
  importError='';
  importBusy=true;
  render();
  try{
    const buf = await importFile.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheet=(name)=>{
      const ws=wb.Sheets[name];
      if(!ws) return null;
      return XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
    };
    const breedsRows=sheet('Breeds');
    const animalsRows=sheet('Animals');
    const weightsRows=sheet('Weights');
    const medicineRows=sheet('Medicine');
    const injuriesRows=sheet('Injuries');
    if(!animalsRows){
      importError='Couldn\u2019t find an "Animals" tab in that file \u2014 make sure you\u2019re using the aBC Stockman template.';
      importBusy=false; render(); return;
    }

    // ---- Breeds (also auto-created below if an animal references an unlisted breed) ----
    const newBreeds=[];
    const breedByName={};
    const ensureBreed=(name)=>{
      const key=(name||'').trim().toLowerCase();
      if(!key) return null;
      if(breedByName[key]) return breedByName[key];
      const b={id:uuid(), species:'cattle', name:(name||'').trim(), price_per_kg:null, min_prime_months:18, max_prime_months:30, active:true};
      newBreeds.push(b);
      breedByName[key]=b.id;
      return b.id;
    };
    (breedsRows||[]).slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const id=ensureBreed(row[0]);
      const b=newBreeds.find(x=>x.id===id);
      if(b && row[1]!=null) b.price_per_kg=importNum(row[1]);
    });

    // ---- Animals ----
    const newAnimals=[];
    const newEvents={};
    const animalByTag={};
    const statusMap={active:'active', sold:'sold', dead:'dead', stolen:'stolen', swapped:'swapped'};
    let seq=1;
    const skipped={weights:0, medicine:0, injuries:0};
    animalsRows.slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const tag=String(row[0]).trim();
      if(!tag) return;
      const name=row[1]!=null?String(row[1]).trim():'';
      const breedId=ensureBreed(row[2]);
      const sexRaw=row[3]!=null?String(row[3]).trim().toUpperCase():'F';
      const sex = sexRaw==='M'?'M':'F';
      const dob=parseImportDate(row[4]) || new Date();
      const eid=row[5]!=null?String(row[5]).trim():null;
      const statusRaw=row[6]!=null?String(row[6]).trim().toLowerCase():'active';
      const status=statusMap[statusRaw]||'active';
      const purchasePrice=importNum(row[7]);
      const birthWeight=importNum(row[8]);
      const weanedWeight=importNum(row[9]);
      const id=uuid();
      newAnimals.push({
        id, tag_number:tag, eid:eid||null, breed_id:breedId, sex, birth_date:dob.toISOString(), status,
        purchase_price:purchasePrice, birth_weight_kg:birthWeight, weaned_weight_kg:weanedWeight,
        mother_id:null, father_id:null, photo_data:null,
        name:name||null, updated_at:new Date().toISOString(), created_seq:seq++,
      });
      const evs=[{event_type:'created', from_status:null, to_status:'active', reason:null, created_at:new Date().toISOString()}];
      if(status!=='active'){
        evs.push({event_type:EXIT_STATUSES[status]||status, from_status:'active', to_status:status, reason:'Imported from spreadsheet', created_at:new Date().toISOString()});
      }
      newEvents[id]=evs;
      animalByTag[tag.toLowerCase()]=id;
    });

    // ---- Weights ----
    const newWeights=[];
    (weightsRows||[]).slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const animalId=animalByTag[String(row[0]).trim().toLowerCase()];
      if(!animalId){ skipped.weights++; return; }
      const weight=importNum(row[2]);
      if(weight==null){ skipped.weights++; return; }
      const date=parseImportDate(row[1]) || new Date();
      const bcsRaw=importNum(row[3]);
      const bcs = bcsRaw!=null ? Math.max(1, Math.min(5, Math.round(bcsRaw))) : null;
      newWeights.push({id:uuid(), animal_id:animalId, weight_kg:weight, bcs, note:null, recorded_at:date.toISOString()});
    });

    // ---- Medicine (also builds Medicine types & Farmers/vets from what's referenced) ----
    const newMedicineTypes=[], newFarmersVets=[];
    const medTypeByName={}, farmerByName={};
    const ensureFarmerVet=(name)=>{
      const key=(name||'').trim().toLowerCase();
      if(!key) return null;
      if(farmerByName[key]) return farmerByName[key];
      const p={id:uuid(), name:(name||'').trim(), role:'farmer', active:true};
      newFarmersVets.push(p);
      farmerByName[key]=p.id;
      return p.id;
    };
    const reasonByLabel={};
    MED_REASON_OPTIONS.forEach(r=>{ reasonByLabel[r.label.toLowerCase().replace(/[\s\/]+/g,'')]=r.key; });
    const matchReason=(text)=>{
      if(!text) return 'other';
      const key=String(text).toLowerCase().replace(/[\s\/]+/g,'').replace(/,/g,'');
      if(reasonByLabel[key]) return reasonByLabel[key];
      const found=MED_REASON_OPTIONS.find(r=>key.includes(r.key));
      return found ? found.key : 'other';
    };
    const newMedicineRecords=[];
    (medicineRows||[]).slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const animalId=animalByTag[String(row[0]).trim().toLowerCase()];
      if(!animalId){ skipped.medicine++; return; }
      const givenDate=parseImportDate(row[1]) || new Date();
      const product=row[2]!=null?String(row[2]).trim():'';
      if(!product){ skipped.medicine++; return; }
      const batchNo=row[3]!=null?String(row[3]).trim():null;
      const doseAmount=importNum(row[4]);
      const doseUnit=row[5]!=null?String(row[5]).trim():'ml';
      const method=row[6]!=null?String(row[6]).trim():null;
      const withdrawalDate=parseImportDate(row[7]);
      const cost=importNum(row[8]) ?? 0;
      const reasonKey=matchReason(row[9]);
      const givenBy=row[10]!=null?String(row[10]).trim():null;
      const farmerVetId=ensureFarmerVet(givenBy);

      const key=product.toLowerCase();
      let medTypeId=medTypeByName[key];
      if(!medTypeId){
        const withdrawalDays = withdrawalDate ? Math.max(0, Math.round((withdrawalDate-givenDate)/86400000)) : 0;
        const mt={id:uuid(), name:product, withdrawal_days:withdrawalDays, dosage_per_kg:null, active:true};
        newMedicineTypes.push(mt);
        medTypeByName[key]=mt.id;
        medTypeId=mt.id;
      }
      newMedicineRecords.push({
        id:uuid(), animal_id:animalId, medicine_type_id:medTypeId, product_name:product,
        farmer_vet_id:farmerVetId, reason:reasonKey, cost,
        batch_no:batchNo, expiry_date:null,
        animal_weight_kg:null, dosage_amount:doseAmount, dosage_unit:doseUnit, method_given:method,
        photo_data:null, administered_at:givenDate.toISOString(),
        withdrawal_until:(withdrawalDate||givenDate).toISOString(),
      });
    });

    // ---- Injuries ----
    const newInjuryRecords=[];
    (injuriesRows||[]).slice(1).forEach(row=>{
      if(!row || !row[0]) return;
      const animalId=animalByTag[String(row[0]).trim().toLowerCase()];
      if(!animalId){ skipped.injuries++; return; }
      const date=parseImportDate(row[1]) || new Date();
      const bodyPart=row[2]!=null?String(row[2]).trim().toLowerCase():null;
      const sevRaw=importNum(row[3]);
      const severity = sevRaw!=null ? Math.max(1, Math.min(5, Math.round(sevRaw))) : null;
      const resolvedDate=parseImportDate(row[4]);
      newInjuryRecords.push({
        id:uuid(), animal_id:animalId, photo_data:null, description:null, severity,
        body_part:bodyPart, cause:null, notes:null,
        recorded_at:date.toISOString(), resolved_at: resolvedDate?resolvedDate.toISOString():null,
      });
    });

    if(!newAnimals.length){
      importError='No animals found to import \u2014 check the Animals tab has at least one row filled in below the header.';
      importBusy=false; render(); return;
    }

    const warnParts=[];
    if(skipped.weights) warnParts.push(skipped.weights+' weight row(s)');
    if(skipped.medicine) warnParts.push(skipped.medicine+' medicine row(s)');
    if(skipped.injuries) warnParts.push(skipped.injuries+' injury row(s)');
    const warnText = warnParts.length ? '\n\n'+warnParts.join(', ')+' were skipped because their Mgmt ID didn\u2019t match any animal on the Animals tab.' : '';

    const applyImport=async()=>{
      // ---- Apply: replace everything ----
      breeds = newBreeds;
      animals = newAnimals;
      events = newEvents;
      weights = newWeights;
      medicineTypes = newMedicineTypes;
      medicineRecords = newMedicineRecords;
      injuryRecords = newInjuryRecords;
      farmersVets = newFarmersVets;
      feedTypes = FEED_TYPES_SEED.map(name=>({id:uuid(), name, active:true}));
      feedRecords = [];
      feedUsageRecords = [];
      damageRecords = [];
      moveRecords = [];
      breedingRecords = [];
      usingFeed = true;
      usingFeedLog = [];
      feedLocation = 'barn';
      feedLocationLog = [];

      // clear session/selection state so nothing points at a deleted record
      selectedId=null; healthTarget=null; weighTarget=null; feedTarget=null;
      cameFromSummary=false; medBulkActive=false; medBulkCarry=null;
      expandedFlagKey=null; expandedBcmsGroupKey=null; expandedMedicineIds=new Set(); expandedMedicineAnimalId=null; expandedInjuryIds=new Set(); expandedInjuryAnimalId=null; expandedDamageId=null;
      settingsOpenSection=null; settingsShowAddForm=false;
      navStack=[];
      importFile=null; importError=''; importBusy=false;

      await persistAll();
      logMsg('Imported '+newAnimals.length+' animals, '+newWeights.length+' weights, '+newMedicineRecords.length+' medicine records, '+newInjuryRecords.length+' injuries from spreadsheet.');
      view='home';
      render();
      showSaveToast('Saved');
    };
    showConfirmModal(
      'This will erase ALL existing animals, weights, medicine, and injury records on this device and replace them with this file:\n\n'+
      newAnimals.length+' animal(s), '+newWeights.length+' weight record(s), '+newMedicineRecords.length+' medicine record(s), '+newInjuryRecords.length+' injury record(s).'+
      warnText+
      '\n\nThis cannot be undone. Continue?',
      applyImport,
      render
    );
    importBusy=false;
  } catch(e){
    importError='Couldn\u2019t read that file: '+e.message+'. Make sure it\u2019s a copy of the aBC Stockman template.';
    importBusy=false;
    render();
  }
}

// ---------- full device backup (Settings > Backup) ----------
// Genuinely everything on the device, losslessly — every field exactly as
// stored, not reshaped into friendly report columns. This exists for one
// purpose: restoring this exact device's data if the phone is lost,
// damaged, or replaced. It's deliberately separate from "Export farm
// data" below, which is a curated, human-readable subset (animals,
// weights, medicine, injuries only) meant for sharing with a vet or
// accountant — that one was never meant to capture Fodder, the Medicine
// Cabinet, Moves, Farm Damage, Farmers & Vets, or Breeding, and still
// doesn't; trying to force all of that into spreadsheet columns would be
// unreliable for something a farmer needs to actually trust in an
// emergency, so a full JSON backup is the correct tool for that job.
function backupSnapshot(){
  return {
    format:'abc-stockman-backup', version:1, exported_at:new Date().toISOString(), build:APP_BUILD_VERSION,
    data:{
      breeds, animals, events, weights,
      feedTypes, feedRecords, feedUsageRecords,
      medicineTypes, medicineRecords,
      injuryRecords, farmSettings, damageRecords, moveRecords, farmersVets,
      usingFeed, usingFeedLog, feedLocation, feedLocationLog,
      breedingRecords, breedPriceHistory,
      deviceFarmCode, deviceFarmName, currentFarmerId, currentFarmerName,
    },
  };
}
function exportFullBackup(){
  const json=JSON.stringify(backupSnapshot());
  const blob=new Blob([json], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='aBC_Stockman_Backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
// Replaces every field this app persists with whatever's in the backup —
// deliberately whole-device, not merged, so what's restored is exactly
// what existed at backup time, with nothing left over from before.
async function restoreFullBackup(parsed){
  const d=parsed.data;
  breeds=d.breeds||[]; animals=d.animals||[]; events=d.events||{}; weights=d.weights||[];
  feedTypes=d.feedTypes||[]; feedRecords=d.feedRecords||[]; feedUsageRecords=d.feedUsageRecords||[];

  usingFeed=d.usingFeed!==undefined?d.usingFeed:true; usingFeedLog=d.usingFeedLog||[];
  feedLocation=d.feedLocation||'barn'; feedLocationLog=d.feedLocationLog||[];
  breedingRecords=d.breedingRecords||[]; breedPriceHistory=d.breedPriceHistory||[];

async function selectAnimalForMove(id){
  // Toggle, not just add — tapping an already-added animal in the picker
  // takes it back off the move immediately, rather than the farmer having
  // to wait until Done and then hunt for it in the "remove" list below.
  // Mistaps happen constantly with a long list of similar tag numbers.
  const wasIncluded=moveAnimalIds.includes(id);
  if(wasIncluded){
    moveAnimalIds=moveAnimalIds.filter(x=>x!==id);
    if(moveAnimalIds.length===0 && moveSessionRecordId){
      const idx=moveRecords.findIndex(r=>r.id===moveSessionRecordId);
      if(idx>-1) moveRecords.splice(idx,1);
      const deletedId=moveSessionRecordId;
      moveSessionRecordId=null;
      await persistAll();
      await deleteMoveFromSupabase(deletedId);
    } else {
      await commitMoveEntry();
    }
    return 'removed';
  }
  moveAnimalIds.push(id);
  const isNew = await commitMoveEntry();
  // modal is still the picker itself at this point (the only two callers —
  // the picker's own row tap, and its own Scan button — both run with the
  // picker as the active modal), so its search term can be carried
  // straight through to reopening it once any warning here is cleared.
  queueMoveRiskWarnings([id], {type:'movePickAnimal', term: modal && modal.term});
  return isNew;
}
// Shared by every place an animal (or several at once) gets added to the
// current move: the picker/scan flow above (always one at a time, via
// selectAnimalForMove), and the few places that pre-fill moveAnimalIds
// directly in a batch (multi-select from the Animal List, reversing a past
// move, pre-filling from an animal's own Summary). Each flagged animal
// gets its own popup in turn — queued, not merged into one combined
// message — so ticking through several one at a time is possible, while
// the "don't alert for any other animals in this move" checkbox lets the
// farmer clear the rest of the queue in one go when that's what's wanted.
// returnTo is what to restore modal to once the whole queue (or the
// suppression shortcut) is done — the picker, for the two callers above;
// left blank for the batch pre-fill call sites, which have no modal to
// return to, just the Move screen itself underneath.
function queueMoveRiskWarnings(ids, returnTo){
  if(moveWarningsSuppressed) return;
  const risky=[...new Set(ids)].filter(id=>animalMoveRisk(id));
  if(!risky.length) return;
  modal={type:'moveRiskWarning', animalId:risky[0], queue:risky.slice(1), returnTo:returnTo||null};
}

function hasUnsavedWeighChanges(){
  if(view!=='weigh' || !weighTarget) return false;
  const weightInput=document.getElementById('w-weight');
  if(!weightInput) return false;
  const raw=weightInput.value.trim();
  const curWeight = raw ? parseFloat(raw) : null;
  if(raw && isNaN(curWeight)) return false;
  const existing = weighSessionRecordId ? weights.find(w=>w.id===weighSessionRecordId) : findRecordForAnimalDate(weighTarget, weighDate);
  const existingWeight = existing ? existing.weight_kg : null;
  const existingBcs = existing ? existing.bcs : null;

}

function goBack(){
  // Same early-exit pattern as the walkthrough case below: long-press
  // select mode on the Animal List (and the Animals to sell report, which
  // reuses the same selection state) isn't a separate screen on navStack,
  // it's a mode within the current view, so the universal back button

  // selection) rather than leaving the screen entirely on the first tap.
  if((view==='herd' || (view==='reportDetail' && reportType==='sellyes')) && herdSelectMode){
    herdSelectMode=false; herdSelectedIds=[];
    suppressHistoryPush=true;
    render();
    return;
  }
  // The walkthrough's 4 steps are all the same `view`, just a different
  // walkthroughStep — they were never pushed onto navStack as separate
  // screens, so without this, swiping right on step 2+ would skip straight
  // past the remaining steps and exit the walkthrough entirely (or do
  // nothing, if there's nothing left on the stack to pop back to). Step 1
  // has nowhere earlier to go, so it correctly falls through to the normal
  // exit-the-screen behaviour below, same as every other screen.
  if(view==='walkthrough' && walkthroughStep>1){
    walkthroughStep--;
    suppressHistoryPush=true;
    render();
    return;
  }
  if(hasUnsavedNewAnimalData()){
    showConfirmModal('Discard new animal?', goBackContinue);
    return;
  }
  if(hasUnsavedMedicineAddData()){
    showConfirmModal('Discard medicine record?', goBackContinue);
    return;
  }
  if(hasUnsavedMedCabinetAddData()){
    showConfirmModal(medCabEditTargetId?'Discard changes to this medicine?':'Discard new medicine?', goBackContinue);
    return;
  }
  if(hasUnsavedMedDisposeData()){
    showConfirmModal('Discard medicine disposal?', goBackContinue);
    return;
  }
  if(hasUnsavedDamageAddData()){
    showConfirmModal('Discard new farm damage?', goBackContinue);
    return;
  }
  if(hasUnsavedWeighChanges()){
    showConfirmModal('You have weight/BCS values entered but not saved. Leave without saving?', goBackContinue);
    return;
  }

}

function breedName(id){const b=breeds.find(x=>x.id===id); return b?b.name:'—';}

function bcsColorClass(n){ if(n===3) return 'bcs-green'; if(n===2||n===4) return 'bcs-amber'; return 'bcs-red'; }
